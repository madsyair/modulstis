project:
  type: book
  output-dir: _book
  pre-render: siapkan.R

book:
  title: "Menyusun Modul Praktikum dengan modulstis"
  subtitle: "Pedoman Langkah demi Langkah untuk Dosen"
  author: "Achmad Syahrul Choir"
  date: last-modified
  date-format: "D MMMM YYYY"
  output-file: Pedoman_modulstis
  chapters:
    - index.qmd
    - part: "Memulai"
      chapters:
        - bab01.qmd
        - bab02.qmd
        - bab03.qmd
    - part: "Menyusun Isi"
      chapters:
        - bab04.qmd
        - bab05.qmd
        - bab06.qmd
        - bab07.qmd
        - bab08.qmd
        - bab09.qmd
        - bab10.qmd
    - part: "Menerbitkan"
      chapters:
        - bab11.qmd
        - bab12.qmd
        - bab13.qmd
        - bab14.qmd
        - bab15.qmd
  appendices:
    - lampiran-a.qmd
    - lampiran-b.qmd
    - lampiran-c.qmd
    - lampiran-d.qmd
    - lampiran-e.qmd

lang: id
language:
  crossref-fig-title: "Gambar"
  crossref-tbl-title: "Tabel"
  crossref-ch-prefix: "Bab"
  crossref-apx-prefix: "Lampiran"
  section-title-appendices: "Lampiran"
  callout-tip-title: "Hasil yang seharusnya Anda lihat"
  callout-note-title: "Catatan"
  callout-warning-title: "Perhatian"
  callout-important-title: "Salah paham umum"
  callout-caution-title: "Coba sendiri"
  toc-title-document: "Daftar Isi"

execute:
  echo: true
  warning: false
  message: false
  freeze: false

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    R.options:
      width: 72

format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any, fontsize=11pt]
    papersize: a4
    geometry:
      - top=28mm
      - bottom=26mm
      - left=26mm
      - right=24mm
      - headsep=8mm
    pdf-engine: xelatex
    mainfont: Carlito
    sansfont: Carlito
    monofont: DejaVu Sans Mono
    monofontoptions:
      - Scale=0.78
    linestretch: 1.2
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 2
    colorlinks: true
    linkcolor: "bpsbiru"
    urlcolor: "bpsbiru"
    code-block-bg: "F4F7FB"
    code-block-border-left: "0B6FB4"
    highlight-style: tango
    fig-pos: "H"
    fig-align: center
    callout-appearance: default
    callout-icon: false
    include-in-header:
      - tex/versi.tex
      - tex/preamble.tex
    template-partials:
      - partials/before-body.tex
    keep-tex: true
