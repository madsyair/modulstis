pertemuan: 8
sub_cpmk: |
  Sub-CPMK 8: Mahasiswa mampu membangun, menala, dan menafsirkan model klasifikasi dasar --- pohon keputusan, Naive Bayes, dan regresi logistik terregularisasi --- serta memilih di antaranya berdasarkan sifat data dan kebutuhan penjelasan.
