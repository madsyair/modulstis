exercises:
- id: L8.1
  points: 15
  solution: 'Tingkat Dasar: penyiapan data, pohon keputusan, dan regresi terregularisasi.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(caret); library(rpart); library(rpart.plot); library(glmnet)})

    nasabah <- read.csv("data/data_nasabah.csv", stringsAsFactors = TRUE)
    nasabah$id <- NULL                                  # buang penanda
    nasabah$gagal_bayar <- factor(nasabah$gagal_bayar, levels = c("ya", "tidak"))
    set.seed(2026)
    idx <- createDataPartition(nasabah$gagal_bayar, p = 0.75, list = FALSE)
    lat <- nasabah[idx, ]; uji <- nasabah[-idx, ]

    kendali <- trainControl(method = "cv", number = 5, classProbs = TRUE,
                            summaryFunction = twoClassSummary)
    m <- train(gagal_bayar ~ ., data = lat, method = "rpart",
               tuneLength = 8, trControl = kendali, metric = "ROC")
    rpart.plot(m$finalModel, type = 2, extra = 104)

    m2 <- train(gagal_bayar ~ ., data = lat, method = "glmnet",
                preProcess = c("center", "scale"),
                tuneLength = 5, trControl = kendali, metric = "ROC")
    koef <- coef(m2$finalModel, s = m2$bestTune$lambda)
  interpretasi: |
    Isian yang benar berturut-turut adalah NULL, createDataPartition, -idx, TRUE, train, rpart, rpart.plot, center, scale, dan coef. Dua hal patut ditekankan. Pertama, penanda dibuang dengan menetapkannya NULL, bukan sekadar tidak disebut pada formula --- sebab formula titik menyertakan seluruh kolom. Kedua, pembakuan hanya diberikan pada glmnet dan tidak pada rpart; memberikannya pada pohon tidak merugikan tetapi memperlihatkan bahwa penyusunnya belum memahami kebutuhan tiap model.
- id: L8.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: perbandingan tiga model dan pemilihan menurut kebutuhan.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(caret); library(naivebayes); library(glmnet)})

    set.seed(2026)
    m_pohon <- train(gagal_bayar ~ ., data = lat, method = "rpart",
                     tuneLength = 8, trControl = kendali, metric = "ROC")
    set.seed(2026)
    m_nb <- train(gagal_bayar ~ ., data = lat, method = "naive_bayes",
                  trControl = kendali, metric = "ROC")
    set.seed(2026)
    m_glm <- train(gagal_bayar ~ ., data = lat, method = "glmnet",
                   preProcess = c("center", "scale"),
                   tuneLength = 5, trControl = kendali, metric = "ROC")

    banding <- resamples(list(Pohon = m_pohon, NaiveBayes = m_nb,
                              LogRegularisasi = m_glm))
    s <- summary(banding)
    print(round(s$statistics$ROC[, c("Min.", "Mean", "Max.")], 4))
    bwplot(banding, metric = "ROC")

    # rentang antar-lipatan sebagai ukuran kestabilan
    rentang <- s$statistics$ROC[, "Max."] - s$statistics$ROC[, "Min."]
    print(round(rentang, 4))
  interpretasi: |
    Benih acak yang sama ditetapkan sebelum tiap pemanggilan train agar lipatannya identik; tanpa itu perbandingannya tidak adil. Kolom rentang antar-lipatan adalah alasan mengapa rata-rata tertinggi belum tentu cukup: model bermata-rata sedikit lebih rendah tetapi berentang sempit lebih dapat diandalkan pada data baru. Untuk pemilihan menurut kebutuhan: penjelasan sebagai aturan menuntut pohon; peluang untuk keputusan biaya menuntut regresi terregularisasi karena kalibrasinya paling baik; peubah kategori bertaraf banyak sesuai bagi Naive Bayes maupun pohon yang menanganinya tanpa pengodean; sedangkan pencilan ekstrem yang sah menuntut pohon karena paling tahan --- masing-masing dengan kelemahannya, yaitu pohon tidak stabil, Naive Bayes berpeluang tak terkalibrasi, dan regresi peka pencilan.
- id: L8.D
  points: 10
  solution: 'Membetulkan kode: penanda, pembakuan regularisasi, ukuran pemilihan, dan kelas positif.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |-
    suppressPackageStartupMessages({library(caret); library(glmnet)})
    nasabah <- read.csv("data/data_nasabah.csv", stringsAsFactors = TRUE)

    # (a) penanda dibuang sebelum pemodelan
    nasabah$id <- NULL
    nasabah$gagal_bayar <- factor(nasabah$gagal_bayar, levels = c("ya", "tidak"))
    set.seed(2026)
    idx <- createDataPartition(nasabah$gagal_bayar, p = 0.75, list = FALSE)
    lat <- nasabah[idx, ]; uji <- nasabah[-idx, ]

    # (c) ukuran pemilihan memakai ROC pada data timpang
    kendali <- trainControl(method = "cv", number = 5, classProbs = TRUE,
                            summaryFunction = twoClassSummary)

    # (b) pembakuan wajib bagi regularisasi
    m <- train(gagal_bayar ~ ., data = lat, method = "glmnet",
               preProcess = c("center", "scale"),
               tuneLength = 5, trControl = kendali, metric = "ROC")
    m2 <- train(gagal_bayar ~ ., data = lat, method = "rpart",
                tuneLength = 8, trControl = kendali, metric = "ROC")

    # (d) kelas positif ditetapkan secara tegas
    print(confusionMatrix(predict(m, uji), uji$gagal_bayar, positive = "ya"))

    # pemeriksaan wajib
    !("id" %in% names(lat))
    "ROC" %in% names(m$results)
  interpretasi: |
    Empat kesalahan diperbaiki. Kesalahan (a) membiarkan nomor urut ikut dimodelkan; pada data yang penandanya berurutan, pohon dapat membelah berdasarkan nomor sehingga tampak sangat baik pada data latih semata karena menghafal. Kesalahan (b) menjalankan regularisasi tanpa pembakuan sehingga hukuman dikenakan tidak adil antar-peubah yang satuannya berbeda --- peubah bersatuan besar nyaris tak terhukum. Kesalahan (c) memilih model berdasarkan akurasi pada data timpang, sehingga model yang menebak seluruhnya mayoritas dapat terpilih. Kesalahan (d) membiarkan caret memilih kelas positif menurut abjad, sehingga sensitivitas dan presisi yang dilaporkan boleh jadi mengukur kelas yang keliru.
- id: T8.1
  points: 50
  solution: 'Penugasan: membangun, membandingkan, dan memilih tiga model klasifikasi dasar.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(caret); library(rpart); library(rpart.plot)
      library(naivebayes); library(glmnet)})

    # 1-2) penyiapan dan pembagian
    nasabah <- read.csv("data/data_nasabah.csv", stringsAsFactors = TRUE)
    nasabah$id <- NULL
    nasabah$gagal_bayar <- factor(nasabah$gagal_bayar, levels = c("ya", "tidak"))
    prop <- prop.table(table(nasabah$gagal_bayar))
    cat("acuan mayoritas:", round(max(prop), 4), "\n")

    set.seed(2026)
    idx <- createDataPartition(nasabah$gagal_bayar, p = 0.75, list = FALSE)
    lat <- nasabah[idx, ]; uji <- nasabah[-idx, ]
    kendali <- trainControl(method = "cv", number = 5, classProbs = TRUE,
                            summaryFunction = twoClassSummary)

    # 3-4) pohon beserta penalaan dan aturannya
    set.seed(2026)
    kisi <- data.frame(cp = c(0.001, 0.003, 0.005, 0.01, 0.02, 0.05, 0.1))
    m_pohon <- train(gagal_bayar ~ ., data = lat, method = "rpart",
                     tuneGrid = kisi, trControl = kendali, metric = "ROC")
    print(round(m_pohon$results[, c("cp","ROC","ROCSD")], 4), row.names = FALSE)
    rpart.plot(m_pohon$finalModel, type = 2, extra = 104,
               main = "Pohon Keputusan Gagal Bayar")
    print(rpart.rules(m_pohon$finalModel, cover = TRUE))

    # 5) Naive Bayes
    set.seed(2026)
    m_nb <- train(gagal_bayar ~ ., data = lat, method = "naive_bayes",
                  trControl = kendali, metric = "ROC")
    cat("pemulusan kernel terpilih:", m_nb$bestTune$usekernel, "\n")

    # 6) regresi terregularisasi
    set.seed(2026)
    m_glm <- train(gagal_bayar ~ ., data = lat, method = "glmnet",
                   preProcess = c("center", "scale"),
                   tuneLength = 5, trControl = kendali, metric = "ROC")
    koef <- coef(m_glm$finalModel, s = m_glm$bestTune$lambda)
    kd <- data.frame(peubah = rownames(koef), koef = as.numeric(koef))
    kd <- kd[kd$peubah != "(Intercept)", ]
    kd$odds <- round(exp(kd$koef), 4)
    cat("peubah dinolkan:", sum(kd$koef == 0), "dari", nrow(kd), "\n")
    print(utils::head(kd[order(-abs(kd$koef)), ], 5), row.names = FALSE)

    # 7) perbandingan
    banding <- resamples(list(Pohon = m_pohon, NaiveBayes = m_nb,
                              LogRegularisasi = m_glm))
    s <- summary(banding)
    print(round(s$statistics$ROC[, c("Min.","Mean","Max.")], 4))
    bwplot(banding, metric = "ROC")

    # 8) penilaian pada data uji
    rata <- s$statistics$ROC[, "Mean"]
    terbaik <- list(Pohon = m_pohon, NaiveBayes = m_nb,
                    LogRegularisasi = m_glm)[[names(which.max(rata))]]
    cm <- confusionMatrix(predict(terbaik, uji), uji$gagal_bayar, positive = "ya")
    print(cm$table)
    cat("akurasi:", round(cm$overall["Accuracy"], 4),
        "| acuan:", round(max(prop.table(table(uji$gagal_bayar))), 4), "\n")

    # 9) kalibrasi
    pr <- predict(terbaik, uji, type = "prob")$ya
    kel <- cut(pr, breaks = seq(0, 1, by = 0.1), include.lowest = TRUE)
    kal <- data.frame(n = as.numeric(table(kel)),
                      dugaan = round(tapply(pr, kel, mean), 4),
                      nyata = round(tapply(uji$gagal_bayar == "ya", kel, mean), 4))
    print(kal[!is.na(kal$dugaan) & kal$n >= 5, ])
  interpretasi: |
    Nomor 4 adalah bagian yang paling menuntut kejujuran: aturan yang cakupannya hanya beberapa persen tidak layak disampaikan sebagai temuan, dan mahasiswa harus menyebutkan cakupannya, bukan hanya aturannya. Nomor 6 menuntut penafsiran yang tepat --- karena peubah sudah dibakukan, rasio odds menyatakan pengaruh kenaikan satu simpangan baku, bukan satu satuan asli; menafsirkannya dalam satuan asli adalah kekeliruan yang lazim. Nomor 10 adalah inti penugasan: rekomendasi wajib mempertimbangkan kestabilan antar-lipatan, kebutuhan prapemrosesan, kalibrasi, dan kemudahan penjelasan --- bukan ROC semata. Pada data simulasi ini ketiga model akan berkinerja mendekati tebakan acak, dan menyatakannya apa adanya justru merupakan jawaban yang benar; memaksakan kesimpulan bahwa suatu model unggul berarti mengarang.
