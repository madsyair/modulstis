body:
  deskripsi:
  - 'Seluruh modul pemodelan sebelumnya --- klasifikasi dasar, klasifikasi lanjut, jaringan syaraf tiruan
    --- mengandaikan satu hal yang jarang dinyatakan terus terang: bahwa **amatan saling bebas**. Pada
    data statistik resmi, pengandaian itu hampir selalu keliru. Rumah tangga tersarang di dalam desa,
    desa di dalam kabupaten, siswa di dalam sekolah, pasien di dalam rumah sakit. Dua rumah tangga dari
    desa yang sama lebih mirip satu sama lain daripada dua rumah tangga dari desa berbeda --- karena berbagi
    harga pasar, akses jalan, mutu layanan, dan banyak hal lain yang tidak terekam sebagai peubah.'
  - Ada dua tradisi yang masing-masing menangani setengah persoalan. **Model campuran** (*mixed models*)
    menangani struktur kelompok lewat **efek acak**, tetapi memaksa hubungan antara peubah penjelas dan
    respons berbentuk **linear**. **Boosting** menangani hubungan nonlinear dan interaksi dengan sangat
    baik, tetapi memperlakukan seluruh amatan sebagai bebas sehingga struktur kelompok terabaikan.
  - '**GPBoost** menggabungkan keduanya: bagian tetap dimodelkan dengan **tree-boosting**, bagian acak
    dengan **proses Gaussian atau efek acak berkelompok**, dan keduanya ditaksir bersama secara berselang-seling.
    Modul ini menerapkannya pada data rumah tangga bertingkat, lalu membandingkan empat pendekatan pada
    data uji yang sama.'
  - Modul memakai **dua bahasa**. R dipakai untuk pembangkitan data, penelaahan struktur, dan model pembanding
    (`lme4`); Python dipakai untuk GPBoost. Keduanya membaca **berkas data yang sama**, sehingga hasilnya
    dapat dibandingkan langsung.
  - |-
    \begin{kotakperhatian}[Kedudukan modul dan catatan data]
    Modul ini termasuk \textbf{bagian pengayaan}. Ia mengandaikan Modul 6 sampai 9 sudah dikuasai, khususnya gagasan pembagian latih--uji, validasi silang, dan pencegahan kebocoran data.
  - |-
    Data bersifat \textbf{ilustratif hasil simulasi} dan \textbf{bukan angka resmi} instansi mana pun. Efek acak tiap wilayah \textbf{sengaja ditanam} pada saat pembangkitan dan disimpan pada berkas terpisah, sehingga dapat diperiksa apakah tiap model berhasil memulihkannya --- pemeriksaan yang tidak mungkin dilakukan pada data nyata.
    \end{kotakperhatian}
  - \vspace{1.2em}
