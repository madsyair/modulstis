  instruksi:
  - |-
    1. Buat **RStudio Project**, salin folder `data/`, dan pastikan Python beserta `gpboost` dapat dipanggil.
    2. Kerjakan Contoh berurutan; perhatikan bahwa potongan R dan Python **berbagi berkas data yang sama**.
    3. Kerjakan **Latihan Mandiri**, lalu **Penugasan** sebagai laporan.
  teori:
  - '## Data Bertingkat dan Efek Acak'
  - |-
    \begin{kotakrumus}
    Misalkan $y_{ij}$ adalah respons rumah tangga ke-$i$ pada wilayah ke-$j$. Model campuran dengan intersep acak menulis
    \[
    y_{ij} = F(\mathbf{x}_{ij}) + b_j + \varepsilon_{ij}, \qquad
    b_j \sim N(0, \sigma_b^2), \quad \varepsilon_{ij} \sim N(0, \sigma^2)
    \]
    dengan $b_j$ \textbf{efek acak} wilayah dan $F(\cdot)$ \textbf{pengaruh tetap}.
  - |-
    \textbf{Koefisien korelasi intrakelas}
    \[
    \mathrm{ICC} = \frac{\sigma_b^2}{\sigma_b^2 + \sigma^2}
    \]
    mengukur proporsi keragaman yang berasal dari perbedaan antar-wilayah. ICC $= 0$ berarti wilayah tidak berperan; ICC mendekati 1 berarti hampir seluruh keragaman terletak antar-wilayah.
    \end{kotakrumus}
  - 'Perbedaan ketiga pendekatan terletak pada bagaimana $F(\cdot)$ dan $b_j$ diperlakukan:'
  - |-
    \begin{kotakinfo}[Empat pendekatan dan yang ditanganinya]\par\smallskip
    \begin{tabular}{@{}p{4.2cm}p{4.6cm}p{5.4cm}@{}}
    \textbf{Pendekatan} & \textbf{$F(\cdot)$ nonlinear?} & \textbf{Efek kelompok $b_j$?}\\
    \hline
    Regresi linear (OLS) & tidak (linear) & tidak (diabaikan)\\[2pt]
    Boosting biasa & \textbf{ya} & tidak (diabaikan)\\[2pt]
    Model campuran linear & tidak (linear) & \textbf{ya}\\[2pt]
    GPBoost & \textbf{ya} & \textbf{ya}\\
    \end{tabular}
    \end{kotakinfo}
  - '## Cara Kerja GPBoost'
  - |-
    \begin{kotakrumus}
    GPBoost menaksir $F(\cdot)$ dan komponen ragam secara \textbf{berselang-seling}:
    \begin{enumerate}
    \item Diberikan taksiran komponen ragam, satu pohon ditambahkan pada ansambel boosting --- tetapi gradiennya dihitung terhadap \textbf{likelihood model campuran}, bukan terhadap sisaan biasa.
    \item Diberikan ansambel pohon terbaru, komponen ragam $\sigma_b^2$ dan $\sigma^2$ ditaksir ulang dengan memaksimumkan likelihood.
    \item Ulangi sampai banyaknya iterasi tercapai.
    \end{enumerate}
    Ramalan bagi kelompok yang sudah terlihat menjumlahkan pengaruh tetap dan efek acak kelompok itu; bagi kelompok \textbf{baru}, efek acaknya diramalkan nol --- yakni kembali ke pengaruh tetap saja.
    \end{kotakrumus}
  - |-
    \begin{kotakperhatian}[Mengapa langkah 1 penting]
    Bila boosting dijalankan lebih dahulu lalu efek acak ditaksir dari sisaannya, pohon-pohon akan lebih dahulu ``memakan'' keragaman antar-kelompok --- sebab peubah penjelas dapat menghampiri identitas kelompok. Akibatnya ragam antar-kelompok tertaksir terlalu kecil dan model menjadi terlalu percaya diri. Penaksiran berselang-seling menghindari hal ini.
    \end{kotakperhatian}
  - |-
    \begin{kotaktujuan}
    \textbf{Alur praktikum Modul 13}
    \begin{enumerate}
    \item Menelaah struktur bertingkat dan menghitung ICC (R).
    \item Menunjukkan keterbatasan regresi linear dan model campuran linear (R).
    \item Menjalankan GPBoost: penentuan iterasi, pelatihan, komponen ragam (Python).
    \item Memulihkan efek acak dan memeriksanya terhadap nilai yang ditanam (Python).
    \item Membandingkan keempat pendekatan pada data uji yang sama.
    \item Meramalkan bagi wilayah baru.
    \end{enumerate}
    \end{kotaktujuan}
  latihan:
  - \latihan{Menelaah struktur dan pembanding}
  - |-
    (a) Hitung ICC memakai model kosong pada **seluruh** data (bukan hanya data latih). Bandingkan dengan nilai pada Contoh 13.2 dan jelaskan mengapa keduanya berbeda sedikit.
    (b) Gambar diagram kotak-garis pengeluaran untuk 12 wilayah pertama. Apa yang terlihat mengenai perbedaan antar-wilayah?
    (c) Cocokkan model campuran linear dengan menambahkan **kemiringan acak** untuk `lama_sekolah`, yakni `(1 + lama_sekolah | wilayah)`. Apakah RMSE-nya membaik? Apa artinya?
  - \latihan{Menjalankan GPBoost}
  - |-
    (a) Ulangi Contoh 13.4 sampai 13.6 dengan `learning_rate` $0{,}01$ dan $0{,}20$. Bagaimana perubahan banyaknya iterasi optimum dan taksiran komponen ragamnya?
    (b) Bandingkan taksiran ragam antar-wilayah pada ketiga nilai `learning_rate` tersebut dengan nilai sebenarnya ($0{,}904$). Nilai mana yang paling mendekati?
    (c) Hitung RMSE GPBoost **terpisah** untuk rumah tangga di wilayah ber-efek acak positif dan negatif. Apakah ketepatannya seimbang?
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat **empat kesalahan**; temukan, perbaiki, jalankan versi yang benar, dan jelaskan
    akibat tiap kesalahan bagi kesimpulan.
  - \kode{kode yang harus dibetulkan}
  - |-
    ```{python lat-salah, eval=FALSE}
    X = rt[["lama_sekolah", "umur_krt", "anggota_rt", "wilayah"]].values   # (1)
    gm = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
    bst = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                    gp_model=gm, num_boost_round=1000)                      # (2)
    pred = bst.predict(data=X[tr], group_data_pred=g[tr])                   # (3)
    # "RMSE 0,08 -- model sangat akurat"                                    # (4)
    ```
  - 'Petunjuk: satu baris memasukkan penanda kelompok sebagai peubah penjelas; satu baris menetapkan iterasi
    tanpa validasi silang; satu baris menilai model pada **data latih**; dan satu kesimpulan menyalahartikan
    angka yang dihasilkan cara tersebut.'
  - \latihan{Meramalkan wilayah baru}
  - |-
    (a) Bagi data **per wilayah**: 48 wilayah untuk latih, 12 wilayah untuk uji --- sehingga seluruh wilayah uji belum pernah terlihat.
    (b) Latih ulang GPBoost pada pembagian itu, lalu hitung RMSE-nya.
    (c) Bandingkan dengan RMSE pada Contoh 13.7 yang pembagiannya acak. Berapa besar penurunan ketepatannya, dan mengapa?
    (d) Tulis satu paragraf (maksimal 150 kata) tentang bagaimana hasil ini harus disampaikan kepada pengguna yang hendak menerapkan model pada kabupaten yang belum tercakup pendataan.
  penugasan:
  - |-
    \begin{kotaktugas}
    \textbf{Konteks: Pendugaan Pengeluaran Rumah Tangga per Wilayah}
  - |-
    Sebuah unit kerja hendak menduga rata-rata pengeluaran rumah tangga tiap wilayah untuk keperluan penargetan program. Data pencacahan tersedia bagi 60 wilayah, tetapi ukuran sampel per wilayah kecil. Anda diminta menilai apakah pendekatan berbasis model dapat memperbaiki dugaan langsung, dan pendekatan mana yang sebaiknya dipakai.
    \end{kotaktugas}
  - \tugas{Penelaahan struktur}
  - 1. Laporkan struktur data, ICC, dan sebaran rata-rata wilayah. Simpulkan apakah struktur kelompok
    perlu dimodelkan.
  - \tugas{Pemodelan dan perbandingan}
  - |-
    2. Cocokkan keempat pendekatan pada pembagian latih--uji yang **sama**; laporkan RMSE keempatnya dalam satu tabel.
    3. Untuk GPBoost, tentukan banyaknya iterasi lewat validasi silang dan laporkan komponen ragam beserta galat bakunya.
    4. Bandingkan taksiran komponen ragam dari model campuran linear dan dari GPBoost. Mana yang lebih mendekati nilai yang ditanam, dan mengapa?
  - \tugas{Efek acak dan penargetan}
  - |-
    5. Susun peringkat 10 wilayah dengan efek acak terendah menurut GPBoost, lalu bandingkan dengan peringkat menurut **rata-rata mentah** pengeluaran wilayah. Apakah keduanya sama? Jelaskan mengapa dapat berbeda.
    6. Jelaskan mengapa peringkat berdasarkan efek acak lebih tepat untuk penargetan daripada peringkat berdasarkan rata-rata mentah.
  - \tugas{Kesimpulan dan keterbatasan}
  - |-
    7. Susun rekomendasi (maksimal 250 kata): pendekatan mana yang Anda usulkan, dan dengan syarat apa.
    8. Tulis bagian keterbatasan yang memuat sekurang-kurangnya: perbedaan ketepatan bagi wilayah dikenal dan wilayah baru; ketiadaan klaim sebab-akibat; dan bahwa data bersifat simulasi.
