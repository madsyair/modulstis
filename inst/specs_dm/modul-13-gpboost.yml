  - |-
    ```{python k3b}
    X = rt[["lama_sekolah", "umur_krt", "anggota_rt"]].values               # (1)
    par = {"objective": "regression_l2", "learning_rate": 0.05, "max_depth": 3, "verbose": 0}
    gm_cv = gpb.GPModel(group_data=g[tr], likelihood="gaussian")            # (2)
    cv = gpb.cv(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]), gp_model=gm_cv,
                num_boost_round=400, early_stopping_rounds=20, nfold=5,
                seed=2026, verbose_eval=False)
    k = int(np.argmin(cv[[c for c in cv if "mean" in c][0]])) + 1
    gm = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
    bst = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                    gp_model=gm, num_boost_round=k)
  - |-
    p_latih = bst.predict(data=X[tr], group_data_pred=g[tr], pred_latent=False)
    p_uji   = bst.predict(data=X[te], group_data_pred=g[te], pred_latent=False)   # (3)
    print("RMSE data LATIH:", round(float(np.sqrt(np.mean((y[tr]-p_latih["response_mean"])**2))), 4))
    print("RMSE data UJI  :", round(float(np.sqrt(np.mean((y[te]-p_uji["response_mean"])**2))), 4))
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(1)} Memasukkan \texttt{wilayah} ke dalam \texttt{X} membuat penanda kelompok diperlakukan sebagai \textbf{peubah penjelas} --- pohon akan memecah berdasarkan identitas wilayah, sehingga efek acak kehilangan perannya dan ragam antar-wilayah tertaksir mendekati nol. Selain itu kolom teks akan mengubah seluruh matriks menjadi karakter dan menimbulkan galat.
  - '\textbf{(2)} Menetapkan 1.000 iterasi tanpa validasi silang. Pada GPBoost ini merusak dua hal sekaligus:
    daya ramal \emph{dan} taksiran komponen ragam (bandingkan Contoh 13.5 yang memperlihatkan ragam galat
    anjlok dari $0{,}202$ ke $0{,}105$ ketika iterasi dinaikkan ke 400).'
  - \textbf{(3)} Menilai model pada \textbf{data latih}. Angka yang dihasilkan mengukur seberapa baik
    model menghafal, bukan seberapa baik ia meramal.
  - |-
    \textbf{(4)} RMSE $0{,}08$ pada data latih bukan tanda model akurat melainkan tanda \textbf{penghafalan}. Perhatikan selisih RMSE latih dan uji pada kode yang telah dibetulkan; selisih besar adalah gejala klasik. Nilai penuh bila mahasiswa menghubungkan butir (2) dan (4) --- iterasi berlebihlah yang menyebabkan angka latih tampak sempurna.
    \end{kotakkunci}
  - '## Kunci Latihan 13.4 -- Meramalkan Wilayah Baru'
  - |-
    ```{python k4}
    wil_unik = np.unique(g)                                                 # (a)
    rng2 = np.random.default_rng(2026); acak = rng2.permutation(wil_unik)
    wil_latih, wil_uji = acak[:48], acak[48:]
    trw = np.isin(g, wil_latih); tew = np.isin(g, wil_uji)
    print("wilayah latih:", len(wil_latih), " wilayah uji:", len(wil_uji),
          " amatan latih:", int(trw.sum()), " amatan uji:", int(tew.sum()))
  - |-
    gm_w = gpb.GPModel(group_data=g[trw], likelihood="gaussian")            # (b)
    bst_w = gpb.train(params=par, train_set=gpb.Dataset(X[trw], label=y[trw]),
                      gp_model=gm_w, num_boost_round=44)
    pw = bst_w.predict(data=X[tew], group_data_pred=g[tew], pred_latent=False)
    rmse_baru = float(np.sqrt(np.mean((y[tew] - pw["response_mean"])**2)))
    print("RMSE wilayah BARU     :", round(rmse_baru, 4))
    print("RMSE pembagian acak   :", 0.5482)                                 # (c)
    print("kenaikan galat        :", round(rmse_baru / 0.5482, 2), "kali")
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(a)--(b)} Pembagian dilakukan \textbf{per wilayah}, bukan per rumah tangga, sehingga seluruh 12 wilayah uji benar-benar belum pernah terlihat. Ini menirukan keadaan sesungguhnya ketika model diterapkan pada kabupaten yang belum tercakup pendataan.
  - '\textbf{(c)} RMSE naik dari $0{,}548$ menjadi $\mathbf{1{,}112}$ --- \textbf{dua kali lipat}. Sebabnya
    jelas dan bukan cacat model: bagi wilayah baru, efek acaknya diramalkan \textbf{nol}, sehingga seluruh
    keragaman antar-wilayah (yang menyumbang $41\%$ keragaman total menurut ICC) tidak dapat diramalkan
    sama sekali. Yang tersisa hanya pengaruh tetap.'
  - 'Perhatikan bahwa besarnya kenaikan ini dapat diduga dari ICC: makin tinggi ICC, makin besar bagian
    keragaman yang hilang ketika wilayah tidak dikenal.'
  - |-
    \textbf{(d) Contoh paragraf.} ``Model ini menduga pengeluaran rumah tangga dengan memanfaatkan dua sumber informasi: ciri rumah tangga, dan simpangan khas wilayahnya. Bagi kabupaten yang sudah tercakup pendataan, keduanya tersedia sehingga ketepatannya tinggi. Bagi kabupaten yang \textbf{belum} tercakup, sumber kedua tidak tersedia --- model hanya dapat memakai ciri rumah tangga, dan dugaannya akan mendekati rata-rata nasional. Pada pengujian kami, galat ramalan bagi wilayah baru meningkat dua kali lipat. Karena itu dugaan bagi kabupaten yang belum tercakup \textbf{tidak boleh} disajikan dengan tingkat ketelitian yang sama, dan sebaiknya disertai selang yang jauh lebih lebar atau tidak diterbitkan sama sekali sampai tersedia sampel dari kabupaten tersebut.'' Nilai penuh bila jawaban menyebut sebab teknisnya (efek acak diramalkan nol) \emph{dan} menarik konsekuensi bagi penyajian.
    \end{kotakkunci}
  - '# Kunci Jawaban Penugasan'
  - |-
    \begin{kotakkunci}
    \textbf{Butir 1 (struktur).} Angka acuan: 1.200 rumah tangga, 60 wilayah, 20 per wilayah; ragam antar-wilayah $0{,}917$, galat $1{,}320$, \textbf{ICC $0{,}410$}. Kesimpulan wajib: struktur kelompok harus dimodelkan.
  - '\textbf{Butir 2 (perbandingan).} Pada pembagian acak dengan benih 2026: OLS $1{,}294$; boosting biasa
    $1{,}097$; model campuran linear $0{,}873$; GPBoost $\mathbf{0{,}548}$. Yang dinilai bukan sekadar
    angkanya melainkan apakah keempatnya dinilai pada \textbf{pembagian yang sama}.'
  - '\textbf{Butir 3 (komponen ragam).} Dengan 44 iterasi terpilih lewat validasi silang: ragam galat
    $0{,}202$ (galat baku $0{,}010$), ragam wilayah $0{,}890$ (galat baku $0{,}165$).'
  - '\textbf{Butir 4 (perbandingan taksiran ragam).} Nilai sebenarnya: ragam galat $0{,}25$, ragam wilayah
    $0{,}904$. GPBoost lebih mendekati karena model campuran linear memaksakan bentuk linear, sehingga
    ketidakcocokan bentuk itu terserap ke dalam komponen ragam. Jawaban yang menyebut alasan ini memperoleh
    nilai penuh; yang hanya membandingkan angka tanpa alasan memperoleh sebagian.'
  - '\textbf{Butir 5--6 (peringkat).} Peringkat menurut efek acak dan menurut rata-rata mentah \textbf{tidak
    akan sama}. Rata-rata mentah mencampuradukkan dua hal: simpangan khas wilayah, dan komposisi rumah
    tangga di dalamnya. Sebuah wilayah dapat berrata-rata rendah semata karena penduduknya berpendidikan
    rendah --- bukan karena ada sesuatu pada wilayah itu sendiri.'
  - 'Efek acak menjawab pertanyaan yang berbeda dan lebih tepat untuk penargetan: ``setelah ciri rumah
    tangganya diperhitungkan, apakah wilayah ini masih tertinggal?'''' Wilayah yang tertinggal \emph{setelah}
    penyesuaian itulah yang menunjukkan adanya persoalan tingkat wilayah --- akses, harga, layanan ---
    yang dapat ditangani program.'
  - |-
    \textbf{Butir 7--8.} Rekomendasi harus memuat syarat: ICC cukup tinggi, ukuran sampel per wilayah memadai, dan iterasi ditentukan lewat validasi silang. Keterbatasan wajib memuat ketiganya: perbedaan ketepatan wilayah dikenal versus baru; ketiadaan klaim sebab-akibat; dan sifat data yang simulatif.
    \end{kotakkunci}
  - '# Catatan Penskoran untuk Pengajar'
  - |-
    \begin{kotakinfo}
    \begin{itemize}
    \item \textbf{Nilai penuh} bila: ICC dihitung dan dipakai sebagai dasar keputusan, bukan sekadar dilaporkan; keempat model dinilai pada pembagian yang sama; banyaknya iterasi ditentukan lewat validasi silang \emph{dan} alasannya dikaitkan dengan komponen ragam; serta perbedaan ramalan bagi wilayah dikenal dan wilayah baru dinyatakan terus terang.
    \item \textbf{Pengurangan nilai} bila: penanda wilayah dimasukkan sebagai peubah penjelas; model dinilai pada data latih; RMSE antar-model dibandingkan pada pembagian berbeda; atau efek acak ditafsirkan sebagai ``mutu wilayah'' tanpa menyebut bahwa ia bersyarat pada peubah penjelas.
    \item Mahasiswa yang memeriksa apakah GPBoost masih unggul ketika ICC rendah --- misalnya dengan membangkitkan ulang data ber-ICC kecil --- layak memperoleh nilai tambahan, sebab itulah uji kendali yang tepat bagi klaim modul ini.
    \end{itemize}
    \end{kotakinfo}
