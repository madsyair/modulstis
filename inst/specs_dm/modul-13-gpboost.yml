  tujuan:
  - 'Setelah menyelesaikan praktikum Modul 13, mahasiswa diharapkan mampu:'
  - |-
    1. Mengenali **struktur bertingkat** pada data dan menjelaskan mengapa ia melanggar pengandaian kebebasan amatan.
    2. Menghitung dan menafsirkan **koefisien korelasi intrakelas** (ICC) sebagai ukuran kuatnya struktur kelompok.
    3. Menjelaskan keterbatasan **boosting biasa** dan **model campuran linear**, masing-masing pada setengah persoalan yang berbeda.
    4. Menerapkan **GPBoost** dengan Python: menyusun `GPModel`, menentukan banyaknya iterasi lewat validasi silang, dan melatih model.
    5. Menaksir dan menafsirkan **komponen ragam** --- ragam antar-kelompok dan ragam galat.
    6. Memulihkan **efek acak** tiap wilayah dan memeriksa ketepatannya terhadap nilai yang ditanam.
    7. Membandingkan **empat pendekatan** pada data uji yang sama dan menjelaskan urutan hasilnya.
    8. Menjelaskan perbedaan ramalan bagi kelompok **yang sudah terlihat** dan kelompok **baru**.
