  - '## Kunci Latihan 13.2 -- Menjalankan GPBoost'
  - |-
    ```{python k2}
    import numpy as np, pandas as pd, gpboost as gpb
    rt = pd.read_csv("data/rumahtangga_wilayah.csv")
    X = rt[["lama_sekolah", "umur_krt", "anggota_rt"]].values
    y = rt["pengeluaran"].values
    g = rt["wilayah"].astype(str).to_numpy()
    rng = np.random.default_rng(2026); idx = rng.permutation(len(rt))
    tr, te = idx[:900], idx[900:]
  - |-
    hasil = []
    for lr in [0.01, 0.05, 0.20]:                                          # (a) dan (b)
        par = {"objective": "regression_l2", "learning_rate": lr,
               "max_depth": 3, "verbose": 0}
        gm_cv = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
        cv = gpb.cv(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]), gp_model=gm_cv,
                    num_boost_round=800, early_stopping_rounds=30, nfold=5,
                    seed=2026, verbose_eval=False)
        k = int(np.argmin(cv[[c for c in cv if "mean" in c][0]])) + 1
        gm = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
        bst = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                        gp_model=gm, num_boost_round=k)
        cov = gm.get_cov_pars()
        pr = bst.predict(data=X[te], group_data_pred=g[te], pred_latent=False)
        hasil.append({"learning_rate": lr, "iterasi": k,
                      "ragam_galat": round(float(np.asarray(cov).ravel()[0]), 4),
                      "ragam_wilayah": round(float(np.asarray(cov).ravel()[1]), 4),
                      "RMSE": round(float(np.sqrt(np.mean((y[te]-pr["response_mean"])**2))), 4)})
    print(pd.DataFrame(hasil))
    print("\nnilai sebenarnya: ragam galat 0.25, ragam wilayah 0.904")
    ```
  - |-
    ```{python k2c}
    par = {"objective": "regression_l2", "learning_rate": 0.05, "max_depth": 3, "verbose": 0}
    gm = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
    bst = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                    gp_model=gm, num_boost_round=44)
    pr = bst.predict(data=X[te], group_data_pred=g[te], pred_latent=False)
    benar = pd.read_csv("data/efek_wilayah_sebenarnya.csv").set_index("wilayah")
    tanda = np.array([benar.loc[w, "efek_sebenarnya"] > 0 for w in g[te]])   # (c)
    sisa = y[te] - pr["response_mean"]
    print("RMSE wilayah efek POSITIF:", round(float(np.sqrt(np.mean(sisa[tanda]**2))), 4),
          " n =", int(tanda.sum()))
    print("RMSE wilayah efek NEGATIF:", round(float(np.sqrt(np.mean(sisa[~tanda]**2))), 4),
          " n =", int((~tanda).sum()))
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(a)--(b)} Makin kecil \texttt{learning\_rate}, makin banyak iterasi yang diperlukan --- pola yang lazim pada boosting. Yang khas GPBoost adalah pengaruhnya terhadap \textbf{komponen ragam}: laju belajar besar membuat pohon cepat menyerap keragaman sehingga ragam galat cenderung tertaksir terlalu kecil.
  - 'Mahasiswa harus membandingkan taksiran terhadap nilai sebenarnya (ragam galat $0{,}25$; ragam wilayah
    $0{,}904$) dan menyimpulkan laju belajar mana yang paling mendekati --- bukan sekadar memilih yang
    RMSE-nya terkecil. Inilah butir pokok latihan ini: pada statistik resmi, \textbf{komponen ragam sering
    menjadi tujuan analisis}, bukan hasil sampingan.'
  - |-
    \textbf{(c)} Hasilnya: RMSE $0{,}496$ pada wilayah ber-efek positif ($n = 124$) dan $0{,}582$ pada wilayah ber-efek negatif ($n = 176$) --- selisihnya kecil dan dapat dianggap \textbf{seimbang}. Itulah yang diharapkan: model tidak berat sebelah terhadap wilayah tertentu. Ketidakseimbangan yang besar akan menandakan model belum menangkap struktur wilayah dengan baik. Jawaban yang menyimpulkan keseimbangan ini \emph{beserta angkanya} memperoleh nilai penuh.
    \end{kotakkunci}
