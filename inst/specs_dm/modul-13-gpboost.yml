  - '## Daftar Istilah'
  - |-
    \begin{kotakistilah}
    \textbf{Data bertingkat} (\emph{hierarchical/multilevel data}) --- data yang unitnya tersarang di dalam unit tingkat lebih tinggi.
  - \textbf{Efek acak} (\emph{random effect}) --- simpangan khas tiap kelompok yang dimodelkan sebagai
    peubah acak berpusat nol.
  - \textbf{ICC} (\emph{intraclass correlation}) --- proporsi keragaman yang berasal dari perbedaan antar-kelompok.
  - \textbf{Komponen ragam} (\emph{variance components}) --- ragam antar-kelompok dan ragam galat.
  - \textbf{Boosting} --- ansambel pohon yang dibangun berurutan, tiap pohon memperbaiki sisaan pendahulunya.
  - \textbf{GPBoost} --- metode yang menaksir pengaruh tetap dengan boosting dan struktur kelompok dengan
    efek acak atau proses Gaussian secara berselang-seling.
  - |-
    \textbf{Pendugaan area kecil} (\emph{small area estimation}) --- pendugaan bagi wilayah dengan sampel kecil dengan meminjam kekuatan dari wilayah lain lewat model.
    \end{kotakistilah}
