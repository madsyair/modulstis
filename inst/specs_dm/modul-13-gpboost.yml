    Paket \texttt{gpboost} tersedia untuk \textbf{R maupun Python} dengan antarmuka yang hampir sama --- keduanya membungkus pustaka C++ yang sama. Modul ini menjalankan \textbf{keduanya}: Contoh 13.4--13.7 memakai Python, dan Bagian 13.8 mengulang analisis yang sama dengan R.
