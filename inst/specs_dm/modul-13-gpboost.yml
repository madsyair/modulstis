  - '## Bahan (Berkas Data)'
  - |-
    | Berkas | Isi |
    |:-------|:----|
    | `data/rumahtangga_wilayah.csv` | 1.200 rumah tangga dalam 60 wilayah; peubah penjelas dan pengeluaran |
