  contoh:
  - contoh: Membaca data dan mengenali struktur bertingkat
    narasi: |-
      \kode{struktur data dan sebaran antar-wilayah}

      ```{r baca, fig.cap="Rata-rata pengeluaran tiap wilayah: perbedaan antar-wilayah jelas terlihat", fig.width=7.2, fig.height=3.4, out.width="86%"}
      rt <- read.csv("data/rumahtangga_wilayah.csv", stringsAsFactors = FALSE)
      str(rt)
      cat("rumah tangga:", nrow(rt), " wilayah:", length(unique(rt$wilayah)),
          " rumah tangga per wilayah:", nrow(rt) / length(unique(rt$wilayah)), "\n")

      rata_wil <- tapply(rt$pengeluaran, rt$wilayah, mean)
      round(summary(rata_wil), 3)

      par(family = "sans", mar = c(4, 4, 1, 1))
      plot(sort(rata_wil), pch = 19, col = "#0B6FB4", cex = 0.7,
           xlab = "wilayah (diurutkan)", ylab = "rata-rata pengeluaran")
      abline(h = mean(rt$pengeluaran), lty = 2, col = "#F58220", lwd = 2)
      legend("topleft", c("rata-rata wilayah", "rata-rata keseluruhan"),
             col = c("#0B6FB4", "#F58220"), pch = c(19, NA), lty = c(NA, 2), bty = "n", cex = 0.8)
      ```

      \begin{kotakinterpretasi}
      Data memuat 1.200 rumah tangga yang tersebar merata pada 60 wilayah --- 20 rumah tangga per wilayah. Inilah bentuk \textbf{bertingkat} yang lazim pada pendataan resmi: unit pencacahan tersarang di dalam unit wilayah.

      Gambar memperlihatkan persoalannya dengan gamblang. Rata-rata pengeluaran antar-wilayah tersebar jauh dari garis rata-rata keseluruhan --- rentangnya lebih dari empat juta rupiah. Bila amatan benar-benar saling bebas, sebaran rata-rata wilayah hanya akan mencerminkan keragaman pencuplikan dan tampak jauh lebih rapat.

      Perbedaan antar-wilayah sebesar ini \textbf{tidak boleh diabaikan}. Model yang mengandaikan kebebasan akan menganggap keragaman tersebut sebagai galat murni, sehingga selang kepercayaannya terlalu sempit dan ramalannya untuk wilayah tertentu bias.
      \end{kotakinterpretasi}
  - contoh: Mengukur kuatnya struktur kelompok dengan ICC
    narasi: |-
      \kode{model kosong dengan lme4}

      ```{r icc}
      suppressPackageStartupMessages(library(lme4))
      set.seed(2026)
      i_latih <- sample(nrow(rt), 900)
      latih <- rt[i_latih, ]; uji <- rt[-i_latih, ]
      cat("latih:", nrow(latih), " uji:", nrow(uji), "\n")

      m0 <- lmer(pengeluaran ~ 1 + (1 | wilayah), data = latih)
      vc <- as.data.frame(VarCorr(m0))
      ragam <- setNames(vc$vcov, c("antar_wilayah", "galat"))
      round(ragam, 4)
      cat("ICC =", round(ragam["antar_wilayah"] / sum(ragam), 3), "\n")
      ```

      \begin{kotakinterpretasi}
      Model kosong --- tanpa peubah penjelas apa pun --- memisahkan keragaman menjadi dua bagian: \textbf{antar-wilayah} $0{,}917$ dan \textbf{dalam wilayah (galat)} $1{,}320$.

      ICC-nya \textbf{0,410}: sekitar $41\%$ keragaman pengeluaran berasal dari perbedaan antar-wilayah, bukan dari perbedaan antar-rumah tangga di dalam wilayah yang sama. Angka setinggi ini menegaskan bahwa struktur kelompok wajib dimodelkan.

      Sebagai kaidah praktis, ICC di atas sekitar $0{,}05$ saja sudah cukup untuk membuat pengabaian struktur kelompok berbahaya bagi inferensi. Nilai $0{,}41$ jauh melampauinya.

      Perhatikan bahwa ragam galat $1{,}320$ di sini \textbf{masih memuat} pengaruh peubah penjelas yang belum dimasukkan --- pada model kosong, seluruh pengaruh lama sekolah dan umur kepala rumah tangga ikut terhitung sebagai galat. Contoh berikutnya memasukkannya.
      \end{kotakinterpretasi}
  - contoh: 'Dua model pembanding: regresi linear dan model campuran linear'
    narasi: |-
      \kode{lm dan lmer beserta penilaiannya pada data uji}

      ```{r pembanding}
      ols <- lm(pengeluaran ~ lama_sekolah + umur_krt + anggota_rt, data = latih)
      lmm <- lmer(pengeluaran ~ lama_sekolah + umur_krt + anggota_rt + (1 | wilayah),
                  data = latih)

      rmse <- function(y, yhat) sqrt(mean((y - yhat)^2))
      p_ols <- predict(ols, newdata = uji)
      p_lmm <- predict(lmm, newdata = uji, allow.new.levels = TRUE)
      round(c(RMSE_OLS = rmse(uji$pengeluaran, p_ols),
              RMSE_LMM = rmse(uji$pengeluaran, p_lmm)), 4)

      vc1 <- as.data.frame(VarCorr(lmm))
      round(setNames(vc1$vcov, c("antar_wilayah", "galat")), 4)

      benar <- read.csv("data/efek_wilayah_sebenarnya.csv")
      eb <- ranef(lmm)$wilayah[, 1]; nama <- rownames(ranef(lmm)$wilayah)
      cat("korelasi efek acak LMM vs yang ditanam:",
          round(cor(eb, benar$efek_sebenarnya[match(nama, benar$wilayah)]), 4), "\n")
      ```

      \begin{kotakinterpretasi}
      Kedua model memakai peubah penjelas yang sama; yang membedakan hanyalah ada atau tidaknya efek acak wilayah.

      \textbf{Regresi linear} memberi RMSE $\mathbf{1{,}294}$. Ia mengabaikan wilayah sepenuhnya, sehingga seluruh perbedaan antar-wilayah masuk ke galat.

      \textbf{Model campuran linear} memberi RMSE $\mathbf{0{,}873}$ --- perbaikan sekitar $32\%$ hanya dengan menambahkan satu suku $(1 \mid \texttt{wilayah})$. Setelah peubah penjelas masuk, ragam galat turun tajam dari $1{,}320$ menjadi jauh lebih kecil, sedangkan ragam antar-wilayah bertahan --- sebagaimana seharusnya, sebab peubah penjelas tingkat rumah tangga tidak menjelaskan perbedaan antar-wilayah.

      Yang paling meyakinkan: korelasi antara efek acak taksiran dan efek yang \textbf{sengaja ditanam} mencapai $\mathbf{0{,}977}$. Model campuran berhasil memulihkan hampir seluruh struktur wilayah.

      Lalu apa yang masih kurang? Model ini memaksa pengaruh lama sekolah \textbf{linear}, padahal data dibangkitkan dengan bentuk sinus yang naik lalu melandai, ditambah \textbf{ambang tajam} pada umur 45 tahun. Kekurangan itulah yang hendak dijawab GPBoost.
      \end{kotakinterpretasi}

      # Contoh Praktikum: GPBoost dengan Python
  - contoh: Menyiapkan data dan GPModel
    narasi: |-
      \kode{membaca berkas yang sama dari Python}

      ```{python py-siap}
      import numpy as np, pandas as pd, gpboost as gpb
      print("gpboost versi:", gpb.__version__)

      rt = pd.read_csv("data/rumahtangga_wilayah.csv")
      X  = rt[["lama_sekolah", "umur_krt", "anggota_rt"]].values
      y  = rt["pengeluaran"].values
      g  = rt["wilayah"].astype(str).to_numpy()      # penanda kelompok

      rng = np.random.default_rng(2026)
      idx = rng.permutation(len(rt)); tr, te = idx[:900], idx[900:]
      print("latih:", len(tr), " uji:", len(te), " wilayah:", len(np.unique(g)))
      ```

      \begin{kotakpenjelasan}
      Python membaca \textbf{berkas yang sama} dengan R. Perbedaan pokoknya adalah adanya \texttt{group\_data} --- penanda kelompok --- yang diserahkan kepada \texttt{GPModel} secara terpisah dari matriks peubah penjelas. Penanda kelompok \textbf{bukan} peubah penjelas dan tidak boleh dimasukkan ke dalam \texttt{X}.
      \end{kotakpenjelasan}
  - contoh: Menentukan banyaknya iterasi dengan validasi silang
    narasi: |-
      \kode{gpb.cv dengan penghentian dini}

      ```{python py-cv}
      par = {"objective": "regression_l2", "learning_rate": 0.05,
             "max_depth": 3, "verbose": 0}

      gm_cv = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
      cv = gpb.cv(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]), gp_model=gm_cv,
                  num_boost_round=400, early_stopping_rounds=20, nfold=5,
                  seed=2026, verbose_eval=False)
      kunci = [k for k in cv if "mean" in k][0]
      k_opt = int(np.argmin(cv[kunci])) + 1
      print("banyaknya iterasi optimum:", k_opt)
      ```

      \begin{kotakinterpretasi}
      Validasi silang lima lipat memilih \textbf{44 iterasi}. Angka ini jauh lebih kecil daripada 400 yang disediakan --- dan itu bukan kebetulan.

      Pada GPBoost, banyaknya iterasi berperan ganda. Selain mengendalikan kelenturan pengaruh tetap sebagaimana pada boosting biasa, ia juga menentukan \textbf{pembagian keragaman} antara pengaruh tetap dan efek acak. Iterasi yang terlalu banyak membuat pohon-pohon menyerap keragaman yang sesungguhnya milik wilayah, sehingga ragam antar-wilayah tertaksir terlalu kecil.

      Contoh berikutnya memperlihatkan akibatnya secara angka, jadi menentukan banyaknya iterasi lewat validasi silang di sini \textbf{bukan sekadar praktik yang rapi} --- ia menentukan benar atau tidaknya taksiran komponen ragam.
      \end{kotakinterpretasi}
  - contoh: Melatih GPBoost dan menaksir komponen ragam
    narasi: |-
      \kode{gpb.train dan ringkasan GPModel}

      ```{python py-latih}
      gm = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
      bst = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                      gp_model=gm, num_boost_round=k_opt)
      gm.summary()
      ```

      ```{python py-ragam-berlebih}
      # pembanding: iterasi terlalu banyak (tanpa validasi silang)
      gm_lebih = gpb.GPModel(group_data=g[tr], likelihood="gaussian")
      bst_lebih = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                            gp_model=gm_lebih, num_boost_round=400)
      print("--- dengan 400 iterasi ---")
      gm_lebih.summary()
      ```

      \begin{kotakinterpretasi}
      Dengan 44 iterasi, komponen ragam tertaksir: \textbf{ragam galat 0,202} dan \textbf{ragam antar-wilayah 0,890}.

      Bandingkan dengan nilai yang sebenarnya dipakai membangkitkan data: ragam galat $0{,}5^2 = 0{,}25$, dan ragam ke-60 efek wilayah yang tertarik $0{,}951^2 = 0{,}904$. Keduanya dipulihkan dengan baik --- selisihnya kecil dan searah dengan galat baku yang dilaporkan.

      Sekarang perhatikan pembandingnya. Dengan 400 iterasi, \textbf{ragam galat anjlok} jauh di bawah nilai sebenarnya: pohon-pohon telah menghafal data latih sehingga sisaannya hampir nol. Model menjadi sangat percaya diri padahal keragaman itu nyata dan akan muncul kembali pada data baru.

      Inilah alasan mengapa pada GPBoost penghentian yang tepat lebih penting daripada pada boosting biasa. Pada boosting biasa, terlalu banyak iterasi merusak daya ramal; pada GPBoost, ia \textbf{juga} merusak taksiran komponen ragam --- yakni merusak hal yang sering justru menjadi tujuan analisis pada statistik resmi.
      \end{kotakinterpretasi}
  - contoh: Memulihkan efek acak wilayah
    narasi: |-
      \kode{prediksi laten dan pencocokan dengan nilai yang ditanam}

      ```{python py-efek}
      pl = bst.predict(data=X[te], group_data_pred=g[te], pred_latent=True)
      efek = (pd.DataFrame({"wilayah": g[te], "taksiran": pl["random_effect_mean"]})
                .groupby("wilayah").mean())

      benar = pd.read_csv("data/efek_wilayah_sebenarnya.csv").set_index("wilayah")
      gab = efek.join(benar)
      print(gab.head(5).round(4))
      print("\nkorelasi efek acak GPBoost vs yang ditanam:",
            round(float(gab["taksiran"].corr(gab["efek_sebenarnya"])), 4))
      print("banyaknya wilayah yang dicocokkan:", len(gab))
      ```

      \begin{kotakinterpretasi}
      Korelasi antara efek acak taksiran dan efek yang ditanam mencapai \textbf{0,985} --- sedikit lebih tinggi daripada model campuran linear ($0{,}977$).

      Sebabnya masuk akal. Model campuran linear harus memaksakan bentuk linear pada pengaruh lama sekolah dan umur; ketidakcocokan bentuk itu ikut terserap ke dalam efek acak, sehingga taksirannya sedikit tercemar. GPBoost memodelkan bentuk nonlinearnya dengan pohon, sehingga efek acak yang tersisa lebih murni mencerminkan perbedaan antar-wilayah.

      Bagi pekerjaan statistik resmi, efek acak ini sering \textbf{lebih penting daripada ramalannya sendiri}: ia adalah taksiran ``seberapa tinggi atau rendah wilayah ini dibandingkan wilayah lain setelah ciri rumah tangganya diperhitungkan'' --- persis gagasan yang mendasari pendugaan area kecil.
      \end{kotakinterpretasi}
  - contoh: Membandingkan empat pendekatan pada data uji yang sama
    narasi: |-
      \kode{RMSE GPBoost dan boosting biasa}

      ```{python py-banding}
      pr = bst.predict(data=X[te], group_data_pred=g[te], pred_latent=False)
      rmse_gpb = float(np.sqrt(np.mean((y[te] - pr["response_mean"])**2)))

      bst_biasa = gpb.train(params=par, train_set=gpb.Dataset(X[tr], label=y[tr]),
                            num_boost_round=k_opt)          # TANPA gp_model
      rmse_boost = float(np.sqrt(np.mean((y[te] - bst_biasa.predict(X[te]))**2)))

      print("RMSE GPBoost      :", round(rmse_gpb, 4))
      print("RMSE boosting biasa:", round(rmse_boost, 4))
      ```

      \begin{kotakinterpretasi}
      Empat pendekatan, satu data uji, satu ukuran:

      \begin{center}
      \begin{tabular}{@{}p{5.0cm}p{2.6cm}p{2.6cm}p{2.2cm}@{}}
      \textbf{Pendekatan} & \textbf{Nonlinear} & \textbf{Kelompok} & \textbf{RMSE}\\
      \hline
      Regresi linear (OLS)   & tidak & tidak & 1,294\\
      Boosting biasa         & ya    & tidak & 1,097\\
      Model campuran linear  & tidak & ya    & 0,873\\
      \textbf{GPBoost}       & ya    & ya    & \textbf{0,548}\\
      \end{tabular}
      \end{center}

      Urutannya menceritakan seluruh gagasan modul ini. Menambahkan \textbf{kemampuan nonlinear} saja (OLS $\to$ boosting) memperbaiki RMSE sekitar $15\%$. Menambahkan \textbf{struktur kelompok} saja (OLS $\to$ model campuran) memperbaikinya $33\%$ --- lebih besar, sebab ICC data ini tinggi. Menambahkan \textbf{keduanya} memberi $58\%$.

      Yang perlu diperhatikan: perbaikan GPBoost atas model campuran ($0{,}873 \to 0{,}548$) \textbf{lebih besar} daripada perbaikan boosting atas OLS ($1{,}294 \to 1{,}097$). Kedua langkah itu sama-sama ``menambahkan kemampuan nonlinear'', tetapi hasilnya berbeda jauh --- karena pada GPBoost, pohon tidak lagi harus bersaing dengan keragaman antar-wilayah yang tak termodelkan. Kedua komponen itu \textbf{saling menguatkan}, bukan sekadar berjumlah.

      Perlu pula ditegaskan bahwa urutan ini bergantung pada data. Bila ICC-nya rendah, model campuran nyaris tidak akan mengungguli OLS dan boosting biasa dapat memadai. Karena itu \textbf{hitung ICC lebih dahulu} --- sebagaimana Contoh 13.2 --- sebelum memilih pendekatan.
      \end{kotakinterpretasi}
  - contoh: Meramalkan bagi wilayah baru
    narasi: |-
      \kode{kelompok yang belum pernah terlihat}

      ```{python py-baru}
      pred_lama = bst.predict(data=X[te][:5], group_data_pred=g[te][:5],
                              pred_latent=False)["response_mean"]
      pred_baru = bst.predict(data=X[te][:5],
                              group_data_pred=np.array(["W99"] * 5),
                              pred_latent=False)["response_mean"]
      print(pd.DataFrame({"wilayah_asli": g[te][:5],
                          "ramalan_wilayah_dikenal": np.round(pred_lama, 3),
                          "ramalan_wilayah_baru": np.round(pred_baru, 3)}))
      ```

      \begin{kotakinterpretasi}
      Kelima rumah tangga ini memiliki ciri yang sama persis pada kedua kolom ramalan --- yang berbeda hanyalah wilayahnya.

      Untuk \textbf{wilayah yang dikenal}, ramalannya menjumlahkan pengaruh tetap dan efek acak wilayah tersebut. Untuk \textbf{wilayah baru} (\texttt{W99}, yang tidak ada pada data latih), efek acaknya diramalkan \textbf{nol} sehingga yang tersisa hanya pengaruh tetap --- dan seluruh ramalannya bergeser ke nilai rata-rata.

      Perilaku ini benar dan penting dipahami: model tidak memiliki dasar apa pun untuk menduga wilayah baru itu di atas atau di bawah rata-rata. Konsekuensi praktisnya, \textbf{ketepatan ramalan bagi wilayah baru akan jauh lebih rendah} daripada bagi wilayah yang datanya sudah ada. Bila laporan menyajikan satu angka ketepatan tanpa membedakan keduanya, angka itu menyesatkan bagi pengguna yang hendak menerapkan model ke wilayah yang belum tercakup.
      \end{kotakinterpretasi}

      # Padanan Kode dalam R

      Bagian ini menjalankan **analisis yang sama dengan R**, sehingga hasil kedua bahasa dapat dibandingkan langsung. Berikut analisis yang sama dijalankan ulang dengan R.

      \kode{GPBoost dengan R}

      ```{r r-gpboost}
      library(gpboost)

      rt <- read.csv("data/rumahtangga_wilayah.csv", stringsAsFactors = FALSE)
      X  <- as.matrix(rt[, c("lama_sekolah", "umur_krt", "anggota_rt")])
      y  <- rt$pengeluaran
      g  <- rt$wilayah

      set.seed(2026)
      i_latih <- sample(nrow(rt), 900)
      X_tr <- X[i_latih, ]; y_tr <- y[i_latih]; g_tr <- g[i_latih]
      X_te <- X[-i_latih, ]; y_te <- y[-i_latih]; g_te <- g[-i_latih]

      par <- list(objective = "regression_l2", learning_rate = 0.05,
                  max_depth = 3, verbose = -1)

      # (1) banyaknya iterasi lewat validasi silang
      gm_cv <- GPModel(group_data = g_tr, likelihood = "gaussian")
      cv <- gpb.cv(params = par, data = X_tr, label = y_tr, gp_model = gm_cv,
                   nrounds = 400, early_stopping_rounds = 20, nfold = 5, verbose = 0)
      k_opt <- cv$best_iter
      cat("banyaknya iterasi optimum (R):", k_opt, "\n")

      # (2) pelatihan dan komponen ragam
      gm  <- GPModel(group_data = g_tr, likelihood = "gaussian")
      bst <- gpboost(data = X_tr, label = y_tr, gp_model = gm,
                     nrounds = k_opt, params = par, verbose = 0)
      summary(gm)

      # (3) efek acak dan ramalan
      pl <- predict(bst, data = X_te, group_data_pred = g_te, predict_var = FALSE)
      cat("RMSE GPBoost (R):", round(sqrt(mean((y_te - pl$response_mean)^2)), 4), "\n")
      ```

      \begin{kotakinterpretasi}
      Bandingkan keluaran R di atas dengan hasil Python pada Contoh 13.4--13.6.

      \textbf{Banyaknya iterasi optimum sama persis: 44.} Ini bukan kebetulan --- kedua bahasa membungkus pustaka C++ yang sama, sehingga algoritmanya identik.

      \textbf{Komponen ragam praktis sama:} R memberi ragam galat $0{,}212$ dan ragam wilayah $0{,}870$; Python memberi $0{,}202$ dan $0{,}890$. Keduanya sama-sama dekat dengan nilai sebenarnya ($0{,}25$ dan $0{,}904$).

      \textbf{RMSE sedikit berbeda:} $0{,}529$ pada R dan $0{,}548$ pada Python. Penyebabnya bukan algoritma melainkan \textbf{pembagian latih--uji yang berbeda} --- \texttt{sample()} pada R dan \texttt{numpy} pada Python memakai pembangkit bilangan acak yang berlainan, sehingga 900 rumah tangga yang terpilih tidak sama meskipun benihnya sama-sama 2026.

      Pelajaran praktisnya: \textbf{benih acak tidak dapat disamakan antar-bahasa}. Bila hasil R dan Python harus benar-benar identik, pembagian latih--uji harus dibuat sekali lalu disimpan ke berkas dan dibaca kedua bahasa --- bukan dibangkitkan ulang di masing-masing.

      \textbf{Perbedaan penamaan:} R memakai \texttt{nrounds} (Python: \texttt{num\_boost\_round}), \texttt{gpboost()} (Python: \texttt{gpb.train()}), dan menyerahkan data lewat \texttt{data=} beserta \texttt{label=} (Python: objek \texttt{gpb.Dataset}). Argumen \texttt{verbose} pun berbeda: R memakai $-1$ untuk membisukan keluaran, Python memakai $0$.
      \end{kotakinterpretasi}

      \begin{kotaksalah}
      \begin{enumerate}
      \item Memasukkan penanda kelompok sebagai \textbf{peubah penjelas} ke dalam \texttt{X}; ia harus diserahkan lewat \texttt{group\_data} agar diperlakukan sebagai efek acak, bukan sebagai pemecah pohon.
      \item Menjalankan boosting lebih dahulu lalu menaksir efek acak dari sisaannya; komponen ragam akan tertaksir terlalu kecil.
      \item Menetapkan banyaknya iterasi tanpa validasi silang; pada GPBoost hal itu merusak taksiran komponen ragam, bukan hanya daya ramal.
      \item Membagi data latih--uji secara acak padahal tujuannya meramalkan \textbf{wilayah baru}; pembagiannya harus dilakukan \textbf{per wilayah}.
      \item Melaporkan satu angka ketepatan tanpa membedakan wilayah yang dikenal dan wilayah baru.
      \item Menafsirkan efek acak sebagai ``mutu'' wilayah; ia hanyalah simpangan bersyarat setelah peubah penjelas diperhitungkan.
      \item Mengabaikan ICC lalu langsung memakai GPBoost; bila ICC hampir nol, boosting biasa lebih sederhana dan setara.
      \item Membandingkan RMSE antar-model yang dihitung pada pembagian data yang berbeda.
      \item Menyimpulkan hubungan sebab-akibat dari pentingnya peubah pada model boosting.
      \end{enumerate}
      \end{kotaksalah}
