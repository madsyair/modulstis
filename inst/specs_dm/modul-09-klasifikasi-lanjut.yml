exercises:
- id: L9.1
  points: 15
  solution: 'Tingkat Dasar: dua resep berbeda, spesifikasi tiga model, dan perbandingan adil.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: "suppressPackageStartupMessages({\n  library(recipes); library(rsample); library(parsnip); library(workflows)\n  library(tune); library(yardstick); library(dplyr)})\n\ntani <- read.csv(\"data/data_usahatani.csv\", stringsAsFactors = TRUE)\ntani$produktif <- factor(tani$produktif, levels = c(\"Ya\", \"Tidak\"))\nset.seed(2025)\nbagi <- initial_split(tani, prop = 0.75, strata = produktif)\nlat  <- training(bagi); uji <- testing(bagi)\nset.seed(2025)\nlipatan <- vfold_cv(lat, v = 5, strata = produktif)\n\nrec_jarak <- recipe(produktif ~ ., data = lat) |>\n  step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>\n  step_normalize(all_numeric_predictors())\nrec_pohon <- recipe(produktif ~ ., data = lat) |> step_zv(all_predictors())\n\nspec_svm <- svm_rbf(cost = tune(), rbf_sigma = tune()) |>\n  set_engine(\"kernlab\") |> set_mode(\"classification\")\nspec_knn <- nearest_neighbor(neighbors = tune()) |>\n  set_engine(\"kknn\") |> set_mode(\"classification\")\nspec_rf  <- rand_forest(mtry = tune(), min_n = tune(), trees = 500) |>\n  set_engine(\"ranger\", importance = \"permutation\") |> set_mode(\"classification\")\n\nwf_svm <- workflow() |> add_recipe(rec_jarak) |> add_model(spec_svm)\nset.seed(2025)\npesan <- capture.output(\n  h_svm <- tune_grid(wf_svm, resamples = lipatan, grid = 8,\n                     metrics = metric_set(roc_auc)))\nshow_best(h_svm, metric = \"roc_auc\", n = 1)"
  interpretasi: 'Isian yang benar berturut-turut adalah NULL, step_normalize, step_zv, svm_rbf, kernlab, kknn, rand_forest, permutation, vfold_cv, lipatan, dan show_best. Dua hal patut ditekankan. Pertama, kedua resep sengaja berbeda: resep jarak mengodekan lalu membakukan karena SVM dan KNN bersandar pada jarak, sedangkan resep pohon tidak memerlukan keduanya. Kedua, objek lipatan dibuat sekali lalu dipakai seluruh model --- inilah syarat perbandingan yang adil.

    '
- id: L9.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: menguji kebutuhan pembakuan dan pemilihan model.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: "suppressPackageStartupMessages({\n  library(recipes); library(rsample); library(parsnip); library(workflows)\n  library(tune); library(yardstick); library(dplyr)})\n\ntani <- read.csv(\"data/data_usahatani.csv\", stringsAsFactors = TRUE)\ntani$produktif <- factor(tani$produktif, levels = c(\"Ya\", \"Tidak\"))\nset.seed(2025)\nbagi <- initial_split(tani, prop = 0.75, strata = produktif)\nlat  <- training(bagi); uji <- testing(bagi)\nset.seed(2025)\nlipatan <- vfold_cv(lat, v = 5, strata = produktif)\n\nrec_jarak <- recipe(produktif ~ ., data = lat) |>\n  step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>\n  step_normalize(all_numeric_predictors())\nrec_pohon <- recipe(produktif ~ ., data = lat) |> step_zv(all_predictors())\n\nuji_resep <- function(spec, rec, nama) {\n  wf <- workflow() |> add_recipe(rec) |> add_model(spec)\n  set.seed(2025)\n  h <- tune_grid(wf, resamples = lipatan, grid = 5,\n                 metrics = metric_set(roc_auc))\n  data.frame(model = nama,\n             AUC = round(max(collect_metrics(h)$mean, na.rm = TRUE), 4))\n}\n\ns_knn <- nearest_neighbor(neighbors = tune()) |>\n  set_engine(\"kknn\") |> set_mode(\"classification\")\ns_rf  <- rand_forest(mtry = tune(), min_n = tune(), trees = 500) |>\n  set_engine(\"ranger\") |> set_mode(\"classification\")\n\nhasil <- rbind(\n  uji_resep(s_knn, rec_jarak, \"KNN + resep jarak (dibakukan)\"),\n  uji_resep(s_knn, rec_pohon, \"KNN + resep pohon (TANPA baku)\"),\n  uji_resep(s_rf,  rec_pohon, \"RF + resep pohon (TANPA baku)\"),\n  uji_resep(s_rf,  rec_jarak, \"RF + resep jarak (dibakukan)\"))\nprint(hasil, row.names = FALSE)\n\ncat(\"\\nselisih pada KNN:\", round(hasil$AUC[1] - hasil$AUC[2], 4), \"\\n\")\ncat(\"selisih pada RF :\", round(hasil$AUC[3] - hasil$AUC[4], 4), \"\\n\")"
  interpretasi: 'Selisih pada Random Forest seharusnya mendekati nol, sebab pembelahan pohon hanya membandingkan urutan nilai dan urutan tidak berubah oleh pembakuan --- pembakuan pada pohon tidak merugikan, hanya sia-sia dan menambah waktu. Sebaliknya selisih pada KNN lazimnya nyata, sebab tanpa pembakuan peubah dosis pupuk yang bersatuan ratusan akan menentukan hampir seluruh jarak sehingga peubah lain praktis diabaikan. Peragaan ini mengubah aturan kesesuaian prapemrosesan dari hafalan menjadi sesuatu yang terbukti angkanya. Untuk pemilihan model: dugaan sangat cepat pada jutaan amatan menuntut Random Forest atau SVM dan **bukan** KNN yang biayanya justru pada tahap dugaan, dengan kelemahan waktu latih yang lebih lama; banyak peubah tak relevan memihak Random Forest yang cukup tahan, dengan kelemahan penafsiran yang lebih sukar; pencilan ekstrem yang sah memihak Random Forest karena pencilan hanya memengaruhi sebagian pohon; sedangkan kebutuhan daftar peubah berpengaruh dipenuhi Random Forest lewat kepentingan permutasi, dengan catatan bahwa kepentingan bukan sebab-akibat.

    '
- id: L9.D
  points: 10
  solution: 'Membetulkan kode: resep seragam, lipatan berbeda, trees ditala, dan pemilihan pada data uji.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: "suppressPackageStartupMessages({\n  library(recipes); library(rsample); library(parsnip); library(workflows)\n  library(tune); library(yardstick); library(dplyr)})\n\ntani <- read.csv(\"data/data_usahatani.csv\", stringsAsFactors = TRUE)\ntani$produktif <- factor(tani$produktif, levels = c(\"Ya\", \"Tidak\"))\nset.seed(2025)\nbagi <- initial_split(tani, prop = 0.75, strata = produktif)\nlat  <- training(bagi); uji <- testing(bagi)\nset.seed(2025)\nlipatan <- vfold_cv(lat, v = 5, strata = produktif)\n\nrec_jarak <- recipe(produktif ~ ., data = lat) |>\n  step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>\n  step_normalize(all_numeric_predictors())\nrec_pohon <- recipe(produktif ~ ., data = lat) |> step_zv(all_predictors())\n\n# (a) resep sudah disesuaikan dengan kebutuhan tiap model (lihat di atas)\n# (b) satu objek lipatan dipakai seluruh model (lihat di atas)\n\n# (c) trees ditetapkan, tidak ditala\nspec_rf <- rand_forest(mtry = tune(), min_n = tune(), trees = 500) |>\n  set_engine(\"ranger\", importance = \"permutation\") |>\n  set_mode(\"classification\")\nwf_rf <- workflow() |> add_recipe(rec_pohon) |> add_model(spec_rf)\n\n# (d) pemilihan memakai validasi silang pada data latih\nset.seed(2025)\nh_rf <- tune_grid(wf_rf, resamples = lipatan, grid = 8,\n                  metrics = metric_set(roc_auc))\nprint(show_best(h_rf, metric = \"roc_auc\", n = 3))\n\n# pemeriksaan wajib\n!(\"trees\" %in% names(select_best(h_rf, metric = \"roc_auc\")))"
  interpretasi: 'Empat kesalahan diperbaiki. Kesalahan (a) memakai satu resep bagi seluruh model; akibatnya bukan galat melainkan pemborosan --- pembakuan pada Random Forest tidak merugikan tetapi memperlihatkan bahwa penyusunnya belum memahami kebutuhan tiap model. Kesalahan (b) membuat lipatan berbeda bagi tiap model sehingga selisih kinerja yang terlihat boleh jadi hanya akibat pembagian yang berbeda, bukan akibat modelnya. Kesalahan (c) menala banyaknya pohon padahal menambah pohon pada Random Forest tidak menimbulkan *overfitting*; penalaan itu hanya membuang waktu yang lebih berguna dialokasikan bagi mtry dan min_n. Kesalahan (d) paling parah: mencoba beberapa model pada data uji lalu memilih yang terbaik mengubah data uji menjadi data latih terselubung, sehingga angka akhirnya tidak lagi menggambarkan kinerja pada data baru.

    '
- id: T9.1
  points: 50
  solution: 'Penugasan: membangun, membandingkan, dan merekomendasikan tiga model klasifikasi lanjut.'
  judul_r: Solusi Penugasan (R)
  solusi_r: "suppressPackageStartupMessages({\n  library(recipes); library(rsample); library(parsnip); library(workflows)\n  library(tune); library(yardstick); library(dplyr)})\n\ntani <- read.csv(\"data/data_usahatani.csv\", stringsAsFactors = TRUE)\ntani$produktif <- factor(tani$produktif, levels = c(\"Ya\", \"Tidak\"))\nset.seed(2025)\nbagi <- initial_split(tani, prop = 0.75, strata = produktif)\nlat  <- training(bagi); uji <- testing(bagi)\nset.seed(2025)\nlipatan <- vfold_cv(lat, v = 5, strata = produktif)\n\nrec_jarak <- recipe(produktif ~ ., data = lat) |>\n  step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>\n  step_normalize(all_numeric_predictors())\nrec_pohon <- recipe(produktif ~ ., data = lat) |> step_zv(all_predictors())\n\n# 1) ketimpangan dan profil awal\nprop <- prop.table(table(tani$produktif))\ncat(\"acuan mayoritas:\", round(max(prop), 4), \"\\n\")\nnum <- c(\"luas_lahan\",\"dosis_pupuk\",\"umur_petani\",\"pengalaman\",\"jarak_pasar\")\nrk <- aggregate(tani[num], list(produktif = tani$produktif), mean)\nrk[num] <- round(rk[num], 2); print(rk, row.names = FALSE)\n\n# 4-6) penalaan ketiga model pada lipatan yang SAMA\nsuppressPackageStartupMessages({library(kernlab); library(kknn); library(ranger)})\nsp_svm <- svm_rbf(cost = tune(), rbf_sigma = tune()) |>\n  set_engine(\"kernlab\") |> set_mode(\"classification\")\nsp_knn <- nearest_neighbor(neighbors = tune(), weight_func = tune()) |>\n  set_engine(\"kknn\") |> set_mode(\"classification\")\nsp_rf  <- rand_forest(mtry = tune(), min_n = tune(), trees = 500) |>\n  set_engine(\"ranger\", importance = \"permutation\") |> set_mode(\"classification\")\n\nwf_svm <- workflow() |> add_recipe(rec_jarak) |> add_model(sp_svm)\nwf_knn <- workflow() |> add_recipe(rec_jarak) |> add_model(sp_knn)\nwf_rf  <- workflow() |> add_recipe(rec_pohon) |> add_model(sp_rf)\n\nset.seed(2025)\npesan <- capture.output(\n  h_svm <- tune_grid(wf_svm, lipatan, grid = 8, metrics = metric_set(roc_auc)))\nset.seed(2025); h_knn <- tune_grid(wf_knn, lipatan,\n  grid = expand.grid(neighbors = c(3,5,9,15,25,41),\n                     weight_func = c(\"rectangular\",\"triangular\"),\n                     stringsAsFactors = FALSE), metrics = metric_set(roc_auc))\nset.seed(2025); h_rf  <- tune_grid(wf_rf,  lipatan, grid = 8, metrics = metric_set(roc_auc))\n\n# 7) perbandingan beserta ketidakpastiannya\nambil <- function(h, nm) collect_metrics(h) |> arrange(desc(mean)) |>\n  utils::head(1) |> transmute(model = nm, AUC = round(mean,4),\n                              galat_baku = round(std_err,4))\nbanding <- bind_rows(ambil(h_svm,\"SVM\"), ambil(h_knn,\"KNN\"),\n                     ambil(h_rf,\"Random Forest\"))\nprint(as.data.frame(banding), row.names = FALSE)\ncat(\"\\nselisih terbesar:\", round(max(banding$AUC)-min(banding$AUC), 4),\n    \"| galat baku terbesar:\", round(max(banding$galat_baku), 4), \"\\n\")\n\nbp <- barplot(banding$AUC, names.arg = banding$model,\n              col = c(\"#0B6FB4\",\"#F58220\",\"#00A651\"), border = \"white\",\n              ylim = c(0, max(banding$AUC + banding$galat_baku)*1.25),\n              ylab = \"ROC-AUC\", main = \"Perbandingan Tiga Model\")\narrows(bp, banding$AUC - banding$galat_baku, bp, banding$AUC + banding$galat_baku,\n       angle = 90, code = 3, length = 0.06, lwd = 2)\nabline(h = 0.5, col = \"#C0392B\", lty = 2, lwd = 2)\n\n# 9) penilaian pada data uji\nnm <- banding$model[which.max(banding$AUC)]\nwf_pilih <- switch(nm,\n  \"SVM\" = finalize_workflow(wf_svm, select_best(h_svm, metric=\"roc_auc\")),\n  \"KNN\" = finalize_workflow(wf_knn, select_best(h_knn, metric=\"roc_auc\")),\n  finalize_workflow(wf_rf, select_best(h_rf, metric=\"roc_auc\")))\nset.seed(2025)\nakhir <- last_fit(wf_pilih, split = bagi,\n  metrics = metric_set(roc_auc, f_meas, accuracy, sensitivity, specificity))\nprint(collect_metrics(akhir))\nprint(conf_mat(collect_predictions(akhir), truth = produktif, estimate = .pred_class))\n\n# 10) kepentingan peubah\nset.seed(2025)\nm_rf <- fit(finalize_workflow(wf_rf, select_best(h_rf, metric=\"roc_auc\")), data = lat)\npent <- extract_fit_engine(m_rf)$variable.importance\nimp <- data.frame(peubah = names(pent), kepentingan = round(as.numeric(pent), 5))\nprint(imp[order(-imp$kepentingan), ], row.names = FALSE)"
  interpretasi: 'Nomor 7 adalah inti penugasan. Bila selisih terbesar antar-model lebih kecil daripada galat baku terbesar, maka menyatakan satu model lebih baik tidak didukung bukti --- dan kesimpulan yang benar adalah menyatakan ketiganya tidak dapat dibedakan, lalu memilih berdasarkan pertimbangan lain. Nomor 8 menyediakan pertimbangan itu: KNN tercepat dilatih tetapi paling lambat menduga, dan sifat ini menentukan pada penerapan yang menuntut dugaan cepat. Nomor 10 wajib disertai peringatan bahwa kepentingan peubah menyatakan sumbangan terhadap dugaan, bukan hubungan sebab-akibat; menyimpulkan bahwa menaikkan dosis pupuk akan menaikkan produktivitas hanya karena peubah itu tampak penting adalah kekeliruan yang dapat berujung kebijakan salah sasaran. Nomor 12 menuntut rekomendasi yang mempertimbangkan empat hal sekaligus --- kinerja, kestabilan, biaya, dan penafsiran --- sehingga jawaban yang hanya menyebut AUC tertinggi belum memadai.

    '
