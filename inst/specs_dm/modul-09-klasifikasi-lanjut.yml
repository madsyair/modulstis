sub_cpmk: 'Sub-CPMK 9: Mahasiswa mampu membangun dan menala model klasifikasi lanjut --- Support Vector Machine, K-Nearest Neighbours, dan Random Forest --- menyesuaikan prapemrosesan dengan kebutuhan tiap model, membandingkannya secara adil, serta mengenali gagasan boosting sebagai keluarga model penggabung.

  '
