body:
  deskripsi:
  - |
    Modul-modul sebelumnya membangun model yang keputusannya dapat ditelusuri: pohon dapat dibaca sebagai aturan, dan koefisien regresi dapat ditafsirkan sebagai rasio odds. Modul ini beralih ke keluarga model yang berbeda wataknya --- jaringan syaraf tiruan, yang kuat dalam menangkap hubungan nonlinier tetapi sukar dijelaskan.
  - |
    Dua arsitektur dibahas. Feed-Forward Neural Network menyusun peubah masukan melalui satu atau beberapa lapis tersembunyi dengan fungsi aktivasi nonlinier. Radial Basis Function Neural Network bekerja dengan gagasan yang berbeda: ia menempatkan sejumlah pusat pada ruang peubah, lalu mengukur kedekatan tiap amatan terhadap pusat-pusat itu.
  - |
    Konteks yang dipakai adalah pendugaan kerentanan pangan rumah tangga --- persoalan yang lazim dihadapi instansi statistik, dan yang kelasnya timpang sehingga menuntut penanganan khusus. Ketimpangan itu ditangani dengan pembangkitan contoh sintetis, dan ambang keputusan dipindahkan berdasarkan ukuran yang sesuai, bukan dibiarkan pada nilai bawaan.
  - |-
    \begin{kotakperhatian}[Tentang data]
    Berkas data pada modul ini adalah \textbf{data simulasi} (\texttt{set.seed(2025)}), \textbf{bukan data nyata} dan \textbf{bukan data resmi} instansi mana pun. Berbeda dari beberapa modul sebelumnya, data ini sengaja dibangkitkan dengan \textbf{hubungan yang sungguh ada} antara peubah penjelas dan sasaran, sehingga model diharapkan berkinerja baik --- dan kinerja yang buruk justru menandakan ada yang keliru pada alur kerja.
    \end{kotakperhatian}
  tujuan:
  - 'Setelah menyelesaikan praktikum ini secara tuntas, mahasiswa diharapkan mampu:'
  - 1. **Menjelaskan** arsitektur FFNN beserta peran lapis tersembunyi dan fungsi aktivasi.
  - 2. **Menjelaskan** cara kerja RBFNN dan perbedaan gagasannya terhadap FFNN.
  - 3. **Menyusun** resep prapemrosesan yang sesuai bagi jaringan syaraf.
  - 4. **Menangani** ketimpangan kelas di dalam lipatan validasi silang.
  - 5. **Menala** banyaknya simpul tersembunyi dan parameter penyusutan.
  - 6. **Membangun** RBFNN dari dasar beserta penetapan pusat dan lebarnya.
  - 7. **Memindahkan** ambang keputusan berdasarkan ukuran yang sesuai.
  - 8. **Menafsirkan** model tertutup melalui kepentingan permutasi dan analisis profil.
  - 9. **Membandingkan** kedua arsitektur secara adil pada lipatan yang sama.
