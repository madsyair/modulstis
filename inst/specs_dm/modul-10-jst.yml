exercises:
- id: L10.1
  points: 15
  solution: 'Tingkat Dasar: resep bagi jaringan, membangun FFNN, dan basis Gauss.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(themis)
      library(parsnip); library(workflows)})

    survei <- read.csv("data/data_survei.csv", stringsAsFactors = TRUE)
    survei$rentan <- factor(survei$rentan, levels = c("Ya", "Tidak"))
    set.seed(2025)
    bagi <- initial_split(survei, prop = 0.75, strata = rentan)
    lat <- training(bagi); uji <- testing(bagi)

    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors()) |>
      step_zv(all_predictors()) |>
      step_range(all_numeric_predictors(), min = 0, max = 1) |>
      step_rose(rentan, seed = 2025)

    spec <- mlp(hidden_units = 6, penalty = 0.01, epochs = 200) |>
      set_engine("nnet", trace = FALSE) |>
      set_mode("classification")
    wf <- workflow() |> add_recipe(rec) |> add_model(spec)
    set.seed(2025)
    m <- fit(wf, data = lat)

    # basis Gauss
    # lebar <- max(dist(pusat)) / sqrt(2 * H)
    # H     <- exp(-jarak_ke_pusat(X, pusat)^2 / (2 * lebar^2))
  interpretasi: |
    Isian yang benar berturut-turut adalah initial_split, step_range, step_rose, mlp, nnet, set.seed, H, dan exp. Tiga hal patut ditekankan. Pertama, step_range dipilih alih-alih step_normalize karena fungsi aktivasi logistik bekerja pada rentang nol sampai satu. Kedua, step_rose ditempatkan di dalam resep sehingga otomatis dilewati ketika resep diterapkan pada data uji. Ketiga, set.seed wajib mendahului fit karena bobot awal jaringan dibangkitkan acak --- tanpa benih, hasilnya tidak dapat diulang.
- id: L10.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: penalaan RBFNN dengan validasi silang dan pemilihan arsitektur.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(themis); library(yardstick)})

    survei <- read.csv("data/data_survei.csv", stringsAsFactors = TRUE)
    survei$rentan <- factor(survei$rentan, levels = c("Ya", "Tidak"))
    set.seed(2025)
    bagi <- initial_split(survei, prop = 0.75, strata = rentan)
    lat <- training(bagi); uji <- testing(bagi)
    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>
      step_range(all_numeric_predictors(), min = 0, max = 1) |>
      step_rose(rentan, seed = 2025)

    # --- fungsi RBFNN diulang di sini agar kunci berdiri sendiri ---
    jarak_ke_pusat <- function(A, B) {
      sqrt(pmax(outer(rowSums(A^2), rep(1, nrow(B))) +
                outer(rep(1, nrow(A)), rowSums(B^2)) - 2 * A %*% t(B), 0))
    }
    rbf_latih <- function(X, y, size = 20, seed = 2025) {
      set.seed(seed)
      km    <- kmeans(X, centers = size, nstart = 10, iter.max = 50)
      lebar <- max(dist(km$centers)) / sqrt(2 * size)
      H     <- exp(-jarak_ke_pusat(X, km$centers)^2 / (2 * lebar^2))
      df    <- data.frame(H); df$y <- ifelse(y == "Ya", 1, 0)
      list(pusat = km$centers, lebar = lebar,
           mod = suppressWarnings(glm(y ~ ., data = df, family = binomial)))
    }
    rbf_duga <- function(fit, X) {
      H <- exp(-jarak_ke_pusat(X, fit$pusat)^2 / (2 * fit$lebar^2))
      as.numeric(predict(fit$mod, newdata = data.frame(H), type = "response"))
    }

    # menala banyaknya pusat dengan validasi silang pada DATA LATIH
    set.seed(2025)
    lipatan <- vfold_cv(lat, v = 5, strata = rentan)
    ukuran  <- c(5, 10, 20, 30, 50)

    hasil_cv <- t(sapply(ukuran, function(s) {
      auc <- sapply(seq_len(nrow(lipatan)), function(i) {
        tr <- analysis(lipatan$splits[[i]])
        va <- assessment(lipatan$splits[[i]])
        siap_i <- prep(rec, training = tr)
        Xtr <- as.matrix(bake(siap_i, new_data = NULL)[, -ncol(bake(siap_i, new_data = NULL))])
        ytr <- bake(siap_i, new_data = NULL)$rentan
        bva <- bake(siap_i, new_data = va)
        Xva <- as.matrix(bva[, setdiff(names(bva), "rentan")])
        f <- rbf_latih(Xtr, ytr, size = s)
        roc_auc(data.frame(benar = bva$rentan, prob = rbf_duga(f, Xva)),
                benar, prob)$.estimate
      })
      c(pusat = s, AUC_rata = round(mean(auc), 4), galat_baku = round(sd(auc)/sqrt(5), 4))
    }))
    print(hasil_cv, row.names = FALSE)

    cat("\npusat terbaik menurut validasi silang:",
        hasil_cv[which.max(hasil_cv[, "AUC_rata"]), "pusat"], "\n")
  interpretasi: |
    Perbedaan pokoknya terhadap Contoh 10.13 adalah resep dipersiapkan ulang di dalam tiap lipatan lewat prep pada data analisis saja, sehingga penyeimbangan maupun penskalaan dipelajari hanya dari bagian yang sedang dipakai melatih. Cara ini dapat memberi jawaban berbeda dari pemilihan berdasarkan data uji, dan jawaban inilah yang valid --- memilih berdasarkan data uji mengubah data uji menjadi data latih terselubung sehingga kinerja akhir yang dilaporkan tidak lagi menggambarkan kinerja pada data baru. Perhatikan pula kolom galat baku: bila selisih antar-ukuran lebih kecil daripadanya, memilih jaringan yang lebih kecil lebih dapat dipertanggungjawabkan. Untuk pemilihan arsitektur: amatan yang mungkin jauh di luar rentang data latih menuntut RBFNN karena keluarannya kembali ke nilai dasar alih-alih meramal sembarang, dengan kelemahan berupa kebutuhan menetapkan pusat; waktu pelatihan terbatas juga memihak RBFNN yang dilatih dua tahap terpisah; hubungan rumit dan menyeluruh memihak FFNN karena tiap simpulnya berpengaruh pada seluruh ruang peubah, dengan kelemahan waktu latih lebih lama; sedangkan kebutuhan penjelasan kepada pengguna awam sesungguhnya tidak dipenuhi keduanya --- jawaban yang jujur adalah mempertimbangkan model yang lebih terbuka seperti pohon atau regresi, dan memakai jaringan hanya bila kenaikan kinerjanya sepadan dengan hilangnya keterjelasan.
- id: L10.D
  points: 10
  solution: 'Membetulkan kode: penyeimbangan sebelum pembagian, tanpa penskalaan, tanpa benih, dan ambang
    bawaan.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(themis)
      library(parsnip); library(workflows); library(yardstick)})

    survei <- read.csv("data/data_survei.csv", stringsAsFactors = TRUE)
    survei$rentan <- factor(survei$rentan, levels = c("Ya", "Tidak"))

    # (a) pembagian DAHULU; penyeimbangan dipindahkan ke dalam resep
    set.seed(2025)
    bagi <- initial_split(survei, prop = 0.75, strata = rentan)
    lat <- training(bagi); uji <- testing(bagi)

    # (b) penskalaan wajib bagi jaringan syaraf
    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors()) |>
      step_zv(all_predictors()) |>
      step_range(all_numeric_predictors(), min = 0, max = 1) |>
      step_rose(rentan, seed = 2025)

    spec <- mlp(hidden_units = 6, penalty = 0.01, epochs = 200) |>
      set_engine("nnet", trace = FALSE) |> set_mode("classification")

    # (c) benih ditetapkan sebelum pelatihan
    set.seed(2025)
    m <- fit(workflow() |> add_recipe(rec) |> add_model(spec), data = lat)

    # (d) ambang dipilih berdasarkan indeks Youden
    p <- predict(m, uji, type = "prob")$.pred_Ya
    ambang <- seq(0.05, 0.95, by = 0.05)
    j <- sapply(ambang, function(t) {
      dg <- factor(ifelse(p > t, "Ya", "Tidak"), levels = c("Ya", "Tidak"))
      yardstick::sensitivity_vec(uji$rentan, dg) +
        yardstick::specificity_vec(uji$rentan, dg) - 1
    })
    t_baik <- ambang[which.max(j)]
    cat("ambang terbaik:", t_baik, "| bawaan: 0.5\n")

    # pemeriksaan wajib
    round(prop.table(table(uji$rentan)), 3)      # masih timpang
    t_baik != 0.5
  interpretasi: |
    Empat kesalahan diperbaiki. Kesalahan (a) paling parah: menyeimbangkan seluruh data sebelum pembagian membuat amatan sintetis yang diturunkan dari data latih muncul di data uji, sehingga model menilai dirinya atas amatan yang sudah dipelajarinya --- dan kinerja yang dilaporkan menjadi terlalu bagus tanpa menimbulkan galat apa pun. Kesalahan (b) meninggalkan peubah pada satuan aslinya; pengeluaran bersatuan ratusan berdampingan dengan indeks bernilai satu sampai lima membuat gradien sangat timpang sehingga pembelajaran lambat atau gagal menyatu. Kesalahan (c) membuat hasil tidak dapat diulang, sebab bobot awal jaringan dibangkitkan acak. Kesalahan (d) membiarkan ambang pada nilai bawaan padahal kelasnya timpang dan biaya kekeliruannya tidak simetris, sehingga peluang perbaikan terbesar terlewat begitu saja.
- id: T10.1
  points: 50
  solution: 'Penugasan: membangun, menala, menafsirkan, dan membandingkan FFNN dan RBFNN.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |-
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(parsnip); library(workflows)
      library(tune); library(yardstick); library(themis); library(dplyr)})

    survei <- read.csv("data/data_survei.csv", stringsAsFactors = TRUE)
    survei$rentan <- factor(survei$rentan, levels = c("Ya", "Tidak"))

    # 1) ketimpangan dan profil awal
    prop <- prop.table(table(survei$rentan))
    cat("acuan mayoritas:", round(max(prop), 4),
        "| rasio:", round(max(prop)/min(prop), 2), "\n")
    num <- c("pengeluaran","anggota_rt","pendidikan","ketahanan","sejahtera")
    ringkas_kelas <- aggregate(survei[num], list(rentan = survei$rentan), mean)
    ringkas_kelas[num] <- round(ringkas_kelas[num], 2)
    print(ringkas_kelas, row.names = FALSE)

    # 2) pembagian dan resep
    set.seed(2025)
    bagi <- initial_split(survei, prop = 0.75, strata = rentan)
    lat <- training(bagi); uji <- testing(bagi)
    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors()) |> step_zv(all_predictors()) |>
      step_range(all_numeric_predictors(), min = 0, max = 1) |>
      step_rose(rentan, seed = 2025)
    siap <- prep(rec, training = lat)
    lat_siap <- bake(siap, new_data = NULL); uji_siap <- bake(siap, new_data = uji)
    cat("\nlatih setelah ROSE:"); print(table(lat_siap$rentan))
    cat("uji (tetap timpang):"); print(table(uji_siap$rentan))

    # 3) kepekaan terhadap benih
    spec0 <- mlp(hidden_units = 6, penalty = 0.01, epochs = 200) |>
      set_engine("nnet", trace = FALSE) |> set_mode("classification")
    wf0 <- workflow() |> add_recipe(rec) |> add_model(spec0)
    auc_benih <- sapply(1:5, function(s) {
      set.seed(s); m <- fit(wf0, data = lat)
      d <- predict(m, uji, type = "prob") |> bind_cols(uji |> select(rentan))
      roc_auc(d, rentan, .pred_Ya)$.estimate })
    cat("\nrentang AUC antar-benih:", round(diff(range(auc_benih)), 4),
        "| sb:", round(sd(auc_benih), 4), "\n")

    # 4-6) penalaan dan penyelesaian
    spec <- mlp(hidden_units = tune(), penalty = tune(), epochs = 200) |>
      set_engine("nnet", trace = FALSE) |> set_mode("classification")
    wf <- workflow() |> add_recipe(rec) |> add_model(spec)
    set.seed(2025); lipatan <- vfold_cv(lat, v = 5, strata = rentan)
    kisi <- expand.grid(hidden_units = c(3,6,10,15),
                        penalty = c(0.0001,0.001,0.01,0.1))
    set.seed(2025)
    tun <- tune_grid(wf, resamples = lipatan, grid = kisi,
                     metrics = metric_set(roc_auc, f_meas))
    print(collect_metrics(tun) |> filter(.metric == "roc_auc") |>
            arrange(desc(mean)) |> select(hidden_units, penalty, mean, std_err) |>
            mutate(across(where(is.numeric), \(x) round(x, 4))) |>
            as.data.frame() |> utils::head(6), row.names = FALSE)
    set.seed(2025)
    akhir <- last_fit(finalize_workflow(wf, select_best(tun, metric = "roc_auc")),
                      split = bagi, metrics = metric_set(roc_auc, f_meas, accuracy))
    print(collect_metrics(akhir))
    pred_ffnn <- collect_predictions(akhir)
    print(conf_mat(pred_ffnn, truth = rentan, estimate = .pred_class))

    # 12) pemindahan ambang
    ambang <- seq(0.05, 0.95, by = 0.05)
    uk <- t(sapply(ambang, function(t) {
      dg <- factor(ifelse(pred_ffnn$.pred_Ya > t, "Ya", "Tidak"),
                   levels = c("Ya","Tidak"))
      sn <- yardstick::sensitivity_vec(pred_ffnn$rentan, dg)
      sp <- yardstick::specificity_vec(pred_ffnn$rentan, dg)
      c(sens = sn, spes = sp, youden = sn + sp - 1,
        F1 = yardstick::f_meas_vec(pred_ffnn$rentan, dg)) }))
    cat("\nambang Youden:", ambang[which.max(uk[,"youden"])],
        "| ambang F1:", ambang[which.max(uk[,"F1"])], "\n")
  interpretasi: |
    Nomor 2 menuntut pembuktian berupa dua tabel: data latih menjadi seimbang sedangkan data uji tetap timpang. Bila keduanya seimbang, penyeimbangan telah bocor ke data uji. Nomor 3 adalah bagian yang paling sering diabaikan pada pekerjaan jaringan syaraf; rentang AUC antar-benih menjadi tolok ukur apakah selisih antar-model kelak bermakna. Nomor 12 adalah inti penugasan ini. Konteks menyatakan bahwa melewatkan rumah tangga rentan jauh lebih merugikan, sehingga ambang yang dipilih semestinya lebih rendah daripada yang memaksimumkan indeks Youden --- Youden memperlakukan kedua jenis kekeliruan setara, padahal di sini tidak. Mahasiswa yang memilih ambang Youden tanpa membahas ketidaksimetrisan biaya belum menjawab pertanyaannya. Nomor 13 menuntut kejujuran: bila selisih AUC antar-arsitektur lebih kecil daripada rentang antar-benih pada nomor 3, maka kesimpulan yang benar adalah menyatakan keduanya tidak dapat dibedakan --- bukan memilih yang angkanya kebetulan lebih tinggi.

