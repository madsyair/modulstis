  - '#### Tingkat Menengah (menulis sendiri)'
  - \latihan{Menala RBFNN dengan validasi silang}
  - Contoh 10.13 memilih banyaknya pusat berdasarkan data uji --- cara yang tidak valid. Perbaiki dengan
    menala memakai **validasi silang lima lipatan pada data latih**. Bandingkan banyaknya pusat yang terpilih
    terhadap hasil Contoh 10.13, lalu jelaskan mengapa cara yang benar dapat memberi jawaban berbeda.
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat empat kesalahan (penyeimbangan dikerjakan sebelum pembagian, peubah tidak diskalakan,
    benih acak tidak ditetapkan, dan ambang dibiarkan pada nilai bawaan pada data timpang). Temukan dan
    perbaiki, lalu jelaskan akibat masing-masing.
  - |-
    ```{r eval=FALSE}
    library(recipes); library(rsample); library(themis); library(parsnip)
    survei <- read.csv("data/data_survei.csv", stringsAsFactors = TRUE)

    # (a) penyeimbangan dikerjakan pada SELURUH data sebelum dibagi
    survei_seimbang <- ROSE::ROSE(rentan ~ ., data = survei)$data
    bagi <- initial_split(survei_seimbang, prop = 0.75)
    lat <- training(bagi); uji <- testing(bagi)

    # (b) tidak ada penskalaan padahal jaringan syaraf menuntutnya
    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors())

    # (c) benih acak tidak ditetapkan
    m <- fit(workflow() |> add_recipe(rec) |> add_model(spec), data = lat)

    # (d) ambang dibiarkan pada 0,5 pada data yang timpang
    duga <- ifelse(predict(m, uji, type = "prob")$.pred_Ya > 0.5, "Ya", "Tidak")
    ```
  - |-
    **Keluaran yang benar.** Setelah diperbaiki, kode yang dipakai adalah sebagai berikut.

    ```
    # (a) pembagian DAHULU; penyeimbangan masuk ke dalam resep
    survei$rentan <- factor(survei$rentan, levels = c("Ya", "Tidak"))
    set.seed(2025)
    bagi <- initial_split(survei, prop = 0.75, strata = rentan)
    lat <- training(bagi); uji <- testing(bagi)

    # (b) penskalaan wajib, dan (a) penyeimbangan hanya pada data latih
    rec <- recipe(rentan ~ ., data = lat) |>
      step_dummy(all_nominal_predictors()) |>
      step_zv(all_predictors()) |>
      step_range(all_numeric_predictors(), min = 0, max = 1) |>
      step_rose(rentan, seed = 2025)

    # (c) benih ditetapkan sebelum pelatihan
    set.seed(2025)
    m <- fit(workflow() |> add_recipe(rec) |> add_model(spec), data = lat)

    # (d) ambang dipilih berdasarkan indeks Youden
    p <- predict(m, uji, type = "prob")$.pred_Ya
    ambang <- seq(0.05, 0.95, by = 0.05)
    j <- sapply(ambang, function(t) {
      dg <- factor(ifelse(p > t, "Ya", "Tidak"), levels = c("Ya", "Tidak"))
      yardstick::sensitivity_vec(uji$rentan, dg) +
        yardstick::specificity_vec(uji$rentan, dg) - 1
    })
    t_baik <- ambang[which.max(j)]
    duga <- factor(ifelse(p > t_baik, "Ya", "Tidak"), levels = c("Ya", "Tidak"))
    ```

    Pemeriksaan yang wajib berhasil: proporsi kelas pada `uji` masih timpang (sekitar 0,2), dan `t_baik != 0.5` bernilai **TRUE**.
  - '#### Tingkat Lanjut (pemilihan)'
  - \latihan{Memilih arsitektur menurut kebutuhan}
  - 'Untuk masing-masing keadaan berikut, tentukan arsitektur yang Anda pilih beserta alasannya, dan sebutkan
    **satu kelemahan** pilihan itu: (a) model akan menerima amatan yang mungkin jauh di luar rentang data
    latih; (b) waktu pelatihan sangat terbatas; (c) hubungan antar-peubah diduga rumit dan menyeluruh,
    bukan setempat; (d) hasil harus dijelaskan kepada pengguna yang tidak berlatar statistika.'
  penugasan:
  - |-
    \begin{kotaktugas}
    Sebagai calon analis pada instansi statistik, bangun model penduga kerentanan pangan rumah tangga atas \texttt{data\_survei.csv} (\emph{data simulasi}) memakai dua arsitektur jaringan syaraf, lalu rekomendasikan satu di antaranya beserta ambang keputusan yang sesuai.
    \end{kotaktugas}
  - '**Konteks.** Sebuah unit hendak menyasar bantuan pangan. Melewatkan rumah tangga yang sesungguhnya
    rentan dianggap jauh lebih merugikan daripada memeriksa rumah tangga yang ternyata tidak rentan.'
  - \tugas{Penyiapan}
  - 1. Periksa **ketimpangan kelas** dan laporkan acuan tebakan mayoritas. Sajikan pula profil awal tiap
    peubah menurut kelas.
  - 2. Bagi data dengan penstrataan, lalu susun resep yang memuat pengodean, **penskalaan**, dan **penyeimbangan**.
    Buktikan bahwa data uji tidak ikut diseimbangkan.
  - \tugas{Feed-Forward Neural Network}
  - 3. Latih FFNN dengan **lima benih acak berbeda**. Laporkan rentang dan simpangan baku AUC-nya, lalu
    jelaskan sumber ketidakpastian itu.
  - 4. **Tala** simpul tersembunyi dan penyusutan pada kisi minimal empat kali empat dengan validasi silang
    lima lipatan. Sajikan tabel enam teratas beserta galat bakunya.
  - 5. Sajikan **permukaan penalaan** sebagai grafik. Jelaskan keterkaitan kedua parameter berdasarkan
    bentuk garisnya.
  - 6. Selesaikan alur dan nilai pada data uji. Sajikan matriks kekeliruan dan minimal empat ukuran.
  - \tugas{Radial Basis Function Neural Network}
  - '7. Bangun **RBFNN dari dasar**: penempatan pusat, penetapan lebar, dan pendugaan bobot keluaran.
    Laporkan banyaknya pusat dan lebar basisnya.'
  - 8. **Tala banyaknya pusat dengan validasi silang pada data latih** --- bukan pada data uji sebagaimana
    Contoh 10.13. Sajikan hasilnya dan bandingkan terhadap cara yang keliru itu.
  - 9. Sajikan grafik AUC latih dan uji menurut banyaknya pusat. Tentukan pada nilai berapa pemodelan
    berlebih (*overfitting*) mulai tampak.
  - \tugas{Penafsiran, Ambang, dan Rekomendasi}
  - 10. Hitung **kepentingan permutasi** dengan minimal lima pengulangan. Bandingkan urutannya terhadap
    koefisien pembangkit data, lalu nilai apakah model menangkap struktur yang benar.
  - 11. Lakukan **analisis profil** atas tiga kelompok peluang dugaan. Periksa apakah proporsi kelas sebenarnya
    menaik antar-kelompok, dan jelaskan artinya bagi kelayakan pemakaian model untuk penyasaran.
  - 12. **Pindahkan ambang keputusan.** Bandingkan ambang menurut indeks Youden dan menurut F1. Tentukan
    ambang yang Anda pilih dengan mempertimbangkan bahwa melewatkan rumah tangga rentan lebih merugikan
    --- dan jelaskan alasannya.
  - 13. **Bandingkan kedua arsitektur** pada data uji yang sama. Nilai apakah selisihnya melampaui rentang
    yang timbul semata karena benih acak berbeda. Bila tidak, nyatakan bahwa keduanya tidak dapat dibedakan.
  - '14. Susun laporan R Markdown berisi kode, keluaran, gambar, dan interpretasi. Tutup dengan **ringkasan
    (maksimal 300 kata)** memuat: arsitektur dan ambang yang direkomendasikan beserta alasannya, kinerja
    terhadap acuan, keterbatasan, dan penegasan bahwa data merupakan simulasi.'
  tambahan:
  - |
    Modul ini memakai kerangka tidymodels. Sebagian besar kode dan rujukan yang beredar masih memakai `caret`, sehingga kemampuan membaca keduanya tetap diperlukan. Bagian ini menjalankan alur yang sama dengan `caret` lalu membandingkan hasilnya.
  - contoh: Alur yang sama dengan caret
    kode_r: |-
      suppressPackageStartupMessages(library(caret))

      lat_caret <- lat                       # caret tidak mengenal peran penanda
      kendali <- trainControl(method = "cv", number = 5,
                              classProbs = TRUE,
                              summaryFunction = twoClassSummary,
                              sampling = "rose")          # penyeimbangan DI DALAM lipatan

      set.seed(2025)
      m_caret <- train(rentan ~ ., data = lat_caret, method = "nnet",
                       preProcess = c("range"),           # skala 0-1
                       tuneGrid = expand.grid(size = c(3, 6, 10, 15),
                                              decay = c(0.0001, 0.001, 0.01, 0.1)),
                       trControl = kendali, metric = "ROC",
                       trace = FALSE, maxit = 200)

      hasil_caret <- m_caret$results[order(-m_caret$results$ROC),
                                     c("size", "decay", "ROC", "ROCSD")]
      print(round(utils::head(hasil_caret, 6), 4), row.names = FALSE)
      cat("\nterpilih - size:", m_caret$bestTune$size,
          "| decay:", m_caret$bestTune$decay, "\n")
    judul_r: caret::train dengan method nnet
    eval: true
    penjelasan: |
      Seluruh alur ditulis dalam satu pemanggilan train. Penskalaan ditetapkan lewat preProcess, penyeimbangan lewat argumen sampling pada trainControl, dan ruang pencarian lewat tuneGrid. Argumen sampling bernilai rose memastikan penyeimbangan dikerjakan di dalam tiap lipatan, bukan sebelumnya.
    interpretasi: |
      Argumen sampling pada trainControl adalah bagian terpenting di sini. Tanpa itu, penyeimbangan harus dikerjakan manual sebelum train dipanggil --- dan bila dikerjakan pada seluruh data latih sekaligus, amatan sintetis akan bocor antar-lipatan sehingga kinerja validasi silang tampak lebih baik daripada sebenarnya. Perhatikan pula bahwa caret memakai nama size dan decay, sedangkan parsnip memakai hidden\_units dan penalty; keduanya menunjuk hal yang sama.
  - contoh: Menyandingkan hasil kedua kerangka
    kode_r: |-
      tm <- collect_metrics(hasil_tune) |>
        dplyr::filter(.metric == "roc_auc") |>
        dplyr::select(size = hidden_units, decay = penalty, tidymodels = mean)
      ct <- data.frame(size = m_caret$results$size,
                       decay = m_caret$results$decay,
                       caret = m_caret$results$ROC)

      banding2 <- merge(tm, ct, by = c("size", "decay"))
      banding2 <- banding2[order(-banding2$tidymodels), ]
      print(round(utils::head(banding2, 8), 4), row.names = FALSE)

      cat("\nkorelasi antar-kerangka:",
          round(cor(banding2$tidymodels, banding2$caret), 4), "\n")
      cat("selisih rata-rata      :",
          round(mean(abs(banding2$tidymodels - banding2$caret)), 4), "\n")
    judul_r: menggabungkan hasil dua kerangka
    eval: true
    penjelasan: |
      Hasil penalaan kedua kerangka digabungkan menurut pasangan nilai parameter yang sama. Korelasi antar-keduanya dihitung, begitu pula selisih rata-rata mutlaknya.
    interpretasi: |
      Korelasi yang tinggi menandakan kedua kerangka sepakat mengenai kombinasi parameter mana yang lebih baik, meski angka mutlaknya berbeda. Perbedaan itu wajar dan bersumber dari pembentukan lipatan yang tidak identik, cara penyeimbangan yang sedikit berlainan, serta inisialisasi bobot yang acak. Yang tidak wajar adalah bila urutannya berbeda jauh --- itu pertanda ada perbedaan perlakuan yang perlu ditelusuri, bukan sekadar derau.
  - |-
    \begin{kotaksalah}[Melaporkan angka tanpa menyebut seluruh prosedurnya]
    Karena hasil jaringan syaraf bergantung pada kerangka, benih acak, skema penyeimbangan, penskalaan, dan banyaknya epoch, maka melaporkan angka kinerja tanpa menyebutkan seluruhnya membuat hasil \textbf{tidak dapat direproduksi}. Laporan yang baik mencantumkan: perangkat lunak beserta versinya, skema pembagian dan resampling, benih acak, urutan prapemrosesan, cara penanganan ketimpangan, arsitektur beserta parameternya, dan ambang keputusan yang dipakai.
    \end{kotaksalah}
  - |-
    \begin{kotaktips}
    Bila Anda menjumpai kode \texttt{caret} pada rujukan lama, padanannya di tidymodels dapat ditelusuri melalui nama parameternya: \texttt{size} menjadi \texttt{hidden\_units}, \texttt{decay} menjadi \texttt{penalty}, \texttt{trControl} menjadi \texttt{resamples} pada \texttt{tune\_grid}, dan \texttt{preProcess} menjadi langkah-langkah pada \texttt{recipe}. Yang berubah adalah tata caranya, bukan gagasannya.
    \end{kotaktips}
  ringkasan:
  - |-
    \begin{kotaktujuan}
    \textbf{Daftar periksa penguasaan:}
    \begin{itemize}
    \item[$\square$] Saya dapat menjelaskan peran lapis tersembunyi dan fungsi aktivasi.
    \item[$\square$] Saya memahami mengapa aktivasi nonlinier menjadi sumber kekuatan jaringan.
    \item[$\square$] Saya selalu menskalakan peubah sebelum melatih jaringan syaraf.
    \item[$\square$] Saya menempatkan penyeimbangan kelas di dalam resep, bukan sebelum pembagian.
    \item[$\square$] Saya menetapkan benih acak dan melaporkan ketidakpastian antar-benih.
    \item[$\square$] Saya menala simpul dan penyusutan bersama-sama, bukan satu per satu.
    \item[$\square$] Saya dapat menjelaskan perbedaan sifat setempat RBFNN dan menyeluruh FFNN.
    \item[$\square$] Saya dapat membangun RBFNN dari dasar: pusat, lebar, dan bobot keluaran.
    \item[$\square$] Saya memindahkan ambang keputusan berdasarkan ukuran yang sesuai.
    \item[$\square$] Saya menafsirkan model tertutup lewat kepentingan permutasi dan profil.
    \item[$\square$] Saya menyadari bahwa kepentingan peubah bukan hubungan sebab-akibat.
    \item[$\square$] Saya membandingkan model hanya bila selisihnya melampaui derau antar-benih.
    \end{itemize}
    \end{kotaktujuan}
  - '**Kartu Referensi Cepat.**'
  - |-
    \begin{kotakrumus}\par\smallskip
    \begin{tabular}{@{}ll@{}}
    \textbf{Keperluan} & \textbf{Perintah}\\
    Membagi berstrata & \texttt{initial\_split(d, prop =, strata =)}\\
    Penskalaan 0--1 & \texttt{step\_range(all\_numeric\_predictors())}\\
    Penyeimbangan & \texttt{step\_rose(y, seed =)}\\
    Spesifikasi FFNN & \texttt{mlp(hidden\_units =, penalty =, epochs =)}\\
    Mesin FFNN & \texttt{set\_engine("nnet", trace = FALSE)}\\
    Penalaan & \texttt{tune\_grid(wf, resamples =, grid =)}\\
    Menyelesaikan & \texttt{finalize\_workflow()}, \texttt{last\_fit()}\\
    Pusat RBFNN & \texttt{kmeans(X, centers = H)}\\
    Lebar basis & \texttt{max(dist(pusat)) / sqrt(2 * H)}\\
    Basis Gauss & \texttt{exp(-jarak\^{}2 / (2 * lebar\^{}2))}\\
    Sensitivitas & \texttt{yardstick::sensitivity\_vec(benar, duga)}\\
    Indeks Youden & \texttt{sens + spes - 1}\\
    Kurva ROC & \texttt{roc\_curve(d, truth =, .pred\_Ya)}\\
    Padanan caret & \texttt{size} = \texttt{hidden\_units}, \texttt{decay} = \texttt{penalty}\\
    \end{tabular}
    \end{kotakrumus}
  - 'Modul ini memperkenalkan keluarga model yang kuat tetapi tertutup. Prinsip yang perlu dibawa: skalakan
    peubah sebelum melatih; tempatkan penyeimbangan di dalam resep agar data uji tetap mencerminkan keadaan
    sesungguhnya; tetapkan benih dan laporkan ketidakpastiannya; tala fleksibilitas dan penyusutan bersama-sama;
    pindahkan ambang berdasarkan biaya kekeliruan, bukan membiarkannya pada nilai bawaan; tafsirkan model
    lewat permutasi dan profil sambil mengingat bahwa keduanya menyatakan kaitan, bukan sebab; dan jangan
    menyatakan satu arsitektur lebih baik sebelum selisihnya melampaui derau yang timbul semata dari inisialisasi
    acak.'
