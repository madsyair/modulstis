  teori:
  - '### Kedudukan pada CRISP-DM'
  - |
    Modul ini menempati tahap Modeling dan Evaluation. Yang membedakannya dari modul pemodelan sebelumnya adalah bobot yang lebih besar pada tahap Data Preparation: jaringan syaraf jauh lebih menuntut dalam hal penskalaan peubah daripada pohon maupun model berbasis aturan.
  - '### Arsitektur Feed-Forward Neural Network'
  - |
    FFNN menyusun peubah masukan menjadi keluaran melalui satu atau beberapa lapis tersembunyi. Setiap simpul pada lapis tersembunyi menghitung kombinasi linier terboboti dari masukannya, lalu meneruskannya melalui fungsi aktivasi nonlinier.
  - |-
    \begin{kotakrumus}
    Bagi jaringan berlapis tersembunyi tunggal dengan $H$ simpul:\\[6pt]
    $z_{h} = \sigma\!\left( b_{h} + \sum_{j=1}^{p} w_{hj} x_{j} \right), \qquad h = 1, \ldots, H$\\[6pt]
    $\hat{y} = \sigma\!\left( b_{0} + \sum_{h=1}^{H} v_{h} z_{h} \right)$\\[6pt]
    dengan $\sigma(u) = 1/(1 + e^{-u})$ fungsi logistik.
    \end{kotakrumus}
  - |
    Fungsi aktivasi nonlinier inilah sumber kekuatannya. Tanpa aktivasi nonlinier, gabungan beberapa lapis lurus tetap menghasilkan fungsi linier, sehingga jaringan tidak lebih kuat daripada regresi biasa. Justru sifat nonlinier itu yang memungkinkan jaringan menangkap hubungan berbentuk lengkung maupun interaksi antar-peubah tanpa perlu dituliskan secara tersurat.
  - |-
    \begin{kotakinfo}[Dua parameter penala yang menentukan]\par\smallskip
    \begin{tabular}{@{}p{3.4cm}p{4.6cm}p{6.0cm}@{}}
    \textbf{Parameter} & \textbf{Mengatur} & \textbf{Akibat bila keliru}\\
    \hline
    Simpul tersembunyi & fleksibilitas model & terlalu sedikit: kurang luwes (\emph{underfitting}); terlalu banyak: mengalami \emph{overfitting}\\[3pt]
    Penyusutan (\emph{decay}) & besarnya bobot & terlalu kecil: bobot meledak; terlalu besar: model mendatar\\
    \end{tabular}
    \end{kotakinfo}
  - |
    Keduanya saling berkaitan: jaringan berukuran besar dengan penyusutan memadai kerap berkinerja lebih baik daripada jaringan kecil tanpa penyusutan. Karena itu keduanya sebaiknya ditala bersama-sama, bukan satu per satu.
  - '### Penskalaan Wajib bagi Jaringan Syaraf'
  - |-
    \begin{kotakperhatian}[Jaringan syaraf menuntut penskalaan]
    Bobot awal jaringan dibangkitkan acak pada rentang kecil, dan pembelajarannya bergerak menurut besarnya galat. Bila peubah bersatuan ribuan berdampingan dengan peubah bersatuan belasan, gradien menjadi sangat timpang sehingga pembelajaran lambat atau sama sekali gagal menyatu. Penskalaan ke rentang nol sampai satu, atau pembakuan, karena itu \textbf{wajib} --- berbeda dari pohon keputusan yang tidak memerlukannya sama sekali.
    \end{kotakperhatian}
  - '### Arsitektur Radial Basis Function Neural Network'
  - |
    RBFNN bertolak dari gagasan yang sama sekali berbeda. Alih-alih menyusun kombinasi linier lalu meneruskannya melalui aktivasi, RBFNN menempatkan sejumlah **pusat** pada ruang peubah, lalu mengukur seberapa dekat tiap amatan terhadap masing-masing pusat.
  - |-
    \begin{kotakrumus}
    Fungsi basis Gauss bagi pusat ke-$h$:\\[6pt]
    $\phi_{h}(x) = \exp\!\left( -\dfrac{\lVert x - c_{h} \rVert^{2}}{2\sigma^{2}} \right)$\\[6pt]
    Keluarannya berupa kombinasi linier dari seluruh basis:\\[6pt]
    $\hat{y} = g\!\left( b_{0} + \sum_{h=1}^{H} v_{h}\, \phi_{h}(x) \right)$\\[6pt]
    dengan $c_{h}$ pusat, $\sigma$ lebar basis, dan $g$ fungsi kaitan.
    \end{kotakrumus}
  - |
    Akibat bentuk itu, tiap basis hanya aktif pada daerah di sekitar pusatnya dan meredup cepat ketika menjauh. Sifat **lokal** inilah pembeda pokoknya terhadap FFNN, yang tiap simpulnya berpengaruh pada seluruh ruang peubah.
  - |-
    \begin{kotakinfo}[Membandingkan dua arsitektur]\par\smallskip
    \begin{tabular}{@{}p{3.0cm}p{5.2cm}p{6.0cm}@{}}
     & \textbf{FFNN} & \textbf{RBFNN}\\
    \hline
    Sifat simpul & menyeluruh (\emph{global}) & setempat (\emph{local})\\[2pt]
    Pelatihan & seluruh bobot sekaligus & pusat lalu bobot keluaran\\[2pt]
    Parameter utama & simpul, penyusutan & banyaknya pusat, lebar\\[2pt]
    Kecepatan latih & lebih lambat & lebih cepat\\[2pt]
    Di luar rentang data & meramal sembarang & mendekati nilai dasar\\
    \end{tabular}
    \end{kotakinfo}
  - |
    Baris terakhir patut diperhatikan pada penerapan resmi. Ketika RBFNN menerima amatan yang jauh dari seluruh pusatnya, seluruh basis bernilai mendekati nol sehingga keluarannya kembali ke nilai dasar --- perilaku yang lebih aman daripada FFNN yang dapat menghasilkan dugaan ekstrem tanpa peringatan.
  - '### Menetapkan Pusat dan Lebar'
  - |
    Pusat RBFNN lazim ditetapkan dengan pengelompokan, misalnya K-Means, sehingga pusat berada di daerah yang memang padat amatan. Adapun lebar basis dapat ditetapkan dari jarak antar-pusat.
  - |-
    \begin{kotakrumus}
    Aturan praktis penetapan lebar:\\[6pt]
    $\sigma = \dfrac{d_{\max}}{\sqrt{2H}}$\\[6pt]
    dengan $d_{\max}$ jarak terjauh antar-pusat dan $H$ banyaknya pusat. Makin banyak pusat, makin sempit tiap basisnya.
    \end{kotakrumus}
  - |-
    \begin{kotaktips}
    Lebar yang terlalu sempit membuat tiap basis hanya menanggapi segelintir amatan sehingga jaringan menghafal; lebar yang terlalu lebar membuat seluruh basis hampir sama sehingga jaringan kehilangan ketajaman. Aturan praktis di atas menjadi titik awal yang baik, tetapi nilainya tetap layak ditala bila waktu memungkinkan.
    \end{kotaktips}
  - '### Ketimpangan Kelas dan Pemindahan Ambang'
  - |
    Pada persoalan seperti kerentanan pangan, kelas yang diperhatikan lazimnya jauh lebih sedikit. Dua penanganan yang saling melengkapi tersedia: menyeimbangkan data latih, dan memindahkan ambang keputusan.
  - |-
    \begin{kotakinfo}[Dua penanganan dan kedudukannya]\par\smallskip
    \begin{tabular}{@{}p{3.6cm}p{4.8cm}p{5.6cm}@{}}
    \textbf{Penanganan} & \textbf{Dikerjakan pada} & \textbf{Catatan}\\
    \hline
    Penyeimbangan & data latih saja & masuk ke dalam resep\\[3pt]
    Pemindahan ambang & tahap keputusan & tidak mengubah model\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[Menyeimbangkan sebelum membagi data]
    Pembangkitan contoh sintetis \textbf{hanya boleh} dikenakan pada data latih. Bila dikerjakan sebelum pembagian, amatan sintetis yang diturunkan dari data latih dapat muncul pada data uji, sehingga model menilai dirinya atas amatan yang sudah dipelajarinya. Menempatkan langkah penyeimbangan di dalam resep menjamin hal ini secara rancangan --- ia otomatis dilewati ketika resep diterapkan pada data uji.
    \end{kotaksalah}
  - |
    Pemindahan ambang bekerja pada tahap yang berbeda. Model tetap sama; yang berubah hanya batas peluang yang dipakai memutuskan. Ambang bawaan setengah mengandaikan kedua jenis kekeliruan sama mahalnya --- anggapan yang jarang benar.
  - |-
    \begin{kotakrumus}
    \textbf{Indeks Youden} sebagai dasar pemilihan ambang:\\[6pt]
    $J(t) = \text{sensitivitas}(t) + \text{spesifisitas}(t) - 1$\\[6pt]
    Ambang yang memaksimumkan $J$ menyeimbangkan kedua jenis kekeliruan tanpa memihak salah satunya.
    \end{kotakrumus}
  - '### Menafsirkan Model yang Tertutup'
  - |
    Jaringan syaraf tidak menyediakan koefisien yang dapat dibaca langsung. Dua cara penafsiran yang berlaku bagi model apa pun karena itu menjadi penting.
  - |-
    \begin{kotakinfo}[Dua cara menafsirkan model tertutup]\par\smallskip
    \begin{tabular}{@{}p{4.0cm}p{10.4cm}@{}}
    \textbf{Kepentingan permutasi} & mengacak satu peubah lalu mengukur penurunan kinerja; makin besar penurunannya, makin penting peubah itu\\[3pt]
    \textbf{Analisis profil} & membandingkan ciri amatan berpeluang dugaan tinggi terhadap yang rendah\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[Kepentingan bukan hubungan sebab-akibat]
    Kepentingan permutasi menyatakan seberapa besar suatu peubah menyumbang pada \emph{dugaan}, bukan seberapa besar pengaruhnya secara sebab-akibat. Peubah dapat tampak penting semata karena berkaitan dengan penyebab sesungguhnya yang tidak terukur. Menyampaikan hasil ini tanpa peringatan tersebut berisiko melahirkan kebijakan yang salah sasaran.
    \end{kotaksalah}
  contoh:
  - contoh: Membangkitkan data survei kerentanan pangan
    kode_r: |-
      set.seed(2025)
      n <- 1000

      pengeluaran <- round(rlnorm(n, meanlog = log(450), sdlog = 0.6), 1)
      anggota_rt  <- sample(1:9, n, TRUE, c(.05,.12,.18,.25,.20,.10,.05,.03,.02))
      pendidikan  <- pmin(pmax(round(rnorm(n, 9, 3)), 0), 18)
      air_bersih  <- factor(rbinom(n, 1, .72), labels = c("Tidak", "Ya"))
      pekerjaan   <- factor(sample(c("formal","informal","tidak_bekerja"), n, TRUE,
                                   c(.35,.50,.15)))
      lahan       <- factor(rbinom(n, 1, .55), labels = c("Tidak", "Ya"))
      ketahanan   <- sample(1:5, n, TRUE, c(.15,.25,.30,.20,.10))
      sejahtera   <- sample(1:3, n, TRUE, c(.30,.50,.20))

      # hubungan sengaja dibuat ADA agar model dapat diuji kemampuannya
      skor <- -2.5 - 0.003*pengeluaran + 0.12*anggota_rt - 0.10*pendidikan -
              0.60*(air_bersih == "Ya") + 0.50*(pekerjaan == "tidak_bekerja") +
              0.25*(pekerjaan == "informal") - 0.40*(lahan == "Ya") -
              0.35*ketahanan - 0.50*sejahtera + rnorm(n, 0, 0.5)

      peluang <- plogis(skor)
      survei <- data.frame(pengeluaran, anggota_rt, pendidikan, air_bersih,
                           pekerjaan, lahan, ketahanan, sejahtera,
        rentan = factor(ifelse(peluang > quantile(peluang, 0.80), "Ya", "Tidak"),
                        levels = c("Ya", "Tidak")))

      write.csv(survei, "data/data_survei.csv", row.names = FALSE)
      str(survei)
      round(prop.table(table(survei$rentan)), 4)
    judul_r: membangkitkan data bersinyal
    eval: true
    penjelasan: |
      Sembilan peubah dibangkitkan menyerupai hasil survei sosial-ekonomi rumah tangga. Skor logit disusun sebagai kombinasi linier peubah tersebut dengan koefisien yang ditetapkan, lalu diubah menjadi peluang. Sasaran ditetapkan dari kuantil ke-80 sehingga kelas yang diperhatikan berjumlah sekitar seperlima.
    interpretasi: |
      Perhatikan bahwa urutan taraf sasaran ditetapkan secara tegas dengan kelas yang diperhatikan di depan, sesuai kelaziman yardstick. Perhatikan pula bahwa hubungan antara peubah dan sasaran sengaja dibuat ada --- berbeda dari beberapa modul sebelumnya yang peubahnya saling bebas. Akibatnya model diharapkan berkinerja baik, sehingga kinerja yang buruk justru menjadi pertanda ada kekeliruan pada alur kerja, bukan temuan mengenai datanya.
  - contoh: Memeriksa ketimpangan dan menetapkan acuan
    kode_r: |-
      prop <- prop.table(table(survei$rentan))
      cat("proporsi kelas:", round(prop, 4), "\n")
      cat("rasio timpang:", round(max(prop) / min(prop), 2), "berbanding 1\n")
      cat("acuan tebakan mayoritas:", round(max(prop), 4), "\n\n")

      # sebaran peubah numerik menurut kelas
      num <- c("pengeluaran", "anggota_rt", "pendidikan", "ketahanan", "sejahtera")
      ringkas_kelas <- aggregate(survei[num], list(rentan = survei$rentan), mean)
      ringkas_kelas[num] <- round(ringkas_kelas[num], 2)
      print(ringkas_kelas, row.names = FALSE)
    judul_r: memeriksa ketimpangan dan profil awal
    eval: true
    penjelasan: |
      Proporsi kelas dihitung beserta rasio ketimpangan dan acuan tebakan mayoritas. Setelah itu rata-rata tiap peubah numerik dibandingkan antara kedua kelas.
    interpretasi: |
      Acuan tebakan mayoritas sebesar empat perlima menjadi pembanding wajib bagi setiap akurasi yang kelak dilaporkan. Adapun perbandingan rata-rata antar-kelas sudah memperlihatkan arah hubungan yang masuk akal: rumah tangga rentan cenderung berpengeluaran lebih rendah dan beranggota lebih banyak. Pemeriksaan sederhana ini berguna sebagai pemeriksaan kewajaran sebelum pemodelan --- bila arahnya berlawanan dengan pengetahuan bidang, ada yang perlu ditelusuri lebih dahulu.
  - contoh: Membagi data dan menyusun resep
    kode_r: |-
      suppressPackageStartupMessages({
        library(recipes); library(rsample); library(themis)})

      set.seed(2025)
      bagi <- initial_split(survei, prop = 0.75, strata = rentan)
      lat  <- training(bagi); uji <- testing(bagi)

      rec <- recipe(rentan ~ ., data = lat) |>
        step_dummy(all_nominal_predictors()) |>            # pengodean kategori
        step_zv(all_predictors()) |>                       # buang ragam nol
        step_range(all_numeric_predictors(), min = 0, max = 1) |>  # skala 0-1
        step_rose(rentan, seed = 2025)                     # seimbangkan LATIH saja

      siap <- prep(rec, training = lat)
      lat_siap <- bake(siap, new_data = NULL)   # data latih: sudah diseimbangkan
      uji_siap <- bake(siap, new_data = uji)    # data uji : TIDAK diseimbangkan

      cat("latih asli    :", nrow(lat), "| setelah ROSE:", nrow(lat_siap), "\n")
      print(table(latih = lat_siap$rentan))
      print(table(uji = uji_siap$rentan))
    judul_r: resep dengan penskalaan dan penyeimbangan
    eval: true
    penjelasan: |
      Data dibagi dengan penstrataan. Resep menetapkan empat langkah: pengodean peubah kategori, pembuangan peubah berragam nol, penskalaan ke rentang nol sampai satu, dan penyeimbangan kelas memakai ROSE. Resep lalu diterapkan ke kedua bagian data.
    interpretasi: |
      Bandingkan kedua tabel terakhir. Data latih menjadi seimbang, sedangkan data uji tetap timpang sebagaimana keadaan sesungguhnya --- dan inilah perilaku yang benar. Paket recipes melewatkan langkah penyeimbangan secara otomatis ketika resep diterapkan pada data baru, sehingga kekeliruan yang dibahas pada Teori tercegah oleh rancangan, bukan oleh kedisiplinan penulis kode. Perhatikan pula penskalaan ke rentang nol sampai satu yang dipilih karena sesuai dengan fungsi aktivasi logistik.
  - contoh: Membangun FFNN pertama
    kode_r: |-
      suppressPackageStartupMessages({
        library(parsnip); library(workflows); library(yardstick); library(dplyr)})

      spec_ffnn <- mlp(hidden_units = 6, penalty = 0.01, epochs = 200) |>
        set_engine("nnet", trace = FALSE) |>
        set_mode("classification")

      wf_ffnn <- workflow() |> add_recipe(rec) |> add_model(spec_ffnn)
      set.seed(2025)
      m_ffnn <- fit(wf_ffnn, data = lat)

      duga <- predict(m_ffnn, uji) |>
        bind_cols(predict(m_ffnn, uji, type = "prob")) |>
        bind_cols(uji |> select(rentan))

      print(conf_mat(duga, truth = rentan, estimate = .pred_class))
      cat("\nAUC:", round(roc_auc(duga, rentan, .pred_Ya)$.estimate, 4),
          "| acuan mayoritas:", round(max(prop.table(table(uji$rentan))), 4), "\n")
    judul_r: mlp dengan mesin nnet
    eval: true
    penjelasan: |
      Spesifikasi jaringan ditetapkan dengan enam simpul tersembunyi, penyusutan 0,01, dan dua ratus epoch. Argumen trace bernilai salah menekan keluaran pelatihan yang panjang. Alur kerja dirangkai, dilatih, lalu dinilai pada data uji.
    interpretasi: |
      Bandingkan AUC terhadap acuan; pada data yang hubungannya sengaja dibuat ada, AUC seharusnya jauh melampaui setengah. Perhatikan bahwa nilai simpul dan penyusutan di sini masih ditebak, bukan ditala --- contoh berikutnya memperbaikinya. Perhatikan pula bahwa benih acak ditetapkan sebelum pelatihan, sebab bobot awal jaringan dibangkitkan acak sehingga hasilnya berubah tiap kali dijalankan tanpa benih.
  - contoh: Memperagakan kepekaan terhadap benih acak
    kode_r: |-
      hasil_benih <- sapply(1:5, function(s) {
        set.seed(s)
        m <- fit(wf_ffnn, data = lat)
        d <- predict(m, uji, type = "prob") |> bind_cols(uji |> select(rentan))
        roc_auc(d, rentan, .pred_Ya)$.estimate
      })
      print(round(data.frame(benih = 1:5, AUC = hasil_benih), 4), row.names = FALSE)
      cat("\nrentang AUC antar-benih:", round(diff(range(hasil_benih)), 4), "\n")
      cat("simpangan baku          :", round(sd(hasil_benih), 4), "\n")
    judul_r: melatih jaringan dengan lima benih berbeda
    eval: true
    penjelasan: |
      Jaringan yang sama dilatih lima kali dengan benih acak berbeda. AUC pada data uji dicatat bagi masing-masing, lalu rentang dan simpangan bakunya dihitung.
    interpretasi: |
      Rentang antar-benih inilah ketidakpastian yang melekat pada jaringan syaraf dan tidak dimiliki model seperti regresi logistik. Sebabnya bobot awal dibangkitkan acak dan pengoptimuman dapat berhenti pada minimum setempat yang berbeda. Akibat praktisnya tegas: melaporkan AUC dari satu kali pelatihan tanpa menyebutkan benihnya membuat hasil tidak dapat direproduksi, dan bila rentangnya besar maka perbandingan antar-model menjadi tidak bermakna kecuali selisihnya melampaui rentang itu.
  - contoh: Menala simpul tersembunyi dan penyusutan
    kode_r: |-
      suppressPackageStartupMessages({library(tune); library(dials)})

      spec_tune <- mlp(hidden_units = tune(), penalty = tune(), epochs = 200) |>
        set_engine("nnet", trace = FALSE) |>
        set_mode("classification")
      wf_tune <- workflow() |> add_recipe(rec) |> add_model(spec_tune)

      set.seed(2025)
      lipatan <- vfold_cv(lat, v = 5, strata = rentan)
      kisi <- expand.grid(hidden_units = c(3, 6, 10, 15),
                          penalty = c(0.0001, 0.001, 0.01, 0.1))

      set.seed(2025)
      hasil_tune <- tune_grid(wf_tune, resamples = lipatan, grid = kisi,
                              metrics = metric_set(roc_auc, f_meas))

      atas <- collect_metrics(hasil_tune) |>
        filter(.metric == "roc_auc") |>
        arrange(desc(mean)) |>
        select(hidden_units, penalty, mean, std_err) |>
        mutate(across(where(is.numeric), \(x) round(x, 4)))
      print(utils::head(as.data.frame(atas), 6), row.names = FALSE)
    judul_r: tune_grid atas dua parameter
    eval: true
    penjelasan: |
      Kedua parameter ditandai tune sehingga nilainya dicari. Kisi berukuran empat kali empat dicoba pada lima lipatan, sehingga delapan puluh jaringan dilatih. Enam kombinasi terbaik ditampilkan bersama galat bakunya.
    interpretasi: |
      Perhatikan kolom galat baku. Bila selisih rata-rata antar-kombinasi teratas lebih kecil daripada galat bakunya, maka pemilihan yang terbaik sesungguhnya sembarang. Dalam keadaan demikian, memilih jaringan yang lebih kecil dengan penyusutan lebih besar --- yakni model yang lebih sederhana dan lebih stabil --- lebih dapat dipertanggungjawabkan daripada memilih yang rata-ratanya kebetulan tertinggi.
  - contoh: Menggambarkan permukaan penalaan
    kode_r: |-
      auc_kisi <- collect_metrics(hasil_tune) |> filter(.metric == "roc_auc")

      matriks <- with(auc_kisi,
        matrix(mean, nrow = length(unique(hidden_units)),
               dimnames = list(sort(unique(hidden_units)), sort(unique(penalty)))))

      par(mar = c(4.5, 4.5, 3, 1))
      matplot(sort(unique(auc_kisi$hidden_units)), matriks, type = "b",
              pch = 19, lwd = 2, lty = 1,
              col = c("#0B6FB4", "#F58220", "#00A651", "#C0392B"),
              xlab = "Banyaknya simpul tersembunyi",
              ylab = "ROC-AUC (validasi silang)",
              main = "Permukaan Penalaan FFNN")
      legend("bottomright", legend = paste("penalty =", colnames(matriks)),
             col = c("#0B6FB4", "#F58220", "#00A651", "#C0392B"),
             lwd = 2, pch = 19, bty = "n", cex = 0.8)
      grid(col = "grey88")
      par(mar = c(5, 4, 4, 2) + 0.1)
    judul_r: matplot atas kisi dua parameter
    eval: true
    penjelasan: |
      Hasil penalaan diubah menjadi matriks berbaris simpul tersembunyi dan berkolom nilai penyusutan. Setiap kolom digambar sebagai satu garis, sehingga pengaruh kedua parameter terlihat sekaligus.
    interpretasi: |
      Gambar ini memperlihatkan keterkaitan yang disebut pada Teori. Garis dengan penyusutan kecil lazimnya menurun ketika simpul bertambah --- pertanda mengalami *overfitting* --- sedangkan garis dengan penyusutan memadai tetap datar atau naik. Menyajikan permukaan seperti ini jauh lebih informatif daripada sekadar melaporkan kombinasi terbaik, sebab pembaca dapat menilai sendiri seberapa peka model terhadap pilihan parameternya.
  - contoh: Menyelesaikan FFNN dan menilai pada data uji
    kode_r: |-
      terbaik <- select_best(hasil_tune, metric = "roc_auc")
      cat("terpilih - simpul:", terbaik$hidden_units,
          "| penyusutan:", signif(terbaik$penalty, 4), "\n\n")

      wf_final <- finalize_workflow(wf_tune, terbaik)
      set.seed(2025)
      akhir <- last_fit(wf_final, split = bagi,
                        metrics = metric_set(roc_auc, f_meas, accuracy))

      collect_metrics(akhir) |>
        mutate(.estimate = round(.estimate, 4)) |>
        select(.metric, .estimate) |> print()

      pred_ffnn <- collect_predictions(akhir)
      print(conf_mat(pred_ffnn, truth = rentan, estimate = .pred_class))
    judul_r: finalize_workflow dan last_fit
    eval: true
    penjelasan: |
      Kombinasi parameter terbaik dipakai menyelesaikan alur kerja. Fungsi last_fit melatih ulang pada seluruh data latih lalu menilai satu kali pada data uji. Dugaan pada data uji diambil untuk pemeriksaan lanjutan.
    interpretasi: |
      Inilah satu-satunya kali data uji disentuh; seluruh keputusan penalaan diambil lewat validasi silang pada data latih. Perhatikan bahwa matriks kekeliruan dihitung pada ambang bawaan setengah --- contoh berikutnya memperlihatkan bahwa ambang itu jarang merupakan pilihan terbaik pada data timpang.
  - contoh: Memindahkan ambang keputusan
    kode_r: |-
      ambang <- seq(0.05, 0.95, by = 0.05)
      ukuran_ambang <- t(sapply(ambang, function(t) {
        dg <- factor(ifelse(pred_ffnn$.pred_Ya > t, "Ya", "Tidak"),
                     levels = c("Ya", "Tidak"))
        sn <- yardstick::sensitivity_vec(pred_ffnn$rentan, dg)
        sp <- yardstick::specificity_vec(pred_ffnn$rentan, dg)
        c(sensitivitas = sn, spesifisitas = sp, youden = sn + sp - 1,
          F1 = yardstick::f_meas_vec(pred_ffnn$rentan, dg))
      }))
      tabel_ambang <- data.frame(ambang, round(ukuran_ambang, 4))
      print(tabel_ambang[seq(1, nrow(tabel_ambang), by = 2), ], row.names = FALSE)

      t_youden <- ambang[which.max(ukuran_ambang[, "youden"])]
      t_f1     <- ambang[which.max(ukuran_ambang[, "F1"])]
      cat("\nambang terbaik menurut Youden:", t_youden,
          "| menurut F1:", t_f1, "| bawaan: 0.5\n")
    judul_r: menghitung ukuran pada berbagai ambang
    eval: true
    penjelasan: |
      Sembilan belas ambang dicoba. Pada tiap ambang, kelas dugaan dibentuk ulang lalu sensitivitas, spesifisitas, indeks Youden, dan F1 dihitung memakai fungsi bentuk vektor dari yardstick. Ambang terbaik menurut dua ukuran berbeda dicari.
    interpretasi: |
      Perhatikan bahwa kedua ukuran dapat menghasilkan ambang yang berbeda, dan keduanya lazimnya bukan setengah. Indeks Youden menyeimbangkan kedua jenis kekeliruan tanpa memihak, sedangkan F1 lebih memihak kelas yang diperhatikan. Pemilihan di antara keduanya adalah keputusan kebijakan: bila melewatkan rumah tangga rentan dianggap jauh lebih merugikan daripada memeriksa yang tidak rentan, maka ukuran yang lebih memihak sensitivitas lebih tepat.
  - contoh: Menggambarkan pengaruh ambang
    kode_r: |-
      par(mfrow = c(1, 2), mar = c(4.5, 4.5, 3, 1))

      matplot(ambang, ukuran_ambang[, c("sensitivitas", "spesifisitas", "F1")],
              type = "l", lwd = 2, lty = 1,
              col = c("#0B6FB4", "#F58220", "#00A651"),
              xlab = "Ambang keputusan", ylab = "Nilai ukuran",
              main = "Ukuran menurut Ambang")
      abline(v = t_youden, col = "#C0392B", lty = 2, lwd = 2)
      legend("bottom", c("sensitivitas", "spesifisitas", "F1"),
             col = c("#0B6FB4", "#F58220", "#00A651"), lwd = 2, bty = "n", cex = 0.75)

      kurva <- roc_curve(pred_ffnn, truth = rentan, .pred_Ya)
      plot(1 - kurva$specificity, kurva$sensitivity, type = "l", lwd = 2,
           col = "#0B6FB4", xlim = c(0, 1), ylim = c(0, 1),
           xlab = "1 - spesifisitas", ylab = "sensitivitas",
           main = "Kurva ROC FFNN")
      abline(0, 1, col = "#C0392B", lty = 2, lwd = 2)
      par(mfrow = c(1, 1), mar = c(5, 4, 4, 2) + 0.1)
    judul_r: grafik ambang dan kurva ROC
    eval: true
    penjelasan: |
      Dua gambar disajikan berdampingan. Yang kiri memuat ketiga ukuran menurut ambang dengan garis tegak menandai ambang terbaik menurut Youden. Yang kanan berupa kurva ROC yang menilai seluruh ambang sekaligus.
    interpretasi: |
      Kedua gambar melengkapi satu sama lain. Kurva ROC menilai kemampuan pemisahan model tanpa bergantung ambang, sedangkan gambar kiri menjawab pertanyaan praktis ambang mana yang hendak dipakai. Perhatikan bahwa titik pada kurva ROC yang terjauh dari garis diagonal berpadanan dengan ambang yang memaksimumkan indeks Youden --- keduanya menyatakan hal yang sama dengan cara berbeda.
  - contoh: Membangun RBFNN dari dasar
    kode_r: |-
      # jarak Euclidean antara tiap baris A terhadap tiap baris B
      jarak_ke_pusat <- function(A, B) {
        sqrt(pmax(outer(rowSums(A^2), rep(1, nrow(B))) +
                  outer(rep(1, nrow(A)), rowSums(B^2)) - 2 * A %*% t(B), 0))
      }

      rbf_latih <- function(X, y, size = 20, seed = 2025) {
        set.seed(seed)
        km    <- kmeans(X, centers = size, nstart = 10, iter.max = 50)
        lebar <- max(dist(km$centers)) / sqrt(2 * size)      # aturan praktis
        H     <- exp(-jarak_ke_pusat(X, km$centers)^2 / (2 * lebar^2))
        df    <- data.frame(H); df$y <- ifelse(y == "Ya", 1, 0)
        list(pusat = km$centers, lebar = lebar,
             mod = suppressWarnings(glm(y ~ ., data = df, family = binomial)))
      }

      rbf_duga <- function(fit, X) {
        H <- exp(-jarak_ke_pusat(X, fit$pusat)^2 / (2 * fit$lebar^2))
        as.numeric(predict(fit$mod, newdata = data.frame(H), type = "response"))
      }

      X_lat <- as.matrix(lat_siap[, setdiff(names(lat_siap), "rentan")])
      X_uji <- as.matrix(uji_siap[, setdiff(names(uji_siap), "rentan")])

      f20 <- rbf_latih(X_lat, lat_siap$rentan, size = 20)
      cat("banyaknya pusat:", nrow(f20$pusat), "| lebar basis:", round(f20$lebar, 4), "\n")
      cat("dimensi ruang peubah:", ncol(X_lat), "\n")
    judul_r: menyusun RBFNN dengan tiga fungsi
    eval: true
    penjelasan: |
      Tiga fungsi disusun. Yang pertama menghitung matriks jarak memakai penjabaran kuadrat agar cepat. Yang kedua melatih jaringan: pusat ditetapkan dengan K-Means, lebar dihitung dengan aturan praktis, matriks basis Gauss dibentuk, lalu bobot keluaran diduga dengan regresi logistik. Yang ketiga menerapkannya pada data baru.
    interpretasi: |
      Menyusun RBFNN dari dasar bukan sekadar siasat karena paket tidak tersedia, melainkan cara memahami mekanismenya. Ketiga langkahnya terlihat jelas: penempatan pusat, pengukuran kedekatan, dan penggabungan lurus. Perlu dicatat bahwa pelatihannya berlangsung dua tahap terpisah --- pusat ditetapkan tanpa memperhatikan sasaran, baru kemudian bobot keluaran diduga --- berbeda dari FFNN yang seluruh bobotnya dilatih bersama-sama.
  - contoh: Menala banyaknya pusat RBFNN
    kode_r: |-
      ukuran_pusat <- c(5, 10, 20, 30, 50)

      hasil_rbf <- t(sapply(ukuran_pusat, function(s) {
        f <- rbf_latih(X_lat, lat_siap$rentan, size = s)
        d_lat <- data.frame(benar = lat_siap$rentan, prob = rbf_duga(f, X_lat))
        d_uji <- data.frame(benar = uji_siap$rentan, prob = rbf_duga(f, X_uji))
        c(pusat = s, lebar = round(f$lebar, 4),
          AUC_latih = round(roc_auc(d_lat, benar, prob)$.estimate, 4),
          AUC_uji   = round(roc_auc(d_uji, benar, prob)$.estimate, 4))
      }))
      print(hasil_rbf, row.names = FALSE)

      cat("\njarak AUC latih terhadap uji:\n")
      print(round(hasil_rbf[, "AUC_latih"] - hasil_rbf[, "AUC_uji"], 4))
    judul_r: melatih RBFNN pada lima ukuran
    eval: true
    penjelasan: |
      Lima nilai banyaknya pusat dicoba. Pada masing-masing, AUC dihitung dua kali: pada data latih dan pada data uji. Lebar basis ikut dilaporkan karena nilainya berubah mengikuti banyaknya pusat.
    interpretasi: |
      Perhatikan dua hal. Pertama, lebar basis menyempit ketika pusat bertambah, sesuai rumus aturan praktis --- makin banyak pusat, makin setempat pengaruh masing-masing. Kedua, jarak antara AUC latih dan uji melebar seiring pusat bertambah; itulah wujud pemodelan berlebih (*overfitting*) pada RBFNN. Banyaknya pusat karena itu berperan serupa dengan banyaknya simpul tersembunyi pada FFNN, yakni mengatur fleksibilitas model.
  - contoh: Menggambarkan pengaruh banyaknya pusat
    kode_r: |-
      plot(hasil_rbf[, "pusat"], hasil_rbf[, "AUC_latih"], type = "b", pch = 19,
           lwd = 2, col = "#C0392B",
           ylim = range(hasil_rbf[, c("AUC_latih", "AUC_uji")]),
           xlab = "Banyaknya pusat", ylab = "ROC-AUC",
           main = "Kelenturan RBFNN menurut Banyaknya Pusat")
      lines(hasil_rbf[, "pusat"], hasil_rbf[, "AUC_uji"], type = "b", pch = 17,
            lwd = 2, col = "#0B6FB4")
      legend("bottomright", c("data latih", "data uji"),
             col = c("#C0392B", "#0B6FB4"), lwd = 2, pch = c(19, 17),
             bty = "n", cex = 0.85)
      grid(col = "grey88")

      pusat_terbaik <- hasil_rbf[which.max(hasil_rbf[, "AUC_uji"]), "pusat"]
      cat("banyaknya pusat terbaik menurut data uji:", pusat_terbaik, "\n")
    judul_r: grafik kinerja latih dan uji
    eval: true
    penjelasan: |
      Kedua kurva AUC digambar bersama pada sumbu yang sama, dengan batas sumbu tegak ditetapkan agar keduanya selalu terlihat penuh.
    interpretasi: |
      Jarak antara kedua garis adalah ukuran langsung pemodelan berlebih (*overfitting*), persis sebagaimana pada penalaan tetangga terdekat di modul supervised learning. Perlu diakui satu kelemahan pada peragaan ini: banyaknya pusat terbaik dipilih berdasarkan data uji, padahal seharusnya lewat validasi silang pada data latih. Peragaan ini disederhanakan demi kejelasan, dan Penugasan menuntut Anda mengerjakannya dengan benar memakai lipatan.
  - contoh: Menghitung kepentingan peubah dengan permutasi
    kode_r: |-
      f_rbf <- rbf_latih(X_lat, lat_siap$rentan, size = as.numeric(pusat_terbaik))
      dasar <- roc_auc(data.frame(benar = uji_siap$rentan,
                                  prob = rbf_duga(f_rbf, X_uji)), benar, prob)$.estimate

      set.seed(2025)
      kepentingan <- sapply(seq_len(ncol(X_uji)), function(j) {
        turun <- replicate(5, {
          Xp <- X_uji; Xp[, j] <- sample(Xp[, j])
          dasar - roc_auc(data.frame(benar = uji_siap$rentan,
                                     prob = rbf_duga(f_rbf, Xp)), benar, prob)$.estimate
        })
        mean(turun)
      })

      imp <- data.frame(peubah = colnames(X_uji),
                        penurunan_AUC = round(kepentingan, 4))
      imp <- imp[order(-imp$penurunan_AUC), ]
      print(utils::head(imp, 8), row.names = FALSE)
    judul_r: permutasi peubah satu per satu
    eval: true
    penjelasan: |
      Setiap peubah diacak nilainya lima kali, dan penurunan AUC dicatat lalu dirata-ratakan. Pengacakan memutus hubungan antara peubah itu dan sasaran tanpa melatih ulang model, sehingga sumbangannya terhadap dugaan dapat diukur.
    interpretasi: |
      Pengulangan lima kali penting karena pengacakan bersifat acak; sekali pengacakan menghasilkan angka yang tidak stabil. Bandingkan urutan yang diperoleh terhadap koefisien yang dipakai membangkitkan data pada Contoh 10.1 --- bila peubah yang koefisiennya besar memang muncul di atas, itu pertanda model menangkap struktur yang benar. Perlu ditegaskan kembali bahwa kepentingan ini menyatakan sumbangan terhadap dugaan, bukan pengaruh sebab-akibat.
  - contoh: Menafsirkan model melalui analisis profil
    kode_r: |-
      prob_uji <- rbf_duga(f_rbf, X_uji)
      kelompok <- cut(prob_uji, breaks = quantile(prob_uji, c(0, .25, .75, 1)),
                      labels = c("peluang rendah", "menengah", "peluang tinggi"),
                      include.lowest = TRUE)

      num_asli <- c("pengeluaran", "anggota_rt", "pendidikan", "ketahanan", "sejahtera")
      profil <- aggregate(uji[num_asli], list(kelompok = kelompok), mean)
      profil[num_asli] <- round(profil[num_asli], 2)
      print(profil, row.names = FALSE)

      cat("\nproporsi rentan sebenarnya per kelompok:\n")
      print(round(tapply(uji$rentan == "Ya", kelompok, mean), 4))
    judul_r: membandingkan ciri antar-kelompok peluang
    eval: true
    penjelasan: |
      Amatan data uji dibagi tiga menurut kuartil peluang dugaan. Rata-rata peubah numerik dalam satuan aslinya dibandingkan antar-kelompok, disusul proporsi kelas yang sebenarnya pada tiap kelompok.
    interpretasi: |
      Analisis profil menjembatani model tertutup dengan pemahaman pengguna. Bila kelompok berpeluang tinggi ternyata berpengeluaran jauh lebih rendah dan beranggota lebih banyak, maka model menangkap pola yang masuk akal menurut pengetahuan bidang. Baris terakhir berfungsi sebagai pemeriksaan kalibrasi kasar: proporsi rentan sebenarnya seharusnya menaik dari kelompok rendah ke tinggi. Bila tidak menaik, dugaan peluangnya tidak dapat dipercaya untuk penyasaran.
  - contoh: Membandingkan FFNN dan RBFNN secara adil
    kode_r: |-
      d_ffnn <- data.frame(benar = pred_ffnn$rentan, prob = pred_ffnn$.pred_Ya)
      d_rbf  <- data.frame(benar = uji_siap$rentan,    prob = prob_uji)

      ringkas <- function(d, nama) {
        dg <- factor(ifelse(d$prob > 0.5, "Ya", "Tidak"), levels = c("Ya", "Tidak"))
        data.frame(model = nama,
          AUC  = round(roc_auc(d, benar, prob)$.estimate, 4),
          F1   = round(yardstick::f_meas_vec(d$benar, dg), 4),
          Sens = round(yardstick::sensitivity_vec(d$benar, dg), 4),
          Spes = round(yardstick::specificity_vec(d$benar, dg), 4))
      }
      banding <- rbind(ringkas(d_ffnn, "FFNN"), ringkas(d_rbf, "RBFNN"))
      print(banding, row.names = FALSE)

      cat("\nselisih AUC antar-model      :", round(abs(diff(banding$AUC)), 4), "\n")
      cat("rentang AUC FFNN antar-benih:", round(diff(range(hasil_benih)), 4), "\n")
    judul_r: menyandingkan kedua arsitektur
    eval: true
    penjelasan: |
      Kedua model dinilai pada data uji yang sama dengan ambang yang sama. Empat ukuran dihitung bagi masing-masing. Selisih AUC keduanya dibandingkan terhadap rentang antar-benih yang diperoleh sebelumnya.
    interpretasi: |
      Perbandingan pada baris terakhir adalah bagian terpenting. Bila selisih AUC antar-model lebih kecil daripada rentang yang timbul semata karena benih acak berbeda, maka menyatakan salah satu arsitektur lebih baik tidak didukung bukti. Kekeliruan ini lazim terjadi pada perbandingan jaringan syaraf, sebab ketidakpastian akibat inisialisasi acak kerap diabaikan. Perlu dicatat pula bahwa keduanya di sini dinilai pada ambang bawaan; kesimpulan dapat berubah bila masing-masing dipakai pada ambang optimalnya sendiri.
