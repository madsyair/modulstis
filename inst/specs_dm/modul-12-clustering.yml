  penugasan:
  - |-
    \begin{kotaktugas}
    Sebagai calon analis pada instansi statistik, lakukan pengelompokan wilayah atas \texttt{data\_wilayah.csv} (\emph{data simulasi}) memakai beberapa metode, evaluasi hasilnya, lalu simpulkan apakah data ini memang memiliki struktur klaster.
    \end{kotaktugas}
  - '**Konteks.** Sebuah unit hendak menyusun tipologi wilayah berdasarkan indikator sosial-ekonomi. Pimpinan
    meminta bukan hanya hasil pengelompokan melainkan juga penilaian apakah pengelompokan itu bermakna.'
  - \tugas{Penyiapan}
  - 1. Periksa **perbedaan skala** antar-peubah numerik. Laporkan rasio simpangan baku terbesar terhadap
    terkecil, lakukan pembakuan, lalu buktikan hasilnya dengan memeriksa rata-rata dan simpangan baku
    kolomnya.
  - \tugas{Metode Partisi}
  - 2. Bentuk satu pengelompokan berbasis jarak dengan k = 3 sebagai **pembanding**. Laporkan ukuran klasternya
    saja; cara kerja metodenya tidak perlu dibahas.
  - \tugas{Metode Berbasis Kepadatan}
  - 6. Tentukan **Eps** melalui grafik jarak tetangga ke-k dan tetapkan **MinPts** dengan aturan praktis.
    Sajikan grafiknya beserta alasan pemilihan nilainya.
  - 7. Terapkan **DBSCAN**. Laporkan banyaknya klaster, persentase derau, lalu periksa **kepekaannya**
    dengan mencoba minimal delapan nilai Eps.
  - 8. Terapkan **OPTICS** dan sajikan **diagram jangkauannya**. Bandingkan hasilnya terhadap DBSCAN,
    lalu jelaskan keunggulan OPTICS pada data berkepadatan beragam.
  - \tugas{Evaluasi dan Kesimpulan}
  - 9. Hitung **indeks siluet** dan **indeks Dunn** bagi hasil K-Medoids. Sajikan diagram siluet, laporkan
    amatan bersiluet negatif, lalu jelaskan mengapa Dunn peka terhadap pencilan.
  - 10. Tentukan banyaknya klaster dengan **metode siku dan siluet rata-rata** untuk k dari 2 sampai 10.
    Sajikan keduanya dan bandingkan jawabannya.
  - 11. Susun **profil tiap klaster** dalam satuan asli beserta sebaran peubah kategorinya. Berikan nama
    bagi tiap klaster, disertai catatan bahwa penamaan berasal dari penafsiran analis.
  - 12. **Simpulkan apakah data ini memiliki struktur klaster yang berarti.** Dasarkan kesimpulan pada
    nilai siluet, bentuk kurva siku, dan diagram jangkauan --- bukan pada keberhasilan algoritma menghasilkan
    klaster.
  - \tugas{Kajian Perbandingan Dua Keluarga Metode}
  - '10. Bangkitkan **tiga data uji berlabel diketahui**: gumpalan membulat, cincin sepusat, dan gumpalan
    disertai 10 persen derau. Sajikan gambar ketiganya.'
  - 11. Jalankan **kedua keluarga metode** pada ketiga data dengan prapemrosesan yang sama. Sajikan tabel
    memuat banyaknya klaster, cakupan, dan ARI.
  - '12. **Buktikan bahwa indeks siluet tidak sah** dipakai membandingkan antar-keluarga: hitung siluet
    bagi pengelompokan yang sebenarnya benar pada data cincin, lalu bandingkan terhadap siluet pengelompokan
    berbasis jarak yang keliru. Jelaskan sebabnya.'
  - 13. Terapkan **lima langkah perbandingan yang adil** pada data berderau. Laporkan ARI atas seluruh
    amatan dan atas himpunan bagian yang sama, lalu jelaskan dari mana keunggulan yang terlihat sesungguhnya
    berasal.
  - 14. Susun **tabel rangkuman kajian** yang memuat kesesuaian tiap keluarga metode dan ukuran penilaian
    yang sah bagi tiap keadaan data.
  - '15. Susun laporan R Markdown berisi kode, keluaran, gambar, dan interpretasi. Tutup dengan **ringkasan
