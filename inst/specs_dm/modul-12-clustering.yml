body:
  deskripsi:
  - 'Sembilan modul sebelumnya bekerja pada tugas supervised, yaitu ketika sasaran diketahui dan model
    dinilai terhadapnya. Modul ini berpindah ke tugas unsupervised: tidak ada sasaran, dan yang dicari
    adalah struktur alami di dalam data itu sendiri.'
  - Perpindahan itu membawa akibat mendasar pada cara menilai. Tidak ada kunci jawaban, sehingga tidak
    ada akurasi yang dapat dihitung. Kebermaknaan hasil bersandar pada ukuran internal --- seberapa rapat
    anggota satu klaster dan seberapa terpisah antar-klaster --- serta pada penafsiran yang masuk akal
    menurut pengetahuan bidang.
  - 'Materi mencakup empat keluarga metode. **Pertama**, metode berbasis medoid: **k-Medoid (PAM)** untuk
    peubah numerik, serta penerapannya pada **data kategorik dan campuran** lewat jarak **Gower**. **Kedua**,
    **k-Prototype** yang menggabungkan k-Means dan k-Modes untuk data campuran, beserta parameter $\lambda$
    yang menimbang kedua jenis peubah. **Ketiga**, metode berbasis kepadatan --- **DBSCAN** dan **OPTICS**
    --- yang mampu menemukan klaster berbentuk tidak teratur sekaligus menandai derau; keduanya dibandingkan
    pada data berkepadatan **bersarang** yang memperlihatkan kapan DBSCAN tidak lagi memadai. **Keempat**,
    **bi-clustering** yang mengelompokkan baris dan kolom sekaligus, sehingga dapat menemukan pola yang
    hanya berlaku pada sebagian peubah.'
  - 'Selain metode, modul menekankan **evaluasi**: ukuran mutu bagi keempat metode, penentuan banyaknya
    klaster, serta **ukuran yang sah dipakai lintas keluarga** --- kesepakatan, cakupan, dan kestabilan
    --- sebab siluet dan Dunn tidak sebanding bila dihitung atas himpunan amatan yang berbeda. Bagian
    penutup memuat **kajian terkendali** yang membuktikan hal itu pada data berpola diketahui.'
  - Tiga hal yang bersifat pelengkap --- alur kerja pengelompokan dari memeriksa kecenderungan berklaster
    hingga profiling, varian k-Medoid untuk data besar (**CLARA** dan **CLARANS**), serta **kajian terkendali**
    yang membuktikan mengapa siluet dan Dunn tidak sah menjadi hakim antar-keluarga metode --- dipindahkan
    ke **Modul 13** agar modul ini tetap seukuran satu sesi praktikum.
  - 'Perlu ditegaskan apa yang **tidak** dibahas modul ini: teori jarak, pengelompokan hierarki, dan k-Means.
    Ketiganya diandaikan sudah dikenal; k-Medoid dan PAM hadir sebagai wakil keluarga berbasis jarak,
    dan k-Means disebut hanya sebagai pembanding konseptual.'
  - |-
    \begin{kotakperhatian}[Tentang data]
    Berkas data pada modul ini adalah \textbf{data simulasi} (\texttt{set.seed(2026)}), \textbf{bukan data nyata} dan \textbf{bukan data resmi} instansi mana pun. Peubah dibangkitkan tanpa struktur klaster yang disengaja, sehingga hasil pengelompokan yang lemah adalah temuan yang benar dan wajib dilaporkan apa adanya.
    \end{kotakperhatian}
  - \vspace{1.2em}
  tujuan:
  - 'Setelah menyelesaikan praktikum ini secara tuntas, mahasiswa diharapkan mampu:'
  - 1. **Menjelaskan** gagasan titik inti, titik batas, dan derau pada metode kepadatan.
  - 2. **Menerapkan** DBSCAN beserta penetapan parameter Eps dan MinPts secara terarah.
  - 3. **Memeriksa** kepekaan hasil DBSCAN terhadap pemilihan parameternya.
  - 4. **Menerapkan** OPTICS dan membaca diagram jangkauannya.
  - 5. **Mengevaluasi** hasil pengelompokan dengan indeks siluet dan indeks Dunn.
  - 6. **Menentukan** banyaknya klaster dengan metode siku dan siluet rata-rata.
  - 7. **Menjelaskan** mengapa ukuran internal tidak sah dipakai membandingkan antar-keluarga metode.
  - 8. **Menerapkan** prosedur perbandingan yang adil beserta pelaporan cakupannya.
  - 9. **Memakai** ukuran eksternal (ARI) ketika label sebenarnya tersedia.
  - 10. **Mengenali** gagasan bi-clustering beserta keadaan yang menuntutnya.
  - \vspace{1.2em}
  alat:
  - 'Perangkat dan bahan yang diperlukan:'
  - '- **R** (RStudio) dengan paket `dbscan`, `cluster`, `fpc`, `mclust`, dan `factoextra`.'
  - '- Paket `biclust` untuk bagian bi-clustering.'
  - '- Pasang dengan `install.packages(c("dbscan","cluster","fpc","clustMixType","biclust","factoextra"))`.'
  - '- Berkas data: `data/data_wilayah.csv`, `data/titik_pemantauan.csv`, dan `data/data_ekspresi.csv`.'
  - '- Paket `cluster` dipakai untuk indeks siluet dan sebagai pembanding berbasis jarak, bukan sebagai
    bahasan tersendiri.'
  - \vspace{1.2em}
  instruksi:
  - 'Ikuti tahapan berikut:'
  - '**Sebelum praktikum:** pasang seluruh paket; siapkan kedua berkas data; tinjau kembali bagian jarak
    pada Modul 3.'
  - '**Selama praktikum:** kerjakan Contoh berurutan. Perhatikan bahwa pembakuan menjadi penentu pada
    hampir seluruh metode di modul ini --- ini menjadi sorotan utama.'
  - '**Selama praktikum:** kerjakan Contoh berurutan. Bagian kajian perbandingan (Contoh 12.10 sampai
    11.15) memakai data buatan berlabel diketahui, sebab hanya dengan begitu ketepatan suatu ukuran mutu
    dapat diuji.'
  - \vspace{1.2em}
  teori:
  - '### Kedudukan pada CRISP-DM'
  - Modul ini menempati tahap Modeling dan Evaluation, tetapi dengan watak yang berbeda dari modul supervised.
    Tanpa sasaran, tahap evaluasi tidak dapat membandingkan dugaan terhadap kebenaran; yang dinilai adalah
    mutu struktur yang ditemukan beserta kebermaknaannya menurut pengetahuan bidang.
  - |-
    \begin{kotakperhatian}[Pembakuan mendahului pengelompokan]
    Seluruh metode pada modul ini bersandar pada jarak antar-amatan. Bila satuan peubah berbeda jauh --- kepadatan penduduk bersatuan ribuan berdampingan dengan lama sekolah bersatuan belasan --- maka peubah bersatuan besar akan menentukan hampir seluruh jarak, sehingga pengelompokan yang dihasilkan sesungguhnya hanya mencerminkan satu peubah. Pembakuan karena itu \textbf{wajib} dilakukan lebih dahulu.
    \end{kotakperhatian}
  - '### Metode Berbasis Kepadatan'
  - 'Metode partisi seperti PAM mengandaikan klaster berbentuk kurang lebih bulat dan mengharuskan setiap
    amatan masuk salah satu klaster. Metode berbasis kepadatan melepaskan kedua anggapan itu: klaster
    didefinisikan sebagai daerah berkepadatan tinggi yang dipisahkan daerah berkepadatan rendah, dan amatan
    yang tidak termasuk mana pun ditandai sebagai **derau**.'
  - |-
    \begin{kotakinfo}[Tiga jenis titik pada DBSCAN]\par\smallskip
    \begin{tabular}{@{}p{3.0cm}p{11.4cm}@{}}
    \textbf{Titik inti} & memiliki setidaknya MinPts tetangga dalam radius Eps\\[3pt]
    \textbf{Titik batas} & bukan titik inti, tetapi berada dalam Eps dari suatu titik inti\\[3pt]
    \textbf{Derau} & bukan keduanya; tidak dimasukkan ke klaster mana pun\\
    \end{tabular}
    \end{kotakinfo}
  - Dua gagasan penghubungnya adalah **density-reachable** --- titik dapat dicapai melalui rantai titik
    inti --- dan **density-connected**, yaitu dua titik yang keduanya dapat dicapai dari titik inti yang
    sama. Sebuah klaster DBSCAN adalah himpunan maksimal titik yang saling density-connected.
  - |-
    \begin{kotakinfo}[Keunggulan dan kelemahan DBSCAN]\par\smallskip
    \begin{tabular}{@{}p{4.0cm}p{10.0cm}@{}}
    \textbf{Bentuk bebas} & menemukan klaster tidak bulat, misalnya memanjang atau melengkung\\[3pt]
    \textbf{Menandai derau} & pencilan tidak dipaksa masuk klaster\\[3pt]
    \textbf{Tanpa menetapkan k} & banyaknya klaster muncul sendiri\\[3pt]
    \textbf{Kepadatan beragam} & \emph{gagal} bila klaster berkepadatan sangat berbeda\\[3pt]
    \textbf{Dimensi tinggi} & memburuk karena kutukan dimensi\\
    \end{tabular}
    \end{kotakinfo}
  - '### Menetapkan Eps dan MinPts'
  - 'Kedua parameter itu menentukan hasil sepenuhnya. MinPts lazim ditetapkan sekitar dua kali banyaknya
    dimensi. Adapun Eps dicari secara grafis: jarak tiap titik ke tetangga terdekat ke-k diurutkan lalu
    digambar, dan titik belok pada kurva itu menjadi calon nilai Eps.'
  - |-
    \begin{kotaktips}
    Alasan cara grafis itu bekerja sederhana: bagi titik yang berada di dalam klaster, jarak ke tetangga ke-k relatif kecil dan seragam; bagi titik derau, jaraknya jauh lebih besar. Titik belok menandai peralihan antara keduanya.
    \end{kotaktips}
  - '### OPTICS: Mengurutkan Alih-alih Memartisi'
  - OPTICS tidak menghasilkan pengelompokan tunggal melainkan **urutan** titik beserta jarak jangkauannya.
    Dari urutan itu, pengelompokan pada berbagai nilai Eps dapat diperoleh tanpa menghitung ulang.
  - |-
    \begin{kotakinfo}[Dua besaran pokok OPTICS]\par\smallskip
    \begin{tabular}{@{}p{3.8cm}p{10.6cm}@{}}
    \textbf{Jarak inti} & jarak terkecil yang membuat suatu titik menjadi titik inti\\[3pt]
    \textbf{Jarak jangkauan} & jarak terkecil yang membuat suatu titik dapat dicapai dari titik lain\\
    \end{tabular}
    \end{kotakinfo}
  - Diagram jangkauan menggambarkan jarak jangkauan menurut urutan tersebut. Lembah pada diagram menandai
    klaster, sedangkan puncak menandai batas antar-klaster. Keunggulan pokoknya adalah kemampuan menangani
    klaster berkepadatan berbeda --- tepat kelemahan DBSCAN.
  - '### Evaluasi Hasil Pengelompokan'
  - Tanpa sasaran, mutu pengelompokan dinilai dengan ukuran internal yang membandingkan kerapatan di dalam
    klaster terhadap keterpisahan antar-klaster.
  - |-
    \begin{kotakrumus}
    \textbf{Indeks siluet} bagi amatan $i$:\\[6pt]
    $s(i) = \dfrac{b(i) - a(i)}{\max\{a(i),\, b(i)\}}$\\[6pt]
    dengan $a(i)$ rata-rata jarak ke sesama anggota klaster dan $b(i)$ rata-rata jarak ke anggota klaster tetangga terdekat. Nilainya berkisar dari $-1$ sampai $1$.
    \end{kotakrumus}
  - |-
    \begin{kotakinfo}[Membaca nilai siluet]\par\smallskip
    \begin{tabular}{@{}p{3.2cm}p{11.2cm}@{}}
    $0{,}71$ sampai $1{,}00$ & struktur kuat\\[2pt]
    $0{,}51$ sampai $0{,}70$ & struktur cukup\\[2pt]
    $0{,}26$ sampai $0{,}50$ & struktur lemah, mungkin semu\\[2pt]
    $\leq 0{,}25$ & tidak ada struktur berarti\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotakrumus}
    \textbf{Indeks Dunn} bagi seluruh pengelompokan:\\[6pt]
    $D = \dfrac{\min_{\text{antar-klaster}} \text{jarak}}{\max_{\text{dalam klaster}} \text{diameter}}$\\[6pt]
    Makin besar makin baik. Dunn sangat peka terhadap pencilan karena memakai nilai ekstrem.
    \end{kotakrumus}
  - '### Membandingkan Pengelompokan Berbasis Jarak dan Berbasis Kepadatan'
  - 'Dua keluarga metode pengelompokan bertolak dari gagasan yang berbeda. Metode berbasis jarak --- K-Means,
    K-Medoids, K-Prototypes --- mencari partisi yang meminimumkan jarak anggota terhadap pusat klasternya.
    Metode berbasis kepadatan mencari daerah padat yang dipisahkan daerah renggang. Perbedaan itu bukan
    sekadar teknis: keduanya menjawab pertanyaan yang berlainan, sehingga membandingkannya menuntut kehati-hatian.'
  - |-
    \begin{kotakinfo}[Perbedaan pokok dua keluarga metode]\par\smallskip
    \begin{tabular}{@{}p{3.4cm}p{4.8cm}p{5.8cm}@{}}
     & \textbf{Berbasis jarak} & \textbf{Berbasis kepadatan}\\
    \hline
    Bentuk klaster & cenderung membulat & bebas, dapat melengkung\\[2pt]
    Banyaknya klaster & ditetapkan di muka & muncul dari data\\[2pt]
    Cakupan amatan & seluruhnya masuk klaster & sebagian dapat menjadi derau\\[2pt]
    Parameter utama & $k$ & Eps dan MinPts\\[2pt]
    Kepadatan beragam & tidak menjadi soal & menyulitkan DBSCAN\\[2pt]
    Dimensi tinggi & memburuk & memburuk lebih cepat\\
    \end{tabular}
    \end{kotakinfo}
  - '#### Tiga Halangan dalam Membandingkannya'
  - Baris ketiga pada tabel di atas menimbulkan halangan pertama. Metode berbasis jarak menempatkan seluruh
    amatan ke dalam klaster, sedangkan metode berbasis kepadatan menyisakan sebagian sebagai derau. Membandingkan
    ukuran mutu keduanya secara langsung berarti membandingkan hasil atas himpunan amatan yang berbeda
    --- perbandingan yang tidak sepadan.
  - Halangan kedua terletak pada banyaknya klaster. Ukuran internal seperti siluet bergantung pada $k$,
    sehingga dua pengelompokan dengan banyak klaster berbeda tidak otomatis dapat diperbandingkan nilainya.
  - 'Halangan ketiga yang paling menentukan: **ukuran internal yang lazim dipakai mengandaikan klaster
    membulat**. Indeks siluet membandingkan jarak rata-rata ke sesama anggota terhadap jarak ke klaster
    tetangga, sehingga klaster memanjang atau melengkung dihukum meski pengelompokannya benar. Akibatnya
    siluet **tidak sah** dipakai memutuskan keluarga metode mana yang lebih baik.'
  - |-
    \begin{kotaksalah}[Siluet bukan hakim yang adil antar-keluarga metode]\par\smallskip
    Pada data berbentuk cincin sepusat, pengelompokan yang \textbf{sungguh benar} dapat bernilai siluet lebih rendah daripada pengelompokan yang sepenuhnya keliru. Sebabnya bukan kekeliruan perhitungan melainkan sifat ukurannya: siluet memberi nilai tinggi kepada klaster yang rapat dan membulat, dan cincin bukan keduanya. Contoh 12.13 memperagakan hal ini dengan angka.
    \end{kotaksalah}
  - '#### Prosedur Perbandingan yang Sahih'
  - |-
    \begin{kotakinfo}[Lima langkah membandingkan secara adil]\par\smallskip
    \begin{tabular}{@{}p{0.7cm}p{13.7cm}@{}}
    \textbf{1} & Samakan prapemrosesan: pembakuan dan ukuran jarak yang sama bagi keduanya\\[3pt]
    \textbf{2} & Laporkan \emph{cakupan}, yaitu persentase amatan yang dikelompokkan tiap metode\\[3pt]
    \textbf{3} & Bandingkan pada \emph{himpunan bagian yang sama}, yakni amatan yang dikelompokkan keduanya\\[3pt]
    \textbf{4} & Bila label sebenarnya tersedia, pakai ukuran \emph{eksternal} seperti Adjusted Rand Index\\[3pt]
    \textbf{5} & Bila tidak tersedia, jangan mengadu ukuran internal; pakai kestabilan, gambar, dan penafsiran bidang\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotakrumus}
    \textbf{Adjusted Rand Index} membandingkan dua pengelompokan atas amatan yang sama:\\[6pt]
    $ARI = \dfrac{RI - E[RI]}{\max(RI) - E[RI]}$\\[6pt]
    Bernilai $1$ bila kedua pengelompokan identik, dan sekitar $0$ bila kesesuaiannya tidak lebih baik daripada kebetulan. Nilai negatif menandakan kesesuaian lebih buruk daripada kebetulan.
    \end{kotakrumus}
  - 'Keunggulan ARI atas ukuran internal terletak pada ketidakbergantungannya terhadap bentuk klaster.
    Ia hanya memeriksa pasangan amatan: apakah dua amatan yang sekelompok menurut kebenaran juga sekelompok
    menurut model. Karena itu ARI sah dipakai membandingkan keluarga metode mana pun --- asalkan label
    sebenarnya memang tersedia.'
  - |-
    \begin{kotaktips}
    Pada pekerjaan nyata, label sebenarnya hampir tidak pernah tersedia --- itulah sebabnya pengelompokan dipakai. Karena itu langkah kelima menjadi yang paling sering terpakai: jalankan kedua keluarga metode, gambarkan hasilnya, periksa kestabilannya terhadap perubahan kecil data, dan pilih berdasarkan mana yang menghasilkan kelompok yang dapat dijelaskan dan dipakai. Keputusan itu bersifat substantif, bukan semata angka.
    \end{kotaktips}
  - '### Menentukan Banyaknya Klaster'
  - |-
    \begin{kotakinfo}[Tiga cara yang lazim]\par\smallskip
    \begin{tabular}{@{}p{3.4cm}p{4.8cm}p{6.0cm}@{}}
    \textbf{Cara} & \textbf{Yang diamati} & \textbf{Kelemahan}\\
    \hline
    Siku & jumlah kuadrat dalam klaster & titik siku kerap kabur\\[2pt]
    Siluet rata-rata & nilai siluet menurut $k$ & memihak klaster bulat\\[2pt]
    Empiris & $k \approx \sqrt{n/2}$ & kasar, hanya awalan\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[Algoritma selalu memberi jawaban]
    Seluruh algoritma pengelompokan akan mengembalikan klaster meski data sama sekali tidak berstruktur --- persis sebagaimana algoritma penemuan komunitas pada Modul 3. Karena itu langkah wajib setelah pengelompokan adalah memeriksa apakah strukturnya \textbf{berarti}, bukan sekadar melaporkan hasilnya. Nilai siluet rata-rata di bawah $0{,}25$ pada seluruh nilai $k$ adalah pertanda kuat bahwa data memang tidak berklaster.
    \end{kotaksalah}
  - \newpage
  - '### Bi-clustering'
  - Seluruh metode di atas mengelompokkan **baris**. Bi-clustering mengelompokkan baris dan kolom secara
    bersamaan, sehingga menemukan himpunan bagian amatan yang berperilaku serupa hanya pada himpunan bagian
    peubah tertentu.
  - Kebutuhan itu muncul ketika sebuah kelompok amatan hanya mirip pada sebagian peubah saja. Pada data
    ekspresi gen, sekelompok gen dapat terekspresi serupa hanya pada beberapa contoh dan tidak pada yang
    lain --- pola yang tak akan ditemukan pengelompokan baris biasa.
  - |-
    \begin{kotakinfo}[Pengelompokan baris dibandingkan bi-clustering]\par\smallskip
    \begin{tabular}{@{}p{3.6cm}p{5.0cm}p{5.6cm}@{}}
     & \textbf{Pengelompokan baris} & \textbf{Bi-clustering}\\
    \hline
    Yang dikelompokkan & baris saja & baris dan kolom\\[2pt]
    Cakupan peubah & seluruh peubah & sebagian peubah\\[2pt]
    Tumpang tindih & lazimnya tidak & boleh\\[2pt]
    Penerapan khas & segmentasi & ekspresi gen, sistem rekomendasi\\
    \end{tabular}
    \end{kotakinfo}
  - '**Algoritma Cheng-Church.** Diperkenalkan pada tahun 2000, algoritma ini mencari submatriks yang
    **skor sisaan rata-ratanya** rendah, yaitu submatriks yang nilainya dapat diterangkan oleh pengaruh
    baris ditambah pengaruh kolom.'
  - |-
    \begin{kotakrumus}
    \textbf{Skor sisaan rata-rata} bagi submatriks $I \times J$:\\[6pt]
    $H(I,J) = \dfrac{1}{|I||J|} \sum_{i \in I, j \in J} \left( a_{ij} - a_{iJ} - a_{Ij} + a_{IJ} \right)^{2}$\\[6pt]
    dengan $a_{iJ}$ rata-rata baris, $a_{Ij}$ rata-rata kolom, dan $a_{IJ}$ rata-rata submatriks. Submatriks disebut bikluster bila $H(I,J) < \delta$.
    \end{kotakrumus}
  - \vspace{1.2em}
  latihan:
  - Kerjakan bertahap. Gunakan `data/data_wilayah.csv`.
  - '#### Tingkat Dasar (melengkapi kode)'
  - \latihan{Pembakuan}
  - |-
    ```{r eval=FALSE}
    wil <- read.csv("data/data_wilayah.csv", stringsAsFactors = TRUE)
    num <- c("kepadatan","pengeluaran","akses_air","akses_listrik","lama_sekolah")
    X <- ____(wil[num])                      # pembakuan WAJIB
    round(colMeans(X), 8)                     # harus bernilai nol
    ```
  - \latihan{K-Medoids}
  - |-
    ```{r eval=FALSE}
    library(cluster)
    set.seed(2026)
    p <- ____(X, k = 3)                      # K-Medoids
    cat("siluet rata-rata:", p$silinfo$____, "\n")
    wil[p$____, num]                          # amatan yang menjadi medoid
    ```
  - \latihan{DBSCAN}
  - |-
    ```{r eval=FALSE}
    library(dbscan)
    minpts <- 2 * length(num)
    jk <- sort(dbscan::____(X, k = minpts))   # jarak ke tetangga ke-k
    db <- dbscan::____(X, eps = 1.5, minPts = minpts)
    cat("derau:", sum(db$cluster == ____), "\n")
    ```
  - '#### Tingkat Menengah (menulis sendiri)'
  - \latihan{Menentukan banyaknya klaster}
  - 'Tentukan banyaknya klaster dengan **dua cara**: metode siku dan siluet rata-rata, masing-masing untuk
    k dari 2 sampai 10. Sajikan tabel dan grafik keduanya. Bandingkan jawabannya, lalu tentukan k yang
    Anda pilih --- dan bila **kedua cara tidak memberi jawaban yang meyakinkan**, nyatakan hal itu beserta
    alasannya.'
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat empat kesalahan (jarak dihitung tanpa pembakuan, `dbscan` tanpa penulisan nama
    paket sehingga bentrok dengan `fpc`, siluet dihitung terhadap data tak terbakukan, dan derau DBSCAN
    ikut dihitung sebagai klaster). Temukan dan perbaiki, lalu jelaskan akibat masing-masing.
  - |-
    ```{r eval=FALSE}
    library(cluster); library(dbscan); library(fpc)
    wil <- read.csv("data/data_wilayah.csv", stringsAsFactors = TRUE)
    num <- c("kepadatan","pengeluaran","akses_air","akses_listrik","lama_sekolah")
  - |-
    # (a) jarak dihitung pada satuan asli
    D <- dist(wil[num])
    p <- pam(D, k = 3)
  - |-
    # (b) dbscan bentrok dengan fpc::dbscan
    db <- dbscan(wil[num], eps = 1.5, minPts = 10)
  - |-
    # (c) siluet dihitung terhadap data TAK terbakukan
    sil <- silhouette(p$clustering, dist(wil[num]))
  - |-
    # (d) derau ikut dicacah sebagai klaster
    cat("banyaknya klaster:", length(unique(db$cluster)), "\n")
    ```
  - '**Keluaran yang benar.** Setelah diperbaiki, kode yang dipakai adalah sebagai berikut.'
  - |-
    ```
    # (a) pembakuan mendahului perhitungan jarak
    X <- scale(wil[num])
    D <- dist(X)
    p <- pam(D, k = 3)
  - |-
    # (b) nama paket ditulis tegas
    minpts <- 2 * length(num)
    db <- dbscan::dbscan(X, eps = 1.5, minPts = minpts)
  - |-
    # (c) siluet dihitung terhadap data yang sama dengan pengelompokannya
    sil <- silhouette(p$clustering, dist(X))
  - |-
    # (d) derau (klaster 0) dikeluarkan saat mencacah
    cat("banyaknya klaster:", length(setdiff(unique(db$cluster), 0)), "\n")
    cat("derau:", sum(db$cluster == 0), "\n")
    ```
  - 'Pemeriksaan yang wajib berhasil: `all(abs(round(colMeans(X), 8)) == 0)` bernilai **TRUE**, dan `!(0
    %in% setdiff(unique(db$cluster), 0))` bernilai **TRUE**.'
  - \latihan{Menguji validitas siluet}
  - Bangkitkan data dua cincin sepusat sebagaimana Contoh 12.10. Hitung indeks siluet bagi **pengelompokan
    yang sebenarnya** dan bagi pengelompokan berbasis jarak dengan k = 2. Hitung pula ARI keduanya. Laporkan
    mana yang bersiluet lebih tinggi, lalu jelaskan mengapa hal itu terjadi dan apa akibatnya bila siluet
    dipakai memilih metode.
  - \latihan{Perbandingan yang adil}
  - 'Bangkitkan data bergumpal disertai 10 persen derau seragam. Jalankan kedua keluarga metode, lalu
    laporkan: (a) cakupan masing-masing; (b) ARI atas seluruh amatan; (c) ARI pada himpunan bagian yang
    dikelompokkan keduanya. Simpulkan dari mana keunggulan metode berbasis kepadatan sesungguhnya berasal.'
  - '#### Tingkat Lanjut (pemilihan metode)'
  - \latihan{Memilih dan membandingkan metode}
  - 'Untuk masing-masing keadaan berikut, tentukan keluarga metode yang Anda pilih beserta alasannya,
    dan sebutkan **ukuran penilaian yang sah** dipakai: (a) klaster diduga berbentuk memanjang dan sebagian
    amatan merupakan pencilan yang ingin ditandai; (b) klaster diduga membulat dan seluruh amatan harus
    masuk kelompok; (c) label sebenarnya tersedia dari sumber lain; (d) label tidak tersedia dan bentuk
