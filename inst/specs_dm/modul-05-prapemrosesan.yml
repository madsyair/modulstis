exercises:
- id: L5.1
  points: 15
  solution: 'Tingkat Dasar: pemeriksaan cacat, pembagian data, dan resep sederhana.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |
    suppressPackageStartupMessages({library(recipes); library(rsample)})
    kotor <- read.csv("data/data_kotor.csv", stringsAsFactors = TRUE)

    sum(is.na(kotor))                 # cacah nilai hilang
    sum(duplicated(kotor))            # cacah baris kembar
    q <- quantile(kotor$pendapatan, c(.25, .75), na.rm = TRUE)
    batas <- q[2] + 1.5 * diff(q)

    set.seed(2026)
    bagi <- initial_split(kotor, prop = 0.75, strata = target)
    lat <- training(bagi); uji <- testing(bagi)

    rec <- recipe(target ~ ., data = lat) |>
      step_impute_median(all_numeric_predictors()) |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())
    siap  <- prep(rec, training = lat)
    hasil <- bake(siap, new_data = uji)
  interpretasi: |
    Isian yang benar berturut-turut adalah is.na, duplicated, quantile, diff, initial_split, training, testing, recipe, all_numeric_predictors, prep, dan bake. Perhatikan bahwa prep memakai data latih sedangkan bake dapat dikenakan pada data mana pun. Pemakaian pemilih all_numeric_predictors lebih baik daripada menyebut nama kolom, sebab resep tetap sah meski susunan kolomnya berubah.
- id: L5.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: resep lengkap, fungsi pemeriksa, dan keputusan penanganan.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |
    suppressPackageStartupMessages({library(recipes); library(rsample)})
    kotor <- read.csv("data/data_kotor.csv", stringsAsFactors = TRUE)
    set.seed(2026)
    bagi <- initial_split(kotor, prop = 0.75, strata = target)
    lat <- training(bagi); uji <- testing(bagi)

    rec <- recipe(target ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_impute_median(all_numeric_predictors()) |>
      step_impute_mode(all_nominal_predictors()) |>
      step_YeoJohnson(all_numeric_predictors()) |>
      step_other(all_nominal_predictors(), threshold = 0.05) |>
      step_dummy(all_nominal_predictors()) |>
      step_zv(all_predictors()) |>
      step_normalize(all_numeric_predictors())

    periksa_alur <- function(rec, lat, uji) {
      siap <- prep(rec, training = lat)
      a <- bake(siap, new_data = lat)
      b <- bake(siap, new_data = uji)
      # kolom berperan penanda tidak dibakukan, sehingga dikecualikan
      num <- setdiff(names(a)[sapply(a, is.numeric)], "id")
      stopifnot(
        "masih ada NA pada data latih"   = !anyNA(a),
        "masih ada NA pada data uji"     = !anyNA(b),
        "nama kolom latih dan uji beda"  = identical(names(a), names(b)),
        "rata kolom latih tidak nol"     = all(abs(sapply(a[num], mean)) < 1e-8)
      )
      message("Alur prapemrosesan lolos empat pemeriksaan.")
      invisible(list(latih = a, uji = b))
    }
    hasil <- periksa_alur(rec, lat, uji)
  interpretasi: |
    Fungsi pemeriksa memakai stopifnot dengan pesan bernama, sehingga kegagalan langsung menunjuk penyebabnya alih-alih menampilkan ekspresi yang gagal. Ambang satu per sepuluh pangkat delapan dipakai karena pembakuan tidak menghasilkan nol persis akibat keterbatasan ketelitian mesin. Untuk keputusan penanganan cacat: kehilangan yang lebih banyak pada kelompok berpendidikan tinggi menandakan MAR sehingga imputasi sebaiknya memperhatikan pendidikan, dengan risiko memperkecil keragaman yang sesungguhnya; pendapatan seratus kali lipat sebaiknya diperiksa kewajarannya lebih dahulu dan bila sah dipertahankan dengan transformasi, sebab membuangnya membiaskan dugaan ke bawah; kategori bertaut dibakukan ejaannya; sedangkan nilai 999 pada skor literasi hampir pasti merupakan sandi nilai hilang dan harus diubah menjadi NA sebelum diimputasi.
- id: L5.D
  points: 10
  solution: 'Membetulkan kode: prapemrosesan sebelum pembagian, urutan langkah, dan prep memakai data
    uji.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |
    suppressPackageStartupMessages({library(recipes); library(rsample)})
    kotor <- read.csv("data/data_kotor.csv", stringsAsFactors = TRUE)

    # (a) dan (b) DIHAPUS: pembakuan dan imputasi tidak boleh dilakukan
    #     sebelum pembagian; keduanya dipindahkan ke dalam resep

    set.seed(2026)
    bagi <- initial_split(kotor, prop = 0.75, strata = target)
    lat <- training(bagi); uji <- testing(bagi)

    # (c) imputasi mendahului pembakuan
    rec <- recipe(target ~ ., data = lat) |>
      step_impute_median(all_numeric_predictors()) |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())

    # (d) prep memakai data LATIH
    siap <- prep(rec, training = lat)
    uji_siap <- bake(siap, new_data = uji)

    # pemeriksaan wajib
    anyNA(bake(siap, new_data = lat))                              # FALSE
    abs(mean(bake(siap, new_data = lat)$umur)) < 1e-8              # TRUE
  interpretasi: |
    Empat kesalahan diperbaiki. Kesalahan (a) dan (b) sama-sama menghitung besaran dari seluruh data sebelum pembagian, sehingga informasi bagian uji ikut memengaruhi hasilnya --- inilah kebocoran, dan keduanya tidak menimbulkan galat sehingga sukar terdeteksi. Kesalahan (c) bersifat teknis: pembakuan atas kolom yang masih memuat NA menghasilkan NA pula, sehingga imputasi berikutnya kehilangan artinya. Kesalahan (d) paling parah akibatnya: mempelajari resep dari data uji berarti seluruh nilai tengah dan simpangan baku berasal dari data yang seharusnya hanya dipakai menilai, sehingga penilaian kinerjanya sama sekali tidak valid.
- id: T5.1
  points: 50
  solution: 'Penugasan: diagnosis cacat, penyusunan resep, pembuktian ketiadaan kebocoran, dan penggabungan.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |
    suppressPackageStartupMessages({library(recipes); library(rsample); library(dplyr)})
    kotor <- read.csv("data/data_kotor.csv", stringsAsFactors = TRUE)

    # 1) diagnosis empat jenis cacat
    cat("NA total:", sum(is.na(kotor)),
        "| baris kembar:", sum(duplicated(kotor)),
        "| id ganda:", sum(duplicated(kotor$id)), "\n")
    num <- names(kotor)[sapply(kotor, is.numeric)]
    pencilan <- sapply(kotor[num], function(x) {
      q <- quantile(x, c(.25,.75), na.rm = TRUE)
      sum(x > q[2] + 1.5*diff(q) | x < q[1] - 1.5*diff(q), na.rm = TRUE)
    })
    print(pencilan)

    # 2) pola nilai hilang: tabel silang keterisian
    for (k in c("wilayah", "pendidikan")) {
      ada <- !is.na(kotor$pendapatan)
      if (any(!ada)) print(round(prop.table(table(kotor[[k]], ada), 1), 3))
    }

    # 3) kemencengan dan skala
    kem <- function(x) { x <- x[!is.na(x)]; mean((x-mean(x))^3)/sd(x)^3 }
    ringkas <- data.frame(
      rata = sapply(kotor[num], mean, na.rm = TRUE),
      sb   = sapply(kotor[num], sd,   na.rm = TRUE),
      kemencengan = sapply(kotor[num], kem))
    print(round(ringkas, 3))

    # 4-5) pembagian dan resep
    set.seed(2026)
    bagi <- initial_split(kotor, prop = 0.75, strata = target)
    lat <- training(bagi); uji <- testing(bagi)
    rec <- recipe(target ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_impute_median(all_numeric_predictors()) |>
      step_impute_mode(all_nominal_predictors()) |>
      step_YeoJohnson(all_numeric_predictors()) |>
      step_other(all_nominal_predictors(), threshold = 0.05) |>
      step_dummy(all_nominal_predictors()) |>
      step_zv(all_predictors()) |>
      step_normalize(all_numeric_predictors())
    siap <- prep(rec, training = lat)
    a <- bake(siap, new_data = lat); b <- bake(siap, new_data = uji)
    cat("latih:", dim(a), "| uji:", dim(b), "| NA:", anyNA(a), anyNA(b), "\n")

    # 6) fungsi pemeriksa
    periksa_alur <- function(a, b) {
      nm <- setdiff(names(a)[sapply(a, is.numeric)], "id")
      stopifnot("NA pada latih" = !anyNA(a), "NA pada uji" = !anyNA(b),
                "kolom beda" = identical(names(a), names(b)),
                "rata latih tidak nol" = all(abs(sapply(a[nm], mean)) < 1e-8))
      message("lolos empat pemeriksaan"); invisible(TRUE)
    }
    periksa_alur(a, b)

    # 7) BUKTI ketiadaan kebocoran
    nm <- setdiff(names(a)[sapply(a, is.numeric)], "id")[1:4]
    round(rbind(latih = sapply(a[nm], mean), uji = sapply(b[nm], mean)), 5)

    # 8) penggabungan dan dua pemeriksaan
    referensi <- read.csv("data/data_referensi.csv", stringsAsFactors = TRUE)
    gab <- lat |> left_join(referensi, by = "wilayah")
    cat("baris tetap:", nrow(gab) == nrow(lat),
        "| gagal berpasangan:", sum(is.na(gab$indeks_wilayah)), "\n")
  interpretasi: |
    Nomor 2 menuntut bukti berupa tabel, bukan pernyataan; bila proporsi keterisian berbeda antar-kelompok maka MAR didukung, tetapi MNAR tetap tidak dapat disingkirkan sebab pemeriksaannya menuntut nilai yang justru tidak teramati. Nomor 7 adalah inti penugasan dan kerap disalahpahami: rata-rata kolom terbakukan pada data uji yang **tidak persis nol** justru merupakan bukti bahwa pembakuannya dipelajari dari data latih saja. Mahasiswa yang melaporkan nilai persis nol pada kedua bagian sesungguhnya sedang melaporkan kebocoran tanpa menyadarinya. Pada nomor 8, tabel referensi aman digabungkan sebelum pembagian karena nilainya berasal dari sumber luar dan tidak diturunkan dari data ini; seandainya kolom indeks wilayah dihitung sebagai rata-rata pendapatan per wilayah dari data yang sama, penggabungan sebelum pembagian justru akan menimbulkan kebocoran.
