exercises:
- id: L7.1
  points: 15
  solution: 'Tingkat Dasar: acuan pembanding, matriks biaya, dan inventarisasi peubah.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |
    proyek <- read.csv("data/data_proyek.csv", stringsAsFactors = TRUE)
    proyek$penerima_bantuan <- factor(proyek$penerima_bantuan,
                                      levels = c("ya", "tidak"))

    prop <- prop.table(table(proyek$penerima_bantuan))
    cat("acuan mayoritas:", round(max(prop), 4), "\n")
    ambang_lama <- quantile(proyek$pengeluaran, 0.2)

    biaya_sp <- 500; biaya_sn <- 5000
    m <- matrix(c(0, biaya_sp, biaya_sn, 0), nrow = 2,
                dimnames = list(dugaan = c("ya","tidak"),
                                sebenarnya = c("ya","tidak")))
    print(m)
    cat("rasio:", biaya_sn / biaya_sp, "\n")

    inv <- data.frame(
      peubah = names(proyek),
      tipe = sapply(proyek, function(x) class(x)[1]),
      hilang = colSums(is.na(proyek)),
      row.names = NULL)
    print(inv, right = FALSE)
  interpretasi: |
    Isian yang benar berturut-turut adalah prop.table, max, quantile, matrix, 2, names, class, dan colSums. Perlu diperhatikan bahwa acuan mayoritas dihitung dari seluruh data atau data latih, tidak pernah dari data uji --- menghitungnya dari data uji berarti memakai informasi yang seharusnya disisihkan. Rasio biaya sepuluh berbanding satu menyatakan bahwa melewatkan kasus dianggap sepuluh kali lebih merugikan, dan angka itu berasal dari kebijakan, bukan dari data.
- id: L7.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: kurva belajar dan perumusan persoalan sendiri.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(parsnip)
      library(workflows); library(yardstick); library(dplyr)})

    set.seed(2026)
    bagi <- initial_split(proyek, prop = 0.75, strata = penerima_bantuan)
    lat <- training(bagi); uji <- testing(bagi)
    rec <- recipe(penerima_bantuan ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())
    wf <- workflow() |> add_recipe(rec) |>
      add_model(logistic_reg() |> set_engine("glm"))

    ukuran <- c(50, 100, 200, 350, 500, nrow(lat))
    kurva <- t(sapply(ukuran, function(m) {
      set.seed(1); s <- lat[sample(nrow(lat), m), ]
      fm <- fit(wf, data = s)
      du <- predict(fm, uji, type = "prob") |>
        bind_cols(uji |> select(penerima_bantuan))
      c(n = m, auc = roc_auc(du, penerima_bantuan, .pred_ya)$.estimate)
    }))
    print(round(kurva, 4))

    plot(kurva[, "n"], kurva[, "auc"], type = "b", pch = 19, lwd = 2,
         col = "#0B6FB4", ylim = c(0.4, 1),
         xlab = "Ukuran data latih", ylab = "ROC-AUC pada data uji",
         main = "Kurva Belajar")
    abline(h = 0.5, col = "#C0392B", lty = 2, lwd = 2)
    abline(h = 0.7, col = "#00A651", lty = 3, lwd = 2)

    # selisih antar-ukuran sebagai petunjuk kedataran
    cat("\nselisih AUC antar-ukuran berturutan:\n")
    print(round(diff(kurva[, "auc"]), 4))
  interpretasi: |
    Selisih AUC antar-ukuran berturutan adalah cara membaca kedataran kurva secara kuantitatif, bukan sekadar dari bentuk gambarnya. Bila selisihnya sudah mendekati nol pada ukuran terbesar, menambah data tidak akan menolong dan usulan pengumpulan data tambahan tidak dapat dibenarkan. Pada data yang peubahnya dibangkitkan saling bebas terhadap sasaran, kurva akan mendatar jauh di bawah sasaran 0,70 --- dan tanggapan yang jujur adalah merevisi sasaran atau mengubah perumusan persoalan, bukan memaksakan model yang lebih rumit. Untuk perumusan persoalan sendiri, ketiga tingkat wajib dituliskan seluruhnya, dan rasio biaya wajib disertai alasan mengapa satu jenis kekeliruan dianggap lebih merugikan.
- id: L7.D
  points: 10
  solution: 'Membetulkan kode: acuan dari data uji, kurva dinilai pada latih, ambang bawaan, dan penanda
    ikut dimodelkan.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(recipes); library(parsnip); library(workflows)
      library(yardstick); library(dplyr)})

    # (a) acuan dihitung dari data latih, bukan data uji
    acuan <- max(prop.table(table(lat$penerima_bantuan)))

    # (d) penanda diubah perannya lebih dahulu
    rec <- recipe(penerima_bantuan ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())
    wf <- workflow() |> add_recipe(rec) |>
      add_model(logistic_reg() |> set_engine("glm"))

    # (b) kurva belajar dinilai pada data UJI yang sama
    kurva <- sapply(c(50, 100, 200), function(m) {
      set.seed(1); s <- lat[sample(nrow(lat), m), ]
      fm <- fit(wf, data = s)
      d <- predict(fm, uji, type = "prob") |>
        bind_cols(uji |> select(penerima_bantuan))
      roc_auc(d, penerima_bantuan, .pred_ya)$.estimate
    })

    # (c) ambang dipilih berdasarkan biaya
    model <- fit(wf, data = lat)
    du <- predict(model, uji, type = "prob") |>
      bind_cols(uji |> select(penerima_bantuan))
    biaya_sp <- 500; biaya_sn <- 5000
    ambang <- seq(0.05, 0.95, by = 0.05)
    biaya <- sapply(ambang, function(t) {
      dg <- ifelse(du$.pred_ya > t, "ya", "tidak")
      sum(dg == "ya" & du$penerima_bantuan == "tidak") * biaya_sp +
        sum(dg == "tidak" & du$penerima_bantuan == "ya") * biaya_sn
    })
    t_terbaik <- ambang[which.min(biaya)]

    # pemeriksaan wajib
    t_terbaik != 0.5
    "id" %in% names(bake(prep(rec, training = lat), new_data = NULL))
  interpretasi: |
    Empat kesalahan diperbaiki. Kesalahan (a) memakai data uji untuk menetapkan acuan, yang berarti informasi data uji sudah ikut memengaruhi perencanaan. Kesalahan (b) paling menyesatkan: kurva belajar yang dinilai pada data latih akan selalu menanjak atau tetap tinggi, sehingga tidak dapat menjawab pertanyaan apakah datanya cukup. Kesalahan (c) membiarkan ambang pada nilai bawaan padahal biaya kekeliruannya jauh dari simetris, sehingga peluang penghematan terbesar terlewat begitu saja. Kesalahan (d) membiarkan penanda ikut dimodelkan; pada data yang penandanya berurutan, model dapat tampak sangat baik semata karena menghafal nomor --- kekeliruan yang tidak menimbulkan galat sama sekali.
- id: T7.1
  points: 50
  solution: 'Penugasan: proposal proyek lengkap berdasarkan kerangka CRISP-DM.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(recipes); library(rsample); library(parsnip)
      library(workflows); library(yardstick); library(dplyr)})
    proyek <- read.csv("data/data_proyek.csv", stringsAsFactors = TRUE)
    proyek$penerima_bantuan <- factor(proyek$penerima_bantuan,
                                      levels = c("ya", "tidak"))

    # 1) rumusan bertingkat
    print(data.frame(
      tingkat = c("Kebutuhan", "Pertanyaan", "Tugas teknis", "Pengguna", "Pemakaian"),
      isi = c("bantuan sering tidak tepat sasaran",
              "rumah tangga mana yang paling mungkin layak?",
              "klasifikasi biner, dinilai dengan recall",
              "unit penyaluran bantuan",
              "menyaring daftar calon sebelum verifikasi lapangan")),
      right = FALSE)

    # 2) dua acuan
    prop <- prop.table(table(proyek$penerima_bantuan))
    ambang_lama <- quantile(proyek$pengeluaran, 0.2)
    aturan <- factor(ifelse(proyek$pengeluaran <= ambang_lama, "ya", "tidak"),
                     levels = c("ya", "tidak"))
    cm_lama <- table(duga = aturan, benar = proyek$penerima_bantuan)
    recall_lama <- cm_lama[1, 1] / sum(cm_lama[, 1])
    cat("acuan mayoritas:", round(max(prop), 4),
        "| recall aturan lama:", round(recall_lama, 4), "\n")

    # 4) inventarisasi
    inv <- data.frame(peubah = names(proyek),
                      tipe = sapply(proyek, function(x) class(x)[1]),
                      hilang = colSums(is.na(proyek)),
                      unik = sapply(proyek, function(x) length(unique(x))),
                      row.names = NULL)
    inv$peran <- c("penanda", rep("prediktor", 7), "sasaran")
    print(inv, right = FALSE)

    # 5) kurva belajar
    set.seed(2026)
    bagi <- initial_split(proyek, prop = 0.75, strata = penerima_bantuan)
    lat <- training(bagi); uji <- testing(bagi)
    rec <- recipe(penerima_bantuan ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())
    wf <- workflow() |> add_recipe(rec) |>
      add_model(logistic_reg() |> set_engine("glm"))
    ukuran <- c(50, 100, 200, 350, 500, nrow(lat))
    kurva <- t(sapply(ukuran, function(m) {
      set.seed(1); s <- lat[sample(nrow(lat), m), ]
      du <- predict(fit(wf, data = s), uji, type = "prob") |>
        bind_cols(uji |> select(penerima_bantuan))
      c(n = m, auc = roc_auc(du, penerima_bantuan, .pred_ya)$.estimate)
    }))
    print(round(kurva, 4))

    # 6) biaya dan ambang
    model <- fit(wf, data = lat)
    du <- predict(model, uji, type = "prob") |>
      bind_cols(uji |> select(penerima_bantuan))
    biaya_sp <- 500; biaya_sn <- 5000
    ambang <- seq(0.05, 0.95, by = 0.05)
    biaya <- sapply(ambang, function(t) {
      dg <- ifelse(du$.pred_ya > t, "ya", "tidak")
      sum(dg == "ya" & du$penerima_bantuan == "tidak") * biaya_sp +
        sum(dg == "tidak" & du$penerima_bantuan == "ya") * biaya_sn
    })
    t_baik <- ambang[which.min(biaya)]
    cat("ambang terbaik:", t_baik, "| penghematan:",
        round(100 * (biaya[ambang == 0.5] - min(biaya)) / biaya[ambang == 0.5], 1),
        "persen\n")

    # 10) keadilan antar-kelompok
    du$wilayah <- uji$wilayah
    du$dg <- factor(ifelse(du$.pred_ya > t_baik, "ya", "tidak"),
                    levels = c("ya", "tidak"))
    adil <- do.call(rbind, lapply(levels(du$wilayah), function(w) {
      s <- du[du$wilayah == w, ]
      cm <- table(duga = s$dg, benar = s$penerima_bantuan)
      data.frame(wilayah = w, n = nrow(s),
                 ditandai = round(mean(s$dg == "ya"), 4),
                 recall = round(cm[1, 1] / max(sum(cm[, 1]), 1), 4))
    }))
    print(adil, right = FALSE)
  interpretasi: |
    Nomor 2 adalah bagian yang paling menentukan mutu proposal: acuan aturan lama jauh lebih bermakna daripada acuan mayoritas, sebab itulah pesaing sesungguhnya. Bila model tidak melampaui aturan sederhana yang sudah berjalan, penggantiannya tidak dapat dibenarkan betapapun canggihnya. Nomor 5 menuntut kejujuran: pada data simulasi ini kurva akan mendatar rendah, dan tanggapan yang benar adalah merevisi sasaran pada proposal, bukan menyembunyikan temuan itu. Nomor 6 memperlihatkan bahwa penghematan terbesar kerap datang dari keputusan ambang, bukan dari pemilihan model. Nomor 10 wajib dilaporkan apa adanya; selisih kinerja antar-wilayah yang besar berarti penerapan model akan memperlebar ketimpangan, dan temuan itu harus disampaikan meski melemahkan usulan sendiri. Ringkasan eksekutif wajib menegaskan bahwa data merupakan simulasi sehingga seluruh angka kinerja tidak menggambarkan keadaan sebenarnya.
