    6. Dokumentasi LightGBM: https://lightgbm.readthedocs.io
  contoh:
  - contoh: Menelaah data dan menyiapkan acuan
    narasi: |-
      \kode{struktur data dan regresi logistik sebagai pembanding}

      ```{r}
      suppressPackageStartupMessages(library(lightgbm))
      rt <- read.csv("data/penerima_manfaat.csv", stringsAsFactors = TRUE)
      str(rt, give.attr = FALSE)
      cat("baris:", nrow(rt), " kabupaten:", nlevels(rt$kabupaten),
          " proporsi penerima:", round(mean(rt$penerima), 4), "\n")

      fitur <- c("kabupaten", "lama_sekolah", "umur_krt", "anggota_rt",
                 "luas_lantai", "jenis_pekerjaan", "punya_aset")
      set.seed(2026)
      i_latih <- sample(nrow(rt), 0.75 * nrow(rt))
      latih <- rt[i_latih, ]; uji <- rt[-i_latih, ]
      y_uji <- uji$penerima

      auc <- function(y, p) {                       # AUC lewat statistik Mann-Whitney
        r <- rank(p); n1 <- sum(y == 1); n0 <- sum(y == 0)
        (sum(r[y == 1]) - n1 * (n1 + 1) / 2) / (n1 * n0)
      }

      waktu_glm <- system.time(
        glm_acuan <- glm(penerima ~ ., data = latih[, c(fitur, "penerima")],
                         family = binomial, model = FALSE, y = FALSE))[["elapsed"]]
      p_glm <- predict(glm_acuan, uji, type = "response")
      cat("regresi logistik -- waktu:", round(waktu_glm, 2), "detik  AUC:",
          round(auc(y_uji, p_glm), 4), "\n")
      cat("banyaknya koefisien yang ditaksir:", length(coef(glm_acuan)), "\n")
      rm(glm_acuan); invisible(gc())        # bebaskan memori
      ```

      \begin{kotakinterpretasi}
      Data memuat \textbf{40.000 rumah tangga} di \textbf{120 kabupaten}, dengan \textbf{11,8\%} berstatus penerima --- kelas yang jelas tidak seimbang.

      Acuannya adalah regresi logistik dengan seluruh peubah. Perhatikan angka terakhir: ia menaksir \textbf{126 koefisien}, sebab peubah \texttt{kabupaten} sendiri memakan 119 kolom boneka. Inilah persoalan kardinalitas tinggi --- model linear terpaksa memberi satu parameter bagi tiap kabupaten, padahal sebagian kabupaten hanya memuat sedikit amatan.

      AUC-nya \textbf{0,775}. Angka ini akan menjadi pembanding sepanjang modul. Menyajikan AUC sebuah model tanpa acuan seperti ini tidak bermakna: yang penting bukan "0,83 itu bagus" melainkan "0,83 dibandingkan 0,775 dari model yang jauh lebih sederhana".
      \end{kotakinterpretasi}
  - contoh: Melatih LightGBM
    narasi: |-
      \kode{lgb.Dataset dan lgb.train}

      ```{r}
      # LightGBM menerima matriks numerik; kategori diserahkan sebagai indeks integer
      sebagai_matriks <- function(d) {
        m <- d[, fitur]
        m$kabupaten       <- as.integer(m$kabupaten) - 1L
        m$jenis_pekerjaan <- as.integer(m$jenis_pekerjaan) - 1L
        as.matrix(m)
      }
      X_latih <- sebagai_matriks(latih); X_uji <- sebagai_matriks(uji)

      par <- list(objective = "binary", metric = "auc", learning_rate = 0.03,
                  num_leaves = 63, min_data_in_leaf = 40, feature_fraction = 0.8,
                  bagging_fraction = 0.8, bagging_freq = 1, cat_smooth = 10, verbose = -1)

      d_latih <- lgb.Dataset(X_latih, label = latih$penerima,
                             categorical_feature = c("kabupaten", "jenis_pekerjaan"))
      waktu_lgb <- system.time(
        model_awal <- lgb.train(params = par, data = d_latih, nrounds = 111))[["elapsed"]]

      cat("LightGBM -- waktu:", round(waktu_lgb, 2), "detik  AUC:",
          round(auc(y_uji, predict(model_awal, X_uji)), 4), "\n")
      cat("banyaknya kolom masukan:", ncol(X_latih), "\n")
      ```

      \begin{kotakinterpretasi}
      LightGBM memberi AUC \textbf{0,828} berbanding \textbf{0,775} milik regresi logistik --- perbaikan yang berarti. Dan ia melakukannya dengan \textbf{7 kolom} masukan, bukan 126: peubah \texttt{kabupaten} tetap satu kolom karena ditangani langsung sebagai kategorik.

      Waktu latihnya pun jauh lebih singkat meskipun membangun ratusan pohon, sementara regresi logistik hanya menaksir satu himpunan koefisien. Pada \$n = 40.000\$ selisihnya sudah terasa; pada jutaan baris, selisih itulah yang menentukan apakah analisis dapat dijalankan berulang kali dalam sehari atau tidak.

      Perlu ditegaskan bahwa keunggulan ini \textbf{bukan hukum alam}. Data pada modul ini sengaja dibangkitkan dengan hubungan yang penuh ambang dan interaksi --- keadaan yang menguntungkan model berbasis pohon. Bila hubungan sesungguhnya mendekati linear dalam log-odds, regresi logistik dapat menyamai atau bahkan mengungguli LightGBM, dengan bonus koefisien yang dapat ditafsirkan. \textbf{Selalu jalankan acuannya.}
      \end{kotakinterpretasi}
  - contoh: Menentukan banyaknya iterasi dengan validasi silang
    narasi: |-
      \kode{lgb.cv dengan penghentian dini}

      ```{r}
      set.seed(2026)
      cv <- lgb.cv(params = par, data = d_latih, nrounds = 2000, nfold = 5,
                   early_stopping_rounds = 50, verbose = -1)
      cat("iterasi terbaik:", cv$best_iter, " AUC validasi silang:",
          round(cv$best_score, 4), "\n")

      model <- lgb.train(params = par, data = d_latih, nrounds = cv$best_iter)
      p_lgb <- predict(model, X_uji)
      cat("AUC data uji:", round(auc(y_uji, p_lgb), 4), "\n")

      # perbandingan: iterasi jauh lebih banyak
      model_lebih <- lgb.train(params = par, data = d_latih, nrounds = 1500)
      cat("AUC dengan 1500 iterasi:", round(auc(y_uji, predict(model_lebih, X_uji)), 4), "\n")
      rm(model_lebih); invisible(gc())
      ```

      \begin{kotakinterpretasi}
      Validasi silang lima lipat berhenti pada \textbf{111 iterasi} dengan AUC \$0{,}823\$; pada data uji AUC-nya \textbf{0,828} --- sangat dekat, pertanda penalaannya tidak lewat-suai terhadap lipatan validasi.

      Baris terakhir memperlihatkan mengapa penghentian dini penting. Dengan 1.500 iterasi --- lebih dari tiga belas kali lipat --- AUC pada data uji \textbf{tidak membaik}, malah cenderung menurun. Boosting akan terus menambah pohon selama diminta, dan pohon-pohon terakhir itu hanya menghafal derau data latih.

      Kaidahnya: \textbf{jangan pernah menetapkan \texttt{nrounds} dengan menebak}. Selalu pakai validasi silang dengan penghentian dini, lalu latih ulang pada seluruh data latih dengan banyaknya iterasi yang terpilih.
      \end{kotakinterpretasi}
  - contoh: Kategorik langsung dibandingkan pengodean boneka
    narasi: |-
      \kode{dua cara menangani 120 kabupaten}

      ```{r}
      # (a) kategorik ditangani langsung -- sudah dilakukan pada model di atas
      # (b) pengodean boneka (one-hot)
      boneka <- model.matrix(~ . - 1, data = rt[, fitur])
      cat("kolom setelah pengodean boneka:", ncol(boneka), "\n")

      d_boneka <- lgb.Dataset(boneka[i_latih, ], label = latih$penerima)
      waktu_boneka <- system.time(
        model_boneka <- lgb.train(params = par, data = d_boneka,
                                  nrounds = cv$best_iter))[["elapsed"]]

      hasil_kat <- data.frame(
        penanganan = c("kategorik langsung", "pengodean boneka"),
        kolom      = c(ncol(X_latih), ncol(boneka)),
        AUC        = round(c(auc(y_uji, p_lgb),
                             auc(y_uji, predict(model_boneka, boneka[-i_latih, ]))), 4))
      rm(boneka, d_boneka, model_boneka); invisible(gc())
      hasil_kat
      ```

      \begin{kotakinterpretasi}
      Penanganan langsung memberi AUC \textbf{0,828} dengan \textbf{7 kolom}; pengodean boneka memberi \textbf{0,823} dengan \textbf{129 kolom}.

      Selisih AUC-nya kecil, tetapi selisih \textbf{struktur}-nya besar dan berdampak pada data yang lebih besar. Dengan pengodean boneka, tiap kabupaten menjadi kolom biner yang hampir seluruhnya nol; pohon harus memecah kolom-kolom itu satu per satu untuk memisahkan sekelompok kabupaten. Dengan penanganan langsung, LightGBM mengurutkan kategori menurut statistik gradiennya lalu memecahnya menjadi \textbf{dua himpunan sekaligus} --- satu pecahan dapat memisahkan 40 kabupaten dari 80 lainnya.

      Peringatan yang menyertainya: penanganan langsung ini \textbf{rawan lewat-suai} pada kategori berfrekuensi kecil, sebab pengurutan menurut gradien dapat mengejar derau. Parameter \texttt{cat\_smooth} --- di sini 10 --- meredamnya dengan menarik statistik kategori kecil ke arah rata-rata keseluruhan. Naikkan nilainya bila banyak kategori beranggota sedikit.
      \end{kotakinterpretasi}
  - contoh: Menangani ketidakseimbangan kelas
    narasi: |-
      \kode{Pembobotan kelas dibandingkan penggeseran ambang}

      ```{r}
      w <- sum(latih$penerima == 0) / sum(latih$penerima == 1)
      cat("nisbah kelas negatif terhadap positif:", round(w, 3), "\n")

      par_bobot <- par; par_bobot$scale_pos_weight <- w
      model_bobot <- lgb.train(params = par_bobot, data = d_latih, nrounds = cv$best_iter)
      p_bobot <- predict(model_bobot, X_uji)

      f1 <- function(y, p, th) {
        pred <- as.integer(p > th); tp <- sum(pred == 1 & y == 1)
        if (tp == 0) return(0)
        prec <- tp / sum(pred == 1); rec <- tp / sum(y == 1)
        2 * prec * rec / (prec + rec)
      }
      ambang <- seq(0.05, 0.95, by = 0.01)
      f1_tanpa <- sapply(ambang, function(t) f1(y_uji, p_lgb, t))

      data.frame(
        model  = c("tanpa bobot, ambang 0,5", "dengan bobot, ambang 0,5",
                   "tanpa bobot, ambang terbaik"),
        rerata_peluang = round(c(mean(p_lgb), mean(p_bobot), mean(p_lgb)), 3),
        F1  = round(c(f1(y_uji, p_lgb, 0.5), f1(y_uji, p_bobot, 0.5), max(f1_tanpa)), 4),
        AUC = round(c(auc(y_uji, p_lgb), auc(y_uji, p_bobot), auc(y_uji, p_lgb)), 4))
      cat("ambang terbaik:", ambang[which.max(f1_tanpa)], "\n")

      par(family = "sans", mar = c(4, 4, 1, 1))
      plot(ambang, f1_tanpa, type = "l", lwd = 2, col = "#0B6FB4",
           xlab = "ambang keputusan", ylab = "F1")
      abline(v = ambang[which.max(f1_tanpa)], lty = 2, col = "#F58220", lwd = 2)
      abline(v = 0.5, lty = 3, col = "grey40")
      ```

      \begin{kotakinterpretasi}
      Kelas positif hanya \$11{,}8\%\$, sehingga tiap positif "bernilai" \$7{,}64\$ negatif. Dua cara lazim menanganinya dibandingkan di sini, dan hasilnya mengandung kejutan.

      \textbf{Pembobotan} (\texttt{scale\_pos\_weight}) menaikkan F1 pada ambang \$0{,}5\$ dari \$0{,}330\$ menjadi \$0{,}436\$. Cara kerjanya bukan membuat model "lebih pintar" melainkan \textbf{menggeser skala peluangnya}: rata-rata peluang ramalan melonjak dari \$0{,}118\$ ke \$0{,}330\$, sehingga lebih banyak amatan melewati ambang \$0{,}5\$.

      \textbf{Menggeser ambang} pada model tanpa bobot memberi F1 \textbf{0,478} pada ambang \$0{,}21\$ --- \textbf{lebih baik} daripada pembobotan, tanpa melatih ulang apa pun.

      Dan perhatikan kolom AUC: ketiganya \textbf{praktis sama}. AUC mengukur kemampuan \textbf{mengurutkan}, dan baik pembobotan maupun penggeseran ambang tidak mengubah urutan --- keduanya hanya memindahkan garis potong.

      Kesimpulan praktisnya penting: bila persoalannya semata-mata ketidakseimbangan, \textbf{latih model apa adanya lalu tala ambangnya pada data validasi}. Pembobotan baru diperlukan ketika biaya kekeliruan sungguh berbeda dan hendak dimasukkan ke dalam proses pelatihan, atau ketika kelas positifnya sangat langka (di bawah 1\%) sehingga gradiennya tenggelam.

      Perlu ditegaskan pula: ambang \$0{,}21\$ di atas dipilih pada \textbf{data uji}, semata untuk peragaan. Pada pekerjaan sungguhan ambang harus ditala pada \textbf{data validasi terpisah}, sebab menalanya pada data uji membuat angka F1 yang dilaporkan menjadi optimistis.
      \end{kotakinterpretasi}
  - contoh: Menafsirkan pentingnya peubah
    narasi: |-
      \kode{lgb.importance}

      ```{r}
      imp <- lgb.importance(model)
      print(imp)

      par(family = "sans", mar = c(4, 8, 1, 1))
      barplot(rev(imp$Gain), names.arg = rev(imp$Feature), horiz = TRUE, las = 1,
              col = "#0B6FB4", border = NA, xlab = "gain (proporsi)")
      ```

      \begin{kotakinterpretasi}
      Tiga ukuran dilaporkan. \textbf{Gain} adalah total penurunan kerugian dari seluruh pecahan yang memakai peubah itu --- inilah yang paling lazim dipakai. \textbf{Cover} adalah banyaknya amatan yang terpengaruh, dan \textbf{Frequency} adalah cacah pecahan.

      \texttt{kabupaten} menempati urutan pertama menurut gain. Pembacaannya harus hati-hati: sebagian besar gain itu berasal dari \textbf{efek kabupaten} yang memang ditanam saat pembangkitan data, tetapi peubah berkardinalitas tinggi juga secara struktural \textbf{cenderung memperoleh gain tinggi} --- ia menawarkan lebih banyak calon pecahan daripada peubah biner seperti \texttt{punya\_aset}. Kedua sebab itu bercampur dan tidak dapat dipisahkan dari tabel ini saja.

      Tiga peringatan yang wajib menyertai setiap laporan pentingnya peubah:

      \begin{enumerate}
      \item Ia \textbf{bukan ukuran sebab-akibat}. Peubah dapat penting semata karena berkorelasi dengan penyebab sesungguhnya yang tidak terekam.
      \item Ia \textbf{berat sebelah} terhadap peubah berkardinalitas tinggi dan peubah kontinu.
      \item Ia \textbf{tidak menunjukkan arah}. Tabel ini tidak memberi tahu apakah lama sekolah tinggi menaikkan atau menurunkan peluang. Untuk itu diperlukan alat seperti \emph{partial dependence} atau nilai SHAP.
      \end{enumerate}
      \end{kotakinterpretasi}

      # Alur yang Sama dengan Python

      Bagian ini mengulang analisis di atas dengan Python, membaca **berkas data yang sama**.
  - contoh: LightGBM dengan Python
    narasi: |-
      \kode[Python]{penyiapan, validasi silang, dan penilaian}

      ```{python}
      import numpy as np, pandas as pd, lightgbm as lgb, time
      from sklearn.metrics import roc_auc_score

      rt = pd.read_csv("data/penerima_manfaat.csv")
      for c in ["kabupaten", "jenis_pekerjaan"]:
          rt[c] = rt[c].astype("category")          # kategori ditangani langsung
      fitur = ["kabupaten", "lama_sekolah", "umur_krt", "anggota_rt",
               "luas_lantai", "jenis_pekerjaan", "punya_aset"]
      X, y = rt[fitur], rt["penerima"].values

      rng = np.random.default_rng(2026)
      idx = rng.permutation(len(rt)); n_tr = int(0.75 * len(rt))
      tr, te = idx[:n_tr], idx[n_tr:]

      par = {"objective": "binary", "metric": "auc", "learning_rate": 0.03,
             "num_leaves": 63, "min_data_in_leaf": 40, "feature_fraction": 0.8,
             "bagging_fraction": 0.8, "bagging_freq": 1, "cat_smooth": 10,
             "verbose": -1, "seed": 2026}

      d_tr = lgb.Dataset(X.iloc[tr], label=y[tr],
                         categorical_feature=["kabupaten", "jenis_pekerjaan"])
      cv = lgb.cv(par, d_tr, num_boost_round=2000, nfold=5, stratified=True,
                  callbacks=[lgb.early_stopping(50, verbose=False)])
      k = len(cv["valid auc-mean"])
      print("iterasi terbaik:", k, " AUC validasi silang:", round(cv["valid auc-mean"][-1], 4))

      t0 = time.time(); model = lgb.train(par, d_tr, num_boost_round=k)
      print("waktu latih:", round(time.time() - t0, 2), "detik")
      print("AUC data uji:", round(roc_auc_score(y[te], model.predict(X.iloc[te])), 4))
      ```

      \begin{kotakinterpretasi}
      Python berhenti pada \textbf{92 iterasi} dengan AUC validasi silang \$0{,}823\$ dan AUC data uji \textbf{0,826}; R berhenti pada 111 iterasi dengan AUC uji \$0{,}828\$.

      Perbedaan banyaknya iterasi ini \textbf{wajar dan tidak menandakan kekeliruan}. Dua sebabnya: pembagian latih--uji berbeda karena \texttt{sample()} pada R dan \texttt{numpy} pada Python memakai pembangkit bilangan acak yang berlainan meskipun benihnya sama-sama 2026; dan pembentukan lipatan validasi silangnya pun berbeda --- Python di sini memakai \texttt{stratified=True} sedangkan \texttt{lgb.cv} pada R tidak menstratifikasi secara bawaan.

      Yang penting adalah \textbf{kesimpulannya sama}: AUC sekitar \$0{,}82\$--\$0{,}83\$, jauh di atas acuan regresi logistik \$0{,}775\$. Bila hasil kedua bahasa harus benar-benar identik, pembagian data harus dibuat sekali lalu disimpan ke berkas dan dibaca oleh keduanya.

      \textbf{Perbedaan penamaan:} Python memakai \texttt{num\_boost\_round} (R: \texttt{nrounds}), \texttt{lgb.train()} (R: \texttt{lgb.train()} juga), dan menyerahkan penghentian dini lewat \texttt{callbacks} (R: argumen \texttt{early\_stopping\_rounds}). Python dapat menerima \texttt{DataFrame} dengan kolom bertipe \texttt{category} secara langsung, sedangkan R menuntut matriks numerik dengan kategori diubah menjadi indeks integer --- perbedaan yang paling sering menjadi sumber galat bagi pemula.
      \end{kotakinterpretasi}

      \begin{kotaksalah}
      \begin{enumerate}
      \item Menetapkan \texttt{nrounds} dengan menebak, tanpa validasi silang beserta penghentian dini.
      \item Menaikkan \texttt{num\_leaves} tanpa menaikkan \texttt{min\_data\_in\_leaf}; inilah resep lewat-suai yang paling sering dijumpai.
      \item Melaporkan AUC tanpa \textbf{acuan}; angka $0{,}83$ tidak bermakna sebelum dibandingkan dengan model sederhana.
      \item Membuat kolom boneka bagi peubah berkardinalitas tinggi padahal LightGBM dapat menanganinya langsung.
      \item Memakai \texttt{scale\_pos\_weight} padahal yang diperlukan hanya menggeser ambang; keduanya tidak mengubah AUC.
      \item Menala ambang pada \textbf{data uji} lalu melaporkan hasilnya sebagai ketepatan; ambang harus ditala pada data validasi.
      \item Menafsirkan pentingnya peubah sebagai hubungan sebab-akibat, atau sebagai arah pengaruh.
      \item Membandingkan hasil R dan Python lalu menyimpulkan salah satunya keliru padahal pembagian datanya berbeda.
      \item Memakai \texttt{accuracy} sebagai ukuran pada data tidak seimbang; menebak seluruhnya negatif sudah memberi $88\%$.
      \end{enumerate}
      \end{kotaksalah}

