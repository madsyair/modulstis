  teori:
  - '## Gradient Boosting Ringkas'
  - |-
    \begin{kotakrumus}
    Boosting membangun ansambel secara berurutan:
    \[
    F_m(\mathbf{x}) = F_{m-1}(\mathbf{x}) + \eta \, h_m(\mathbf{x})
    \]
    dengan $h_m$ pohon ke-$m$ yang dicocokkan pada \textbf{gradien negatif} fungsi kerugian terhadap $F_{m-1}$, dan $\eta$ \textbf{laju belajar}. Untuk klasifikasi biner, kerugiannya log-loss dan gradiennya adalah selisih antara label dan peluang ramalan.
    \end{kotakrumus}
  - '## Tiga Gagasan LightGBM'
  - |-
    \begin{kotakinfo}[Apa yang membuat LightGBM cepat]\par\smallskip
    \begin{tabular}{@{}p{4.0cm}p{10.8cm}@{}}
    \textbf{Gagasan} & \textbf{Isi}\\
    \hline
    Tumbuh \textbf{per daun} & Pohon lain tumbuh per tingkat --- seluruh daun dipecah bersama. LightGBM memilih \emph{satu} daun dengan penurunan kerugian terbesar. Pada anggaran daun yang sama, kerugiannya turun lebih cepat, tetapi pohonnya menjadi dalam dan tak seimbang sehingga rawan lewat-suai bila \texttt{num\_leaves} terlalu besar.\\[3pt]
    \textbf{Histogram} & Nilai tiap peubah numerik dibin menjadi 255 keranjang. Pencarian titik pecah lalu berjalan pada histogram, bukan pada nilai asli --- biaya turun dari $O(n)$ menjadi $O(\#\text{bin})$ per peubah, dan memorinya jauh lebih kecil.\\[3pt]
    \textbf{Kategorik langsung} & Peubah kategorik tidak perlu diubah menjadi kolom boneka. Kategori diurutkan menurut statistik gradiennya, lalu dipecah menjadi dua himpunan --- sehingga 120 kabupaten tetap satu kolom, bukan 119 kolom.\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotakrumus}
    Dua gagasan tambahan pada makalah aslinya: \textbf{GOSS} (\emph{Gradient-based One-Side Sampling}) yang menyimpan seluruh amatan bergradien besar dan menarik sampel dari sisanya; dan \textbf{EFB} (\emph{Exclusive Feature Bundling}) yang menggabungkan peubah renggang yang jarang tak-nol bersamaan menjadi satu kolom.
    \end{kotakrumus}
  - |-
    \begin{kotakperhatian}[Parameter yang paling menentukan]
    \texttt{num\_leaves} mengendalikan kelenturan --- inilah parameter terpenting pada LightGBM, bukan \texttt{max\_depth}. Kaidah praktis: \texttt{num\_leaves} $< 2^{\texttt{max\_depth}}$. Nilai besar disertai \texttt{min\_data\_in\_leaf} kecil adalah resep lewat-suai yang paling sering dijumpai.
    \end{kotakperhatian}
  - |-
    \begin{kotaktujuan}
    \textbf{Alur praktikum Modul 15}
    \begin{enumerate}
    \item Menelaah data dan menyiapkan acuan (regresi logistik).
    \item Melatih LightGBM dan membandingkan waktu serta AUC.
    \item Menala banyaknya iterasi dengan validasi silang.
    \item Membandingkan penanganan kategorik langsung dan pengodean boneka.
    \item Menangani ketidakseimbangan kelas: bobot versus ambang.
    \item Menafsirkan pentingnya peubah.
    \item Mengulang seluruhnya dengan Python.
    \end{enumerate}
    \end{kotaktujuan}
