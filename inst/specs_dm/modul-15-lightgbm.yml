  kunci:
  - '# Kunci Jawaban Latihan Mandiri'
  - |-
    ```{r siap}
    suppressPackageStartupMessages(library(lightgbm))
    rt <- read.csv("data/penerima_manfaat.csv", stringsAsFactors = TRUE)
    fitur <- c("kabupaten","lama_sekolah","umur_krt","anggota_rt",
               "luas_lantai","jenis_pekerjaan","punya_aset")
    set.seed(2026); i <- sample(nrow(rt), 0.75 * nrow(rt))
    latih <- rt[i, ]; uji <- rt[-i, ]; y_uji <- uji$penerima
    mk <- function(d) { m <- d[, fitur]
      m$kabupaten <- as.integer(m$kabupaten) - 1L
      m$jenis_pekerjaan <- as.integer(m$jenis_pekerjaan) - 1L; as.matrix(m) }
    X_latih <- mk(latih); X_uji <- mk(uji)
    auc <- function(y, p) { r <- rank(p); n1 <- sum(y == 1); n0 <- sum(y == 0)
      (sum(r[y == 1]) - n1 * (n1 + 1) / 2) / (n1 * n0) }
    dasar <- list(objective = "binary", metric = "auc", learning_rate = 0.03,
                  min_data_in_leaf = 40, feature_fraction = 0.8, bagging_fraction = 0.8,
                  bagging_freq = 1, cat_smooth = 10, verbose = -1,
                  feature_pre_filter = FALSE)   # agar min_data_in_leaf boleh diubah
    kat <- c("kabupaten", "jenis_pekerjaan")
    d_latih <- lgb.Dataset(X_latih, label = latih$penerima, categorical_feature = kat)
    ```
  - '## Kunci Latihan 15.1 -- Menala Parameter'
  - |-
    ```{r k1}
    set.seed(2026)
    hasil <- do.call(rbind, lapply(c(15, 63, 255), function(nl) {
      p <- dasar; p$num_leaves <- nl
      cv <- lgb.cv(params = p, data = d_latih, nrounds = 2000, nfold = 5,
                   early_stopping_rounds = 50, verbose = -1)
      m <- lgb.train(params = p, data = d_latih, nrounds = cv$best_iter)
      data.frame(num_leaves = nl, iterasi = cv$best_iter,
                 AUC_cv = round(cv$best_score, 4),
                 AUC_uji = round(auc(y_uji, predict(m, X_uji)), 4))
    }))
    print(hasil, row.names = FALSE)
  - |-
    set.seed(2026)
    hasil2 <- do.call(rbind, lapply(c(20, 200), function(md) {
      p <- dasar; p$num_leaves <- 255; p$min_data_in_leaf <- md
      d_md <- lgb.Dataset(X_latih, label = latih$penerima, categorical_feature = kat)
      cv <- lgb.cv(params = p, data = d_md, nrounds = 2000, nfold = 5,
                   early_stopping_rounds = 50, verbose = -1)
      m <- lgb.train(params = p, data = d_md, nrounds = cv$best_iter)
      data.frame(min_data_in_leaf = md, iterasi = cv$best_iter,
                 AUC_uji = round(auc(y_uji, predict(m, X_uji)), 4))
    }))
    print(hasil2, row.names = FALSE)
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(a)} Hasilnya: \texttt{num\_leaves} 15 memerlukan \textbf{178} iterasi, sedangkan 63 dan 255 hanya 71 dan 73. Pola yang diharapkan muncul --- pohon yang lebih lentur menurunkan kerugian lebih cepat sehingga iterasinya lebih sedikit --- tetapi tidak berbanding lurus: dari 63 ke 255 iterasinya praktis sama.
  - 'AUC data ujinya berdekatan ($0{,}827$; $0{,}829$; $0{,}825$), dengan yang tertinggi pada 63 dan yang
    terendah pada 255. Kesimpulan yang benar: menaikkan \texttt{num\_leaves} melampaui titik tertentu
    \textbf{tidak menambah apa pun} dan mulai merugikan. Mahasiswa yang menyimpulkan ``makin besar makin
    baik'''' dari selisih sekecil ini dikenai pengurangan nilai --- selisih $0{,}004$ pada satu pembagian
    data tidak cukup untuk menyimpulkan apa pun.'
  - \textbf{(b)} Pada \texttt{num\_leaves} 255, menaikkan \texttt{min\_data\_in\_leaf} dari 20 ke 200
    menaikkan AUC dari $0{,}823$ menjadi $\mathbf{0{,}829}$ --- \textbf{menolong}. Ia menghalangi terbentuknya
    daun berisi segelintir amatan, yakni daun yang paling mungkin sekadar menghafal derau. Perhatikan
    bahwa \texttt{feature\_pre\_filter = FALSE} wajib disetel bila \texttt{min\_data\_in\_leaf} hendak
    diubah-ubah pada objek \texttt{lgb.Dataset} yang sama; tanpa itu LightGBM menolak dengan pesan galat.
  - |-
    \textbf{(c)} Ketiga parameter bekerja bersama. \texttt{num\_leaves} menetapkan kelenturan maksimum; \texttt{min\_data\_in\_leaf} membatasi seberapa halus pohon boleh memecah; \texttt{learning\_rate} menentukan seberapa besar sumbangan tiap pohon, dan bersama penghentian dini menentukan banyaknya iterasi. Menaikkan salah satunya hampir selalu menuntut penyesuaian yang lain --- \textbf{tidak ada nilai bawaan yang baik untuk semua data}. Jawaban yang menyimpulkan ketergantungan ini memperoleh nilai penuh.
    \end{kotakkunci}
  - '## Kunci Latihan 15.2 -- Kategorik dan Kardinalitas'
  - |-
    ```{r k2}
    p63 <- dasar; p63$num_leaves <- 63
    tanpa_kab <- setdiff(fitur, "kabupaten")                                   # (a)
    mk2 <- function(d) { m <- d[, tanpa_kab]
      m$jenis_pekerjaan <- as.integer(m$jenis_pekerjaan) - 1L; as.matrix(m) }
    d2 <- lgb.Dataset(mk2(latih), label = latih$penerima,
                      categorical_feature = "jenis_pekerjaan")
    m2 <- lgb.train(params = p63, data = d2, nrounds = 111)
    cat("AUC tanpa kabupaten:", round(auc(y_uji, predict(m2, mk2(uji))), 4), "\n")
  - |-
    frek <- table(rt$kabupaten)                                                 # (b)
    kecil <- names(frek)[frek < 200]
    cat("kabupaten berfrekuensi < 200:", length(kecil), "\n")
    rt2 <- rt; lev <- levels(rt2$kabupaten)
    levels(rt2$kabupaten) <- ifelse(lev %in% kecil, "Lainnya", lev)
    mk3 <- function(d) { m <- d[, fitur]
      m$kabupaten <- as.integer(m$kabupaten) - 1L
      m$jenis_pekerjaan <- as.integer(m$jenis_pekerjaan) - 1L; as.matrix(m) }
    m3 <- lgb.train(params = p63,
            data = lgb.Dataset(mk3(rt2[i, ]), label = latih$penerima,
                               categorical_feature = kat), nrounds = 111)
    cat("AUC dengan kategori kecil digabung:",
        round(auc(y_uji, predict(m3, mk3(rt2[-i, ]))), 4), "\n")
  - |-
    for (cs in c(1, 10, 100)) {                                                 # (c)
      p <- p63; p$cat_smooth <- cs
      m <- lgb.train(params = p, data = d_latih, nrounds = 111)
      cat("cat_smooth", cs, "-> AUC", round(auc(y_uji, predict(m, X_uji)), 4), "\n")
    }
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(a)} AUC turun dari $0{,}828$ menjadi $\mathbf{0{,}789}$ tanpa \texttt{kabupaten} --- penurunan nyata, sebab efek wilayah memang ditanam pada pembangkitan data. Mahasiswa harus menyimpulkan bahwa peubah berkardinalitas tinggi di sini \textbf{bukan sekadar penambah gain artifisial} melainkan benar-benar informatif. Namun perhatikan pula bahwa model tanpa kabupaten pun masih mengungguli regresi logistik lengkap ($0{,}775$) --- jadi keunggulan LightGBM tidak semata berasal dari penanganan kategoriknya.
  - \textbf{(b)} Pada data ini \textbf{tidak ada satu pun} kabupaten berfrekuensi di bawah 200 --- 40.000
    amatan terbagi ke 120 kabupaten sehingga rata-ratanya sekitar 333. Penggabungan karena itu tidak mengubah
    apa pun, dan jawaban yang benar adalah \textbf{melaporkan bahwa syaratnya tidak terpenuhi}, bukan
    memaksakan penggabungan. Pada data nyata dengan ribuan desa beranggota belasan amatan, langkah ini
    penting untuk mencegah lewat-suai.
  - '\textbf{(c)} Hasilnya: \texttt{cat\_smooth} 1 memberi AUC $0{,}827$; 10 memberi $0{,}828$; dan 100
    memberi $\mathbf{0{,}832}$ --- \textbf{nilai terbesarlah yang terbaik} di sini, berlawanan dengan
    kaidah umum bahwa nilai menengah biasanya menang.'
  - |-
    Penjelasannya justru menguatkan pemahaman: \texttt{cat\_smooth} menarik statistik tiap kategori ke arah rata-rata keseluruhan, dan penarikan itu bermanfaat bila taksiran per kategori berderau. Dengan 120 kabupaten dan efek wilayah yang tidak terlalu besar, peredaman kuat ternyata menguntungkan. Mahasiswa yang melaporkan hasil ini apa adanya --- bukan memaksakannya agar sesuai kaidah umum --- memperoleh nilai penuh.
    \end{kotakkunci}
  - '## Kunci Latihan 15.3 -- Ketidakseimbangan dan Ambang'
  - |-
    ```{r k3}
    set.seed(2026)                                                              # (a)
    j <- sample(seq_len(nrow(latih)), 0.8 * nrow(latih))
    latih2 <- latih[j, ]; validasi <- latih[-j, ]
    d3 <- lgb.Dataset(mk(latih2), label = latih2$penerima, categorical_feature = kat)
    m <- lgb.train(params = p63, data = d3, nrounds = 111)
    p_val <- predict(m, mk(validasi)); p_uji <- predict(m, X_uji)
  - |-
    f1 <- function(y, p, th) { pred <- as.integer(p > th); tp <- sum(pred == 1 & y == 1)
      if (tp == 0) return(0); prec <- tp / sum(pred == 1); rec <- tp / sum(y == 1)
      2 * prec * rec / (prec + rec) }
    ambang <- seq(0.05, 0.95, by = 0.01)
    th_val <- ambang[which.max(sapply(ambang, function(t) f1(validasi$penerima, p_val, t)))]
    cat("ambang terpilih pada VALIDASI:", th_val,
        " F1 pada data uji:", round(f1(y_uji, p_uji, th_val), 4), "\n")
  - |-
    th_uji <- ambang[which.max(sapply(ambang, function(t) f1(y_uji, p_uji, t)))]  # (b)
    cat("ambang terbaik pada DATA UJI:", th_uji,
        " F1:", round(f1(y_uji, p_uji, th_uji), 4), "\n")
  - |-
    pred <- as.integer(p_uji > th_val)                                           # (c)
    tp <- sum(pred == 1 & y_uji == 1)
    cat("presisi:", round(tp / sum(pred == 1), 4),
        " recall:", round(tp / sum(y_uji == 1), 4),
        " terpilih:", round(mean(pred), 4), "\n")
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(a)--(b)} Ambang yang ditala pada data validasi memberi F1 pada data uji yang \textbf{sedikit lebih rendah} daripada ambang yang ditala langsung pada data uji. Selisih itulah \textbf{besarnya optimisme} yang diperoleh bila ambang ditala pada data yang sama dengan yang dipakai melaporkan hasil --- dan itulah sebabnya cara kedua menyesatkan. Mahasiswa harus menyebut bahwa data uji hanya boleh disentuh \textbf{sekali}, pada akhir.
  - |-
    \textbf{(c)} Bila program hanya sanggup menjangkau $5\%$ rumah tangga, ambang \textbf{tidak boleh} dipilih dari F1 melainkan dari \textbf{kendala anggaran}: naikkan ambang sampai tepat $5\%$ terpilih, lalu laporkan presisi pada titik itu. F1 menimbang presisi dan recall sama berat, padahal ketika anggaran mengikat, yang penting adalah presisi pada cakupan yang mampu dibiayai. Jawaban yang memilih ambang dari kendala anggaran memperoleh nilai penuh.
    \end{kotakkunci}
  - '## Kunci Latihan 15.4 -- Membetulkan Kode yang Salah'
  - |-
    ```{r k4, eval=FALSE}
    # KODE ASLI (salah)
    d <- lgb.Dataset(mk(rt), label = rt$penerima)                  # (1) seluruh data
    p <- list(objective = "binary", num_leaves = 500,
              min_data_in_leaf = 5, learning_rate = 0.3)            # (2) rawan lewat-suai
    m <- lgb.train(params = p, data = d, nrounds = 3000)            # (3) tanpa penghentian dini
    akurasi <- mean((predict(m, mk(rt)) > 0.5) == rt$penerima)      # (4) akurasi pada data latih
    ```
  - |-
    ```{r k4b}
    cat("akurasi bila seluruhnya ditebak BUKAN penerima:",
        round(1 - mean(rt$penerima), 4), "\n")
    m_benar <- lgb.train(params = p63, data = d_latih, nrounds = 111)
    p_u <- predict(m_benar, X_uji)
    cat("akurasi model pada data uji:", round(mean((p_u > 0.5) == y_uji), 4),
        " AUC:", round(auc(y_uji, p_u), 4), "\n")
    ```
  - |-
    \begin{kotakkunci}
    \textbf{(1)} Melatih pada seluruh data termasuk data uji --- seluruh penilaian sesudahnya kehilangan makna.
  - '\textbf{(2)} \texttt{num\_leaves} 500 dengan \texttt{min\_data\_in\_leaf} 5 dan laju belajar $0{,}3$:
    pohon sangat lentur, daun boleh berisi lima amatan, dan tiap pohon menyumbang besar. Ketiganya bersama-sama
    menjamin penghafalan.'
  - \textbf{(3)} 3.000 iterasi tanpa penghentian dini memperparahnya.
  - |-
    \textbf{(4)} Inilah butir terpenting. Akurasi \textbf{bukan ukuran yang sah} pada data tidak seimbang: menebak seluruhnya bukan penerima sudah memberi akurasi $0{,}882$ tanpa model sama sekali. Angka $0{,}97$ pada data latih karena itu tidak menunjukkan apa pun --- ia gabungan dari penghafalan dan ukuran yang keliru. Pakailah AUC, atau presisi dan recall pada ambang operasional.
    \end{kotakkunci}
  - '# Kunci Jawaban Penugasan'
  - |-
    \begin{kotakkunci}
    \textbf{Butir 1--2.} Proporsi penerima harus serupa pada ketiga bagian (sekitar $0{,}118$); bila jauh berbeda, pembagiannya perlu distratifikasi. Acuan regresi logistik memberi AUC sekitar $\mathbf{0{,}775}$ pada data uji.
  - \textbf{Butir 3--5.} LightGBM dengan penghentian dini berhenti sekitar 100--120 iterasi dan memberi
    AUC sekitar $\mathbf{0{,}83}$. Penanganan kategorik langsung sedikit mengungguli pengodean boneka
    ($0{,}828$ berbanding $0{,}823$) dengan 7 kolom berbanding 129.
  - '\textbf{Butir 6.} Ambang ditetapkan dari \textbf{kendala anggaran}, bukan dari F1: pilih ambang sehingga
    tepat $8\%$ terpilih --- yakni kuantil $92\%$ dari peluang ramalan. Laporkan presisi dan recall pada
    titik itu.'
  - \textbf{Butir 7.} Ini butir yang membedakan jawaban baik. Penyaringan acak $8\%$ akan menangkap sekitar
    $8\%$ penerima; presisinya sama dengan prevalensi ($0{,}118$). Model yang baik memberi presisi beberapa
    kali lipat angka itu --- nisbahnya dikenal sebagai \emph{lift}. Aturan satu peubah (misalnya lama
    sekolah terendah) berada di antara keduanya. Jawaban wajib menyajikan ketiganya berdampingan.
  - |-
    \textbf{Butir 8--9.} Rekomendasi harus menyatakan bahwa model dipakai sebagai \textbf{penyaring awal}, bukan penentu akhir --- verifikasi lapangan tetap diperlukan. Keterbatasan wajib memuat: pentingnya peubah bukan sebab-akibat; model dilatih pada sebaran data tertentu sehingga perlu dilatih ulang bila keadaan berubah; dan data bersifat simulasi.
    \end{kotakkunci}
  - '# Catatan Penskoran untuk Pengajar'
  - |-
    \begin{kotakinfo}
    \begin{itemize}
    \item \textbf{Nilai penuh} bila: acuan dijalankan dan dibandingkan; banyaknya iterasi ditentukan dengan penghentian dini; ambang ditetapkan dari kendala anggaran; dan model dibandingkan dengan penyaringan acak.
    \item \textbf{Pengurangan nilai} bila: akurasi dipakai sebagai ukuran utama; ambang $0{,}5$ dipakai tanpa alasan; ambang ditala pada data uji; atau pentingnya peubah ditafsirkan sebagai sebab-akibat.
    \item Mahasiswa yang menunjukkan bahwa regresi logistik dapat menyamai LightGBM bila hubungannya mendekati linear --- misalnya dengan membangkitkan ulang data tanpa interaksi --- layak memperoleh nilai tambahan.
    \end{itemize}
    \end{kotakinfo}
