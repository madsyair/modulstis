  - '## Daftar Istilah'
  - |-
    \begin{kotakistilah}
    \textbf{Gradient boosting} --- ansambel pohon yang dibangun berurutan, tiap pohon dicocokkan pada gradien negatif fungsi kerugian.
  - \textbf{Pertumbuhan per daun} (\emph{leaf-wise growth}) --- memecah satu daun dengan penurunan kerugian
    terbesar, bukan seluruh daun pada tingkat yang sama.
  - \textbf{Pembinan histogram} (\emph{histogram binning}) --- mengelompokkan nilai peubah numerik menjadi
    sejumlah keranjang untuk mempercepat pencarian titik pecah.
  - \textbf{Kardinalitas} --- banyaknya kategori berbeda pada suatu peubah kategorik.
  - \textbf{cat\_smooth} --- parameter yang menarik statistik kategori berfrekuensi kecil ke arah rata-rata
    keseluruhan.
  - \textbf{scale\_pos\_weight} --- bobot bagi kelas positif pada data tidak seimbang.
  - \textbf{Penghentian dini} (\emph{early stopping}) --- menghentikan penambahan pohon ketika ukuran
    pada data validasi tidak lagi membaik.
  - |-
    \textbf{AUC} --- luas di bawah kurva ROC; mengukur kemampuan mengurutkan, tidak terpengaruh penggeseran ambang.
    \end{kotakistilah}
