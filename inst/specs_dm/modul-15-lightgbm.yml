  latihan:
  - \latihan{Menala parameter}
  - |-
    (a) Ulangi Contoh 15.3 dengan `num_leaves` bernilai 15, 63, dan 255 --- masing-masing dengan validasi silang. Bagaimana perubahan iterasi terbaik dan AUC data ujinya?
    (b) Untuk `num_leaves = 255`, coba `min_data_in_leaf` bernilai 20 dan 200. Apakah menaikkan `min_data_in_leaf` menolong?
    (c) Simpulkan hubungan antara ketiga parameter tersebut dalam satu paragraf.
  - \latihan{Kategorik dan kardinalitas}
  - |-
    (a) Latih model tanpa peubah `kabupaten` sama sekali. Berapa AUC-nya, dan apa artinya bagi peran efek wilayah?
    (b) Gabungkan kabupaten berfrekuensi rendah (kurang dari 200 amatan) menjadi satu kategori "Lainnya", lalu latih ulang. Apakah AUC-nya berubah?
    (c) Bandingkan `cat_smooth` bernilai 1, 10, dan 100. Jelaskan perannya.
  - \latihan{Ketidakseimbangan dan ambang**}
  - |-
    (a) Bagi data latih menjadi latih dan **validasi**, tala ambang pada data validasi, lalu laporkan F1 pada data uji.
    (b) Bandingkan dengan F1 yang ambangnya ditala langsung pada data uji (Contoh 15.5). Berapa selisihnya, dan mengapa cara kedua menyesatkan?
    (c) Hitung pula **presisi** dan **recall** pada ambang terpilih. Bila program hanya sanggup menjangkau 5\% rumah tangga, ambang mana yang Anda pilih?
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat **empat kesalahan**; temukan, perbaiki, jalankan versi yang benar, dan jelaskan
    akibat tiap kesalahan.
  - \kode{kode yang harus dibetulkan}
  - |-
    ```{r lat-salah, eval=FALSE}
    d <- lgb.Dataset(sebagai_matriks(rt), label = rt$penerima)          # (1)
    p <- list(objective = "binary", num_leaves = 500,
              min_data_in_leaf = 5, learning_rate = 0.3)                # (2)
    m <- lgb.train(params = p, data = d, nrounds = 3000)                # (3)
    akurasi <- mean((predict(m, sebagai_matriks(rt)) > 0.5) == rt$penerima)
    # "akurasi 0,97 -- model sangat baik"                               # (4)
    ```
  - 'Petunjuk: satu baris melatih pada **seluruh** data termasuk data uji; satu himpunan parameter sangat
    rawan lewat-suai; satu baris menetapkan iterasi tanpa penghentian dini; dan satu kesimpulan memakai
    ukuran yang keliru bagi data tidak seimbang.'
  - \newpage
  penugasan:
  - |-
    \begin{kotaktugas}
    \textbf{Konteks: Penyaringan Awal Calon Penerima Program}
  - |-
    Sebuah unit kerja hendak memakai model untuk \textbf{menyaring awal} calon penerima program bantuan, sebelum verifikasi lapangan dilakukan. Anggaran verifikasi hanya cukup untuk mengunjungi \textbf{8 persen} rumah tangga. Anda diminta membangun model penyaring beserta ambang operasionalnya, dan menilai apakah model itu layak dipakai.
    \end{kotaktugas}
  - \tugas{Penyiapan dan acuan}
  - |-
    1. Bagi data menjadi latih, validasi, dan uji (misalnya 60--15--25). Laporkan proporsi penerima pada ketiganya.
    2. Bangun **acuan**: regresi logistik. Laporkan AUC-nya pada data uji.
  - \tugas{Pemodelan}
  - |-
    3. Latih LightGBM dengan validasi silang beserta penghentian dini; laporkan iterasi terbaik dan AUC.
    4. Tala sekurang-kurangnya `num_leaves` dan `min_data_in_leaf`; sajikan tabel hasil penalaan.
    5. Bandingkan penanganan kategorik langsung dan pengodean boneka.
  - \tugas{Ambang operasional}
  - |-
    6. Tetapkan ambang sehingga **tepat 8 persen** rumah tangga terpilih untuk diverifikasi. Laporkan presisi dan recall pada ambang itu.
    7. Bandingkan dengan penyaringan **acak** 8 persen dan dengan penyaringan berdasarkan **satu peubah** saja (misalnya lama sekolah terendah). Berapa kali lipat model mengungguli keduanya?
  - \tugas{Kesimpulan dan keterbatasan}
  - |-
    8. Susun rekomendasi (maksimal 250 kata) mengenai kelayakan model sebagai penyaring awal.
    9. Tulis keterbatasan yang memuat sekurang-kurangnya: pentingnya peubah bukan sebab-akibat; risiko bila sebaran data berubah; dan bahwa data bersifat simulasi.
