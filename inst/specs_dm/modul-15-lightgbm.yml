body:
  deskripsi:
  - 'Modul 8 dan 9 memperkenalkan klasifikasi dengan pohon dan ansambel; Modul 13 memakai boosting pada
    data bertingkat. Modul ini kembali ke klasifikasi biasa, tetapi pada keadaan yang khas pekerjaan sungguhan:
    **data berukuran besar**, memuat **peubah kategorik berkardinalitas tinggi** seperti kode kabupaten,
    dan **kelas yang tidak seimbang**.'
  - '**LightGBM** adalah salah satu penerapan *gradient boosting decision tree* yang paling banyak dipakai.
    Keunggulannya bukan pada gagasan boosting itu sendiri --- yang sudah dikenal sejak akhir 1990-an ---
    melainkan pada tiga keputusan rekayasa yang membuatnya jauh lebih cepat dan hemat memori: **pertumbuhan
    pohon per daun**, **pembinan histogram**, dan **penanganan langsung peubah kategorik** tanpa perlu
    membuat kolom boneka.'
  - Modul memakai **dua bahasa**. Analisis utama dikerjakan dengan R, lalu diulang dengan Python pada
    Bagian 15.8 --- keduanya membaca berkas data yang sama, sehingga hasilnya dapat dibandingkan langsung.
  - |-
    \begin{kotakperhatian}[Kedudukan modul dan catatan data]
    Modul ini termasuk \textbf{bagian pengayaan}. Ia mengandaikan Modul 6, 8, dan 9 sudah dikuasai --- khususnya pembagian latih--uji, validasi silang, dan ukuran penilaian klasifikasi.
  - |-
    Data bersifat \textbf{ilustratif hasil simulasi} dan \textbf{bukan angka resmi} instansi mana pun. Hubungan antara peubah penjelas dan status penerima sengaja dibuat \textbf{sangat nonlinear dan penuh interaksi}, sehingga keunggulan model berbasis pohon atas model linear dapat diperlihatkan. Pada data nyata keunggulan itu tidak dijamin --- Contoh 15.3 membahasnya.
    \end{kotakperhatian}
