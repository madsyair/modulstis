    ```{r eval=FALSE}
    sapply(pel, function(x) ____(x)[1])      # kelas tiap kolom
    sapply(pel, function(x) length(____(x)))  # cacah nilai unik tiap kolom
    ```
  - \latihan{Tabel silang dan uji kebebasan}
  - |-
    ```{r eval=FALSE}
    silang <- ____(pel$wilayah, pel$segmen)      # tabel silang
    round(prop.table(silang, margin = ____), 3)  # proporsi PER BARIS
    ____(silang)$p.value                          # uji kebebasan khi-kuadrat
    ```
  - '#### Tingkat Menengah (menulis sendiri)'
  - \latihan{Penjelajahan mandiri}
  - 'Susun ringkasan yang menjawab tiga pertanyaan berikut, seluruhnya dengan kode Anda sendiri: (a) berapa
    rata-rata dan median `lama_langganan` pada tiap segmen; (b) segmen mana yang skor kepuasannya paling
    rendah; (c) apakah pelanggan berlangganan lebih lama cenderung bertagihan lebih besar --- jawab dengan
    koefisien korelasi dan diagram pencar.'
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat empat kesalahan (argumen `is.na` keliru, `prop.table` tanpa margin sehingga salah
    tafsir, pengelompokan tidak dilepaskan, dan `mean` pada kolom faktor). Temukan dan perbaiki, lalu
    jelaskan tiap kesalahannya.
  - |-
    ```{r eval=FALSE}
    pel <- read.csv("data/data_pelanggan.csv", stringsAsFactors = TRUE)

    # (a) is.na diberi nama kolom sebagai teks
    colSums(is.na("pel"))

    # (b) proporsi tanpa margin -- ditafsirkan sebagai proporsi per kolom
    prop.table(table(pel$segmen, pel$wilayah))

    # (c) pengelompokan tidak dilepaskan sehingga terbawa
    library(dplyr)
    hasil <- pel |> group_by(segmen) |> summarise(n = n())

    # (d) rata-rata dihitung pada kolom faktor
    mean(pel$wilayah)
    ```
  - |-
    **Keluaran yang benar.** Setelah diperbaiki, kode yang dipakai adalah sebagai berikut. Gunakan ini untuk memverifikasi perbaikan Anda.

    ```
    # (a) is.na dikenakan pada objek, bukan pada teks berisi namanya
    colSums(is.na(pel))

    # (b) margin = 2 bila ingin proporsi per kolom
    prop.table(table(pel$segmen, pel$wilayah), margin = 2)

    # (c) lepaskan pengelompokan setelah peringkasan
    hasil <- pel |> group_by(segmen) |> summarise(n = n(), .groups = "drop")

    # (d) kolom faktor dicacah, bukan dirata-ratakan
    table(pel$wilayah)
    ```

    Pemeriksaan yang wajib berhasil setelah perbaikan: `sum(colSums(is.na(pel)))` bernilai **0**, dan `all(round(colSums(prop.table(table(pel$segmen, pel$wilayah), margin = 2)), 8) == 1)` bernilai **TRUE**.
  - \latihan{Menakar pola semu sendiri}
  - 'Ulangi peragaan pada Contoh 1.10 dengan tiga nilai banyaknya peubah: 20, 100, dan 500. Untuk masing-masing,
    laporkan (a) berapa peubah tampak nyata pada taraf lima persen; (b) berapa yang diharapkan secara
    teoretis; (c) berapa yang tersisa setelah koreksi Bonferroni. Sajikan sebagai tabel dan jelaskan polanya.'
  - \latihan{Menakar risiko pengenalan}
  - Ulangi Contoh 1.12 dengan mengasarkan tahun lahir menjadi **kelompok umur lima tahunan**. Laporkan
    berapa persen amatan yang tetap unik dan berapa nilai k terkecil. Bandingkan terhadap hasil semula,
    lalu jelaskan mengapa pengasaran menurunkan risiko sekaligus apa yang hilang darinya.
  - '#### Tingkat Lanjut (rumusan persoalan)'
  - \latihan{Menempatkan persoalan pada CRISP-DM}
  - 'Pilih satu persoalan nyata yang dapat dijawab dengan data pelanggan ini --- misalnya mengenali pelanggan
    berpotensi berhenti, atau menetapkan sasaran promosi. Untuk persoalan itu: (a) tuliskan rumusan tahap
    *Business Understanding* beserta **kriteria sukses yang terukur**; (b) sebutkan peubah mana yang relevan
    dan alasannya; (c) tentukan pada tahap CRISP-DM mana pekerjaan Anda akan paling banyak menghabiskan
    waktu, dan jelaskan mengapa; (d) sebutkan satu risiko etika dari penerapan hasilnya.'
  penugasan:
  - |-
    \begin{kotaktugas}
    Sebagai calon analis data pada instansi statistik, susun laporan penjelajahan awal atas data pelanggan tiruan \texttt{data\_pelanggan.csv} (\emph{data simulasi}) sekaligus merumuskan persoalan penambangan data yang layak dikerjakan.
    \end{kotaktugas}
  - '**Konteks.** Sebuah unit layanan memiliki catatan 500 pelanggan berisi wilayah, segmen, lama langganan,
    tagihan bulanan, jumlah transaksi, dan skor kepuasan. Pimpinan ingin mengetahui apakah data ini cukup
    untuk mendukung keputusan penawaran layanan.'
  - \tugas{Data Understanding}
  - '1. Lakukan penjelajahan menyeluruh: dimensi, tipe kolom, ringkasan tiap peubah, cacah nilai hilang,
    dan pemeriksaan kewajaran rentang. Laporkan temuan yang patut diperhatikan.'
  - 2. Sajikan sebaran ketiga peubah kategori dan tiga peubah numerik dengan tabel maupun gambar. Jelaskan
    bentuk sebarannya, termasuk apakah ada yang miring.
  - 3. Periksa hubungan antar-peubah numerik dengan matriks korelasi. Sebutkan pasangan yang paling erat
    dan tafsirkan artinya.
  - \tugas{Business Understanding}
  - '4. Rumuskan **dua persoalan** yang dapat dijawab dengan data ini: satu bersifat **inferensia** dan
    satu bersifat **data mining**. Untuk masing-masing, tuliskan pertanyaannya, ukuran keberhasilannya,
    dan mengapa jenis pendekatannya berbeda.'
  - 5. Untuk persoalan data mining yang Anda pilih, susun rencana ringkas menurut **enam tahap CRISP-DM**,
    memuat perkiraan kesulitan pada tiap tahap.
  - \tugas{Penjelajahan Lanjut}
  - 8. Sajikan **empat jenis gambar** eksplorasi (histogram, diagram kotak-garis, diagram batang, diagram
    pencar). Untuk masing-masing, jelaskan mengapa jenis itu sesuai bagi skala pengukuran peubahnya.
  - 9. Susun tabel skala pengukuran seluruh peubah. Tandai peubah yang **dugaan otomatisnya keliru** dan
    jelaskan mengapa.
  - '10. Peragakan bahaya **pola semu**: bangkitkan 100 peubah acak, uji korelasinya terhadap `tagihan_bulanan`,
    lalu laporkan berapa yang tampak nyata sebelum dan sesudah koreksi Bonferroni.'
  - 11. Takar **risiko pengenalan individu** bila data pelanggan digabungkan dengan kode pos dan tahun
    lahir. Laporkan persentase amatan unik, lalu usulkan satu langkah pengasaran beserta akibatnya terhadap
    kegunaan data.
  - \tugas{Etika dan Laporan}
  - 6. Bahas **dua pertimbangan etika** yang muncul bila hasil analisis ini dipakai menyasar pelanggan
    tertentu. Sebutkan pula langkah pencegahannya.
  - '7. Susun laporan R Markdown berisi kode, keluaran, gambar, dan interpretasi. Tutup dengan **ringkasan
    (maksimal 300 kata)** yang memuat: temuan pokok, persoalan yang diusulkan, keterbatasan data, dan
    penegasan bahwa data merupakan simulasi sehingga hasilnya tidak menggambarkan keadaan sebenarnya.'
  ringkasan:
  - |-
    \begin{kotaktujuan}
    \textbf{Daftar periksa penguasaan:}
    \begin{itemize}
    \item[$\square$] Saya dapat menjelaskan pengertian data mining beserta empat sifat pola yang dicarinya.
    \item[$\square$] Saya dapat membedakan data mining dari statistika inferensia pada enam aspek.
    \item[$\square$] Saya dapat menyebutkan enam tahap CRISP-DM dan menempatkan suatu pekerjaan padanya.
    \item[$\square$] Saya dapat mengenali jenis data beserta perlakuan yang sesuai.
    \item[$\square$] Saya dapat melakukan penjelajahan awal: dimensi, tipe, ringkasan, nilai hilang.
    \item[$\square$] Saya dapat merumuskan pertanyaan inferensia dan pertanyaan data mining atas data yang sama.
    \item[$\square$] Saya menyadari risiko menemukan pola semu pada data berpeubah banyak.
    \item[$\square$] Saya dapat menyebutkan pertimbangan etika sebelum menambang data.
    \end{itemize}
    \end{kotaktujuan}
  - '**Kartu Referensi Cepat.** Perintah penjelajahan awal:'
  - |-
    \begin{kotakrumus}
    \begin{tabular}{@{}ll@{}}
    \textbf{Keperluan} & \textbf{Perintah}\\nDimensi data & \texttt{dim(d)}, \texttt{nrow(d)}, \texttt{ncol(d)}\\nTipe tiap kolom & \texttt{str(d)}\\nRingkasan menyeluruh & \texttt{summary(d)}\\nNilai hilang per kolom & \texttt{colSums(is.na(d))}\\nCacah kategori & \texttt{table(d\$k)}\\nProporsi per kolom & \texttt{prop.table(tab, margin = 2)}\\nRingkasan per kelompok & \texttt{group\_by()} lalu \texttt{summarise()}\\nKorelasi & \texttt{cor(d[, numerik])}\\nMengukur waktu & \texttt{system.time(ekspresi)}\\
    \end{tabular}
    \end{kotakrumus}
  - 'Modul ini menata cara berpikir sebelum menyentuh algoritma. Prinsip yang perlu dibawa: rumuskan persoalan
    sebelum mencari pola, kenali data sebelum memodelkannya, dan ingat bahwa menemukan pola pada data
    berpeubah banyak selalu disertai risiko menemukan kebetulan. Modul berikutnya membahas konsep big
    data beserta kendala teknis yang menyertainya.'
