exercises:
- id: L1.1
  points: 15
  solution: 'Tingkat Dasar: penjelajahan awal, sebaran kategori, ringkasan per kelompok.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |
    pel <- read.csv("data/data_pelanggan.csv", stringsAsFactors = TRUE)
    dim(pel)                     # banyaknya baris dan kolom
    str(pel)                     # tipe tiap kolom
    colSums(is.na(pel))          # cacah nilai hilang per kolom

    table(pel$segmen)                              # cacah tiap segmen
    round(prop.table(table(pel$segmen)), 3)        # proporsi

    suppressPackageStartupMessages(library(dplyr))
    pel |>
      group_by(wilayah) |>
      summarise(n = n(), rata = mean(tagihan_bulanan), .groups = "drop")
  interpretasi: |
    Isian yang benar berturut-turut adalah dim, str, is.na, table, prop.table, group_by, dan n. Perhatikan bahwa is.na dikenakan pada seluruh data.frame sehingga menghasilkan matriks logika, dan colSums menjumlahkannya per kolom. Fungsi n hanya sah dipakai di dalam summarise setelah group_by.
- id: L1.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: penjelajahan mandiri dan rumusan persoalan.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |
    suppressPackageStartupMessages(library(dplyr))
    pel <- read.csv("data/data_pelanggan.csv", stringsAsFactors = TRUE)

    # (a) rata-rata dan median lama langganan per segmen
    pel |>
      group_by(segmen) |>
      summarise(rata = mean(lama_langganan),
                median = median(lama_langganan), .groups = "drop")

    # (b) segmen dengan skor kepuasan terendah
    ringkas <- pel |>
      group_by(segmen) |>
      summarise(rata_kepuasan = mean(skor_kepuasan), .groups = "drop")
    ringkas$segmen[which.min(ringkas$rata_kepuasan)]

    # (c) hubungan lama langganan dengan tagihan
    round(cor(pel$lama_langganan, pel$tagihan_bulanan), 4)
    plot(pel$lama_langganan, pel$tagihan_bulanan, pch = 19, col = "#0B6FB4",
         xlab = "Lama langganan (bulan)", ylab = "Tagihan bulanan (ribu Rp)",
         main = "Lama Langganan vs Tagihan")
    abline(lm(tagihan_bulanan ~ lama_langganan, data = pel),
           col = "#F58220", lwd = 2)
  interpretasi: |
    Butir (b) memakai which.min atas hasil peringkasan, bukan atas data mentah, karena yang dibandingkan adalah rata-rata per kelompok. Pada butir (c), koefisien korelasi wajib dibaca bersama diagram pencarnya: korelasi mendekati nol hanya menyatakan tidak ada hubungan linier, dan pola melengkung tetap dapat terjadi. Karena data ini dibangkitkan dengan peubah saling bebas, korelasi yang lemah adalah hasil yang wajar dan harus dilaporkan apa adanya.
- id: L1.D
  points: 10
  solution: 'Membetulkan kode: argumen is.na, margin prop.table, pelepasan kelompok, dan mean pada faktor.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |
    pel <- read.csv("data/data_pelanggan.csv", stringsAsFactors = TRUE)

    # (a) is.na dikenakan pada objek, bukan pada teks berisi namanya
    colSums(is.na(pel))

    # (b) margin = 2 agar proporsi dihitung per kolom
    prop.table(table(pel$segmen, pel$wilayah), margin = 2)

    # (c) pengelompokan dilepaskan setelah peringkasan
    suppressPackageStartupMessages(library(dplyr))
    hasil <- pel |> group_by(segmen) |> summarise(n = n(), .groups = "drop")

    # (d) kolom faktor dicacah, bukan dirata-ratakan
    table(pel$wilayah)

    # pemeriksaan wajib
    sum(colSums(is.na(pel)))                                          # 0
    all(round(colSums(prop.table(table(pel$segmen, pel$wilayah),
                                 margin = 2)), 8) == 1)               # TRUE
  interpretasi: |
    Empat kesalahan diperbaiki. Pertama, is.na yang diberi teks berisi nama objek memeriksa teks itu sendiri, bukan datanya, sehingga hasilnya selalu FALSE. Kedua, prop.table tanpa margin menghitung proporsi terhadap total seluruh sel, sehingga menafsirkannya sebagai proporsi per kolom adalah kekeliruan penafsiran yang serius. Ketiga, pengelompokan yang tidak dilepaskan terbawa ke langkah berikutnya dan menimbulkan hasil tak terduga. Keempat, rata-rata tidak terdefinisi bagi kolom faktor; yang sesuai adalah pencacahan.
- id: T1.1
  points: 50
  solution: 'Penugasan: penjelajahan menyeluruh, rumusan dua jenis persoalan, rencana CRISP-DM, dan etika.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |
    suppressPackageStartupMessages(library(dplyr))
    pel <- read.csv("data/data_pelanggan.csv", stringsAsFactors = TRUE)

    # 1) penjelajahan menyeluruh
    dim(pel); str(pel); summary(pel)
    colSums(is.na(pel))
    # pemeriksaan kewajaran rentang
    range(pel$skor_kepuasan)          # harus berada di dalam 1 sampai 5
    range(pel$lama_langganan)

    # 2) sebaran peubah kategori dan numerik
    par(mfrow = c(2, 3))
    for (k in c("wilayah", "segmen"))
      barplot(table(pel[[k]]), main = k, col = "#0B6FB4", border = "white")
    for (k in c("lama_langganan", "tagihan_bulanan", "jumlah_transaksi", "skor_kepuasan"))
      hist(pel[[k]], main = k, xlab = k, col = "#0B6FB4", border = "white")
    par(mfrow = c(1, 1))

    # 3) matriks korelasi peubah numerik
    num <- pel[, c("lama_langganan", "tagihan_bulanan",
                   "jumlah_transaksi", "skor_kepuasan")]
    K <- round(cor(num), 3); print(K)
    # pasangan paling erat (di luar diagonal)
    diag(K) <- 0
    which(abs(K) == max(abs(K)), arr.ind = TRUE)[1, ]

    # 4) dua jenis persoalan atas data yang sama
    #    (a) INFERENSIA: apakah rata-rata kepuasan berbeda antar-segmen?
    summary(aov(skor_kepuasan ~ segmen, data = pel))
    #    (b) DATA MINING: seberapa baik peubah yang ada meramalkan tagihan tinggi?
    pel$tagihan_tinggi <- factor(ifelse(
      pel$tagihan_bulanan > median(pel$tagihan_bulanan), "tinggi", "rendah"))
    round(prop.table(table(pel$segmen, pel$tagihan_tinggi), margin = 1), 3)

    # 5) rencana CRISP-DM sebagai tabel
    rencana <- data.frame(
      tahap = paste(1:6, c("Business Understanding","Data Understanding",
                           "Data Preparation","Modeling","Evaluation","Deployment")),
      kegiatan = c("rumuskan sasaran dan kriteria sukses",
                   "jelajahi mutu dan sebaran data",
                   "tangani nilai hilang, skala, pengodean",
                   "bandingkan beberapa model",
                   "nilai terhadap kriteria tahap 1",
                   "laporkan dan pantau"),
      kesulitan = c("sedang","rendah","tinggi","sedang","sedang","tinggi"))
    print(rencana, right = FALSE)
  interpretasi: |
    Penjelajahan pada nomor 1 wajib memuat pemeriksaan kewajaran rentang, bukan sekadar ringkasan, karena nilai di luar rentang yang mungkin menandakan kekeliruan pencatatan. Pada nomor 3, diagonal matriks korelasi dinolkan lebih dahulu agar pasangan terkuat tidak terpilih dari diagonalnya sendiri. Nomor 4 adalah inti penugasan: pertanyaan inferensia dijawab dengan uji dan nilai-p, sedangkan pertanyaan data mining dijawab dengan seberapa berguna peubah itu membedakan kelas. Pada nomor 5, penempatan Data Preparation sebagai tahap tersulit sejalan dengan pengalaman lapangan: penyiapan data lazimnya menyita porsi waktu terbesar. Laporan wajib menegaskan bahwa data merupakan simulasi dengan peubah yang dibangkitkan saling bebas, sehingga hubungan yang lemah adalah hasil yang wajar dan tidak boleh ditafsirkan sebagai temuan.
