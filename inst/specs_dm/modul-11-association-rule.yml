  - '## Daftar Istilah'
  - |-
    \begin{kotakistilah}
    \textbf{Transaksi} (\emph{transaction}) --- himpunan barang yang muncul bersamaan pada satu kejadian.
  - \textbf{Himpunan barang} (\emph{itemset}) --- himpunan bagian dari seluruh barang; $k$-itemset bila
    beranggota $k$.
  - \textbf{Support} --- proporsi transaksi yang memuat suatu himpunan.
  - \textbf{Confidence} --- peluang bersyarat ruas kanan bila ruas kiri hadir.
  - \textbf{Lift} --- nisbah confidence terhadap support ruas kanan; 1 berarti tidak ada kaitan.
  - \textbf{Leverage} --- selisih mutlak support gabungan terhadap keadaan bebas.
  - \textbf{Conviction} --- seberapa sering aturan akan keliru bila kedua ruas bebas.
  - \textbf{Sifat anti-monoton} (\emph{apriori property}) --- himpunan bagian dari himpunan yang sering
    muncul pasti juga sering muncul.
  - \textbf{Closed itemset} --- tidak ada superhimpunan langsung yang support-nya sama.
  - \textbf{Maximal itemset} --- tidak ada superhimpunan yang juga sering muncul.
  - |-
    \textbf{Aturan redundan} --- aturan yang confidence-nya tidak melampaui aturan lain yang ruas kirinya lebih sederhana.
    \end{kotakistilah}
