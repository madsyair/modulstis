  tujuan:
  - 'Setelah menyelesaikan praktikum Modul 11, mahasiswa diharapkan mampu:'
  - |-
    1. Menjelaskan bentuk data transaksi dan membedakannya dari tabel persegi biasa.
    2. Membaca data transaksi ke dalam R dari bentuk panjang maupun lebar, serta memeriksa ringkasannya.
    3. Menjelaskan definisi **support**, **confidence**, dan **lift** beserta hubungan ketiganya.
    4. Menambang himpunan barang sering muncul dengan **Apriori** dan **Eclat**, serta menjelaskan mengapa keduanya memberi hasil sama dengan cara kerja berbeda.
    5. Membedakan himpunan **frequent**, **closed**, dan **maximal**, serta menjelaskan pemampatan yang diberikan keduanya.
    6. Membentuk aturan asosiasi, mengurutkannya, dan menyaringnya menurut barang tertentu.
    7. Mengenali aturan ber-*confidence* tinggi tetapi ber-*lift* sekitar satu, dan menjelaskan mengapa aturan semacam itu tidak berguna.
    8. Memangkas aturan **redundan** serta memakai ukuran tambahan (*leverage*, *conviction*, uji Fisher) untuk menilai kebermaknaan.
    9. Menjelaskan pengaruh ambang *support* terhadap banyaknya aturan dan terhadap kemampuan menemukan pola pada barang langka.
    10. Menerapkan penambangan aturan pada **data statistik resmi** --- kejadian bersama indikator keterbatasan rumah tangga --- dan menerjemahkan temuannya menjadi usulan penargetan program beserta keterbatasannya.
  alat:
  - '## Perangkat Lunak'
  - |-
    - **R** versi 4.2 atau lebih baru dan **RStudio**.
    - Paket R: **`arules`** (penambangan aturan asosiasi). Paket `arulesViz` bersifat pilihan untuk penyajian grafis; modul ini sengaja memakai grafik bawaan R agar dapat dijalankan tanpanya.
  - \kode{pemasangan dan pemanggilan paket}
  - |-
    ```{r pkg-install, eval=FALSE}
    install.packages("arules")     # jalankan sekali saja
    ```
  - |-
    ```{r pkg-load}
    suppressPackageStartupMessages(library(arules))
    ```
  - '## Bahan (Berkas Data)'
  - |-
    | Berkas | Isi |
    |:-------|:----|
    | `data/transaksi_ritel.csv` | 5.279 baris; bentuk **panjang**: `id_transaksi`, `item` --- 1.200 transaksi, 20 jenis barang |
    | `data/keterangan_barang.csv` | padanan tiap barang dengan **kategori**-nya (Minuman, Bahan Pokok, dan seterusnya) |
    | `data/keterbatasan_rt.csv` | 3.216 baris; 866 rumah tangga $\times$ 12 indikator keterbatasan --- **kasus statistik resmi** (Bagian 11.7) |
  - Berkas `gen_data.R` memuat kode pembangkit kedua berkas itu lengkap dengan `set.seed()`.
  instruksi:
  - |-
    1. Buat **RStudio Project** dan salin folder `data/` ke dalamnya.
    2. Kerjakan Contoh secara berurutan; ketik ulang kodenya, jalankan, lalu baca kotak Interpretasi Output.
    3. Kerjakan **Latihan Mandiri**, lalu **Penugasan** sebagai laporan.
    4. Tuliskan jawaban, kode, output, dan interpretasi dalam satu berkas `.Rmd`, lalu **Knit** ke PDF.
  - |-
    \begin{kotakcatatan}[Kebiasaan baik]
    Tetapkan ambang \emph{support} dan \emph{confidence} \textbf{beserta alasannya} sebelum menambang, bukan sesudah melihat hasil mana yang enak diceritakan. Menurunkan ambang sampai aturan yang diinginkan muncul adalah pencarian pola, bukan analisis.
    \end{kotakcatatan}
  teori:
  - '## Data Transaksi'
  - Misalkan $I = \{i_1, i_2, \ldots, i_d\}$ himpunan seluruh **barang** (*item*). Sebuah **transaksi**
    $t$ adalah himpunan bagian dari $I$, dan basis data transaksi $D$ adalah kumpulan $n$ transaksi. **Himpunan
    barang** (*itemset*) $X \subseteq I$ berukuran $k$ disebut $k$-itemset.
  - 'Data transaksi berbeda dari tabel persegi dalam dua hal: panjang tiap transaksi berbeda-beda, dan
    yang dicatat hanya **kehadiran** --- ketiadaan suatu barang tidak berarti "nol", melainkan sekadar
    tidak dibeli.'
  - '## Support, Confidence, dan Lift'
  - |-
    \begin{kotakrumus}
    \textbf{Support} himpunan $X$: proporsi transaksi yang memuat $X$.
    \[
    \mathrm{supp}(X) = \frac{|\{t \in D : X \subseteq t\}|}{n}
    \]
  - |-
    \textbf{Aturan asosiasi} $X \Rightarrow Y$ dengan $X \cap Y = \varnothing$:
    \[
    \mathrm{supp}(X \Rightarrow Y) = \mathrm{supp}(X \cup Y), \qquad
    \mathrm{conf}(X \Rightarrow Y) = \frac{\mathrm{supp}(X \cup Y)}{\mathrm{supp}(X)}
    \]
  - |-
    \textbf{Lift} membandingkan \emph{confidence} dengan support ruas kanan:
    \[
    \mathrm{lift}(X \Rightarrow Y) = \frac{\mathrm{conf}(X \Rightarrow Y)}{\mathrm{supp}(Y)}
     = \frac{\mathrm{supp}(X \cup Y)}{\mathrm{supp}(X)\,\mathrm{supp}(Y)}
    \]
    $\mathrm{lift} = 1$ berarti $X$ dan $Y$ muncul bersamaan persis sesering yang diharapkan bila keduanya bebas; $> 1$ berarti saling menguatkan; $< 1$ berarti saling meniadakan.
    \end{kotakrumus}
  - |-
    \begin{kotakperhatian}[Mengapa confidence saja menyesatkan]
    \emph{Confidence} tidak memperhitungkan seberapa laris ruas kanannya. Bila 60\% transaksi memuat air mineral, maka aturan apa pun $\Rightarrow$ air mineral akan ber-\emph{confidence} sekitar 0{,}60 tanpa memuat informasi apa pun. Aturan semacam itu \emph{terlihat} kuat padahal \emph{lift}-nya mendekati 1. Karena itu \textbf{lift wajib dilaporkan bersama confidence}.
    \end{kotakperhatian}
  - '## Sifat Apriori dan Dua Algoritma'
  - |-
    \begin{kotakrumus}
    \textbf{Sifat Apriori (anti-monoton).} Bila $X$ sering muncul, maka setiap himpunan bagiannya juga sering muncul. Kontraposisinya yang dipakai: bila $X$ \emph{tidak} sering muncul, maka setiap superhimpunannya pasti tidak sering muncul --- sehingga seluruh cabang itu dapat dipangkas tanpa diperiksa.
    \end{kotakrumus}
  - '**Apriori** bekerja per tingkat: cari 1-itemset yang sering, gabungkan menjadi calon 2-itemset, hitung
    support-nya dengan menyapu basis data, dan seterusnya. Ia menyapu data berulang kali tetapi hemat
    memori.'
  - '**Eclat** memakai penyajian **vertikal**: tiap barang disimpan sebagai daftar id transaksi yang memuatnya.
    Support gabungan dua himpunan diperoleh dengan **mengiriskan** kedua daftar itu, tanpa menyapu ulang
    data. Ia lebih cepat pada data yang tidak terlalu besar, tetapi lebih boros memori.'
  - Keduanya menyelesaikan masalah yang sama sehingga **hasilnya identik**; yang berbeda hanya cara mencapainya.
  - '## Frequent, Closed, dan Maximal'
  - |-
    \begin{kotakrumus}
    Himpunan $X$ yang sering muncul disebut:
    \begin{itemize}
    \item \textbf{closed} bila tidak ada superhimpunan langsung yang \emph{support}-nya sama;
    \item \textbf{maximal} bila tidak ada superhimpunan yang juga sering muncul.
    \end{itemize}
    Berlaku: maximal $\subseteq$ closed $\subseteq$ frequent. Himpunan \emph{closed} memampatkan hasil \textbf{tanpa kehilangan informasi support}; \emph{maximal} memampatkan lebih jauh tetapi support himpunan bagiannya tidak lagi dapat dipulihkan.
    \end{kotakrumus}
  - '## Aturan Redundan'
  - Aturan $X \Rightarrow Y$ disebut **redundan** bila ada aturan yang lebih sederhana --- ruas kirinya
    himpunan bagian --- dengan *confidence* yang sama atau lebih tinggi. Menyajikan keduanya membuat laporan
    panjang tanpa menambah pengetahuan.
  - '## Ukuran Tambahan'
  - |-
    \begin{kotakrumus}
    \textbf{Leverage} $= \mathrm{supp}(X \cup Y) - \mathrm{supp}(X)\mathrm{supp}(Y)$: selisih mutlak terhadap keadaan bebas; berguna karena \emph{lift} tinggi pada himpunan yang sangat jarang bisa menyesatkan.
  - '\textbf{Conviction} $= \dfrac{1 - \mathrm{supp}(Y)}{1 - \mathrm{conf}(X \Rightarrow Y)}$: seberapa
    sering aturan akan keliru bila $X$ dan $Y$ bebas. Bernilai $\infty$ bila \emph{confidence} tepat 1.'
  - |-
    \textbf{Uji Fisher} memberi nilai-$p$ bagi hipotesis bahwa $X$ dan $Y$ bebas --- berguna, tetapi \textbf{harus} dikoreksi terhadap pengujian ganda karena ribuan aturan diuji sekaligus.
    \end{kotakrumus}
  - |-
    \begin{kotaktujuan}
    \textbf{Alur praktikum Modul 11}
    \begin{enumerate}
    \item Membaca data transaksi dan memeriksa ringkasannya.
    \item Menambang himpunan sering muncul dengan Apriori; memampatkannya menjadi closed dan maximal.
    \item Membandingkan Apriori dan Eclat.
    \item Membentuk aturan, mengurutkan menurut lift, dan menafsirkannya.
    \item Memperagakan jebakan confidence tinggi dengan lift sekitar satu.
    \item Memangkas aturan redundan dan menilai dengan ukuran tambahan.
    \item Menelusuri pengaruh ambang support, termasuk pada barang langka.
    \item Menaikkan analisis ke tingkat kategori barang.
    \item Menerapkannya pada kasus statistik resmi: kejadian bersama indikator keterbatasan rumah tangga.
    \end{enumerate}
    \end{kotaktujuan}
  latihan:
  - \latihan{Menyiapkan data dan menelaah frekuensi}
  - Kerjakan dengan data yang sama.
  - |-
    (a) Baca ulang `data/transaksi_ritel.csv` menjadi objek `transactions`, lalu laporkan banyaknya transaksi, banyaknya barang, dan sebaran ukuran keranjang.
    (b) Hitung support tiap barang. Berapa banyak barang yang support-nya di bawah 0{,}10?
    (c) Gambar diagram batang sepuluh barang dengan support **terendah**. Barang mana yang paling langka, dan apa akibatnya bagi penambangan pada ambang 5\%?
  - \latihan{Menambang dan memampatkan himpunan sering muncul}
  - |-
    (a) Tambang himpunan sering muncul pada ambang support 0{,}03; laporkan cacahnya menurut ukuran himpunan.
    (b) Hitung berapa yang *closed* dan berapa yang *maximal*. Berapa persen pemampatan yang diberikan masing-masing?
    (c) Jalankan `eclat()` pada ambang yang sama, lalu buktikan hasilnya identik dengan Apriori. Jelaskan mengapa demikian.
  - \latihan{Membentuk dan menyaring aturan}
  - |-
    (a) Bentuk aturan pada support 0{,}02 dan confidence 0{,}6. Berapa banyak yang diperoleh, dan berapa yang redundan?
    (b) Setelah dipangkas, tampilkan sepuluh aturan ber-*lift* tertinggi. Bandingkan dengan sepuluh aturan ber-*confidence* tertinggi --- berapa yang beririsan, dan apa artinya?
    (c) Saring aturan yang ruas kanannya `susu`. Aturan mana yang ber-*leverage* tertinggi, dan mengapa itu berbeda dari yang ber-*lift* tertinggi?
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat **empat kesalahan**; temukan, perbaiki, jalankan versi yang benar, dan jelaskan
    akibat tiap kesalahan bagi kesimpulan bisnis.
  - \kode{kode yang harus dibetulkan}
  - |-
    ```{r lat-salah, eval=FALSE}
    trx <- read.csv("data/transaksi_ritel.csv")                       # (1)
    r <- apriori(trx, parameter = list(support = 0.001, confidence = 0.9))   # (2)
    inspect(head(sort(r, by = "confidence"), 10))                     # (3)
    # "aturan teratas berconfidence 0,95: pelanggan yang membeli X PASTI membeli Y,
    #  jadi promosi X akan menaikkan penjualan Y"                     # (4)
    ```
  - 'Petunjuk: satu baris membaca data sebagai `data.frame` biasa, bukan `transactions`; satu baris memakai
    ambang support yang teramat rendah tanpa alasan; satu baris mengurutkan menurut ukuran yang keliru;
    dan satu kesimpulan menarik klaim sebab-akibat dari aturan asosiasi.'
  penugasan:
  - |-
    \begin{kotaktugas}
    \textbf{Konteks: Penataan Rak dan Paket Promosi}
  - |-
    Sebuah jaringan ritel meminta Anda menyusun \textbf{usulan penataan rak dan paket promosi} berdasarkan 1.200 transaksi yang tersedia. Manajemen meminta usulan yang \textbf{sedikit tetapi berdasar}, bukan daftar panjang aturan. Anda berperan sebagai analis data yang menyusun laporannya.
    \end{kotaktugas}
  - \tugas{Penyiapan dan penelaahan}
  - |-
    1. Baca data transaksi; laporkan banyaknya transaksi, barang, dan sebaran ukuran keranjang.
    2. Tampilkan support seluruh barang. Tetapkan ambang support **beserta alasannya**, dinyatakan sebagai cacah minimum transaksi yang Anda anggap layak menjadi dasar keputusan.
  - \tugas{Penambangan dan pemangkasan}
  - |-
    3. Tambang himpunan sering muncul pada ambang yang Anda tetapkan; laporkan cacahnya menurut ukuran, serta berapa yang *closed* dan *maximal*.
    4. Bentuk aturan asosiasi; laporkan banyaknya sebelum dan sesudah pemangkasan redundansi.
    5. Sajikan sepuluh aturan terbaik menurut **lift**, lengkap dengan support, confidence, lift, leverage, dan cacah pendukung.
  - \tugas{Penilaian dan penyaringan}
  - |-
    6. Tunjukkan **satu** aturan ber-confidence tinggi tetapi ber-lift mendekati 1, lalu jelaskan mengapa aturan itu tidak layak dipakai.
    7. Bandingkan urutan menurut *lift* dan menurut *leverage*. Bila keduanya berbeda, aturan mana yang Anda usulkan untuk ditindaklanjuti, dan mengapa?
    8. Lakukan analisis pada tingkat **kategori**, lalu bandingkan temuannya dengan tingkat barang. Pola apa yang muncul dan pola apa yang hilang?
  - \tugas{Usulan dan keterbatasan}
  - |-
    9. Susun **tiga** usulan konkret --- penataan rak atau paket promosi --- masing-masing disertai aturan pendukung beserta angkanya, dan perkiraan dampaknya berdasarkan *leverage*.
    10. Tulis bagian **keterbatasan** (maksimal 250 kata) yang memuat sekurang-kurangnya: sifat asosiatif (bukan sebab-akibat) temuan ini; pengaruh pilihan ambang; risiko pengujian ganda; dan bahwa data bersifat simulasi.
  - |-
