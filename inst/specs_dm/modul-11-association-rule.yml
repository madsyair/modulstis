body:
  deskripsi:
  - 'Sepuluh modul sebelumnya bekerja pada data berbentuk **tabel persegi**: satu baris satu amatan, satu
    kolom satu peubah. Modul ini berpindah ke bentuk data yang berbeda --- **transaksi**, yakni kumpulan
    himpunan. Satu transaksi adalah satu keranjang belanja, satu kunjungan pasien, atau satu berkas jawaban
    survei; isinya sekumpulan barang atau kejadian yang panjangnya berbeda-beda.'
  - 'Pertanyaan yang diajukan pun berbeda. Bukan "berapa nilai $y$ bila $x$ diketahui" melainkan **"kejadian
    apa yang cenderung muncul bersamaan"**. Jawabannya berbentuk **aturan asosiasi**: bila roti dan mentega
    dibeli, susu cenderung ikut dibeli. Teknik ini lahir dari analisis keranjang belanja, tetapi dipakai
    jauh lebih luas --- pola gejala penyakit yang muncul bersamaan, kombinasi jawaban kuesioner, rangkaian
    modul yang diambil mahasiswa, atau pola kesalahan pada berkas administrasi.'
  - 'Modul dipusatkan pada empat hal. **Pertama**, menyiapkan data transaksi dan memahami bentuknya. **Kedua**,
    menambang himpunan barang sering muncul (*frequent itemsets*) dengan Apriori dan Eclat, beserta gagasan
    *closed* dan *maximal* yang memampatkan hasilnya. **Ketiga**, membentuk aturan dan menafsirkan **support**,
    **confidence**, dan **lift** --- dengan penekanan bahwa dua yang pertama saja menyesatkan. **Keempat**,
    memangkas dan menilai aturan: mana yang berlebihan, mana yang bermakna, dan mana yang hanya cerminan
    barang yang memang laris. Modul ditutup dengan **penerapan pada statistik resmi** --- kejadian bersama
    indikator keterbatasan rumah tangga --- yang memperlihatkan bahwa teknik ini bukan alat ritel semata.'
  - |-
    \begin{kotakperhatian}[Tentang data]
    Berkas data pada modul ini adalah \textbf{data simulasi} (\texttt{set.seed(2026)}), \textbf{bukan data nyata} dan \textbf{bukan data resmi} instansi mana pun. Beberapa kaitan antarbarang \textbf{sengaja ditanam} saat pembangkitan agar dapat diperiksa apakah algoritma menemukannya kembali; kaitan lain muncul semata dari kebetulan, dan membedakan keduanya justru menjadi salah satu latihan pada modul ini.
    \end{kotakperhatian}
  - \vspace{1.2em}
