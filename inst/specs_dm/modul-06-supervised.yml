exercises:
- id: L6.1
  points: 15
  solution: 'Tingkat Dasar: pembagian berstrata, resep dan alur kerja, ukuran penilaian.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(rsample); library(recipes); library(parsnip)
      library(workflows); library(yardstick); library(dplyr)})

    kredit <- read.csv("data/data_kredit.csv", stringsAsFactors = TRUE)
    kredit$gagal_bayar <- factor(kredit$gagal_bayar, levels = c("ya", "tidak"))
    set.seed(2026)
    bagi <- initial_split(kredit, prop = 0.75, strata = gagal_bayar)
    lat <- training(bagi); uji <- testing(bagi)
    round(prop.table(table(lat$gagal_bayar)), 4)

    rec <- recipe(gagal_bayar ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())
    spec <- nearest_neighbor(neighbors = 9) |>
      set_engine("kknn") |> set_mode("classification")
    wf <- workflow() |> add_recipe(rec) |> add_model(spec)

    model <- fit(wf, data = lat)
    duga <- predict(model, uji) |>
      bind_cols(predict(model, uji, type = "prob")) |>
      bind_cols(uji |> select(gagal_bayar))

    conf_mat(duga, truth = gagal_bayar, estimate = .pred_class)
    metric_set(yardstick::accuracy, yardstick::precision,
               yardstick::recall, yardstick::f_meas)(
      duga, truth = gagal_bayar, estimate = .pred_class)
    roc_auc(duga, truth = gagal_bayar, .pred_ya)
  interpretasi: |
    Isian yang benar berturut-turut adalah initial_split, training, testing, step_normalize, nearest_neighbor, classification, add_model, conf_mat, metric_set, dan roc_auc. Dua hal patut ditekankan. Pertama, roc_auc memerlukan kolom peluang, bukan kolom kelas dugaan; memberinya kolom kelas menimbulkan galat. Kedua, urutan taraf sasaran menentukan kelas mana yang dianggap positif, sehingga menetapkannya secara tegas mencegah presisi dan recall mengukur kelas yang keliru.
- id: L6.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: pemodelan berlebih (*overfitting*) dan pemilihan ukuran penilaian.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(parsnip); library(workflows); library(yardstick); library(dplyr)})

    nilai_k <- c(1, 3, 5, 9, 15, 25, 51)
    banding <- t(sapply(nilai_k, function(k) {
      s <- nearest_neighbor(neighbors = k) |>
        set_engine("kknn") |> set_mode("classification")
      m <- fit(workflow() |> add_recipe(rec) |> add_model(s), data = lat)
      dl <- predict(m, lat) |> bind_cols(lat |> select(gagal_bayar))
      du <- predict(m, uji) |> bind_cols(uji |> select(gagal_bayar))
      c(latih = accuracy(dl, gagal_bayar, .pred_class)$.estimate,
        uji   = accuracy(du, gagal_bayar, .pred_class)$.estimate)
    }))
    tabel <- data.frame(k = nilai_k, round(banding, 4),
                        jarak = round(banding[, 1] - banding[, 2], 4))
    print(tabel, row.names = FALSE)

    cat("\npemodelan berlebih terparah pada k =",
        tabel$k[which.max(tabel$jarak)], "\n")

    matplot(nilai_k, banding, type = "b", pch = c(19, 17), lwd = 2, lty = 1,
            col = c("#C0392B", "#0B6FB4"), log = "x",
            xlab = "k (skala log)", ylab = "Akurasi",
            main = "Kinerja Latih dan Uji")
    legend("bottomright", c("latih", "uji"), bty = "n",
           col = c("#C0392B", "#0B6FB4"), lwd = 2, pch = c(19, 17))
  interpretasi: |
    Kolom jarak antara akurasi latih dan uji adalah ukuran langsung pemodelan berlebih (*overfitting*), dan nilainya terbesar pada k bernilai satu. Pada k tersebut model menghafal sempurna data latih sebab tiap amatan menjadi tetangga terdekat bagi dirinya sendiri. Untuk pemilihan ukuran penilaian: penapisan penyakit mengutamakan recall karena biaya melewatkan kasus jauh lebih besar daripada memeriksa orang sehat; penandaan transaksi mencurigakan mengutamakan presisi karena tiap penandaan menuntut pemeriksaan manual yang mahal; kelas gagal bayar tiga persen menuntut F1 atau AUC sebab akurasi akan tampak sangat tinggi tanpa makna; sedangkan promosi berbiaya rendah dapat mengutamakan recall karena kekeliruan menandai hanya berbiaya kecil.
- id: L6.D
  points: 10
  solution: 'Membetulkan kode: penstrataan, penilaian pada data uji, kolom peluang, dan validasi silang.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(rsample); library(yardstick); library(tune); library(dplyr)})

    # (a) penstrataan pada data timpang
    set.seed(2026)
    bagi <- initial_split(kredit, prop = 0.75, strata = gagal_bayar)
    lat <- training(bagi); uji <- testing(bagi)

    # (b) penilaian pada data UJI, bukan data latih
    model <- fit(wf, data = lat)
    d <- predict(model, uji) |>
      bind_cols(predict(model, uji, type = "prob")) |>
      bind_cols(uji |> select(gagal_bayar))
    accuracy(d, gagal_bayar, .pred_class)

    # (c) roc_auc memerlukan kolom PELUANG
    roc_auc(d, gagal_bayar, .pred_ya)

    # (d) pemilihan k memakai validasi silang pada data latih
    spec_t <- nearest_neighbor(neighbors = tune()) |>
      set_engine("kknn") |> set_mode("classification")
    wf_t <- workflow() |> add_recipe(rec) |> add_model(spec_t)
    set.seed(2026)
    lipatan <- vfold_cv(lat, v = 5, strata = gagal_bayar)
    hasil <- tune_grid(wf_t, resamples = lipatan,
                       grid = data.frame(neighbors = c(3, 5, 9, 15)),
                       metrics = metric_set(roc_auc))
    select_best(hasil, metric = "roc_auc")

    # pemeriksaan wajib
    abs(mean(lat$gagal_bayar == "ya") - mean(uji$gagal_bayar == "ya")) < 0.02
  interpretasi: |
    Empat kesalahan diperbaiki. Pertama, tanpa penstrataan proporsi kelas minoritas pada data uji dapat menyimpang jauh sehingga penilaiannya tidak stabil. Kedua, menilai pada data latih mengukur kemampuan menghafal, bukan meramal --- dan kekeliruan ini tidak menimbulkan galat sehingga sukar terdeteksi. Ketiga, roc_auc menuntut kolom peluang sebab ia menilai seluruh ambang sekaligus; memberinya kolom kelas menimbulkan galat yang justru menolong karena langsung terlihat. Keempat, dan paling parah, mencoba beberapa nilai k pada data uji lalu memilih yang terbaik mengubah data uji menjadi data latih terselubung; angka akhirnya tidak lagi menggambarkan kinerja pada data baru.
- id: T6.1
  points: 50
  solution: 'Penugasan: kerangka supervised learning lengkap dengan pembuktian validitas penilaian.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |
    suppressPackageStartupMessages({
      library(rsample); library(recipes); library(parsnip); library(workflows)
      library(tune); library(yardstick); library(dplyr)})

    kredit <- read.csv("data/data_kredit.csv", stringsAsFactors = TRUE)
    kredit$gagal_bayar <- factor(kredit$gagal_bayar, levels = c("ya", "tidak"))

    # 1) ketimpangan
    prop <- prop.table(table(kredit$gagal_bayar))
    cat("proporsi:", round(prop, 4),
        "| rasio:", round(max(prop)/min(prop), 2),
        "| acuan:", round(max(prop), 4), "\n")

    # 2) pembagian berstrata dan pembuktiannya
    set.seed(2026)
    bagi <- initial_split(kredit, prop = 0.75, strata = gagal_bayar)
    lat <- training(bagi); uji <- testing(bagi)
    print(round(rbind(seluruh = prop.table(table(kredit$gagal_bayar)),
                      latih = prop.table(table(lat$gagal_bayar)),
                      uji = prop.table(table(uji$gagal_bayar))), 4))

    # 3) resep bagi model berbasis jarak
    rec <- recipe(gagal_bayar ~ ., data = lat) |>
      update_role(id, new_role = "penanda") |>
      step_impute_median(all_numeric_predictors()) |>
      step_dummy(all_nominal_predictors()) |>
      step_normalize(all_numeric_predictors())

    # 4-5) model, matriks kekeliruan, dan ukuran
    spec <- nearest_neighbor(neighbors = 9) |>
      set_engine("kknn") |> set_mode("classification")
    wf <- workflow() |> add_recipe(rec) |> add_model(spec)
    model <- fit(wf, data = lat)
    duga <- predict(model, uji) |>
      bind_cols(predict(model, uji, type = "prob")) |>
      bind_cols(uji |> select(gagal_bayar))
    print(conf_mat(duga, gagal_bayar, .pred_class))
    print(metric_set(yardstick::accuracy, yardstick::precision, yardstick::recall,
                 yardstick::f_meas, yardstick::specificity)(
      duga, truth = gagal_bayar, estimate = .pred_class))
    cat("AUC:", round(roc_auc(duga, gagal_bayar, .pred_ya)$.estimate, 4),
        "| acuan:", round(max(prop.table(table(uji$gagal_bayar))), 4), "\n")

    # 6) pertukaran presisi-recall
    amb <- seq(0.1, 0.9, by = 0.1)
    pr <- t(sapply(amb, function(t) {
      d <- duga
      d$dg <- factor(ifelse(d$.pred_ya > t, "ya", "tidak"), levels = c("ya","tidak"))
      c(presisi = yardstick::precision(d, gagal_bayar, dg)$.estimate,
        recall = yardstick::recall(d, gagal_bayar, dg)$.estimate,
        F1 = yardstick::f_meas(d, gagal_bayar, dg)$.estimate)
    }))
    print(round(cbind(ambang = amb, pr), 4))

    # 7) validasi silang
    set.seed(2026)
    lipatan <- vfold_cv(lat, v = 5, strata = gagal_bayar)
    cv <- fit_resamples(wf, resamples = lipatan,
                        metrics = metric_set(roc_auc, f_meas, accuracy))
    print(collect_metrics(cv) |> mutate(across(where(is.numeric), \(x) round(x, 4))))

    # 9-10) penalaan dan penyelesaian
    spec_t <- nearest_neighbor(neighbors = tune()) |>
      set_engine("kknn") |> set_mode("classification")
    wf_t <- workflow() |> add_recipe(rec) |> add_model(spec_t)
    set.seed(2026)
    tun <- tune_grid(wf_t, resamples = lipatan,
                     grid = data.frame(neighbors = c(3,5,9,15,25,41)),
                     metrics = metric_set(roc_auc))
    print(collect_metrics(tun) |> select(neighbors, mean, std_err) |>
            mutate(across(where(is.numeric), \(x) round(x, 4))))
    akhir <- last_fit(finalize_workflow(wf_t, select_best(tun, metric = "roc_auc")),
                      split = bagi, metrics = metric_set(roc_auc, f_meas, accuracy))
    print(collect_metrics(akhir))
  interpretasi: |
    Nomor 2 menuntut pembuktian berupa tabel, bukan pernyataan; ketiga baris yang nyaris sama adalah buktinya. Nomor 5 adalah inti penilaian: bila akurasi berdekatan dengan acuan mayoritas dan AUC mendekati setengah, maka model belum menyumbang apa pun --- dan pada data yang peubahnya dibangkitkan saling bebas terhadap sasaran, itulah hasil yang benar dan wajib dilaporkan apa adanya. Melaporkan sebaliknya berarti mengarang. Pada nomor 9, bila selisih rata-rata antar-nilai k lebih kecil daripada galat bakunya, pemilihan terbaik sesungguhnya sembarang sehingga memilih model yang lebih sederhana lebih dapat dipertanggungjawabkan. Nomor 10 menegaskan bahwa data uji hanya disentuh sekali, setelah seluruh keputusan diambil lewat validasi silang.
