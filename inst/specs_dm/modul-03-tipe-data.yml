exercises:
- id: L3.1
  points: 15
  solution: 'Tingkat Dasar: prcomp, ukuran graf, dan tokenisasi.'
  judul_r: Solusi Tingkat Dasar (R)
  solusi_r: |
    dim_data <- read.csv("data/data_dimensi.csv")
    X <- dim_data[, paste0("x", 1:8)]
    pc <- prcomp(X, scale. = TRUE)          # dibakukan
    ragam <- pc$sdev^2 / sum(pc$sdev^2)     # proporsi keragaman

    suppressPackageStartupMessages(library(igraph))
    rel <- read.csv("data/data_relasi.csv")
    rel <- rel[rel$dari != rel$ke, ]
    g <- graph_from_data_frame(rel[, c("dari","ke")], directed = FALSE)
    cat("simpul:", vcount(g), "sisi:", ecount(g), "\n")

    teks <- c("pelayanan cepat dan baik", "antrean lambat sekali")
    token <- lapply(strsplit(tolower(teks), "[^a-z]+"),
                    function(x) x[nchar(x) > 2])
    kosakata <- sort(unique(unlist(token)))
  interpretasi: |
    Isian yang benar berturut-turut adalah prcomp, TRUE, sum, graph_from_data_frame, vcount, ecount, tolower, dan unique. Argumen scale bernilai TRUE menjalankan analisis atas matriks korelasi, bukan matriks ragam-peragam; keduanya memberi hasil berbeda ketika satuan peubah tidak sama. Fungsi tolower wajib mendahului pemecahan agar huruf besar tidak menghasilkan istilah yang terhitung berbeda.
- id: L3.2
  points: 25
  solution: 'Tingkat Menengah dan Lanjut: kontras jarak pada data nyata dan penentuan perlakuan.'
  judul_r: Solusi Menengah dan Lanjut (R)
  solusi_r: |
    dim_data <- read.csv("data/data_dimensi.csv")

    kontras_kolom <- function(d, p) {
      X <- scale(d[, paste0("x", 1:p)])     # dibakukan agar sebanding
      m <- as.matrix(dist(X)); v <- m[upper.tri(m)]
      (max(v) - min(v)) / min(v)
    }
    p_uji <- c(2, 4, 6, 8)
    hasil <- sapply(p_uji, function(p) kontras_kolom(dim_data, p))
    tabel <- data.frame(peubah = p_uji, kontras = round(hasil, 3))
    print(tabel, right = FALSE)

    plot(p_uji, hasil, type = "b", pch = 19, col = "#0B6FB4", lwd = 2,
         xlab = "Banyaknya peubah", ylab = "Kontras jarak",
         main = "Kontras Jarak pada Data Dimensi")
    grid(col = "grey85")
  interpretasi: |
    Pembakuan dilakukan lebih dahulu agar perbandingan antar-banyaknya peubah adil; tanpa itu, peubah bersatuan besar akan mendominasi jarak. Polanya sejalan dengan peragaan pada Contoh 3.1 --- kontras menyusut seiring bertambahnya peubah --- tetapi besarnya berbeda karena delapan peubah masih tergolong sedikit, sedangkan peragaan awal mencapai dua ratus dimensi. Penurunan yang tampak landai pada rentang kecil inilah yang menjelaskan mengapa kutukan dimensi kerap tidak disadari sampai peubahnya benar-benar banyak.
- id: L3.D
  points: 10
  solution: 'Membetulkan kode: pembakuan PCA, kuadrat sdev, graf tak berarah, dan kata henti.'
  judul_r: Solusi Membetulkan Kode (R)
  solusi_r: |
    suppressPackageStartupMessages(library(igraph))
    dim_data <- read.csv("data/data_dimensi.csv")
    X <- dim_data[, paste0("x", 1:8)]

    # (a) pembakuan wajib bila satuan peubah berbeda
    pc <- prcomp(X, scale. = TRUE)

    # (b) proporsi keragaman memakai KUADRAT simpangan baku
    ragam <- pc$sdev^2 / sum(pc$sdev^2)

    # (c) hubungan timbal balik -> tak berarah, gelang dan sisi ganda dibuang
    rel <- read.csv("data/data_relasi.csv")
    rel <- rel[rel$dari != rel$ke, ]
    g <- simplify(graph_from_data_frame(rel[, c("dari","ke")], directed = FALSE))

    # (d) kata henti dibuang
    teks <- c("pelayanan cepat dan baik", "antrean lambat dan panjang")
    henti <- c("dan", "yang", "di", "ke", "dari")
    token <- lapply(strsplit(tolower(teks), "[^a-z]+"),
                    function(x) setdiff(x[nchar(x) > 2], henti))

    # pemeriksaan wajib
    round(sum(ragam), 8)        # 1
    is_directed(g)              # FALSE
  interpretasi: |
    Empat kesalahan diperbaiki. Pertama, prcomp tanpa pembakuan bekerja atas matriks ragam-peragam sehingga peubah bersatuan besar mendominasi komponen pertama semata karena satuannya. Kedua, proporsi keragaman dihitung dari ragam, yaitu kuadrat simpangan baku; memakai simpangan baku langsung menghasilkan angka yang tetap berjumlah satu tetapi maknanya keliru sehingga kekeliruannya sukar terdeteksi. Ketiga, graf berarah pada hubungan timbal balik menggandakan sisi dan mengacaukan seluruh ukuran sentralitas. Keempat, kata henti yang tidak dibuang mendominasi kosakata tanpa menyumbang makna.
- id: T3.1
  points: 50
  solution: 'Penugasan: dimensi tinggi, jaringan, dan teks beserta penilaian perlakuannya.'
  judul_r: Solusi Penugasan (R)
  solusi_r: |
    suppressPackageStartupMessages(library(igraph))
    dim_data <- read.csv("data/data_dimensi.csv")

    # 1) kontras jarak menurut banyaknya peubah
    kontras_kolom <- function(d, p) {
      X <- scale(d[, paste0("x", 1:p)])
      m <- as.matrix(dist(X)); v <- m[upper.tri(m)]
      (max(v) - min(v)) / min(v)
    }
    p_uji <- c(2, 4, 6, 8)
    k <- sapply(p_uji, function(p) kontras_kolom(dim_data, p))
    print(data.frame(peubah = p_uji, kontras = round(k, 3)), right = FALSE)

    # 2) PCA, scree, dan kumulatif
    X <- dim_data[, paste0("x", 1:8)]
    pc <- prcomp(X, scale. = TRUE)
    ragam <- pc$sdev^2 / sum(pc$sdev^2)
    par(mfrow = c(1, 2))
    plot(ragam, type = "b", pch = 19, col = "#0B6FB4", main = "Scree",
         xlab = "Komponen", ylab = "Proporsi")
    abline(h = 1/ncol(X), col = "#F58220", lty = 2)
    plot(cumsum(ragam), type = "b", pch = 19, col = "#0B6FB4", ylim = c(0,1),
         main = "Kumulatif", xlab = "Komponen", ylab = "Kumulatif")
    abline(h = 0.8, col = "#F58220", lty = 2)
    par(mfrow = c(1, 1))
    c(aturan_merata = sum(ragam > 1/ncol(X)),
      aturan_80persen = which(cumsum(ragam) >= 0.8)[1])

    # 3) muatan komponen pertama
    round(sort(abs(pc$rotation[, 1]), decreasing = TRUE), 3)

    # 4-5) jaringan dan sentralitas
    rel <- read.csv("data/data_relasi.csv")
    rel <- rel[rel$dari != rel$ke, ]
    g <- simplify(graph_from_data_frame(rel[, c("dari","ke")], directed = FALSE))
    cat("simpul:", vcount(g), "sisi:", ecount(g),
        "kerapatan:", round(edge_density(g), 4),
        "komponen:", components(g)$no, "\n")
    sentral <- data.frame(simpul = V(g)$name, derajat = degree(g),
                          kedekatan = closeness(g), keperantaraan = betweenness(g))
    for (u in c("derajat","kedekatan","keperantaraan"))
      cat(u, ":", paste(sentral$simpul[order(-sentral[[u]])][1:5], collapse=", "), "\n")

    # 6) komunitas dan modularitas
    set.seed(2026)
    kom <- cluster_louvain(g)
    cat("komunitas:", length(sizes(kom)),
        "| modularitas:", round(modularity(kom), 4), "\n")

    # 7-8) teks, termasuk kalimat menjebak
    ulasan <- c("pelayanan cepat dan ramah", "antrean panjang sangat lambat",
                "aplikasi mudah digunakan", "petugas sulit dihubungi",
                "prosesnya memuaskan sekali", "sistem sering bermasalah",
                "hasilnya baik walau agak lama", "tidak buruk untuk ukuran gratis",
                "wah cepat sekali sampai tiga hari", "layanan ramah dan cepat")
    henti <- c("dan","yang","di","ke","dari","sangat","sekali","untuk","agak","walau")
    token <- lapply(strsplit(tolower(ulasan), "[^a-z]+"),
                    function(x) setdiff(x[nchar(x) > 2], henti))
    kosakata <- sort(unique(unlist(token)))
    dtm <- t(sapply(token, function(t) as.integer(kosakata %in% t)))
    colnames(dtm) <- kosakata
    cat("DTM:", nrow(dtm), "x", ncol(dtm),
        "| kejarangan:", round(mean(dtm == 0) * 100, 1), "persen\n")

    positif <- c("cepat","ramah","mudah","memuaskan","baik")
    negatif <- c("panjang","lambat","sulit","bermasalah","buruk","lama")
    skor <- sapply(token, function(t) sum(t %in% positif) - sum(t %in% negatif))
    print(data.frame(skor, teks = substr(ulasan, 1, 32)), right = FALSE)
  interpretasi: |
    Nomor 2 sengaja meminta kedua aturan dihitung sekaligus, sebab keduanya kerap memberi jawaban berbeda dan pemilihannya harus dijelaskan, bukan dipilih diam-diam. Nomor 3 memakai nilai mutlak muatan karena tanda hanya menyatakan arah, bukan besarnya sumbangan. Pada nomor 6, modularitas rendah pada jaringan yang dibangkitkan acak justru merupakan temuan yang benar dan wajib dilaporkan apa adanya --- algoritma Louvain selalu mengembalikan pengelompokan, sehingga keberadaan komunitas tidak boleh disimpulkan dari keluarannya saja. Nomor 8 adalah inti pelajaran modul: kalimat kedelapan bernegasi dan kesembilan bersindir, dan keduanya akan disalahlabeli oleh pendekatan leksikon. Kekeliruan itu bukan cacat kode melainkan batas pendekatannya, dan menyadari batas itu jauh lebih penting daripada memperoleh skor yang tampak rapi.
