  - contoh: Permintaan HTTP yang santun
    narasi: |-
      \kode[Python]{requests dengan penanganan galat}

      ```{python, eval=FALSE}
      import requests, time

      def ambil_santun(url, jeda=1.0, coba=3, tunggu=10):
          """Mengambil laman dengan jeda, batas waktu, dan pengulangan berlipat."""
          kepala = {"User-Agent": "PraktikumSTIS/1.0 (keperluan pendidikan)"}
          for i in range(coba):
              try:
                  r = requests.get(url, headers=kepala, timeout=tunggu)
                  if r.status_code == 200:
                      return r.text
                  if r.status_code == 429:              # terlalu banyak permintaan
                      time.sleep(jeda * (2 ** i))       # jeda berlipat
                      continue
                  print(f"status {r.status_code}; berhenti")
                  return None
              except requests.RequestException as e:
                  print(f"percobaan {i+1} gagal: {type(e).__name__}")
                  time.sleep(jeda * (2 ** i))
          return None

      # Fungsi ini TIDAK dijalankan pada praktikum; disajikan sebagai acuan.
      print("Fungsi ambil_santun siap dipakai bila kelak merayapi situs sungguhan.")
      ```

      \begin{kotakpenjelasan}
      Fungsi ini menggabungkan empat kebiasaan baik. Penanda User-Agent menyebutkan identitas dan keperluan secara jujur. Argumen timeout membatasi waktu tunggu. Kode status 429 ditanggapi dengan jeda yang berlipat dua setiap percobaan. Blok try dan except menangkap kegagalan jaringan agar program tidak berhenti.

      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Perhatikan bahwa hanya status 200 yang dianggap berhasil; status lain ditangani secara berbeda sesuai maknanya. Perhatikan pula bahwa fungsi ini sengaja tidak dijalankan pada praktikum, sejalan dengan prinsip modul untuk tidak membebani peladen pihak mana pun. Menyebutkan identitas pada User-Agent juga merupakan praktik yang dianjurkan agar penyedia dapat menghubungi bila terjadi persoalan.

      \end{kotakinterpretasi}
