    ```{python, eval=FALSE}
    from bs4 import BeautifulSoup
    import pandas as pd
  - |-
    with open("data/laman_contoh.html", encoding="utf-8") as f:
        sup = BeautifulSoup(f, "html.parser")
  - |-
    # (a) find mengembalikan satu elemen, bukan daftar
    tab = sup.find("table", id="tabel-wilayah")
  - |-
    # (b) kepala kolom berada pada thead, bukan tbody
    kepala = [th.get_text(strip=True) for th in tab.find("thead").find_all("th")]
    isi = [[td.get_text(strip=True) for td in tr.find_all("td")]
           for tr in tab.find("tbody").find_all("tr")]
    df = pd.DataFrame(isi, columns=kepala)
  - |-
    # (c) errors='coerce' agar kegagalan menjadi NaN
    df["Penduduk"] = pd.to_numeric(df["Penduduk"], errors="coerce")
  - |-
    # (d) hasil konversi diperiksa
    print("gagal dikonversi:", int(df["Penduduk"].isna().sum()))
  - |-
    # pemeriksaan wajib
    print(df.shape)                                   # (5, 4)
    print(int(df["Penduduk"].isna().sum()) == 0)      # True
  - '```'
  - |-
    \begin{kotakinterpretasi}
    Empat kesalahan diperbaiki. Pertama, find\_all mengembalikan daftar sehingga pemanggilan find berikutnya gagal dengan pesan yang tidak menunjuk sebab sebenarnya. Kedua, elemen th berada pada thead; mencarinya pada tbody menghasilkan daftar kosong sehingga kolom DataFrame tidak bernama. Ketiga, to\_numeric tanpa errors menghentikan program pada nilai pertama yang gagal, padahal pada perayapan kegagalan justru lazim terjadi. Keempat, tanpa pemeriksaan, nilai yang berubah menjadi NaN hilang tanpa disadari --- inilah bentuk kehilangan data yang paling berbahaya karena tidak menimbulkan galat.
  - \end{kotakinterpretasi}
