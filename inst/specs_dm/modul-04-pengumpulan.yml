  - contoh: Memeriksa ketentuan sebelum mengambil data
    narasi: |-
      \kode[Python]{menguraikan robots.txt}

      ```{python, eval=FALSE}
      # Contoh isi robots.txt (disalin sebagai teks, bukan diunduh)
      robots = """\nUser-agent: *\nDisallow: /admin/\nDisallow: /internal/\nAllow: /publik/\nCrawl-delay: 10\n"""

      aturan = {"disallow": [], "allow": [], "crawl_delay": None}
      for baris in robots.strip().split("\n"):
          if ":" not in baris:
              continue
          kunci, nilai = [b.strip() for b in baris.split(":", 1)]
          kunci = kunci.lower()
          if kunci == "disallow":
              aturan["disallow"].append(nilai)
          elif kunci == "allow":
              aturan["allow"].append(nilai)
          elif kunci == "crawl-delay":
              aturan["crawl_delay"] = int(nilai)

      print(aturan)

      def boleh(jalur, aturan):
          for d in aturan["disallow"]:
              if jalur.startswith(d):
                  return False
          return True

      for jalur in ["/publik/data.html", "/admin/pengguna", "/internal/log"]:
          print(f"{jalur:24s} -> {'boleh' if boleh(jalur, aturan) else 'TIDAK boleh'}")
      ```

      \begin{kotakpenjelasan}
      Isi robots.txt diuraikan baris demi baris. Setiap baris dipecah pada tanda titik dua pertama menjadi kunci dan nilai, lalu dikelompokkan menurut jenis ketentuannya. Fungsi boleh memeriksa apakah suatu jalur diawali salah satu ketentuan larangan.

      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Pemeriksaan semacam ini seharusnya menjadi langkah pertama, bukan langkah yang dilewati. Perhatikan bahwa Crawl-delay bernilai sepuluh berarti penyedia meminta jeda sepuluh detik antar-permintaan; mengabaikannya berarti mengabaikan permintaan yang jelas tertulis. Perlu dicatat bahwa penguraian sederhana ini tidak mencakup seluruh kaidah robots.txt, dan pustaka urllib.robotparser tersedia untuk keperluan yang lebih lengkap.

      \end{kotakinterpretasi}
  - contoh: Membaca dan menelusuri struktur laman
    narasi: |-
      \kode[Python]{BeautifulSoup dan find}

      ```{python, eval=FALSE}
      from bs4 import BeautifulSoup

      with open("data/laman_contoh.html", encoding="utf-8") as f:
          sup = BeautifulSoup(f, "html.parser")

      print("judul:", sup.title.string)
      print("banyaknya tabel:", len(sup.find_all("table")))
      print("banyaknya tautan:", len(sup.find_all("a", href=True)))

