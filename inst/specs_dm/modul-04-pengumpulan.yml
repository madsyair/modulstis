body:
  deskripsi:
  - Tiga modul sebelumnya bekerja dengan data yang sudah tersedia sebagai berkas. Dalam praktik, data
    kerap harus dikumpulkan lebih dahulu, dan sumbernya sering berupa laman web maupun antarmuka pemrograman.
    Modul ini membahas cara memperolehnya beserta pertimbangan yang menyertainya.
  - Perlu ditegaskan sejak awal bahwa kemampuan teknis mengambil data dari internet tidak dengan sendirinya
    membuat pengambilan itu boleh dilakukan. Persoalan hukum, etika, dan beban terhadap peladen pihak
    lain sama pentingnya dengan persoalan teknis. Karena itu bagian Teori memuat pembahasan etika sebelum
    contoh teknisnya, bukan sesudahnya.
  - 'Modul ini memakai **Python**, bukan R. Alasannya bukan preferensi melainkan kematangan perkakas:
    pustaka `requests` dan `BeautifulSoup` menyediakan penanganan permintaan HTTP dan penelusuran struktur
    dokumen yang lebih lengkap dan lebih terdokumentasi untuk keperluan ini.'
  - |-
    \begin{kotakperhatian}[Tidak merayapi situs sungguhan]
    Seluruh contoh pada modul ini bekerja atas \textbf{laman tiruan} yang disediakan sebagai berkas lokal. Praktikum ini \textbf{tidak} merayapi situs mana pun di internet. Dengan begitu latihan dapat diulang kapan saja, hasilnya tetap sama, dan tidak ada peladen pihak lain yang terbebani.
    \end{kotakperhatian}
  - \vspace{1.2em}
  tujuan:
  - 'Setelah menyelesaikan praktikum ini secara tuntas, mahasiswa diharapkan mampu:'
  - 1. **Menjelaskan** perbedaan pengumpulan data melalui berkas, API, dan perayapan.
  - 2. **Menerapkan** pertimbangan etika dan hukum sebelum mengumpulkan data.
  - 3. **Membaca** berkas `robots.txt` dan menafsirkan ketentuannya.
  - 4. **Menelusuri** struktur dokumen HTML untuk menemukan bagian yang diperlukan.
  - 5. **Mengekstrak** tabel HTML menjadi DataFrame yang bertipe benar.
  - 6. **Menangani** kegagalan permintaan secara santun beserta jeda antar-permintaan.
  - 7. **Menilai** mutu dan keterwakilan data hasil pengumpulan.
  - \vspace{1.2em}
  alat:
  - 'Perangkat dan bahan yang diperlukan:'
  - '- **Python** dengan pustaka `requests`, `beautifulsoup4`, dan `pandas`.'
  - '- **R** dengan paket `rvest` dan `dplyr` untuk Bagian 4.8 (padanan dalam R).'
  - '- Pasang dengan `pip install requests beautifulsoup4 pandas`.'
  - '- Berkas tiruan pada folder `data/` --- seluruhnya **lokal**, tidak ada yang diunduh:'
  - |-
    | Berkas | Isi |
    |:-------|:----|
    | `laman_contoh.html` | laman bertabel tunggal |
    | `daftar_1.html`, `daftar_2.html`, `daftar_3.html` | daftar berhalaman dengan tautan |
    | `detail_a.html` ... `detail_i.html` | laman rincian tiap wilayah |
    | `api_wilayah.json` | tiruan tanggapan API |
    | `umpan_rilis.xml` | tiruan umpan RSS |
    | `laman_versi_baru.html` | laman yang tata letaknya berubah |
    | `robots_tiruan.txt` | tiruan berkas ketentuan perayapan |
    | `data_perbandingan.csv` | data pembanding |
  - Berkas `buat_laman.py` memuat kode pembangkit seluruh berkas tiruan itu.
  - \vspace{1.2em}
  instruksi:
  - 'Ikuti tahapan berikut:'
  - '**Sebelum praktikum:** pasang ketiga pustaka Python; pastikan berkas `laman_contoh.html` berada pada
    subfolder `data/`.'
  - '**Selama praktikum:** kerjakan Contoh berurutan. Bacalah bagian etika pada Teori sebelum menjalankan
    kode apa pun.'
  - '**Pembagian kerja:** Contoh dan Latihan dikerjakan di kelas; **Penugasan dikerjakan di luar sesi**.'
  - '**Pengumpulan:** susun laporan R Markdown yang memuat potongan kode Python beserta keluarannya, render
    ke PDF atau HTML, kumpulkan melalui Google Classroom.'
  - \vspace{1.2em}
  teori:
  - '### Kedudukan pada CRISP-DM'
  - 'Modul ini berada pada tahap Data Understanding, khususnya langkah pengumpulan data awal. Perlu diingat
    bahwa tahap ini datang setelah Business Understanding: data dikumpulkan untuk menjawab persoalan yang
    sudah dirumuskan, bukan dikumpulkan lebih dahulu lalu dicarikan persoalannya.'
  - '### Tiga Cara Memperoleh Data'
  - |-
    \begin{kotakinfo}[Perbandingan tiga cara]\par\smallskip
    \begin{tabular}{@{}p{2.6cm}p{3.6cm}p{4.0cm}p{3.8cm}@{}}
     & \textbf{Berkas} & \textbf{API} & \textbf{Perayapan}\\
    \hline
    Bentuk & terstruktur & terstruktur & tak terstruktur\\[2pt]
    Kestabilan & tinggi & tinggi & rendah\\[2pt]
    Izin & jelas & jelas & kerap kabur\\[2pt]
    Usaha & rendah & sedang & tinggi\\[2pt]
    Risiko & rendah & rendah & tinggi\\
    \end{tabular}
    \end{kotakinfo}
  - Urutan pertimbangan yang sehat adalah dari kiri ke kanan. Bila data tersedia sebagai berkas unduhan,
    ambil dari sana. Bila tidak, periksa apakah penyedia menyediakan API. Perayapan ditempuh hanya ketika
    kedua jalan sebelumnya tertutup, sebab ia paling rapuh terhadap perubahan tata letak laman dan paling
    besar risikonya.
  - '### Etika dan Ketentuan'
  - Sebelum menulis kode, empat hal perlu dipastikan. Pertama, apakah ketentuan layanan situs mengizinkan
    pengambilan otomatis. Kedua, apa yang tercantum pada berkas robots.txt. Ketiga, apakah data yang diambil
    memuat informasi pribadi. Keempat, seberapa besar beban yang ditimbulkan bagi peladen penyedia.
  - |-
    \begin{kotakinfo}[Membaca robots.txt]
    Berkas ini diletakkan pada akar situs, misalnya \texttt{contoh.id/robots.txt}, dan memuat ketentuan bagi perayap otomatis:\\[4pt]
    \begin{tabular}{@{}p{3.6cm}p{10.8cm}@{}}
    \texttt{User-agent: *} & ketentuan berlaku bagi semua perayap\\[2pt]
    \texttt{Disallow: /admin/} & bagian ini tidak boleh dirayapi\\[2pt]
    \texttt{Allow: /publik/} & bagian ini diizinkan\\[2pt]
    \texttt{Crawl-delay: 10} & beri jeda 10 detik antar-permintaan\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[robots.txt bukan pengaman]
    Berkas robots.txt adalah \textbf{permintaan}, bukan penghalang teknis; secara teknis ia dapat diabaikan begitu saja. Justru karena itulah mematuhinya menjadi soal etika, bukan soal kemampuan. Mengabaikannya dapat berakibat alamat IP diblokir, dan pada kasus tertentu berujung persoalan hukum.
    \end{kotaksalah}
  - Beban terhadap peladen kerap terlupakan. Perayap yang mengirim ratusan permintaan per detik dapat
    memperlambat layanan bagi pengguna lain, dan dampaknya tidak berbeda dari serangan penolakan layanan
    meski niatnya berbeda. Karena itu jeda antar-permintaan bukan kesopanan berlebihan melainkan keharusan.
  - '### Menilai Keterwakilan Data Daring'
  - 'Persoalan terbesar data hasil pengumpulan daring bukan pada mutu teknisnya melainkan pada keterwakilannya.
    Survei terancang menetapkan kerangka dan peluang terpilih, sehingga dugaannya dapat dipertanggungjawabkan.
    Data daring tidak memiliki keduanya: yang tercakup adalah yang kebetulan tercatat.'
  - |-
    \begin{kotakinfo}[Tiga pertanyaan keterwakilan]\par\smallskip
    \begin{tabular}{@{}p{3.6cm}p{10.8cm}@{}}
    \textbf{Siapa tercakup?} & kelompok mana yang terwakili dan mana yang tidak sama sekali\\[3pt]
    \textbf{Mengapa tercakup?} & apakah keterpilihan berkaitan dengan peubah yang diteliti\\[3pt]
    \textbf{Berubahkah cakupannya?} & apakah kelompok yang tercakup berubah antar-waktu\\
    \end{tabular}
    \end{kotakinfo}
  - Pertanyaan kedua paling menentukan. Bila keterpilihan berkaitan dengan peubah yang diteliti --- misalnya
    menghitung tingkat pengangguran dari lowongan daring, padahal pencari kerja tanpa akses internet tidak
    tercatat --- maka biasnya bersifat sistematis dan tidak dapat diperbaiki dengan memperbesar data.
  - |-
    \begin{kotaksalah}[Data besar tidak menyembuhkan bias seleksi]
    Memperbesar data hanya mengecilkan galat acak, tidak mengurangi bias seleksi. Contoh berjuta amatan dari kelompok yang keliru tetap menduga hal yang keliru --- bahkan dengan selang kepercayaan yang menyesatkan karena tampak sangat sempit. Inilah sebabnya kantor statistik memperlakukan data daring sebagai pelengkap, bukan pengganti survei.
    \end{kotaksalah}
  - '### Struktur Dokumen HTML'
  - Laman web tersusun sebagai pohon elemen bersarang. Setiap elemen ditandai tag pembuka dan penutup,
    dan dapat memiliki atribut seperti id maupun class yang berguna sebagai penanda saat penelusuran.
  - |-
    \begin{kotakinfo}[Elemen yang lazim dicari]\par\smallskip
    \begin{tabular}{@{}p{2.4cm}p{5.0cm}p{6.8cm}@{}}
    \textbf{Tag} & \textbf{Arti} & \textbf{Cara mencarinya}\\
    \hline
    \texttt{table} & tabel & \texttt{find("table", id="...")}\\[2pt]
    \texttt{tr} & baris tabel & \texttt{find\_all("tr")}\\[2pt]
    \texttt{td}, \texttt{th} & sel isi dan sel kepala & \texttt{find\_all("td")}\\[2pt]
    \texttt{a} & tautan & \texttt{find\_all("a", href=True)}\\[2pt]
    \texttt{ul}, \texttt{li} & daftar & \texttt{select("ul.kelas li")}\\
    \end{tabular}
    \end{kotakinfo}
  - '### Bentuk Data yang Ditemui di Web'
  - |-
    \begin{kotakinfo}[Empat bentuk dan cara menanganinya]\par\smallskip
    \begin{tabular}{@{}p{2.6cm}p{4.6cm}p{7.0cm}@{}}
    \textbf{Bentuk} & \textbf{Ciri} & \textbf{Penanganan}\\
    \hline
    HTML statis & isi ada pada sumber laman & BeautifulSoup memadai\\[2pt]
    HTML dinamis & isi dimuat JavaScript & perlu peramban terotomasi\\[2pt]
    JSON & terstruktur, bertipe & json.loads langsung\\[2pt]
    XML/RSS & bersarang, berskema & penguraian khusus\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[Isi yang tidak ada pada sumber laman]
    Banyak situs modern memuat isinya lewat JavaScript setelah laman terbuka. Akibatnya \texttt{requests} hanya memperoleh kerangka kosong, dan mahasiswa kerap menyangka pemilihnya salah padahal isinya memang belum ada. Cara memeriksanya sederhana: cari potongan teks yang tampak di peramban pada hasil \texttt{r.text}. Bila tidak ditemukan, lamannya dinamis dan menuntut pendekatan berbeda --- atau, lebih baik, cari API yang menjadi sumber isinya.
    \end{kotaksalah}
  - '### Menakar Beban yang Ditimbulkan'
  - Beban terhadap peladen dapat diperkirakan sebelum perayapan dijalankan. Bila sebuah laman berukuran
    seratus lima puluh kilobita dan hendak diambil seribu laman, maka lalu lintas yang ditimbulkan mencapai
    sekitar seratus lima puluh megabita. Dengan jeda dua detik, pekerjaan itu memakan waktu lebih dari
    setengah jam --- dan justru lamanya waktu itulah yang membuatnya santun.
  - |-
    \begin{kotaktips}
    Sebelum merayapi banyak laman, hitung lebih dahulu perkiraan lalu lintas dan lamanya. Bila hasilnya tampak mengkhawatirkan, itu pertanda pendekatannya perlu ditinjau --- misalnya dengan mempersempit cakupan, memakai API, atau menanyakan ketersediaan data langsung kepada penyedianya. Cara terakhir ini sering dilupakan padahal paling sederhana.
    \end{kotaktips}
  - '### Menangani Kegagalan'
  - 'Permintaan jaringan dapat gagal karena berbagai sebab: peladen sibuk, jaringan terputus, atau alamat
    berubah. Kode yang baik memperkirakan kegagalan itu dan menanganinya, bukan berhenti mendadak. Tiga
    kebiasaan yang perlu dibangun adalah memeriksa kode status, membatasi waktu tunggu, dan mencoba ulang
    secukupnya dengan jeda yang membesar.'
  - |-
    \begin{kotakinfo}[Kode status yang sering ditemui]\par\smallskip
    \begin{tabular}{@{}p{1.6cm}p{4.4cm}p{8.2cm}@{}}
    \textbf{200} & berhasil & lanjutkan pengolahan\\[2pt]
    \textbf{403} & ditolak & tidak diizinkan; jangan dipaksa\\[2pt]
    \textbf{404} & tidak ditemukan & alamat keliru atau sudah dihapus\\[2pt]
    \textbf{429} & terlalu banyak permintaan & perlambat, perbesar jeda\\[2pt]
    \textbf{5xx} & galat pada peladen & coba lagi nanti, bukan segera\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaktips}
    Kode status 429 adalah tanda paling jelas bahwa laju permintaan Anda terlalu tinggi. Menanggapinya dengan mencoba ulang seketika justru memperburuk keadaan. Tanggapan yang benar adalah memperbesar jeda secara berlipat --- satu detik, dua, empat, dan seterusnya --- yang lazim disebut \emph{exponential backoff}.
    \end{kotaktips}
  - \newpage
  latihan:
  - Kerjakan bertahap. Gunakan `data/laman_contoh.html` dan `data/data_perbandingan.csv`. Seluruh latihan
    bekerja pada berkas lokal; **tidak ada yang merayapi internet**.
  - '#### Tingkat Dasar (melengkapi kode)'
  - \latihan{Menelusuri laman}
  - |-
    ```{python eval=FALSE}
    from bs4 import BeautifulSoup
    with open("data/laman_contoh.html", encoding="utf-8") as f:
        sup = ____(f, "html.parser")
    print(sup.title.string)
    tab = sup.____("table", id="tabel-wilayah")   # cari SATU elemen
    baris = tab.find("tbody").____("tr")           # cari SEMUA baris
    print("baris:", len(baris))
    ```
  - \latihan{Menyusun DataFrame}
  - |-
    ```{python eval=FALSE}
    import pandas as pd
    kepala = [th.get_text(strip=____) for th in tab.find("thead").find_all("th")]
    isi = [[td.get_text(strip=True) for td in tr.find_all("____")] for tr in baris]
    df = pd.____(isi, columns=kepala)
    ```
  - \latihan{Konversi tipe}
  - |-
    ```{python eval=FALSE}
    df["Penduduk"] = pd.____(df["Penduduk"], errors="____")  # numerik, gagal jadi NaN
    print(df.dtypes)
    ```
  - '#### Tingkat Menengah (menulis sendiri)'
  - \latihan{Ekstraksi lengkap}
  - 'Tulis satu fungsi `ekstrak(path)` yang menerima jalur berkas HTML dan mengembalikan DataFrame bertipe
    benar. Fungsi harus: (a) menguraikan laman; (b) mengambil tabel berdasarkan id; (c) mengubah ketiga
    kolom numerik; (d) mengembalikan pula daftar catatan metodologi. Uji pada `laman_contoh.html` dan
    tampilkan hasilnya.'
  - \latihan{Membetulkan kode yang salah}
  - Kode berikut memuat empat kesalahan (`find_all` dipakai saat hanya satu elemen dicari, `th` dicari
    pada tbody, konversi tanpa `errors`, dan tidak ada pemeriksaan hasil konversi). Temukan dan perbaiki,
    lalu jelaskan tiap kesalahannya.
  - |-
    ```{python eval=FALSE}
    from bs4 import BeautifulSoup
    import pandas as pd
  - |-
    with open("data/laman_contoh.html", encoding="utf-8") as f:
        sup = BeautifulSoup(f, "html.parser")
  - |-
    # (a) find_all mengembalikan daftar, bukan satu elemen
    tab = sup.find_all("table", id="tabel-wilayah")
  - |-
    # (b) th dicari pada tbody, padahal berada pada thead
    kepala = [th.get_text(strip=True) for th in tab.find("tbody").find_all("th")]
  - |-
    # (c) konversi tanpa errors -- gagal langsung menghentikan program
    df["Penduduk"] = pd.to_numeric(df["Penduduk"])
  - |-
    # (d) hasil konversi tidak diperiksa
    print(df.head())
    ```
  - '**Keluaran yang benar.** Setelah diperbaiki, kode yang dipakai adalah sebagai berikut.'
  - |-
    ```
    # (a) find mengembalikan satu elemen
    tab = sup.find("table", id="tabel-wilayah")
  - |-
    # (b) kepala kolom diambil dari thead
    kepala = [th.get_text(strip=True) for th in tab.find("thead").find_all("th")]
  - |-
    # (c) errors='coerce' agar kegagalan menjadi NaN, bukan menghentikan program
    df["Penduduk"] = pd.to_numeric(df["Penduduk"], errors="coerce")
  - |-
    # (d) hasil konversi diperiksa
    print("gagal dikonversi:", int(df["Penduduk"].isna().sum()))
    ```
  - 'Pemeriksaan yang wajib berhasil: `df.shape` bernilai **(5, 4)**, dan `int(df["Penduduk"].isna().sum())`
    bernilai **0**.'
  - \latihan{Memeriksa laman statis atau dinamis}
  - Baca `laman_contoh.html` sebagai teks mentah, lalu periksa apakah lima potongan teks yang tampak di
    tabel benar-benar ada pada sumbernya. Jelaskan mengapa pemeriksaan ini wajib dilakukan sebelum menulis
    pemilih.
  - \latihan{Menakar beban perayapan}
  - Hitung perkiraan lalu lintas dan lamanya untuk merayapi 50, 500, dan 5.000 laman dengan jeda 1 dan
    3 detik. Sajikan sebagai tabel enam baris, lalu tentukan pada skala berapa Anda menganggap perayapan
    tidak lagi layak beserta alasannya.
  - '#### Tingkat Lanjut (penilaian)'
  - \latihan{Merayapi seluruh halaman dan menggabungkannya}
  - |-
    (a) Rayapi ketiga laman daftar, lalu telusuri seluruh tautan rincian --- sembilan wilayah.
    (b) Gabungkan hasil daftar dan hasil rincian menjadi **satu** data frame. Periksa bahwa tidak ada wilayah yang hilang atau terduplikasi.
    (c) Ubah seluruh kolom angka menjadi numerik memakai fungsi `ambil_angka()` dari Contoh 4.12, lalu bandingkan hasilnya dengan `data/api_wilayah.json`. Apakah keduanya sama persis?
    (d) Bila ada selisih, jelaskan sebabnya dan tentukan sumber mana yang Anda percayai.
  - \latihan{Pemilih CSS}
  - 'Tulis satu baris pemilih CSS untuk masing-masing:'
  - |-
    (a) seluruh tautan di dalam tabel berkelas `daftar`;
    (b) elemen `dd` yang memiliki atribut `data-nilai`;
    (c) tautan `Berikutnya` saja, bukan `Sebelumnya`;
    (d) baris tabel pertama saja pada `tbody`.
  - Uji tiap jawaban dengan `select()`, lalu laporkan cacah elemen yang ditemukan.
  - \latihan{Memilih antara API, umpan, dan perayapan}
  - Anda diminta memantau rilis statistik wilayah setiap hari.
  - |-
    (a) Bandingkan ketiga sumber pada folder `data/`: laman HTML, `api_wilayah.json`, dan `umpan_rilis.xml`. Peubah apa yang tersedia pada masing-masing?
    (b) Hitung berapa banyak baris kode yang diperlukan untuk memperoleh data yang sama dari ketiganya.
    (c) Sumber mana yang Anda pilih untuk **pemantauan harian**, dan mana untuk **pengambilan data lengkap sekali waktu**? Jelaskan alasannya masing-masing.
  - \latihan{Mendeteksi perubahan tata letak}
  - |-
    (a) Jalankan fungsi `periksa()` dari Contoh 4.16 pada `laman_versi_baru.html` dengan kedua pemilih. Jelaskan perbedaan ketiga keluarannya.
    (b) Perluas fungsi itu agar juga memeriksa **cacah baris** dan **cacah kolom**, serta memberi peringatan bila cacah baris berubah lebih dari 20 persen dari nilai sebelumnya.
    (c) Jelaskan mengapa kekeliruan jenis "kepala kolom berubah" lebih berbahaya daripada "tabel tidak ditemukan".
  - \latihan{Padanan R}
  - |-
    (a) Ulangi Contoh 4.10 (merayapi laman berhalaman) dengan **rvest**. Petunjuk: pakai `html_element("nav.paginasi a.berikutnya")` dan `html_attr("href")`.
    (b) Bandingkan banyaknya baris kode kedua bahasa untuk tugas yang sama.
    (c) Jalankan `html_table()` pada `laman_versi_baru.html`. Apakah tipe datanya langsung benar? Bandingkan dengan hasil ekstraksi manual di Python.
  - \latihan{Menilai kelayakan pengumpulan}
  - 'Untuk masing-masing keadaan berikut, tentukan cara pengumpulan yang Anda sarankan (berkas, API, atau
    perayapan), sebutkan **satu pertimbangan etika**, dan **satu risiko mutu data**: (a) harga komoditas
    harian dari situs asosiasi pedagang; (b) data kependudukan dari portal resmi yang menyediakan unduhan
    CSV; (c) ulasan produk dari lokapasar; (d) cuaca per jam dari penyedia yang memiliki API berbayar.'
  - \newpage
  penugasan:
  - |-
    \begin{kotaktugas}
    Sebagai calon analis pada instansi statistik, susun laporan pengumpulan data dari laman tiruan \texttt{laman\_contoh.html}, lengkap dengan penilaian etika, mutu, dan keterwakilannya.
    \end{kotaktugas}
  - '**Konteks.** Sebuah unit hendak melengkapi data survei dengan sumber daring. Sebelum diputuskan,
    perlu dinilai kelayakan teknis maupun etikanya. Seluruh pekerjaan dilakukan atas laman tiruan; **tidak
