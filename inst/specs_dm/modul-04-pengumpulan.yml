      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Selisih yang besar bukan pertanda salah hitung melainkan pertanda cakupan yang sempit. Lima wilayah bukan contoh acak dari empat puluh, sehingga rata-ratanya tidak menduga apa pun mengenai keseluruhan. Inilah wujud nyata persoalan keterwakilan: banyaknya baris yang berhasil dikumpulkan sama sekali tidak menjamin bahwa yang terkumpul mewakili apa yang hendak digambarkan.

      \end{kotakinterpretasi}
  - contoh: 'Pemilih CSS: cara ringkas menelusuri laman'
    narasi: |-
      \kode{select dan select-one}

      ```{python css}
      from bs4 import BeautifulSoup
      import pandas as pd, json, time, re
      import xml.etree.ElementTree as ET
      import urllib.robotparser as robotparser

      def baca_laman(berkas):
          with open("data/" + berkas, encoding="utf-8") as f:
              return BeautifulSoup(f, "html.parser")

      s = baca_laman("daftar_1.html")

      # find_all versus select: dua cara menuju hasil yang sama
      cara_find   = s.find("table", class_="daftar").find("tbody").find_all("tr")
      cara_select = s.select("table.daftar tbody tr")
      print("jumlah baris -- find_all:", len(cara_find), " select:", len(cara_select))

      # pemilih CSS memudahkan penelusuran berlapis
      print("kepala kolom:", [th.get_text(strip=True) for th in s.select("thead th")])
      print("tautan pertama:", s.select_one("tbody tr td a")["href"])
      print("judul halaman:", s.select_one("h1").get_text(strip=True))
      ```

      \begin{kotakpenjelasan}
      \texttt{select()} menerima \textbf{pemilih CSS} --- sintaks yang sama dengan yang dipakai penata gaya laman. \texttt{table.daftar tbody tr} berarti "setiap \texttt{tr} di dalam \texttt{tbody} di dalam \texttt{table} berkelas \texttt{daftar}". \texttt{select\_one()} mengembalikan elemen pertama saja.
      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Kedua cara memberi 3 baris yang sama --- keduanya sah. Bedanya terletak pada keterbacaan ketika struktur laman berlapis.

      Dengan \texttt{find\_all}, tiap tingkat menuntut satu pemanggilan berantai: \texttt{find(...).find(...).find\_all(...)}. Bila salah satu tingkat tidak ditemukan, rantai itu putus dengan galat \texttt{AttributeError} yang menunjuk baris terakhir, bukan tingkat yang sesungguhnya hilang --- sehingga sulit ditelusuri.

      Dengan \texttt{select}, seluruh jalur ditulis sebagai satu untai. Bila tidak ada yang cocok, hasilnya \textbf{daftar kosong}, bukan galat. Itu lebih aman untuk perayapan banyak laman: satu laman yang menyimpang tidak menghentikan seluruh proses.

      Kaidah praktis: pakailah \texttt{select} untuk penelusuran berdasarkan struktur dan kelas, dan \texttt{find} bila perlu menyaring dengan syarat yang tidak dapat dinyatakan sebagai pemilih CSS --- misalnya mencocokkan teks di dalam elemen.
      \end{kotakinterpretasi}
  - contoh: Merayapi laman berhalaman
    narasi: |-
      \kode{mengikuti tautan Berikutnya sampai habis}

      ```{python paginasi}
      halaman = "daftar_1.html"
      baris, tautan_detail, dikunjungi = [], [], []

      while halaman:
          dikunjungi.append(halaman)
          s = baca_laman(halaman)
          for tr in s.select("table.daftar tbody tr"):
              td = tr.select("td")
              baris.append({"wilayah": td[0].get_text(strip=True),
                            "penduduk_teks": td[1].get_text(strip=True),
                            "pengeluaran_teks": td[2].get_text(strip=True)})
              tautan_detail.append(tr.select_one("td a")["href"])

          berikutnya = s.select_one("nav.paginasi a.berikutnya")
          halaman = berikutnya["href"] if berikutnya else None
          time.sleep(0.2)                 # jeda santun antar-permintaan

      print("halaman dikunjungi:", dikunjungi)
      print("baris terkumpul:", len(baris), " tautan detail:", len(tautan_detail))
      daftar = pd.DataFrame(baris)
      print(daftar.head(4))
      ```

      \begin{kotakinterpretasi}
      Perayapan berhenti sendiri setelah tiga halaman --- bukan karena banyaknya halaman dituliskan di dalam kode, melainkan karena laman terakhir \textbf{tidak lagi memuat} tautan \texttt{Berikutnya}, sehingga \texttt{select\_one} mengembalikan \texttt{None} dan pengulangan berakhir.

      Cara ini lebih tahan perubahan daripada menuliskan \texttt{for h in range(1, 4)}. Bila jumlah halaman bertambah menjadi lima, kode ini tetap benar tanpa disunting; kode yang menuliskan angka 3 akan diam-diam melewatkan dua halaman terakhir --- kekeliruan yang tidak menimbulkan galat apa pun dan karena itu sulit ditemukan.

      Tiga hal yang wajib ada pada pengulangan semacam ini:

      \begin{enumerate}
      \item \textbf{Jeda antar-permintaan} (\texttt{time.sleep}). Di sini 0,2 detik karena berkasnya lokal; pada situs sungguhan ikuti \texttt{Crawl-delay} pada \texttt{robots.txt}, atau minimal 1--2 detik.
      \item \textbf{Catatan laman yang sudah dikunjungi}. Bila tautan saling menunjuk melingkar, tanpa catatan ini pengulangan tidak akan pernah berhenti.
      \item \textbf{Batas atas}. Pada perayapan sungguhan tambahkan pencacah dengan batas maksimum, sebagai jaring pengaman bila struktur laman berubah.
      \end{enumerate}
      \end{kotakinterpretasi}
  - contoh: Menelusuri dari daftar ke laman rincian
    narasi: |-
      \kode{mengambil rincian tiap wilayah beserta atribut data}

      ```{python detail}
      rincian = []
      for t in tautan_detail:
          s = baca_laman(t)
          d = {"wilayah": s.select_one("h1.judul-wilayah").get_text(strip=True),
               "berkas": t}
          # dt berisi label, dd berisi nilainya -- keduanya berpasangan berurutan
          for dt, dd in zip(s.select("dl.rincian dt"), s.select("dl.rincian dd")):
              label = dt.get_text(strip=True).lower().replace(" ", "_")
              # atribut data-nilai memuat angka bersih; teksnya memuat satuan
              d[label] = dd.get("data-nilai", dd.get_text(strip=True))
          rincian.append(d)
          time.sleep(0.2)

      detail = pd.DataFrame(rincian)
      print(detail.head(4))
      print("\ndimensi:", detail.shape, " kolom:", list(detail.columns))
      ```

      \begin{kotakinterpretasi}
      Pola \textbf{daftar $\rightarrow$ rincian} ini adalah bentuk perayapan yang paling sering dijumpai: laman indeks memuat ringkasan beserta tautan, dan rincian lengkapnya berada pada laman tersendiri.

      Perhatikan pengambilan nilai. Teks yang tampak pada laman berbunyi "1.250.000 jiwa" --- memuat pemisah ribuan dan satuan, sehingga harus dibersihkan sebelum dapat dihitung. Tetapi laman ini juga menyediakan atribut \texttt{data-nilai} yang memuat angka bersih. \texttt{dd.get("data-nilai", dd.get\_text(strip=True))} mengambil atribut itu bila ada, dan jatuh kembali ke teks bila tidak.

      \textbf{Selalu periksa atribut sebelum mengurai teks.} Laman yang dirancang baik kerap menyimpan nilai mesin pada atribut \texttt{data-*}, \texttt{datetime}, atau \texttt{content}; memakainya menghindarkan seluruh persoalan pembersihan teks --- dan lebih tahan ketika format tampilan berubah.

      Perhatikan pula bahwa laman rincian memuat dua peubah yang \textbf{tidak ada} pada laman daftar: \texttt{pulau} dan \texttt{tahun}. Itulah alasan menelusuri sampai ke laman rincian, bukan berhenti di indeks.
      \end{kotakinterpretasi}
  - contoh: Membersihkan teks dengan ekspresi reguler
    narasi: |-
      \kode{memisahkan angka dari satuan}

      ```{python regex}
      s = baca_laman("detail_a.html")
      teks_dd = [dd.get_text(strip=True) for dd in s.select("dl.rincian dd")]
      print("teks apa adanya:", teks_dd)

      def ambil_angka(teks):
          """Ambil angka pertama dari teks, tangani pemisah ribuan titik."""
          m = re.search(r"[\d][\d.]*(?:,\d+)?", teks)
          if not m:
              return None
          angka = m.group(0)
          if "," in angka:                       # 72,4 -> desimal
              angka = angka.replace(".", "").replace(",", ".")
          elif angka.count(".") >= 1 and len(angka.split(".")[-1]) == 3:
              angka = angka.replace(".", "")     # 1.250.000 -> ribuan
          return float(angka)

      for t in teks_dd:
          print(f"{t!r:45s} -> {ambil_angka(t)}")
      ```

      \begin{kotakinterpretasi}
      Fungsi ini menyelesaikan persoalan yang khas data Indonesia: \textbf{titik sebagai pemisah ribuan dan koma sebagai pemisah desimal} --- kebalikan dari kebiasaan Inggris yang menjadi bawaan \texttt{float()}.

      Perhatikan bahwa \texttt{float("1.250.000")} akan gagal, dan \texttt{float("72,4")} juga gagal. Yang lebih berbahaya, \texttt{float("1.250")} \textbf{tidak} gagal melainkan menghasilkan $1{,}25$ --- seribu kali lebih kecil daripada yang dimaksud, tanpa peringatan apa pun. Kekeliruan semacam ini lolos dari pemeriksaan otomatis dan hanya ketahuan bila hasilnya dibandingkan dengan sumber lain.

      Aturan yang dipakai di sini: bila ada koma, ia dianggap pemisah desimal; bila tidak dan bagian setelah titik terakhir tepat tiga angka, titik dianggap pemisah ribuan. Aturan ini \textbf{tidak sempurna} --- "1.234" dapat berarti seribu dua ratus tiga puluh empat atau satu koma dua tiga empat, dan tidak ada cara memastikannya dari teks itu sendiri.

      Karena itu pembersihan berbasis ekspresi reguler harus selalu disertai \textbf{pemeriksaan kewajaran}: bandingkan rentang hasil dengan yang diharapkan, dan periksa sampel secara manual. Bila laman menyediakan atribut \texttt{data-*} seperti pada Contoh sebelumnya, pakailah itu dan hindari seluruh persoalan ini.
      \end{kotakinterpretasi}
  - contoh: Periksa apakah tersedia API sebelum merayapi
    narasi: |-
      \kode{membaca tanggapan JSON}

      ```{python api}
      with open("data/api_wilayah.json", encoding="utf-8") as f:
          tanggapan = json.load(f)

      print("kunci teratas:", list(tanggapan.keys()))
      print("metadata:", tanggapan["meta"])

      api = pd.DataFrame(tanggapan["data"])
      print(api.head(4))
      print("\ntipe data langsung benar:")
      print(api.dtypes)
      ```

      \begin{kotakinterpretasi}
      Bandingkan dengan seluruh contoh sebelumnya. Data yang sama diperoleh dengan \textbf{satu baris} \texttt{pd.DataFrame(tanggapan["data"])}, dan --- ini yang paling penting --- \textbf{tipe datanya sudah benar sejak awal}: \texttt{penduduk} bertipe integer, \texttt{akses\_internet} bertipe float. Tidak ada pemisah ribuan yang perlu dibersihkan, tidak ada satuan yang menempel pada angka, tidak ada risiko salah tafsir titik dan koma.

      Selain itu tanggapan API menyertakan \textbf{metadata}: sumber, tahun, jumlah cacah, dan lisensi. Perayapan HTML jarang memberikan hal itu; ia harus dicatat sendiri oleh perayapnya.

      Kaidah yang wajib dipegang: \textbf{cari API lebih dahulu, rayapi belakangan}. Perayapan HTML adalah pilihan terakhir, bukan pertama. Cara memeriksanya: telusuri laman dokumentasi penyedia data; periksa apakah lamannya memuat panggilan XHR/fetch pada tab Network peramban --- kerap laman dinamis mengambil datanya dari API yang dapat dipanggil langsung; dan tanyakan kepada penyedia datanya.

      Perayapan HTML rapuh terhadap perubahan tata letak, membebani peladen, dan sering berada di wilayah abu-abu dari sisi ketentuan layanan. API dirancang untuk diakses program, stabil, dan izinnya jelas.
      \end{kotakinterpretasi}
  - contoh: Membaca umpan XML
    narasi: |-
      \kode{ElementTree untuk RSS}

      ```{python xml}
      akar = ET.parse("data/umpan_rilis.xml").getroot()
      print("judul umpan:", akar.findtext("./channel/title"))

      butir = [{"judul": it.findtext("title"),
                "tanggal": it.findtext("pubDate"),
                "tautan": it.findtext("link"),
                "ringkasan": it.findtext("description")}
               for it in akar.iter("item")]
      umpan = pd.DataFrame(butir)
      print(umpan[["judul", "tanggal"]].head(5))
      print("\njumlah butir:", len(umpan))
      ```

      \begin{kotakinterpretasi}
      Umpan RSS atau Atom sering menjadi jalan tengah antara API dan perayapan HTML: strukturnya baku, ringan, dan \textbf{memang disediakan untuk dibaca program} --- sehingga memakainya tidak menimbulkan persoalan etika sebagaimana perayapan.

      Bagi pekerjaan statistik, umpan rilis berguna untuk \textbf{memantau pembaruan}: alih-alih merayapi seluruh laman setiap hari untuk memeriksa apakah ada rilis baru, cukup baca umpannya --- jauh lebih murah bagi kedua pihak.

      Perhatikan \texttt{pubDate} yang berbentuk teks. Sebelum dipakai, ia harus diurai menjadi tipe tanggal dengan \texttt{pd.to\_datetime()} beserta \texttt{format=} yang tepat; jangan mengandalkan penebakan otomatis, sebab format tanggal berbeda-beda antar-umpan dan salah tebak menghasilkan tanggal yang keliru tanpa peringatan.
      \end{kotakinterpretasi}
  - contoh: Membaca robots.txt secara terprogram
    narasi: |-
      \kode{urllib.robotparser}

      ```{python robots}
      print(open("data/robots_tiruan.txt").read())

      aturan = robotparser.RobotFileParser()
      aturan.parse(open("data/robots_tiruan.txt").read().splitlines())

      for jalur in ["/rilis", "/admin/pengguna", "/pencarian?q=data", "/data/wilayah"]:
          print(f"{jalur:25s} boleh diambil: {aturan.can_fetch('*', jalur)}")

      print("\nCrawl-delay bagi perayap umum:", aturan.crawl_delay("*"), "detik")
      print("PerayapNakal boleh /rilis:", aturan.can_fetch("PerayapNakal", "/rilis"))
      ```

      \begin{kotakinterpretasi}
      Contoh 4.1 membaca \texttt{robots.txt} dengan mata; di sini ia dibaca \textbf{oleh program}. Perbedaannya penting pada perayapan berskala besar: memeriksa ribuan alamat satu per satu secara manual tidak mungkin, dan \texttt{RobotFileParser} melakukannya secara konsisten.

      Perhatikan tiga hasilnya. Jalur \texttt{/admin/pengguna} dan \texttt{/pencarian?q=data} \textbf{tidak boleh} diambil karena tercakup aturan \texttt{Disallow}. \texttt{Crawl-delay} bernilai 5 detik --- itulah jeda minimum yang harus dipakai, bukan angka yang dipilih sendiri. Dan perayap bernama \texttt{PerayapNakal} ditolak sepenuhnya, memperlihatkan bahwa aturan dapat berbeda menurut nama perayap.

      Dua penegasan yang wajib menyertai. \textbf{Pertama}, \texttt{robots.txt} bukan pengaman teknis melainkan \textbf{permintaan}; ia dapat diabaikan secara teknis, tetapi mengabaikannya berarti melanggar norma yang berlaku dan dapat berkonsekuensi hukum melalui ketentuan layanan. \textbf{Kedua}, \texttt{robots.txt} yang mengizinkan \textbf{tidak berarti} pengambilan data itu sah: ketentuan layanan, hak cipta atas isi, dan ketentuan pelindungan data pribadi berlaku terpisah dan lebih kuat.
      \end{kotakinterpretasi}
  - contoh: Mendeteksi perubahan tata letak sebelum ia merusak data
    narasi: |-
      \kode{memeriksa kesesuaian struktur}

      ```{python skema}
      def ekstrak_tabel(berkas, pemilih):
          s = baca_laman(berkas)
          tabel = s.select_one(pemilih)
          if tabel is None:
              raise ValueError(f"tabel tidak ditemukan pada {berkas} dengan pemilih {pemilih!r}")
          kepala = [th.get_text(strip=True) for th in tabel.select("thead th")]
          isi = [[td.get_text(strip=True) for td in tr.select("td")]
                 for tr in tabel.select("tbody tr")]
          return kepala, pd.DataFrame(isi, columns=kepala)

      KEPALA_DIHARAPKAN = ["Wilayah", "Penduduk", "Pengeluaran", "Akses Internet"]

      def periksa(berkas, pemilih):
          try:
              kepala, df = ekstrak_tabel(berkas, pemilih)
          except ValueError as e:
              return f"GAGAL  -- {e}"
          if kepala != KEPALA_DIHARAPKAN:
              return (f"BERUBAH -- kepala kolom tidak sesuai\n"
                      f"          diharapkan: {KEPALA_DIHARAPKAN}\n"
                      f"          ditemukan : {kepala}")
          return f"AMAN   -- {df.shape[0]} baris, kepala kolom sesuai"

      print("laman_contoh.html      :", periksa("laman_contoh.html", "table#tabel-wilayah"))
      print("laman_versi_baru.html  :", periksa("laman_versi_baru.html", "table#tabel-wilayah"))
      print("laman_versi_baru.html  :", periksa("laman_versi_baru.html", "table#tabel-statistik-wilayah"))
      ```

      \begin{kotakinterpretasi}
      Ketiga baris memperagakan tiga keadaan yang berbeda.

      \textbf{Baris pertama} berhasil: struktur laman sesuai harapan.

      \textbf{Baris kedua} gagal dengan pesan yang jelas: pengenal tabel berubah dari \texttt{tabel-wilayah} menjadi \texttt{tabel-statistik-wilayah}, sehingga \texttt{select\_one} mengembalikan \texttt{None}. Tanpa pemeriksaan \texttt{if tabel is None}, baris berikutnya akan melempar \texttt{AttributeError} yang menunjuk tempat yang keliru --- dan pada perayapan terjadwal yang berjalan tanpa pengawasan, galat semacam itu kerap hanya tercatat di log tanpa dibaca siapa pun.

      \textbf{Baris ketiga} menemukan tabelnya, tetapi \textbf{kepala kolomnya berubah}: "Penduduk" menjadi "Jumlah Penduduk", "Wilayah" menjadi "Nama Wilayah". Inilah keadaan yang paling berbahaya --- ekstraksi \textbf{berhasil}, DataFrame terbentuk, tidak ada galat sama sekali, tetapi nama kolomnya berbeda sehingga kode di hilir yang memanggil \texttt{df["Penduduk"]} akan gagal jauh kemudian, atau lebih buruk, penggabungan dengan data lain menghasilkan kolom kosong tanpa peringatan.

      Karena itu perayap yang dijalankan berulang \textbf{wajib memuat pemeriksaan struktur}: bandingkan kepala kolom, cacah kolom, dan cacah baris terhadap nilai yang diharapkan; hentikan proses dan kirim pemberitahuan bila menyimpang. Pemeriksaan ini lebih penting daripada kode ekstraksinya sendiri, sebab tata letak laman \textbf{pasti} berubah cepat atau lambat.
      \end{kotakinterpretasi}
  - contoh: 'Permintaan yang tahan gangguan: batas waktu dan percobaan ulang'
    narasi: |-
      \kode{kerangka acuan --- tidak dijalankan}

      ```{python retry, eval=FALSE}
      import requests, time, random

      def ambil_dengan_ulang(url, maks_ulang=3, jeda_awal=2.0, batas_waktu=10):
          """Mengambil satu alamat dengan percobaan ulang dan jeda berlipat."""
          kepala = {"User-Agent": "PraktikumSTIS/1.0 (kontak: nama@stis.ac.id)"}
          for percobaan in range(1, maks_ulang + 1):
              try:
                  r = requests.get(url, headers=kepala, timeout=batas_waktu)
              except requests.exceptions.Timeout:
                  print(f"  percobaan {percobaan}: batas waktu terlampaui")
              else:
                  if r.status_code == 200:
                      return r.text
                  if r.status_code == 429:                  # terlalu sering meminta
                      jeda = int(r.headers.get("Retry-After", jeda_awal * 2 ** percobaan))
                      print(f"  percobaan {percobaan}: 429, menunggu {jeda} detik")
                      time.sleep(jeda); continue
                  if 400 <= r.status_code < 500:            # galat pada sisi kita
                      raise RuntimeError(f"{r.status_code} pada {url} -- tidak diulang")
                  print(f"  percobaan {percobaan}: status {r.status_code}")
              # jeda berlipat disertai goyangan acak agar permintaan tidak serentak
              time.sleep(jeda_awal * 2 ** (percobaan - 1) + random.uniform(0, 1))
          raise RuntimeError(f"gagal setelah {maks_ulang} percobaan: {url}")
      ```

      \begin{kotakperhatian}[Fungsi ini sengaja tidak dijalankan]
      Potongan di atas ditulis dengan \texttt{eval=FALSE} karena ia menghubungi alamat di internet. Ia disajikan sebagai \textbf{kerangka acuan} bagi mahasiswa yang kelak melakukan perayapan sungguhan --- dengan izin dan pada situs yang tepat.
      \end{kotakperhatian}

      \begin{kotakinterpretasi}
      Enam keputusan penting terkandung di dalamnya, dan seluruhnya lazim dilupakan pemula.

      \textbf{Batas waktu} (\texttt{timeout}). Tanpanya, satu peladen yang menggantung akan membekukan seluruh perayapan tanpa batas.

      \textbf{Nama perayap yang jujur} (\texttt{User-Agent}) beserta alamat kontak. Pengelola situs yang melihat lalu lintas tak lazim dapat menghubungi Anda alih-alih langsung memblokir. Menyamar sebagai peramban justru menandakan niat menghindari deteksi.

      \textbf{Membedakan galat}. Status 4xx berarti kekeliruan ada pada permintaan kita --- mengulangnya hanya menambah beban tanpa manfaat, sehingga langsung dilempar sebagai galat. Status 5xx dan batas waktu berarti gangguan sementara pada peladen, dan layak diulang.

      \textbf{Menghormati 429}. Status ini berarti "terlalu sering meminta". Tajuk \texttt{Retry-After} menyatakan berapa lama harus menunggu --- angka itu wajib dipatuhi, bukan ditawar.

      \textbf{Jeda berlipat} (\emph{exponential backoff}). Jeda menjadi 2, 4, 8 detik --- memberi peladen kesempatan pulih alih-alih menambah tekanan.

      \textbf{Goyangan acak} (\emph{jitter}). Bila banyak proses mengulang pada jeda yang persis sama, permintaannya akan serentak dan membebani peladen sekaligus. Tambahan acak kecil menyebarkannya.
      \end{kotakinterpretasi}

      # Padanan dengan R: Paket rvest

      Bagian ini mengulang beberapa contoh di atas dengan R, agar mahasiswa yang bekerja di R tidak harus berpindah bahasa hanya untuk mengambil data.
  - contoh: Ekstraksi dengan rvest
    narasi: |-
      \kode{read\_html, html\_element, dan html\_table}

      ```{r rvest}
      suppressPackageStartupMessages({library(rvest); library(dplyr)})

      laman <- read_html("data/laman_contoh.html")

      # (a) tabel utuh menjadi data frame -- satu baris
      tabel <- laman |> html_element("table#tabel-wilayah") |> html_table()
      print(tabel)

      # (b) pemilih CSS dan atribut
      daftar1 <- read_html("data/daftar_1.html")
      tautan <- daftar1 |> html_elements("table.daftar tbody tr td a") |> html_attr("href")
      cat("tautan pada halaman 1:", tautan, "\n")

      # (c) laman rincian: label dan nilai berpasangan
      detail_a <- read_html("data/detail_a.html")
      label <- detail_a |> html_elements("dl.rincian dt") |> html_text2()
      nilai <- detail_a |> html_elements("dl.rincian dd") |> html_attr("data-nilai")
      teks  <- detail_a |> html_elements("dl.rincian dd") |> html_text2()
      data.frame(label = label, atribut = nilai, teks = teks)
      ```

      \begin{kotakinterpretasi}
      \texttt{html\_table()} adalah keunggulan rvest yang paling menonjol: ia mengubah tabel HTML menjadi data frame \textbf{beserta tipe datanya} dalam satu pemanggilan --- perhatikan bahwa \texttt{Penduduk} langsung bertipe integer dan \texttt{Akses Internet} bertipe double, tanpa pembersihan apa pun. Di Python, langkah itu memerlukan beberapa baris (atau \texttt{pd.read\_html}, yang serupa).

      Perhatikan pula kolom \texttt{atribut} pada keluaran terakhir: dua baris terakhir bernilai \texttt{NA} karena \texttt{Pulau} dan \texttt{Tahun} memang tidak memiliki atribut \texttt{data-nilai} --- nilainya hanya ada sebagai teks. Kolom \texttt{teks} melengkapinya. Pola "ambil atribut, jatuh kembali ke teks" karena itu berlaku sama di kedua bahasa.

      \textbf{Padanan penamaan:}

      \begin{center}
      \begin{tabular}{@{}p{5.4cm}p{5.4cm}p{4.0cm}@{}}
      \textbf{Python (BeautifulSoup)} & \textbf{R (rvest)} & \textbf{Kegunaan}\\
      \hline
      \texttt{BeautifulSoup(f, "html.parser")} & \texttt{read\_html()} & membaca laman\\[2pt]
      \texttt{select\_one(pemilih)} & \texttt{html\_element()} & satu elemen\\[2pt]
      \texttt{select(pemilih)} & \texttt{html\_elements()} & banyak elemen\\[2pt]
      \texttt{get\_text(strip=True)} & \texttt{html\_text2()} & isi teks\\[2pt]
      \texttt{elemen["href"]} & \texttt{html\_attr("href")} & nilai atribut\\[2pt]
      \texttt{pd.read\_html()} & \texttt{html\_table()} & tabel menjadi data frame\\
      \end{tabular}
      \end{center}

      Untuk perayapan sungguhan di R, paket \texttt{httr2} menyediakan padanan \texttt{requests} --- termasuk \texttt{req\_retry()} dan \texttt{req\_throttle()} yang menangani percobaan ulang serta pembatasan laju secara bawaan.
      \end{kotakinterpretasi}
  - contoh: Menilai mutu dan keterwakilan hasil
    narasi: |-
      \kode[Python]{pemeriksaan mutu hasil perayapan}

      ```{python, eval=FALSE}
      print("baris:", len(df), "| kolom:", len(df.columns))
      print("nilai hilang:", int(df.isna().sum().sum()))
      print("wilayah unik:", df['Wilayah'].nunique())

