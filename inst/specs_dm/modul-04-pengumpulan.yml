    Nomor 4 sengaja meminta tipe dilaporkan sebelum dan sesudah konversi, sebab di situlah letak pelajarannya: seluruh kolom hasil perayapan bertipe teks meski isinya tampak angka. Nomor 5 tidak dijalankan dan memang tidak perlu; yang dinilai adalah pemahaman atas tiap bagiannya. Nomor 6 adalah bagian terpenting: lima wilayah hasil ekstraksi dibandingkan terhadap 40 wilayah pembanding, dan perbedaan rata-ratanya memperlihatkan bahwa cakupan yang sempit dapat menyesatkan. Perlu ditegaskan dalam laporan bahwa kelima wilayah itu bukan contoh acak, sehingga rata-ratanya tidak menduga apa pun --- banyaknya baris tidak menggantikan rancangan penarikan contoh. Laporan juga wajib menegaskan bahwa laman maupun data pembanding merupakan tiruan.
  - \end{kotakinterpretasi}
  - '# Kunci Latihan Tambahan (Perayapan Lanjutan)'
  - |-
    ```{python k-tambahan}
    from bs4 import BeautifulSoup
    import pandas as pd, json, re, time
    import xml.etree.ElementTree as ET
  - |-
    def baca(b):
        with open("data/" + b, encoding="utf-8") as f:
            return BeautifulSoup(f, "html.parser")
  - |-
    # (1) merayapi seluruh halaman lalu menelusuri rincian
    halaman, tautan, baris = "daftar_1.html", [], []
    while halaman:
        s = baca(halaman)
        for tr in s.select("table.daftar tbody tr"):
            td = tr.select("td")
            baris.append({"wilayah": td[0].get_text(strip=True)})
            tautan.append(tr.select_one("td a")["href"])
        nx = s.select_one("nav.paginasi a.berikutnya")
        halaman = nx["href"] if nx else None
  - |-
    rinci = []
    for t in tautan:
        s = baca(t)
        d = {"wilayah": s.select_one("h1.judul-wilayah").get_text(strip=True)}
        for dt, dd in zip(s.select("dl.rincian dt"), s.select("dl.rincian dd")):
            d[dt.get_text(strip=True).lower().replace(" ", "_")] = dd.get(
                "data-nilai", dd.get_text(strip=True))
        rinci.append(d)
  - |-
    hasil = pd.DataFrame(rinci)
    for k in ["penduduk", "pengeluaran", "akses_internet"]:
        hasil[k] = pd.to_numeric(hasil[k], errors="coerce")
    print("baris:", len(hasil), " wilayah unik:", hasil["wilayah"].nunique())
    print("nilai hilang:", int(hasil.isna().sum().sum()))
  - |-
    # (2) bandingkan dengan API
    api = pd.DataFrame(json.load(open("data/api_wilayah.json", encoding="utf-8"))["data"])
    gab = hasil.merge(api, left_on="wilayah", right_on="nama", suffixes=("_html", "_api"))
    for k in ["penduduk", "pengeluaran", "akses_internet"]:
        sama = (gab[k + "_html"] == gab[k + "_api"]).all()
        print(f"{k:16s} identik dengan API: {sama}")
  - |-
    # (3) pemilih CSS
    s1 = baca("daftar_1.html"); dA = baca("detail_a.html")
    print("\n(a) tautan dalam tabel daftar :", len(s1.select("table.daftar a")))
    print("(b) dd dengan data-nilai     :", len(dA.select("dd[data-nilai]")))
    print("(c) tautan Berikutnya saja   :", len(s1.select("nav.paginasi a.berikutnya")))
    print("(d) baris pertama tbody      :", len(s1.select("tbody tr:first-child")))
  - |-
    # (4) membandingkan ketiga sumber
    umpan = ET.parse("data/umpan_rilis.xml").getroot()
    print("\npeubah pada HTML rincian :", [c for c in hasil.columns])
    print("peubah pada API          :", list(api.columns))
    print("peubah pada umpan RSS    :", ["judul", "tautan", "tanggal", "ringkasan"])
    print("butir umpan:", len(list(umpan.iter("item"))), "dari", len(api), "wilayah")
    ```
  - |-
    \begin{kotakkunci}
    \textbf{Latihan tambahan 1 --- perayapan lengkap.} Sembilan wilayah terkumpul tanpa duplikasi dan tanpa nilai hilang. Perbandingan dengan API menunjukkan ketiga peubah \textbf{identik}, sebab keduanya bersumber pada berkas tiruan yang sama.
  - 'Yang harus disimpulkan mahasiswa bukan "keduanya sama" melainkan \textbf{mengapa perbandingan itu
    perlu dilakukan}: pada data sungguhan, selisih antara hasil perayapan dan sumber resmi adalah petunjuk
    pertama adanya kekeliruan ekstraksi --- salah kolom, salah tafsir pemisah ribuan, atau baris yang
    terlewat. Jawaban yang langsung mempercayai hasil perayapannya sendiri tanpa pembanding dikenai pengurangan
    nilai.'
  - '\textbf{Latihan tambahan 2 --- pemilih CSS.} Jawaban: (a) \texttt{table.daftar a}; (b) \texttt{dd[data-nilai]}
    --- perhatikan pemilih berdasar keberadaan atribut, yang menemukan 3 dari 5 \texttt{dd} sebab \texttt{Pulau}
    dan \texttt{Tahun} tidak memilikinya; (c) \texttt{nav.paginasi a.berikutnya}; (d) \texttt{tbody tr:first-child}.'
  - \textbf{Latihan tambahan 3 --- memilih sumber.} API menyediakan seluruh peubah dengan tipe data yang
    sudah benar dan memerlukan paling sedikit baris kode. Umpan RSS hanya memuat judul, tautan, tanggal,
    dan ringkasan --- \textbf{tidak} memuat angkanya, sehingga tidak memadai untuk pengambilan data.
  - 'Jawaban yang tepat membedakan keduanya menurut keperluan: \textbf{umpan RSS untuk pemantauan harian}
    (murah, dirancang untuk itu, cukup untuk mengetahui ada rilis baru), dan \textbf{API untuk pengambilan
    data lengkap}. Perayapan HTML hanya bila keduanya tidak tersedia.'
  - '\textbf{Latihan tambahan 4 --- deteksi perubahan.} Ketiga keluaran Contoh 4.16 mewakili tiga keadaan:
    aman; tabel tidak ditemukan (galat \textbf{berisik} --- proses berhenti, mudah disadari); dan kepala
    kolom berubah (galat \textbf{senyap} --- ekstraksi berhasil, tidak ada galat, tetapi data yang dihasilkan
    salah nama kolom).'
  - 'Jawaban butir (c) harus menyatakan bahwa galat senyap lebih berbahaya justru karena tidak menghentikan
    proses: ia mengalir ke tahap berikutnya dan baru ketahuan --- kalau ketahuan --- setelah hasilnya
    dipakai.'
  - |-
    \textbf{Latihan tambahan 5 --- padanan R.} Perayapan berhalaman dengan rvest memerlukan jumlah baris yang serupa. Keunggulan rvest terletak pada \texttt{html\_table()} yang menghasilkan data frame beserta tipe datanya sekaligus; keunggulan BeautifulSoup terletak pada keluwesan menelusuri struktur yang tidak berbentuk tabel. Jawaban yang menyimpulkan salah satu "lebih baik" secara mutlak kurang tepat --- keduanya sepadan, dan pilihan sebaiknya mengikuti bahasa yang dipakai pada tahap analisis berikutnya.
    \end{kotakkunci}
