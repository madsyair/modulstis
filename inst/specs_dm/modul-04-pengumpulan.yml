    ```{python, eval=FALSE}
    from bs4 import BeautifulSoup
    import pandas as pd, requests, time
  - |-
    # 1) penguraian robots.txt dan pemeriksaan jalur
    robots = """\nUser-agent: *\nDisallow: /admin/\nDisallow: /internal/\nAllow: /publik/\nCrawl-delay: 10\n"""
    aturan = {"disallow": [], "allow": [], "crawl_delay": None}
    for b in robots.strip().split("\n"):
        if ":" not in b: continue
        k, v = [x.strip() for x in b.split(":", 1)]
        k = k.lower()
        if k == "disallow": aturan["disallow"].append(v)
        elif k == "allow":  aturan["allow"].append(v)
        elif k == "crawl-delay": aturan["crawl_delay"] = int(v)
  - |-
    def boleh(jalur):
        return not any(jalur.startswith(d) for d in aturan["disallow"])
  - |-
    for j in ["/publik/a.html", "/admin/x", "/internal/log", "/publik/b", "/data/c"]:
        print(f"{j:20s} -> {'boleh' if boleh(j) else 'TIDAK boleh'}")
  - |-
    # 3-4) fungsi ekstraksi
    def ekstrak(path, id_tabel="tabel-wilayah"):
        with open(path, encoding="utf-8") as f:
            sup = BeautifulSoup(f, "html.parser")
        tab = sup.find("table", id=id_tabel)
        if tab is None:
            raise ValueError(f"tabel '{id_tabel}' tidak ditemukan")
        kepala = [th.get_text(strip=True) for th in tab.find("thead").find_all("th")]
        isi = [[td.get_text(strip=True) for td in tr.find_all("td")]
               for tr in tab.find("tbody").find_all("tr")]
        df = pd.DataFrame(isi, columns=kepala)
        sebelum = dict(df.dtypes.astype(str))
        for k in ["Penduduk", "Pengeluaran", "Akses Internet"]:
            if k in df.columns:
                df[k] = pd.to_numeric(df[k], errors="coerce")
        metod = [li.get_text(strip=True) for li in sup.select("ul.metodologi li")]
        return df, metod, sebelum
  - |-
    df, catatan, tipe_sebelum = ekstrak("data/laman_contoh.html")
    print("tipe SEBELUM:", tipe_sebelum)
    print("tipe SESUDAH:", dict(df.dtypes.astype(str)))
  - |-
    # 5) permintaan santun -- TIDAK dijalankan
    def ambil_santun(url, jeda=1.0, coba=3, tunggu=10):
        kepala = {"User-Agent": "PraktikumSTIS/1.0 (keperluan pendidikan)"}
        for i in range(coba):
            try:
                r = requests.get(url, headers=kepala, timeout=tunggu)
                if r.status_code == 200: return r.text
                if r.status_code == 429:
                    time.sleep(jeda * (2 ** i)); continue
                return None
            except requests.RequestException:
                time.sleep(jeda * (2 ** i))
        return None
  - |-
