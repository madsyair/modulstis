      Data hasil perayapan wajib diperlakukan dengan curiga, sebab tidak ada rancangan penarikan contoh yang menjaminnya. Lima wilayah pada laman tiruan ini jelas tidak mewakili populasi mana pun. Pertanyaan keterwakilan --- siapa yang tercakup dan siapa yang tidak --- jauh lebih penting daripada banyaknya baris yang berhasil dikumpulkan.

      \end{kotakinterpretasi}

