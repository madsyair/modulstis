      ```

      \begin{kotakpenjelasan}
      Berkas HTML dibuka lalu diuraikan menjadi pohon elemen memakai penguraiannya bawaan Python. Perintah find mencari elemen pertama yang cocok, sedangkan find\_all mengembalikan seluruhnya. Argumen class ditulis dengan garis bawah di belakang karena class merupakan kata kunci Python.

      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Langkah pertama pada perayapan selalu berupa penjelajahan struktur, bukan langsung mengambil isi. Mengetahui berapa banyak tabel dan tautan yang ada mencegah pengambilan tabel yang keliru. Perhatikan pula catatan pada laman yang menyatakan bahwa datanya tiruan --- membaca catatan metodologi sebelum memakai data adalah kebiasaan yang wajib.

      \end{kotakinterpretasi}
  - contoh: Mengekstrak tabel menjadi DataFrame
    narasi: |-
      \kode[Python]{menyusun DataFrame dari baris tabel}

      ```{python, eval=FALSE}
      import pandas as pd

      tab = sup.find("table", id="tabel-wilayah")
      kepala = [th.get_text(strip=True) for th in tab.find("thead").find_all("th")]
      baris = [[td.get_text(strip=True) for td in tr.find_all("td")]
               for tr in tab.find("tbody").find_all("tr")]

      df = pd.DataFrame(baris, columns=kepala)
      print(df)
      print("\ntipe sebelum konversi:")
      print(df.dtypes)
      ```

      \begin{kotakpenjelasan}
      Tabel dicari berdasarkan atribut id agar tidak tertukar dengan tabel lain. Kepala kolom diambil dari elemen th di dalam thead, sedangkan isinya diambil dari elemen td pada tiap baris tbody. Argumen strip bernilai True membuang spasi berlebih di kedua ujung teks.

      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Perhatikan bahwa seluruh kolom bertipe objek, yaitu teks, meski isinya tampak berupa angka. Inilah jebakan paling sering pada perayapan: data yang tampak numerik sesungguhnya masih berupa untaian karakter, sehingga penjumlahan maupun perata-rataan akan gagal atau memberi hasil keliru.

      \end{kotakinterpretasi}
  - contoh: Mengubah tipe data dan memeriksa hasilnya
    narasi: |-
      \kode[Python]{pd.to\_numeric dengan errors coerce}

      ```{python, eval=FALSE}
      for k in ["Penduduk", "Pengeluaran", "Akses Internet"]:
          df[k] = pd.to_numeric(df[k], errors="coerce")

      print(df.dtypes)
      print("\nnilai gagal dikonversi:", int(df.isna().sum().sum()))
      print(df.describe().round(2))
      ```

      \begin{kotakpenjelasan}
      Ketiga kolom diubah menjadi numerik. Argumen errors bernilai coerce membuat nilai yang tidak dapat diubah menjadi NaN alih-alih menghentikan program, sehingga kegagalan konversi dapat dihitung dan diperiksa.

      \end{kotakpenjelasan}

      \begin{kotakinterpretasi}
      Pemakaian coerce disertai penghitungan NaN adalah kebiasaan penting. Bila ada nilai yang gagal dikonversi, itu pertanda ada isi tak terduga pada laman --- misalnya tanda pemisah ribuan, satuan yang ikut tertulis, atau tanda strip untuk data yang tidak tersedia. Mengabaikan ini berarti kehilangan data diam-diam.

      \end{kotakinterpretasi}
