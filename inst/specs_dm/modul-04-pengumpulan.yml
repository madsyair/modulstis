  - '# Tambahan: Membaca Data dari Antarmuka Pemrograman (API)'
  - 'Bagian ini melengkapi Contoh dengan tiga hal yang tidak dapat diperagakan pada laman tiruan: antarmuka
    pemrograman sebagai jalur yang lebih baik daripada perayapan, penerapan nyata pada situs berita detik.com,
    serta pemanfaatan Google Trends untuk nowcasting yang kini banyak dipakai kantor statistik dunia.'
  - |-
    \begin{kotakperhatian}[Bagian ini menghubungi peladen sungguhan]
    Berbeda dari bagian Contoh, sebagian kode di sini \textbf{benar-benar mengirim permintaan ke internet}. Kerjakan dengan jeda yang cukup, jangan menjalankannya berulang tanpa perlu, dan hentikan segera bila menerima kode status 429. Bila jaringan tidak tersedia, cukup pelajari kodenya beserta keluaran yang dilampirkan.
    \end{kotakperhatian}
  - '### Antarmuka Pemrograman (API)'
  - '**Mengapa API lebih baik.** Data yang dikembalikan sudah terstruktur, formatnya dijanjikan tetap,
    izin pemakaiannya jelas, dan bebannya terkendali karena penyedia sendiri yang mengatur batas laju.'
  - \contoh{Membaca tanggapan JSON dari API}
  - \kode[Python]{json.loads dan pd.DataFrame}
  - |-
    ```{python, eval=FALSE}
    import json
    import pandas as pd
  - |-
    # Tanggapan API DITIRU sebagai teks; tidak ada permintaan jaringan.
    tanggapan = '''
    {
      "status": "ok",
      "sumber": "API tiruan untuk latihan",
      "data": [
        {"wilayah": "Wilayah A", "tahun": 2026, "nilai": 72.4},
        {"wilayah": "Wilayah B", "tahun": 2026, "nilai": 65.1},
        {"wilayah": "Wilayah C", "tahun": 2026, "nilai": 81.7}
      ]
    }
    '''
  - |-
    hasil = json.loads(tanggapan)
    print("status:", hasil["status"], "| sumber:", hasil["sumber"])
  - |-
    df_api = pd.DataFrame(hasil["data"])
    print(df_api)
    print(df_api.dtypes)
    ```
  - |-
    \begin{kotakpenjelasan}
    Teks JSON diubah menjadi objek Python memakai json.loads. Kunci status diperiksa lebih dahulu, lalu bagian data yang berupa daftar kamus diubah langsung menjadi DataFrame.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Bandingkan dengan hasil perayapan pada Contoh 4.3. Di sini tipe kolom sudah benar sejak awal tanpa konversi apa pun, sebab JSON membawa informasi tipe. Perhatikan pula kebiasaan memeriksa kunci status sebelum mengolah datanya: tanggapan yang gagal kerap tetap berkode 200 tetapi berisi pesan galat di dalamnya.
  - \end{kotakinterpretasi}
  - '### Penerapan Nyata: Indeks Berita detik.com'
  - 'Bagian ini menerapkan seluruh langkah pada situs sungguhan. Urutannya persis seperti yang diajarkan:
    periksa ketentuan lebih dahulu, telusuri struktur, baru ekstraksi.'
  - '\contoh{Langkah pertama: membaca robots.txt detik.com}'
  - \kode[Python]{mengambil robots.txt sungguhan}
  - |-
    ```{python, eval=FALSE}
    import requests
  - |-
    kepala = {"User-Agent": "PraktikumSTIS/1.0 (keperluan pendidikan)"}
    r = requests.get("https://news.detik.com/robots.txt", headers=kepala, timeout=20)
    print("status:", r.status_code)
    print(r.text)
    ```
  - |-
    \begin{kotakpenjelasan}
    Berkas robots.txt diambil dari akar subdomain news.detik.com. Ini adalah satu permintaan yang ringan dan justru dianjurkan sebelum permintaan lainnya.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Isinya perlu dibaca dengan cermat karena mengandung pelajaran penting. Sebagian besar larangan --- termasuk larangan atas jalur indeks --- ditujukan khusus bagi User-agent bernama Googlebot. Sementara itu blok User-agent berlambang bintang, yang mencakup perayap kita, hanya memuat Allow garis miring, artinya seluruh situs diizinkan. Jadi menurut robots.txt, pengambilan halaman indeks oleh perayap biasa tidak dilarang.
  - \end{kotakinterpretasi}
  - |-
    \begin{kotaksalah}[Diizinkan robots.txt belum tentu diizinkan seluruhnya]
    Kesimpulan bahwa robots.txt mengizinkan bukan akhir pemeriksaan. Ketentuan layanan situs, hak cipta atas isi berita, dan batas kewajaran beban tetap berlaku. Isi berita dilindungi hak cipta sehingga tidak boleh diterbitkan ulang; yang lazim dipakai untuk keperluan statistik adalah \textbf{metadata} seperti judul, waktu terbit, dan kanal --- bukan naskah beritanya. Modul ini pun hanya mengambil metadata.
    \end{kotaksalah}
  - \contoh{Menelusuri struktur halaman indeks}
  - \kode[Python]{menelusuri sebelum mengekstrak}
  - |-
    ```{python, eval=FALSE}
    from bs4 import BeautifulSoup
    import time
  - |-
    time.sleep(2)                     # jeda sebelum permintaan berikutnya
    r = requests.get("https://news.detik.com/indeks", headers=kepala, timeout=25)
    print("status:", r.status_code, "| ukuran:", len(r.text), "karakter")
  - |-
    sup = BeautifulSoup(r.text, "html.parser")
    artikel = sup.select("article.list-content__item")
    print("artikel ditemukan:", len(artikel))
  - |-
    # memeriksa susunan satu artikel sebelum mengekstrak semuanya
    for el in artikel[0].find_all(True, class_=True):
        print(" ", el.name, ".".join(el.get("class")))
    ```
  - |-
    \begin{kotakpenjelasan}
    Jeda dua detik diberikan sebelum permintaan. Halaman indeks diambil lalu diuraikan. Pemilih CSS article titik list-content dua garis bawah item menargetkan wadah tiap artikel. Perulangan terakhir mencetak seluruh elemen beratribut class di dalam satu artikel, sehingga susunannya terbaca sebelum pemilih ditetapkan.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Langkah memeriksa satu artikel lebih dahulu ini sering dilewati pemula, padahal justru di sinilah pemilih yang benar ditemukan. Dari keluarannya terlihat bahwa judul berada pada h3 berkelas media dua garis bawah title, tautan pada a berkelas media dua garis bawah link, dan waktu pada div berkelas media dua garis bawah date. Halaman indeks memuat dua puluh artikel.
  - \end{kotakinterpretasi}
  - \contoh{Mengekstrak metadata berita}
  - \kode[Python]{ekstraksi bertahan galat}
  - |-
    ```{python, eval=FALSE}
    import pandas as pd
  - |-
    def ambil_metadata(artikel):
        """Mengambil judul, tautan, dan waktu; mengembalikan None bila tak lengkap."""
        tautan = artikel.select_one("h3.media__title a") or artikel.select_one("a")
        if tautan is None:
            return None
        waktu = artikel.select_one("div.media__date span")
        return {
            "judul": tautan.get_text(strip=True),
            "tautan": tautan.get("href", ""),
            "waktu": (waktu.get("title") if waktu is not None and waktu.has_attr("title")
                      else (waktu.get_text(strip=True) if waktu is not None else None)),
        }
  - |-
    baris = [m for m in (ambil_metadata(a) for a in artikel) if m is not None]
    berita = pd.DataFrame(baris)
    print("terkumpul:", len(berita), "dari", len(artikel), "artikel")
    print(berita[["judul", "waktu"]].head(5).to_string(index=False))
    ```
  - |-
    \begin{kotakpenjelasan}
    Fungsi ambil\_metadata memakai pemilih cadangan lewat operator or, sehingga artikel yang susunannya sedikit berbeda tetap tertangani. Bila tautan sama sekali tidak ditemukan, fungsi mengembalikan None dan baris itu disaring keluar. Waktu diambil dari atribut title bila ada, sebab atribut itu memuat tanggal lengkap sedangkan teksnya kadang hanya berupa keterangan relatif.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Perhatikan bahwa banyaknya baris terkumpul dibandingkan terhadap banyaknya artikel. Selisih di antara keduanya adalah tanda bahwa sebagian artikel bersusunan berbeda --- misalnya sisipan iklan atau berita bergambar --- dan itu perlu diketahui, bukan disembunyikan. Perlu ditegaskan pula bahwa yang diambil hanya metadata; naskah beritanya tidak diambil karena dilindungi hak cipta.
  - \end{kotakinterpretasi}
  - |-
    \begin{kotakperhatian}[Pemilih berumur pendek]
    Pemilih seperti \texttt{article.list-content\_\_item} berlaku pada saat modul ini disusun. Situs berita kerap mengubah tata letaknya, sehingga kode yang hari ini berjalan dapat gagal beberapa bulan kemudian. Inilah kerapuhan mendasar perayapan yang tidak dimiliki API. Karena itu kode perayapan wajib memeriksa apakah hasilnya kosong, dan tidak boleh mengandaikan susunan laman tetap.
    \end{kotakperhatian}
  - \contoh{Meringkas metadata menjadi statistik}
  - \kode[Python]{menguraikan waktu dan kanal}
  - |-
    ```{python, eval=FALSE}
    berita["waktu_parsed"] = pd.to_datetime(
        berita["waktu"].str.replace(" WIB", "", regex=False),
        format="%A, %d %b %Y %H:%M", errors="coerce")
  - print("gagal diuraikan:", int(berita["waktu_parsed"].isna().sum()))
  - |-
    # kanal diambil dari bagian alamat
    berita["kanal"] = berita["tautan"].str.extract(r"https?://([a-z]+)\.detik\.com")
    print(berita["kanal"].value_counts())
    ```
  - |-
    \begin{kotakpenjelasan}
    Akhiran WIB dibuang lalu teks waktu diubah menjadi tipe waktu dengan format yang ditetapkan; argumen errors bernilai coerce membuat kegagalan menjadi NaT sehingga dapat dihitung. Kanal ditarik dari alamat memakai ekspresi reguler yang menangkap bagian subdomain.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Penguraian waktu kerap gagal karena nama hari dan bulan bergantung pada pengaturan bahasa sistem. Bila hasilnya banyak NaT, atur locale ke bahasa Indonesia atau uraikan secara manual. Kegagalan semacam ini wajib dilaporkan, bukan dibiarkan --- sebab waktu terbit adalah peubah kunci bila metadata ini hendak dipakai untuk analisis kecenderungan pemberitaan.
  - \end{kotakinterpretasi}
  - '### Google Trends dan Nowcasting'
  - 'Google Trends menyediakan indeks minat pencarian menurut waktu dan wilayah. Bagi statistik resmi,
    daya tariknya terletak pada ketepatan waktu: data pencarian tersedia hampir seketika, sedangkan indikator
    resmi lazimnya terbit berminggu bahkan berbulan setelah periode acuannya.'
  - Gagasan nowcasting adalah menduga nilai indikator pada periode berjalan yang datanya belum terbit,
    dengan memanfaatkan penunjuk yang tersedia lebih cepat. Istilah ini dipopulerkan Choi dan Varian melalui
    makalah berjudul memperkirakan masa kini dengan Google Trends, dan kini dipakai berbagai kantor statistik
    untuk menduga pengangguran, penjualan eceran, maupun pariwisata.
  - |-
    \begin{kotakinfo}[Nowcasting dibandingkan peramalan]\par\smallskip
    \begin{tabular}{@{}p{3.2cm}p{5.4cm}p{5.8cm}@{}}
     & \textbf{Nowcasting} & \textbf{Peramalan}\\
    \hline
    Sasaran & periode berjalan atau baru lewat & periode mendatang\\[2pt]
    Masalah & data belum terbit & masa depan belum terjadi\\[2pt]
    Penunjuk & tersedia lebih cepat & pola masa lalu\\[2pt]
    Verifikasi & dapat diperiksa saat data terbit & menunggu waktu berlalu\\
    \end{tabular}
    \end{kotakinfo}
  - |-
    \begin{kotaksalah}[Indeks Google Trends bukan cacah pencarian]
    Angka yang dikembalikan \textbf{bukan} banyaknya pencarian, melainkan \emph{indeks relatif} berskala 0 sampai 100 terhadap titik tertinggi pada rentang yang diminta. Akibatnya angka menjadi \textbf{tidak sebanding} antar-permintaan: mengubah rentang waktu, wilayah, atau daftar kata kunci akan mengubah seluruh angkanya. Membandingkan hasil dua permintaan berbeda seolah-olah setara adalah kekeliruan yang sering terjadi. Selain itu, nilai bertanda kurang dari satu perlu ditangani karena terbaca sebagai teks, bukan angka.
    \end{kotaksalah}
  - \contoh{Mengambil data Google Trends}
  - \kode{gtrends dengan penanganan galat}
  - |-
    ```{r, eval=FALSE}
    suppressPackageStartupMessages(library(gtrendsR))
  - |-
    hasil <- tryCatch(
      gtrends("lowongan kerja", geo = "ID", time = "today 12-m", onlyInterest = TRUE),
      error = function(e) { message("pengambilan gagal: ", conditionMessage(e)); NULL })
  - |-
    if (!is.null(hasil)) {
      tren <- hasil$interest_over_time
      tren$hits <- as.numeric(gsub("<1", "0", as.character(tren$hits)))  # tangani '<1'
      cat("baris:", nrow(tren),
          "| rentang:", format(min(tren$date)), "s.d.", format(max(tren$date)), "\n")
      cat("rata indeks:", round(mean(tren$hits, na.rm = TRUE), 1), "\n")
    }
    ```
  - |-
    \begin{kotakpenjelasan}
    Permintaan dibungkus tryCatch karena Google Trends menerapkan batas laju dan kerap menolak permintaan yang terlalu berdekatan. Argumen geo membatasi wilayah ke Indonesia dan time meminta rentang dua belas bulan terakhir. Nilai bertanda kurang dari satu diganti nol lebih dahulu sebelum diubah menjadi numerik, sebab tanpa itu seluruh kolom akan tetap bertipe teks.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Penanganan galat di sini bukan hiasan. Permintaan berturut-turut dalam waktu singkat lazim ditolak, dan kode yang tidak menanganinya akan berhenti mendadak di tengah pengolahan. Perhatikan pula bahwa data mingguan untuk rentang dua belas bulan menghasilkan sekitar lima puluh tiga baris; meminta rentang lebih panjang akan mengubah satuan waktunya menjadi bulanan.
  - \end{kotakinterpretasi}
  - \contoh{Peragaan nowcasting sederhana}
  - \kode{lm sebagai model nowcasting}
  - |-
    ```{r, eval=FALSE}
    if (!is.null(hasil)) {
      set.seed(2026)
      # sasaran TIRUAN yang sengaja dibuat terkait dengan tren pencarian
      tren$sasaran <- 5.2 + 0.03 * scale(tren$hits)[, 1] + rnorm(nrow(tren), 0, 0.05)
  - |-
    m0 <- lm(sasaran ~ 1, data = tren)          # model tanpa penunjuk
      m1 <- lm(sasaran ~ hits, data = tren)       # model dengan penunjuk
  - |-
    rmse <- function(m) sqrt(mean(residuals(m)^2))
      round(c(R2_dengan_tren = summary(m1)$r.squared,
              RMSE_tanpa = rmse(m0), RMSE_dengan = rmse(m1),
              penurunan_persen = 100 * (rmse(m0) - rmse(m1)) / rmse(m0)), 4)
    }
    ```
  - |-
    \begin{kotakpenjelasan}
    Peubah sasaran dibangkitkan agar sengaja berkaitan dengan indeks pencarian, sehingga peragaannya terkendali. Dua model dibandingkan: model tanpa penunjuk yang hanya berisi konstanta, dan model yang menyertakan indeks pencarian. Akar rerata kuadrat sisaan dihitung bagi keduanya, lalu penurunannya dinyatakan dalam persen.
  - \end{kotakpenjelasan}
  - |-
    \begin{kotakinterpretasi}
    Penurunan galat inilah yang menjadi ukuran manfaat sebuah penunjuk. Perlu ditegaskan bahwa peubah sasaran di sini adalah tiruan yang memang dibuat berkaitan, sehingga hasilnya tidak membuktikan apa pun mengenai kegunaan Google Trends pada indikator sungguhan. Pada penerapan nyata, sasaran diganti indikator resmi dan penilaiannya wajib memakai data yang tidak dipakai melatih model.
  - \end{kotakinterpretasi}
  - |-
    \begin{kotaktips}
    Untuk penilaian nowcasting yang valid, pembagian data harus mengikuti \textbf{urutan waktu}: model dilatih pada periode awal dan diuji pada periode akhir. Membagi secara acak akan membocorkan informasi masa depan ke dalam pelatihan sehingga kinerjanya tampak jauh lebih baik daripada sebenarnya. Kekeliruan ini termasuk yang paling sering terjadi pada nowcasting.
    \end{kotaktips}
  - |-
    \begin{kotakinfo}[Empat keterbatasan yang wajib dilaporkan]\par\smallskip
    \begin{tabular}{@{}p{3.8cm}p{10.6cm}@{}}
    \textbf{Keterwakilan} & hanya mencakup pengguna internet yang memakai Google; kelompok tanpa akses tidak terwakili\\[3pt]
    \textbf{Kesebandingan} & indeks berskala relatif; berubah bila rentang atau kata kunci diubah\\[3pt]
    \textbf{Kesinambungan} & algoritma dan penyaringan Google dapat berubah tanpa pemberitahuan\\[3pt]
    \textbf{Ambiguitas kata} & satu kata kunci dapat bermakna ganda, sehingga minat tercampur\\
    \end{tabular}
    \end{kotakinfo}
  - Karena keempat keterbatasan itu, praktik yang dianjurkan adalah memakai Google Trends sebagai pelengkap,
    bukan pengganti. Indikator resmi tetap menjadi acuan, sedangkan penunjuk pencarian dipakai untuk menduga
    nilai sementara pada periode yang datanya belum terbit, lalu diperiksa kembali ketika data resmi keluar.
  - |-
    \begin{kotaktips}
    Urutan yang dianjurkan ketika mencari data: berkas unduhan, lalu API, baru perayapan. Setiap langkah ke kanan menambah usaha, menambah kerapuhan, dan menambah risiko. Google Trends sendiri tergolong API sehingga lebih baik daripada perayapan, tetapi keterbatasannya menuntut kehati-hatian penafsiran.
    \end{kotaktips}
  - \vspace{1.2em}
  ringkasan:
  - |-
    \begin{kotaktujuan}
    \textbf{Daftar periksa penguasaan:}
    \begin{itemize}
    \item[$\square$] Saya dapat membedakan pengumpulan lewat berkas, API, dan perayapan.
    \item[$\square$] Saya memeriksa ketentuan layanan dan robots.txt sebelum menulis kode.
    \item[$\square$] Saya memahami bahwa robots.txt adalah permintaan etis, bukan penghalang teknis.
    \item[$\square$] Saya dapat menelusuri struktur HTML dan menemukan elemen berdasarkan penanda.
    \item[$\square$] Saya dapat mengekstrak tabel menjadi DataFrame bertipe benar.
    \item[$\square$] Saya selalu memakai errors coerce lalu memeriksa hasil konversinya.
    \item[$\square$] Saya dapat menangani kegagalan permintaan beserta jeda berlipat.
    \item[$\square$] Saya menilai keterwakilan data, bukan sekadar banyaknya baris.
    \end{itemize}
    \end{kotaktujuan}
  - '**Kartu Referensi Cepat.**'
  - |-
    \begin{kotakrumus}
    \begin{tabular}{@{}ll@{}}
    \textbf{Keperluan} & \textbf{Perintah}\\nMenguraikan HTML & \texttt{BeautifulSoup(f, "html.parser")}\\nSatu elemen & \texttt{sup.find("table", id="...")}\\nSemua elemen & \texttt{sup.find\_all("tr")}\\nPemilih CSS & \texttt{sup.select("ul.kelas li")}\\nAmbil teks & \texttt{el.get\_text(strip=True)}\\nAtribut & \texttt{a{[}"href"{]}}\\nKe DataFrame & \texttt{pd.DataFrame(isi, columns=kepala)}\\nKonversi aman & \texttt{pd.to\_numeric(x, errors="coerce")}\\nPermintaan HTTP & \texttt{requests.get(url, headers=, timeout=)}\\nMembaca JSON & \texttt{json.loads(teks)}\\
    \end{tabular}
    \end{kotakrumus}
  - '**Alur kerja yang dianjurkan.** Berikut urutan yang sebaiknya diikuti pada tiap pekerjaan pengumpulan
    data daring.'
  - |-
    \begin{kotakinfo}[Tujuh langkah pengumpulan yang bertanggung jawab]\par\smallskip
