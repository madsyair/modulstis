exercises:
  - id: "L6.1"
    points: 15
    solution: "Tingkat Dasar: seleksi kolom/baris, sort_values, assign, groupby + reset_index."
    judul_py: "Solusi Tingkat Dasar (Python)"
    solusi_py: |
      import pandas as pd
      desa = pd.read_csv("data/data_desa.csv")

      print(desa[["provinsi", "penduduk", "akses_listrik"]].head())
      print(desa[desa["penduduk"] > 5000].shape[0])
      print(desa.sort_values("akses_air", ascending=False).head(3))
      hasil = desa.assign(kepadatan = lambda d: d["penduduk"] / d["luas_km2"])
      ringkas = (desa
          .groupby("status")
          .agg(n=("penduduk", "size"), rata=("akses_listrik", "mean"))
          .reset_index())
      print(ringkas)
    interpretasi: >
      Kurung siku ganda memilih beberapa kolom, topeng boolean menyaring baris, ascending bernilai
      False membalik urutan, assign menambah kolom turunan, dan groupby dipadu reset\_index
      menghasilkan tabel ringkasan dengan kunci sebagai kolom biasa. Bandingkan angkanya dengan solusi
      dplyr pada Modul 5 - hasilnya sama.
  - id: "L6.2"
    points: 25
    solution: "Tingkat Menengah dan Lanjut: rantai metode, np.select dengan crosstab, serta merge dengan validate."
    judul_py: "Solusi Menengah dan Lanjut (Python)"
    solusi_py: |
      import pandas as pd, numpy as np
      desa = pd.read_csv("data/data_desa.csv")

      # Rantai metode
      print(desa
          .query("status == 'Perdesaan'")
          .assign(anggota_rt = lambda d: d["penduduk"] / d["rumah_tangga"])
          .groupby("provinsi")
          .agg(n=("penduduk", "size"), rata_anggota=("anggota_rt", "mean"))
          .reset_index()
          .assign(rata_anggota = lambda d: d["rata_anggota"].round(2))
          .sort_values("rata_anggota", ascending=False))

      # Kategori bertingkat + tabel silang
      hasil = desa.assign(kelas_listrik = lambda d: np.select(
          [d["akses_air"] >= 90, d["akses_air"] >= 75],
          ["Tinggi", "Sedang"], default="Rendah"))
      print(pd.crosstab(hasil["provinsi"], hasil["kelas_listrik"]))

      # Penggabungan dan pemeriksaan
      ref = pd.DataFrame({
          "provinsi": ["Jawa Barat", "Jawa Tengah", "Sulawesi Selatan", "Papua"],
          "target_air": [90, 88, 80, 70]})
      print(ref["provinsi"].is_unique)                 # kunci harus unik
      gab = desa.merge(ref, on="provinsi", how="left", validate="m:1")
      print(desa.shape[0], "->", gab.shape[0])         # jumlah baris harus sama
      print(gab.assign(selisih = lambda d: d["akses_listrik"] - d["target_air"])
               .query("selisih < 0")["provinsi"].value_counts())
    interpretasi: >
      Rantai metode mengubah bentuk data berturut-turut: query mengurangi baris, assign menambah kolom,
      groupby dan agg memampatkan menjadi satu baris per provinsi, reset\_index mengembalikan kunci
      menjadi kolom, lalu sort\_values mengurutkan. np.select memberi kategori bertingkat yang
      diperiksa berurutan. Pada penggabungan, argumen validate bernilai m titik dua 1 menjadi pengaman
      otomatis: bila kunci tabel kanan tidak unik, pandas memunculkan galat sehingga penggandaan baris
      tidak lolos diam-diam.
  - id: "L6.D"
    points: 10
    solution: "Membetulkan kode: loc untuk nama kolom, kurung pada topeng boolean, fungsi mean, dan reset_index."
    judul_py: "Solusi Membetulkan Kode (Python)"
    solusi_py: |
      import pandas as pd
      desa = pd.read_csv("data/data_desa.csv")

      # 1) iloc hanya menerima posisi; pakai loc untuk nama kolom
      print(desa.loc[0, "provinsi"])      # atau desa.iloc[0, 0]

      # 2) kurung siku harus menutup nama kolom lebih dahulu
      print(desa[desa["penduduk"] > 5000].shape[0])

      # 3) nama fungsi agregasi adalah "mean", bukan "average";
      #    dan reset_index mengembalikan provinsi menjadi kolom
      ringkas = (desa
          .groupby("provinsi")
          .agg(rata=("penduduk", "mean"))
          .reset_index())
      print(ringkas["provinsi"])
    interpretasi: >
      Empat kesalahan diperbaiki. Pertama, iloc hanya menerima posisi bilangan bulat sehingga nama
      kolom harus memakai loc. Kedua, kurung siku ditempatkan keliru: perbandingan harus dilakukan pada
      Series hasil pemilihan kolom, bukan pada teks nama kolom. Ketiga, nama fungsi agregasi di pandas
      adalah mean, bukan average. Keempat, setelah groupby kunci berpindah menjadi indeks sehingga
      pemanggilan sebagai kolom gagal sampai reset\_index dipanggil - padanan persoalan pengelompokan
      tertinggal pada dplyr.
  - id: "T6.1"
    points: 50
    solution: "Penugasan: pemeriksaan, peubah turunan, klasifikasi, agregasi dua kunci, merge dengan validate, dan perbandingan dengan dplyr."
    judul_py: "Solusi Penugasan (Python)"
    solusi_py: |
      import pandas as pd, numpy as np
      desa = pd.read_csv("data/data_desa.csv")
      print(desa.shape); print(desa.dtypes); print(desa.isna().sum())

      desa2 = desa.assign(
          kepadatan  = lambda d: d["penduduk"] / d["luas_km2"],
          anggota_rt = lambda d: d["penduduk"] / d["rumah_tangga"],
          kelas_listrik  = lambda d: np.select(
              [d["akses_listrik"] >= 90, d["akses_listrik"] >= 75, d["akses_listrik"] >= 60],
              ["Sangat baik", "Baik", "Cukup"], default="Kurang"))

      ringkas = (desa2
          .groupby(["provinsi", "status"])
          .agg(n_desa=("penduduk", "size"),
               penduduk=("penduduk", "sum"),
               kepadatan=("kepadatan", "mean"),
               air=("akses_listrik", "mean"),
               listrik=("akses_air", "mean"))
          .reset_index()
          .round(1)
          .sort_values(["provinsi", "status"]))
      print(ringkas)

      ref = pd.DataFrame({
          "provinsi": ["Jawa Barat", "Jawa Tengah", "Sulawesi Selatan", "Papua"],
          "pulau":    ["Jawa", "Jawa", "Sulawesi", "Papua"],
          "target_air": [90, 88, 80, 70]})
      gab = desa2.merge(ref, on="provinsi", how="left", validate="m:1")
      print(desa2.shape[0], "->", gab.shape[0])

      print(gab
          .assign(memenuhi = lambda d: (d["akses_listrik"] >= d["target_air"]).astype(int))
          .groupby("pulau")
          .agg(n_desa=("memenuhi", "size"),
               n_memenuhi=("memenuhi", "sum"),
               persen=("memenuhi", "mean"))
          .reset_index()
          .assign(persen = lambda d: (100 * d["persen"]).round(1))
          .sort_values("persen", ascending=False))
    interpretasi: >
      Alur penugasan mengikuti urutan kerja nyata: periksa ukuran, tipe, dan nilai hilang; buat peubah
      turunan serta klasifikasi bertingkat; susun ringkasan per kombinasi kelompok dengan named
      aggregation; gabungkan tabel referensi disertai validasi hubungan; lalu hitung capaian target.
      Persentase diperoleh dari rata-rata penanda bernilai 0 dan 1 dikali seratus. Karena berkas
      datanya sama dengan Modul 5, seluruh angka dapat dibandingkan langsung dengan hasil dplyr sebagai
      pemeriksaan silang. Perlu diingat bahwa data ini simulasi sehingga tidak boleh ditafsirkan
      sebagai keadaan sebenarnya.

