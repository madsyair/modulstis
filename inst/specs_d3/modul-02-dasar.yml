exercises:
  - id: "L2.1"
    points: 15
    solution: "Tingkat Dasar: konversi tipe dan indeks. Isian: numeric/int, 3."
    judul_r: "Solusi Tingkat Dasar (R)"
    solusi_r: |
      a <- "42"; b <- as.numeric(a); b + 13   # 50
      class(b)                                # numeric
      nilai <- c(72, 88, 64, 95)
      nilai[2]                                # 90 (elemen ketiga)
      mean(nilai)                             # 77.5
    judul_py: "Solusi Tingkat Dasar (Python)"
    solusi_py: |
      a = "42"; b = int(a); print(b + 13)      # 50
      print(type(b).__name__)                 # int
      nilai = [80, 75, 90, 65]
      print(nilai[2])                         # 90 (indeks 2 = elemen ketiga)
      print(sum(nilai)/len(nilai))            # 77.5
    interpretasi: >
      Elemen ketiga adalah nilai[2] di R dan nilai[2] di Python (indeks berbeda). Konversi tipe
      memungkinkan operasi aritmatika pada nilai yang semula teks. Rata-rata identik di kedua bahasa.
  - id: "L2.2"
    points: 25
    solution: "Tingkat Menengah/Lanjut: struktur campuran, penyaringan, dan fungsi klasifikasi bertingkat."
    judul_r: "Solusi Menengah dan Lanjut (R)"
    solusi_r: |
      # struktur campuran
      saya <- list(nama = "Budi", semester = 3, nilai = c(85, 78, 90))
      saya$nama; saya$nilai[2]
      # penyaringan
      mhs <- read.csv("data/data_mahasiswa.csv")
      mhs[mhs$lulus == "Ya" & mhs$ipk >= 3.6, ]
      # fungsi klasifikasi bertingkat
      predikat <- function(ipk) {
        if (ipk >= 3.6) "Cumlaude"
        else if (ipk >= 3.0) "Sangat Memuaskan"
        else "Memuaskan"
      }
      sapply(mhs$ipk, predikat)
    judul_py: "Solusi Menengah dan Lanjut (Python)"
    solusi_py: |
      saya = {"nama": "Budi", "semester": 3, "nilai": [85, 78, 90]}
      print(saya["nama"], saya["nilai"][1])
      import pandas as pd
      mhs = pd.read_csv("data/data_mahasiswa.csv")
      print(mhs[(mhs["lulus"] == "Ya") & (mhs["ipk"] >= 3.6)])
      def predikat(ipk):
          if ipk >= 3.6: return "Cumlaude"
          elif ipk >= 3.0: return "Sangat Memuaskan"
          else: return "Memuaskan"
      print(mhs["ipk"].apply(predikat).tolist())
    interpretasi: >
      List/dictionary menyimpan campuran tipe; penyaringan menggabungkan dua syarat dengan & (R) atau
      & pada pandas dengan tanda kurung; fungsi bertingkat memakai else if (R) / elif (Python).
      Penerapan ke seluruh kolom memakai sapply (R) dan .apply (pandas).
  - id: "T2.1"
    points: 60
    solution: "Penugasan: tipe kolom, ringkasan, klasifikasi, dan laporan reproducible."
    judul_r: "Solusi Penugasan (R)"
    solusi_r: |
      mhs <- read.csv("data/data_mahasiswa.csv")
      str(mhs)                                      # tipe tiap kolom
      cat("Rata-rata IPK:", round(mean(mhs$ipk), 2), "\n")
      cat("Total SKS:", sum(mhs$sks), "\n")
      cat("Jumlah lulus:", sum(mhs$lulus == "Ya"), "\n")
      mhs[which.max(mhs$ipk), ]; mhs[which.min(mhs$ipk), ]
      status <- function(ipk) if (ipk >= 3.6) "Cumlaude" else "Reguler"
      mhs$status <- sapply(mhs$ipk, status)
      mhs
    judul_py: "Solusi Penugasan (Python)"
    solusi_py: |
      import pandas as pd
      mhs = pd.read_csv("data/data_mahasiswa.csv")
      print(mhs.dtypes)
      print("Rata-rata IPK:", round(mhs["ipk"].mean(), 2))
      print("Total SKS:", mhs["sks"].sum())
      print("Jumlah lulus:", (mhs["lulus"] == "Ya").sum())
      print(mhs.loc[mhs["ipk"].idxmax()]); print(mhs.loc[mhs["ipk"].idxmin()])
      mhs["status"] = mhs["ipk"].apply(lambda v: "Cumlaude" if v >= 3.6 else "Reguler")
      print(mhs)
    interpretasi: >
      Rata-rata IPK, total SKS, dan jumlah lulus identik di kedua bahasa. Mahasiswa IPK tertinggi/
      terendah diidentifikasi dengan which.max/which.min (R) dan idxmax/idxmin (Python). Fungsi status
      menambah kolom klasifikasi. Data simulasi, bukan data resmi.

  - id: "L2.D"
    points: 10
    solution: "Membetulkan kode: konversi tipe, indeks benar, operator == ."
    judul_r: "Solusi Membetulkan Kode (R)"
    solusi_r: |
      nilai <- as.numeric(c("80", "75", "90"))  # konversi ke angka
      rata <- mean(nilai)                        # kini berhasil
      ketiga <- nilai[2]                         # indeks R mulai 1
      cek <- (5 == 5)                            # == untuk perbandingan
    judul_py: "Solusi Membetulkan Kode (Python)"
    solusi_py: |
      import numpy as np
      nilai = [80, 75, 90]
      ketiga = nilai[2]              # indeks Python mulai 0
      if nilai[0] == 80:            # == untuk perbandingan
          print("benar")
      rata = np.mean(nilai)         # pakai numpy, atau sum()/len()
    interpretasi: >
      Kesalahan R: teks perlu as.numeric sebelum dirata-rata; indeks ke-3 adalah nilai[2] (R mulai 1);
      perbandingan pakai == bukan =. Kesalahan Python: nilai[2] di luar batas (pakai [2] untuk elemen
      ketiga); if pakai == bukan =; list tak punya .mean() (pakai numpy atau sum/len).

