number: 2
title: "Dasar R dan Python: Tipe Data, Struktur Data, Operator, dan Fungsi"
short_code: "dasar_r_python"
topic: "Dasar R & Python"
pertemuan: 2
sub_cpmk: >
  Sub-CPMK 2: Mahasiswa mengenal, mengetahui, dan mampu menjelaskan serta menjalankan
  dasar-dasar R dan Python: tipe data, struktur data, operator aritmatika dan logika,
  serta fungsi sederhana.
packages: [reticulate]
contoh_title: "Contoh Praktikum dengan R dan Python"
