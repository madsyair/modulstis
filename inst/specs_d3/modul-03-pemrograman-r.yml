    - "Diberi vektor `c(3, 8, 1, 9, 4, 7)`. Gunakan `Filter` untuk mengambil nilai > 5, `Map` untuk mengkuadratkannya, dan `Reduce` untuk menjumlahkan hasilnya. Kerjakan dalam satu rangkaian."
    - "\\latihan{Membetulkan kode yang salah}"
    - "Kode R berikut memuat kesalahan alur kendali (syarat, perulangan, apply). Temukan dan perbaiki, lalu jelaskan tiap kesalahannya."
    - "```{r eval=FALSE}\n# ingin menjumlahkan 1..5\ntotal <- 0\nfor (i in 1;5) total <- total + i    # salah penulisan rentang\n\n# ingin label lulus untuk vektor\nnilai <- c(80, 55, 70)\nif (nilai >= 60) \"Lulus\" else \"Ulang\"  # if tunggal untuk vektor (harusnya ifelse)\n\n# rata-rata tiap kolom\nm <- matrix(1:6, nrow = 2)\napply(m, 3, mean)                    # MARGIN salah\n```"
    - "**Keluaran yang benar.** Setelah diperbaiki, kode akan menghasilkan keluaran berikut. Gunakan ini untuk memverifikasi perbaikan Anda.\n\n```\n[1] 15                            # total 1 sampai 5\n[1] \"Lulus\" \"Ulang\" \"Lulus\"   # label tiap nilai\n[1] 1.5 3.5 5.5                   # rata-rata tiap kolom\n```"
    - "#### Tingkat Lanjut (kasus kecil)"
    - "\\latihan{Fungsi ringkasan lengkap}"
    - "Tulis fungsi `ringkas(x)` yang menerima vektor numerik dan mengembalikan sebuah list berisi rata-rata, median, dan simpangan baku. Terapkan pada kolom `penjualan`, lalu gunakan `sapply` untuk menerapkannya pada kolom `penjualan` dan `target` sekaligus."
  penugasan:
    - "\\begin{kotaktugas}\nSebagai calon pengolah data \\emph{official statistics}, olah data penjualan wilayah tiruan memakai \\texttt{data\\_penjualan.csv} (\\emph{data simulasi}) dengan alur kendali R.\n\\end{kotaktugas}"
    - "**Konteks.** Seorang petugas pengolah data menerima catatan penjualan 12 baris dari tiga wilayah (Barat, Tengah, Timur) beserta targetnya. Anda diminta mengklasifikasikan pencapaian dan meringkasnya per wilayah."
    - "\\tugas{Fungsi status pencapaian}"
    - "1. Tulis fungsi `status(p, t, ambang = 1)` yang mengembalikan \"Tercapai\"/\"Belum\" berdasarkan rasio penjualan terhadap target, lalu tambahkan hasilnya sebagai kolom baru pada data."
    - "\\tugas{Ringkasan dengan apply}"
    - "2. Gunakan `tapply` untuk menghitung **jumlah wilayah yang \"Tercapai\"** per wilayah."
    - "3. Gunakan `apply` atau `sapply` untuk menghitung **rata-rata dan maksimum** kolom `penjualan` dan `target` sekaligus."
    - "\\tugas{Analisis dan laporan}"
    - "4. Wilayah mana yang paling sedikit mencapai target? Wilayah mana rata-rata penjualannya terendah? Tuliskan pengamatan Anda."
    - "5. Susun laporan R Markdown berisi kode, keluaran, dan interpretasi; render ke PDF/HTML. Jelaskan **kapan** sebaiknya memakai `ifelse`/`apply` daripada perulangan eksplisit, dan berikan satu contoh dari tugas ini."
  ringkasan:
    - "\\begin{kotaktujuan}\n\\textbf{Daftar periksa penguasaan:}\n\\begin{itemize}\n\\item[$\\square$] Saya dapat memakai \\texttt{if}/\\texttt{else if}/\\texttt{else}, \\texttt{ifelse}, dan \\texttt{switch}.\n\\item[$\\square$] Saya dapat menyusun \\texttt{for}, \\texttt{while}, dan \\texttt{repeat} dengan aman, serta memakai \\texttt{break}/\\texttt{next}.\n\\item[$\\square$] Saya dapat memilih anggota keluarga apply yang tepat (\\texttt{sapply}/\\texttt{lapply}/\\texttt{vapply}/\\texttt{mapply}/\\texttt{tapply}/\\texttt{apply}).\n\\item[$\\square$] Saya dapat menulis fungsi dengan argumen bawaan dan memahami skop lokal.\n\\item[$\\square$] Saya dapat memilih pendekatan paling ringkas (tervektor vs apply vs perulangan).\n\\end{itemize}\n\\end{kotaktujuan}"
    - "**Kartu Referensi Cepat.** Rangkuman perintah alur kendali R:"
    - "\\begin{kotakrumus}\n\\begin{tabular}{@{}ll@{}}\n\\textbf{Tugas} & \\textbf{Perintah R}\\\\\nKondisi tunggal & \\texttt{if (s) \\{\\} else \\{\\}}\\\\\nKondisi tervektor & \\texttt{ifelse(s, a, b)}\\\\\nBanyak pilihan & \\texttt{switch(x, ...)}\\\\\nUlang tetap & \\texttt{for (i in 1:n) \\{\\}}\\\\\nUlang bersyarat & \\texttt{while (s) \\{\\}}\\\\\nHentikan/lewati & \\texttt{break} / \\texttt{next}\\\\\nTerap ke elemen & \\texttt{sapply(x, f)}\\\\\nTerap per kelompok & \\texttt{tapply(x, g, f)}\\\\\nTerap baris/kolom & \\texttt{apply(m, 1/2, f)}\\\\\nBuat fungsi & \\texttt{function(arg) \\{\\}}\\\\\n\\end{tabular}\n\\end{kotakrumus}"
    - "Empat pilar alur kendali R kini dikuasai secara menyeluruh: kondisi, perulangan, keluarga apply, dan fungsi. Prinsip penting: pilih alat yang paling ringkas dan efisien - operasi tervektor dan \\texttt{apply} umumnya lebih baik daripada perulangan eksplisit untuk data. Pada Modul 4, konsep yang sama dipelajari di Python."
  referensi:
    - "Pramana, S., dkk. (2016). *Dasar-dasar Statistik menggunakan R*. In-Media. (Alur kendali dan fungsi di R.)"
    - "Wickham, H. (2019). *Advanced R*, 2nd ed. Chapman and Hall/CRC. (Fungsi, skop, dan keluarga apply; tersedia daring gratis.)"
    - "Jones, E., Harden, S., & Crawley, M. J. (2023). *The R Book*, 3rd ed. Wiley. (Referensi dasar pemrograman R.)"
    - "Zhang, N. (2020). *A Tour of Data Science: Learn R and Python in Parallel*. Chapman and Hall/CRC. (Perbandingan dengan Python.)"

exercises:
  - id: "L3.1"
    points: 15
    solution: "Tingkat Dasar: ifelse, for berwadah, apply. Isian: 60, n, 1."
    judul_r: "Solusi Tingkat Dasar (R)"
    solusi_r: |
      nilai <- c(76, 58, 91, 64, 45)
      ifelse(nilai >= 60, "Lulus", "Mengulang")
      n <- 7; kuadrat <- numeric(n)
      for (i in 1:n) kuadrat[i] <- i^2
      kuadrat                                   # 1 4 9 16 25
      m <- matrix(c(72,84,66,90,58,77), nrow = 3, byrow = TRUE)
      apply(m, 1, mean)                         # rata-rata tiap baris
    interpretasi: >
      ifelse memberi label pada seluruh vektor; wadah numeric(n) disiapkan sebelum diisi; apply
      dengan MARGIN=1 memberi rata-rata tiap baris. Tiga alat untuk tiga bentuk tugas.
  - id: "L3.2"
    points: 25
    solution: "Tingkat Menengah/Lanjut: tapply, pengendali perulangan, fungsi ringkasan."
    judul_r: "Solusi Menengah dan Lanjut (R)"
    solusi_r: |
      jual <- read.csv("data/data_penjualan.csv")
      tapply(jual$penjualan, jual$wilayah, sum)   # total per wilayah
      # perulangan dengan next dan break
      for (i in 1:25) {
        if (i %% 4 == 0) next
        if (i > 15) break
        cat(i, "")
      }
      cat("\n")
      # fungsi ringkasan
      ringkas <- function(x) list(rata = mean(x), median = median(x), sd = sd(x))
      ringkas(jual$penjualan)
      sapply(jual[, c("penjualan","target")], ringkas)
    interpretasi: >
      tapply meringkas total per wilayah. Perulangan melewati kelipatan 3 (next) dan berhenti setelah
      15 (break). Fungsi ringkas mengembalikan list tiga statistik; sapply menerapkannya ke dua kolom
      sekaligus.
  - id: "T3.1"
    points: 60
    solution: "Penugasan: fungsi status, ringkasan tapply/apply, analisis, dan laporan."
    judul_r: "Solusi Penugasan (R)"
    solusi_r: |
      jual <- read.csv("data/data_penjualan.csv")
      status <- function(p, t, ambang = 1) ifelse(p / t >= ambang, "Tercapai", "Belum")
      jual$status <- status(jual$penjualan, jual$target)
      # jumlah "Tercapai" per wilayah
      tapply(jual$status == "Tercapai", jual$wilayah, sum)
      # rata-rata & maksimum dua kolom sekaligus
      apply(jual[, c("penjualan","target")], 2, function(x) c(rata = mean(x), maks = max(x)))
      # rata-rata penjualan per wilayah (untuk analisis)
      tapply(jual$penjualan, jual$wilayah, mean)
    interpretasi: >
      Fungsi status menandai tiap baris tercapai/belum; tapply meringkas jumlah "Tercapai" per
      wilayah; apply memberi rata-rata dan maksimum kedua kolom. tapply rata-rata penjualan membantu
      menjawab wilayah mana yang tertinggi. Data simulasi, bukan data resmi.

  - id: "L3.D"
    points: 10
    solution: "Membetulkan kode: rentang 1:5, ifelse untuk vektor, MARGIN benar."
    judul_r: "Solusi Membetulkan Kode (R)"
    solusi_r: |
      total <- 0
      for (i in 1:5) total <- total + i   # rentang pakai titik dua
      total                               # 15

      nilai <- c(80, 55, 70)
      ifelse(nilai >= 60, "Lulus", "Ulang")  # ifelse untuk vektor

      m <- matrix(1:6, nrow = 2)
      apply(m, 2, mean)   # MARGIN=2 (kolom), atau 1 (baris); 3 tak valid
    interpretasi: >
      Kesalahan: rentang ditulis 1;5 seharusnya 1:5; if tunggal tak cocok untuk vektor (pakai ifelse
      yang bekerja elemen per elemen); MARGIN pada apply hanya 1 (baris) atau 2 (kolom), nilai 3 tak
      valid untuk matriks dua dimensi.

