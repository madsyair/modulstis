    - "```{r eval=FALSE}\ndemo <- read.CSV(\"data_demo.csv\")   # 2 kesalahan di baris ini\nhead(demo, n)                         # kesalahan argumen\nmean(demo$pengeluran)                 # kesalahan nama kolom\n```"
    - "```{python eval=FALSE}\nimport pandas\ndemo = pandas.read_csv(\"data/data_demo.csv\")\nprint(demo.Head(3))                   # kesalahan penulisan metode\nprint(demo[\"pengeluaran\"].Mean())    # kesalahan penulisan metode\n```"
    - "**Keluaran yang benar.** Setelah diperbaiki, kode akan menghasilkan keluaran berikut. Gunakan ini untuk memverifikasi perbaikan Anda.\n\n```\n# R\n  wilayah penduduk pengeluaran akses_internet\n1    WilI  4587254        1012           59.1\n2    WilF  9085240        1433           43.2\n3    WilG  6492911         736           62.3\n\n[1] 1173.9\n\n# Python\n  wilayah  penduduk  pengeluaran  akses_internet\n0    WilI   4587254         1012            59.1\n1    WilF   9085240         1433            43.2\n2    WilG   6492911          736            62.3\n\n1173.9\n```"
    - "#### Tingkat Lanjut (kasus kecil)"
    - "\\latihan{Laporan mini reproducible}"
    - "Buat berkas R Markdown (atau Jupyter Notebook) berjudul \"Eksplorasi Awal\" yang: (a) membaca `data_demo.csv`, (b) menampilkan lima baris pertama, (c) menghitung rata-rata `pengeluaran`, dan (d) memuat satu kalimat interpretasi. Render ke HTML/PDF dan pastikan berhasil."
  penugasan:
    - "\\begin{kotaktugas}\nSebagai calon pengolah data di lingkungan \\emph{official statistics}, Anda perlu memastikan lingkungan kerja siap dan mampu menghasilkan \\textbf{laporan reproducible}. Kerjakan studi kasus berikut memakai \\texttt{data\\_demo.csv} (\\emph{data simulasi wilayah}).\n\\end{kotaktugas}"
    - "**Konteks.** Sebuah unit statistik menerima data ringkas 10 wilayah (jumlah penduduk, pengeluaran per kapita, dan akses internet). Anda diminta menyiapkan lingkungan dan menghasilkan laporan awal yang dapat direproduksi."
    - "\\tugas{Verifikasi lingkungan}"
    - "1. Tampilkan **versi R** dan **versi Python** pada mesin Anda dengan potongan kode yang sesuai. Sertakan tangkapan layar RStudio dan Jupyter Notebook. Jelaskan singkat fungsi tiap panel/sel yang tampak."
    - "\\tugas{Operasi dasar di dua bahasa}"
    - "2. Baca `data_demo.csv` di **R** dan di **Python**; tampilkan lima baris pertama dan ukuran data pada masing-masing."
    - "3. Hitung **rata-rata** kolom `pengeluaran` dan **nilai tertinggi** `akses_internet` di kedua bahasa, lalu **bandingkan** hasilnya (seharusnya sama). Jika berbeda, telusuri penyebabnya."
    - "\\tugas{Analisis sederhana}"
    - "4. Identifikasi wilayah dengan **penduduk terbanyak** dan wilayah dengan **akses internet tertinggi**. Apakah keduanya wilayah yang sama? Tuliskan pengamatan Anda."
    - "\\tugas{Laporan reproducible}"
    - "5. Susun seluruh jawaban sebagai satu **laporan R Markdown** (atau Jupyter Notebook) berisi kode, keluaran, dan narasi; render ke **PDF atau HTML**."
    - "6. Tuliskan **ringkasan (maksimal 300 kata)**: perbedaan dan persamaan R dan Python yang Anda amati, kendala yang ditemui saat pemasangan beserta solusinya, dan manfaat laporan reproducible untuk pekerjaan data resmi."
  ringkasan:
    - "\\begin{kotaktujuan}\n\\textbf{Daftar periksa penguasaan:}\n\\begin{itemize}\n\\item[$\\square$] Saya berhasil memasang R, RStudio, dan Python, serta memverifikasinya.\n\\item[$\\square$] Saya mengenali fungsi tiap panel RStudio dan sel Jupyter.\n\\item[$\\square$] Saya dapat menjalankan aritmatika, membuat objek, memasang/memuat paket, dan membaca data di R dan Python.\n\\item[$\\square$] Saya dapat mendiagnosis galat pemasangan yang umum.\n\\item[$\\square$] Saya memahami persamaan konsep dan perbedaan sintaks kedua bahasa.\n\\item[$\\square$] Saya dapat menyusun dan merender laporan reproducible.\n\\end{itemize}\n\\end{kotaktujuan}"
    - "**Kartu Referensi Cepat.** Rangkuman perintah dasar yang dipakai di modul ini:"
    - "\\begin{kotakrumus}\n\\begin{tabular}{@{}lll@{}}\n\\textbf{Tugas} & \\textbf{R} & \\textbf{Python}\\\\\nVersi & \\texttt{R.version.string} & \\texttt{sys.version}\\\\\nPenetapan & \\texttt{x <- 5} & \\texttt{x = 5}\\\\\nTipe objek & \\texttt{class(x)} & \\texttt{type(x)}\\\\\nMuat paket & \\texttt{library(pkg)} & \\texttt{import pkg}\\\\\nBaca CSV & \\texttt{read.csv(f)} & \\texttt{pd.read\\_csv(f)}\\\\\nLihat awal & \\texttt{head(d)} & \\texttt{d.head()}\\\\\nUkuran & \\texttt{dim(d)} & \\texttt{d.shape}\\\\\nRingkasan & \\texttt{summary(d)} & \\texttt{d.describe()}\\\\\nRata-rata & \\texttt{mean(x)} & \\texttt{x.mean()}\\\\\n\\end{tabular}\n\\end{kotakrumus}"
    - "Modul ini menyiapkan fondasi seluruh mata kuliah: lingkungan terpasang dan terverifikasi, dua perangkat dikenali komponen demi komponen, galat umum dapat diatasi, dan laporan reproducible dikuasai. Prinsip yang dibawa ke modul berikutnya: **berpikir pada tataran konsep** dan **fasih berpindah antara R dan Python**. Pada Modul 2, kita mendalami tipe dan struktur data di kedua bahasa."
