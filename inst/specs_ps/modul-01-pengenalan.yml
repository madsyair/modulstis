    - "\\latihan{Ringkasan kolom}"
    - "Tulis kode **di R dan di Python** untuk membaca `data_demo.csv`, lalu tampilkan ringkasan statistik (lima serangkai) kolom `pengeluaran`. Bandingkan keluaran kedua bahasa."
    - "\\latihan{Rata-rata dua kolom}"
    - "Hitung dan tampilkan rata-rata kolom `penduduk` dan `akses_internet` sekaligus, di salah satu bahasa pilihan Anda. Jelaskan langkahnya."
    - "\\latihan{Eksplorasi mandiri}"
    - "Baca `data_demo.csv`, lalu tampilkan: (a) nama semua kolom, (b) tipe tiap kolom, (c) tiga wilayah dengan pengeluaran tertinggi. Kerjakan di R atau Python."
    - "\\latihan{Reproducibility}"
