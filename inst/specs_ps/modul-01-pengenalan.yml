exercises:
  - id: "L1.1"
    points: 15
    solution: "Tingkat Dasar: kalkulator dan objek. Isian: 8, 2025, data_demo.csv."
    judul_r: "Solusi Tingkat Dasar (R)"
    solusi_r: |
      hasil <- 10 * 5 + 8; hasil     # 58
      tahun <- 2025; class(tahun)    # numeric
      d <- read.csv("data/data_demo.csv"); dim(d)
    judul_py: "Solusi Tingkat Dasar (Python)"
    solusi_py: |
      hasil = 10 * 5 + 8; print(hasil)          # 58
      tahun = 2025; print(type(tahun).__name__) # int
    interpretasi: >
      Objek tahun bertipe numeric di R dan int di Python. Gunakan 2025L di R bila ingin bilangan
      bulat. Pembacaan data mengembalikan dimensi 10 x 4.
  - id: "L1.2"
    points: 25
    solution: "Tingkat Menengah: ringkasan kolom dan rata-rata dua kolom di kedua bahasa."
    judul_r: "Solusi Tingkat Menengah (R)"
    solusi_r: |
      d <- read.csv("data/data_demo.csv")
      summary(d$pengeluaran)                    # lima serangkai
      sapply(d[, c("penduduk","akses_internet")], mean)
    judul_py: "Solusi Tingkat Menengah (Python)"
    solusi_py: |
      import pandas as pd
      d = pd.read_csv("data/data_demo.csv")
      print(d["pengeluaran"].describe())
      print(d[["penduduk","akses_internet"]].mean())
    interpretasi: >
      summary/describe memberi ringkasan setara. Untuk beberapa kolom sekaligus, R memakai sapply
      dan pandas memakai pemilihan kolom ganda lalu .mean(). Hasil rata-rata identik di kedua bahasa.
  - id: "T1.1"
    points: 60
    solution: "Penugasan: verifikasi lingkungan, operasi dua bahasa, analisis, dan laporan reproducible."
    judul_r: "Solusi Penugasan (R)"
    solusi_r: |
      demo <- read.csv("data/data_demo.csv")
      head(demo, 5); dim(demo)
      cat("Rata-rata pengeluaran:", round(mean(demo$pengeluaran), 1), "\n")
      cat("Akses internet tertinggi:", max(demo$akses_internet), "\n")
      demo$wilayah[which.max(demo$penduduk)]           # penduduk terbanyak
      demo$wilayah[which.max(demo$akses_internet)]     # akses tertinggi
    judul_py: "Solusi Penugasan (Python)"
    solusi_py: |
      import pandas as pd
      demo = pd.read_csv("data/data_demo.csv")
      print(demo.head(5)); print(demo.shape)
      print("Rata-rata pengeluaran:", round(demo["pengeluaran"].mean(), 1))
      print("Akses internet tertinggi:", demo["akses_internet"].max())
      print(demo.loc[demo["penduduk"].idxmax(), "wilayah"])
      print(demo.loc[demo["akses_internet"].idxmax(), "wilayah"])
    interpretasi: >
      Rata-rata pengeluaran dan nilai maksimum akses_internet identik di kedua bahasa. Identifikasi
      wilayah dengan penduduk terbanyak (which.max/idxmax) dan akses tertinggi memungkinkan
      pengecekan apakah keduanya wilayah sama. Laporan reproducible dinilai dari kode + keluaran +
      narasi yang berhasil dirender. Data simulasi, bukan data resmi.

  - id: "L1.D"
    points: 10
    solution: "Membetulkan kode: read.csv (bukan read.CSV), path data/, head(demo,3), nama kolom pengeluaran; Python .head()/.mean()."
    judul_r: "Solusi Membetulkan Kode (R)"
    solusi_r: |
      # perbaikan: read.csv, path benar, argumen n=3, nama kolom benar
      demo <- read.csv("data/data_demo.csv")
      head(demo, 3)
      mean(demo$pengeluaran)
    judul_py: "Solusi Membetulkan Kode (Python)"
    solusi_py: |
      import pandas
      demo = pandas.read_csv("data/data_demo.csv")
      print(demo.head(3))              # head huruf kecil
      print(demo["pengeluaran"].mean())  # mean huruf kecil
    interpretasi: >
      Kesalahan R: read.CSV harus read.csv (R peka huruf), path perlu "data/", head butuh angka
      (bukan objek n tak terdefinisi), dan pengeluran salah eja menjadi pengeluaran. Kesalahan
      Python: Head/Mean harus huruf kecil (head/mean); metode Python peka huruf.

