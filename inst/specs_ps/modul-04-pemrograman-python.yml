exercises:
  - id: "L4.1"
    points: 15
    solution: "Tingkat Dasar: elif, range, list comprehension. Isian: elif, 11, nilai."
    judul_py: "Solusi Tingkat Dasar (Python)"
    solusi_py: |
      nilai = 68
      if nilai >= 85: huruf = "A"
      elif nilai >= 70: huruf = "B"
      else: huruf = "C"
      print(huruf)                      # C
      total = 0
      for i in range(1, 11): total += i
      print(total)                      # 55
      nilai = [80, 55, 90, 65]
      print([n >= 60 for n in nilai])   # [True, False, True, True]
    interpretasi: >
      elif adalah cabang tengah (bukan else if); range(1, 11) menjumlahkan 1..10 = 55; list
      comprehension memberi daftar boolean. Semua setara konsepnya dengan Modul 3 di R.
  - id: "L4.2"
    points: 25
    solution: "Tingkat Menengah/Lanjut: enumerate/zip, *args, try/except + comprehension."
    judul_py: "Solusi Menengah dan Lanjut (Python)"
    solusi_py: |
      wilayah = ["Barat","Tengah","Timur"]; penjualan = [320, 280, 210]
      for w, p in zip(wilayah, penjualan): print(w, p)
      for i, w in enumerate(wilayah): print(i+1, w)
      def rata(*args): return sum(args) / len(args)
      print(rata(80, 90)); print(rata(70, 85, 95, 100))
      # try/except + comprehension
      data = ["120", "90", "xx", "75"]
      angka = []
      for x in data:
          try: angka.append(int(x))
          except ValueError: pass
      print("rata-rata:", sum(angka) / len(angka))   # 95.0
    interpretasi: >
      zip memasangkan wilayah-penjualan; enumerate memberi nomor urut. rata(*args) menerima jumlah
      argumen tak tetap. try/except melewati "xx" yang tak bisa dikonversi, lalu rata-rata dihitung
      dari angka yang valid (120,90,75 -> 95.0).
  - id: "T4.1"
    points: 60
    solution: "Penugasan: fungsi status, groupby, comprehension, dan laporan perbandingan."
    judul_py: "Solusi Penugasan (Python)"
    solusi_py: |
      import pandas as pd
      jual = pd.read_csv("data/data_penjualan.csv")
      def status(p, t, ambang=1.0):
          return "Tercapai" if p / t >= ambang else "Belum"
      jual["status"] = jual.apply(lambda r: status(r["penjualan"], r["target"]), axis=1)
      # jumlah "Tercapai" per wilayah
      print(jual[jual["status"] == "Tercapai"].groupby("wilayah").size())
      # rata-rata & maksimum per wilayah
      print(jual.groupby("wilayah")["penjualan"].agg(["mean", "max"]))
      # comprehension: wilayah di atas rata-rata keseluruhan
      rata = jual["penjualan"].mean()
      atas = [w for w, p in zip(jual["wilayah"], jual["penjualan"]) if p > rata]
      print("di atas rata-rata:", set(atas))
    interpretasi: >
      Fungsi status menandai tiap baris; groupby+size meringkas jumlah "Tercapai" per wilayah
      (padanan tapply di R); groupby+agg memberi rata-rata dan maksimum. List comprehension menyaring
      wilayah di atas rata-rata. Data simulasi, bukan data resmi.

  - id: "L4.D"
    points: 10
    solution: "Membetulkan kode: titik dua, elif, indentasi, indeks range."
    judul_py: "Solusi Membetulkan Kode (Python)"
    solusi_py: |
      nilai = 78
      if nilai >= 85:              # titik dua
          huruf = "A"
      elif nilai >= 70:            # elif (bukan elseif)
          huruf = "B"             # indentasi konsisten
      else:
          huruf = "C"
      print(huruf)

      angka = [10, 20, 30]
      for i in range(3):           # range(3) -> 0,1,2 (dalam batas)
          print(angka[i])
    interpretasi: >
      Kesalahan Python: baris if lupa titik dua; elseif harus elif; indentasi harus konsisten (empat
      spasi); range(1,4) menghasilkan 1,2,3 sehingga angka[3] di luar batas - pakai range(3) atau
      range(len(angka)). Python peka terhadap indentasi dan titik dua, berbeda dari R.

