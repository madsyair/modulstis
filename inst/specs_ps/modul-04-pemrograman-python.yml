    - "5. Susun laporan Jupyter Notebook berisi kode, keluaran, dan interpretasi. Sertakan **tabel perbandingan** minimal empat konstruksi alur kendali R vs Python yang Anda pakai (rujuk Modul 3)."
  ringkasan:
    - "\\begin{kotaktujuan}\n\\textbf{Daftar periksa penguasaan:}\n\\begin{itemize}\n\\item[$\\square$] Saya dapat memakai \\texttt{if}/\\texttt{elif}/\\texttt{else} dan ekspresi kondisional dengan indentasi benar.\n\\item[$\\square$] Saya dapat memakai \\texttt{for} (dengan \\texttt{range}/\\texttt{enumerate}/\\texttt{zip}), \\texttt{while}, \\texttt{break}/\\texttt{continue}.\n\\item[$\\square$] Saya dapat menulis fungsi \\texttt{def}, \\texttt{lambda}, serta memakai \\texttt{*args}/\\texttt{**kwargs}.\n\\item[$\\square$] Saya dapat memakai list/dict/set comprehension.\n\\item[$\\square$] Saya dapat menangani galat (\\texttt{try}/\\texttt{except}) dan nilai hilang (\\texttt{NaN}).\n\\item[$\\square$] Saya memahami perbedaan sintaks alur kendali Python dan R.\n\\end{itemize}\n\\end{kotaktujuan}"
    - "**Kartu Referensi Cepat.** Rangkuman padanan R $\\rightarrow$ Python:"
    - "\\begin{kotakrumus}\n\\begin{tabular}{@{}ll@{}}\n\\textbf{R} & \\textbf{Python}\\\\\n\\texttt{if/else if/else} & \\texttt{if/elif/else}\\\\\n\\texttt{ifelse(s,a,b)} & \\texttt{a if s else b}\\\\\n\\texttt{for (i in 1:n)} & \\texttt{for i in range(n)}\\\\\n\\texttt{next} / \\texttt{break} & \\texttt{continue} / \\texttt{break}\\\\\n\\texttt{function(x)} & \\texttt{def f(x):}\\\\\n\\texttt{sapply(v,f)} & \\texttt{[f(x) for x in v]}\\\\\n\\texttt{tapply/aggregate} & \\texttt{groupby}\\\\\n\\texttt{is.na(x)} & \\texttt{x.isna()}\\\\\n\\texttt{NA} & \\texttt{None}/\\texttt{NaN}\\\\\n\\end{tabular}\n\\end{kotakrumus}"
    - "Alur kendali Python kini dikuasai menyeluruh dan dapat dibandingkan langsung dengan R (Modul 3). Perbedaan utama: indentasi menggantikan kurung kurawal, \\texttt{elif} menggantikan \\texttt{else if}, indeks mulai dari 0, dan comprehension sebagai idiom ringkas. Fitur khas Python (\\texttt{*args}/\\texttt{**kwargs}, comprehension, \\texttt{try}/\\texttt{except}) memperkaya cara menulis program. Pada modul berikutnya kita masuk ke manipulasi data dengan \\texttt{dplyr} (R)."
